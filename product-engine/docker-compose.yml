# Local PostgreSQL for development. Plain PostgreSQL 16 (Supabase-compatible SQL).
services:
  db:
    image: postgres:16-alpine
    container_name: dtg-product-engine-db
    environment:
      POSTGRES_USER: dtg
      POSTGRES_PASSWORD: dtg
      POSTGRES_DB: dtg_product_engine
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dtg -d dtg_product_engine']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dtg_pe_pgdata:/var/lib/postgresql/data
volumes:
  dtg_pe_pgdata:
