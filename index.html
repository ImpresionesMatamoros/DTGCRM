/* ---------------- fotos múltiples: cola, subida, resultado (Ronda "Fotos/Logo/Cabecera/Affordances" §1-11) ---------------- */

/* Cola genérica con concurrencia limitada — a propósito NO específica de
   fotos (nombre y firma genéricos) por si otra ronda futura necesita el
   mismo patrón para otro tipo de lote. worker(item, idx) debe devolver una
   promesa; onProgress(done, total) se llama después de CADA item, en el
   orden en que van terminando (no en el orden en que arrancaron). */
function runQueueWithConcurrency(items, worker, concurrency, onProgress){
  return new Promise(function(resolve){
    if(!items.length){ resolve([]); return; }
    var results = new Array(items.length);
    var next = 0, done = 0;
    function pump(){
      if(next >= items.length) return;
      var idx = next++;
      Promise.resolve(worker(items[idx], idx)).then(function(r){
        results[idx] = r;
        done++;
        if(onProgress) onProgress(done, items.length);
        if(done >= items.length) resolve(results);
        else pump();
      });
    }
    var starters = Math.min(concurrency, items.length);
    for(var i=0; i<starters; i++) pump();
  });
}

/* Una sola foto, de principio a fin — EXACTAMENTE el mismo mecanismo que ya
   existía para la subida individual (mismo resize 1280/0.8 JPEG sección 5,
   mismo patrón de storage path, misma fila de bitácora tipo "archivo" con
   storage_path/filename/caption — sección 9: cada foto sigue siendo
   completamente individual). Nunca lanza — atrapa su propio error y lo
   devuelve, para que la cola pueda seguir con las demás fotos del lote
   (sección 7: una foto fallida no cancela ni borra las que sí subieron). */
async function uploadOnePhoto(t, file, caption, uploadBatchId){
  try{
    var blob = await resizeImageToBlob(file, 1280, 0.8);
    /* §23: bug real de la auditoría — resizeImageToBlob() SIEMPRE produce
       JPEG (y se sube con contentType: image/jpeg, línea de abajo), pero la
       extensión del PATH se derivaba del nombre original del archivo, así
       que una foto .png/.heic quedaba guardada como "....png"/"....heic"
       con contenido JPEG real adentro. Se fija en "jpg" — el nombre
       original se sigue guardando tal cual en payload.filename, así que no
       se pierde ese dato, y las fotos históricas NO se tocan (esto solo
       afecta subidas nuevas a partir de esta ronda). No aplica al logo del
       cliente (uploadClienteLogo, que sigue siendo PNG a propósito por la
       transparencia — ver ronda anterior). */
    var ext = "jpg";
    var path = t.id + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "." + ext;
    var up = await sb.storage.from(FILES_BUCKET).upload(path, blob, { contentType: "image/jpeg" });
    if(up.error) throw up.error;
    /* upload_batch_id: dato plano dentro del jsonb existente, sin migración
       — opcional a propósito (fotos históricas y la subida de una sola foto
       de antes de esta ronda nunca lo tuvieron, y no se les inventa uno).
       Nunca se usa todavía para agrupar visualmente nada en el thread — es
       solo la base para una futura vista de galería (sección 12/47). */
    var payload = { storage_path: path, filename: file.name, caption: caption || "" };
    if(uploadBatchId) payload.upload_batch_id = uploadBatchId;
    var r = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "archivo", autor: UI.whoami || null, payload: payload });
    if(r.error) throw r.error;
    return { ok: true };
  }catch(e){
    return { ok: false, error: e.message || "error" };
  }
}

/* Libera las miniaturas (URL.createObjectURL nunca decodifica el archivo
   completo, pero sí reserva memoria mientras el object URL vive — hay que
   soltarla explícitamente) y limpia el estado. Se llama al cancelar, al
   cerrar el popover desde cualquier lado, y al terminar un lote sin
   ninguna falla. */
function resetPhotoBatch(){
  var pb = UI.photoBatch;
  if(pb && pb.items){
    pb.items.forEach(function(item){ try{ URL.revokeObjectURL(item.previewUrl); }catch(e){} });
  }
  UI.photoBatch = null;
}

/* Construye la selección a partir del FileList real del <input multiple> —
   sección 3: si excede el máximo, NO arranca nada (ni siquiera arma la
   selección), solo avisa con un mensaje claro y deja el selector listo para
   volver a intentar. Las miniaturas usan URL.createObjectURL — liviano,
   nunca decodifica la imagen completa solo para previsualizar (ver el
   riesgo de memoria en iOS señalado en el análisis de esta ronda). */
function buildPhotoBatchFromFileList(fileList){
  var files = Array.prototype.slice.call(fileList || []);
  if(!files.length) return;
  if(files.length > MAX_PHOTOS_PER_BATCH){
    showToast("Seleccionaste " + files.length + " fotografías. Puedes subir un máximo de " + MAX_PHOTOS_PER_BATCH + " por lote.");
    var input = document.getElementById("f-photos");
    if(input) input.value = "";
    return;
  }
  var items = files.map(function(file){
    return { id: uid(), file: file, previewUrl: URL.createObjectURL(file), name: file.name };
  });
  UI.photoBatch = { items: items, caption: "", uploading: false, progress: null, totalOriginal: 0, succeededSoFar: 0 };
  render();
}

/* Quitar una foto de la selección ANTES de subir (sección 11) — nunca
   obliga a reabrir el selector completo. Si se queda sin ninguna, vuelve a
   la fase de selector vacío. */
function removePhotoBatchItem(id){
  var pb = UI.photoBatch;
  if(!pb) return;
  var idx = -1;
  for(var i=0;i<pb.items.length;i++){ if(pb.items[i].id === id){ idx = i; break; } }
  if(idx === -1) return;
  try{ URL.revokeObjectURL(pb.items[idx].previewUrl); }catch(e){}
  pb.items.splice(idx, 1);
  if(!pb.items.length) UI.photoBatch = null;
  render();
}

function discardPhotoBatch(){
  resetPhotoBatch();
  UI.composer = null;
  render();
}

/* Arranca (o reintenta) la subida. En el primer intento fija totalOriginal/
   caption y toma TODOS los items; en un reintento, pb.items YA solo trae
   las fotos que fallaron la vuelta anterior (sección 7) y pb.totalOriginal
   ya existe, así que no se reinicia nada — es literalmente la misma
   función. Un solo refreshFromServer al final del lote completo (sección
   8), nunca uno por foto. Si algo falla a medio camino, el ticket sigue
   abierto con lo que sí se guardó — nunca se deshace nada (sección 10, ya
   garantizado porque cada foto es su propia fila independiente). */
async function startPhotoBatchUpload(){
  var pb = UI.photoBatch;
  if(!pb || !pb.items.length || pb.uploading) return;
  var t = findTicket(UI.selectedTicketId);
  if(!t){ showToast("Selecciona un ticket primero."); return; }
  if(!pb.totalOriginal){
    var capInput = document.getElementById("f-photo-caption");
    pb.caption = capInput ? capInput.value.trim() : (pb.caption || "");
    pb.totalOriginal = pb.items.length;
    pb.succeededSoFar = 0;
    /* Ajuste explícito del dueño del producto: un identificador simple por
       lote, guardado dentro del payload jsonb de CADA foto — no requiere
       SQL nuevo (bitacora.payload ya es jsonb libre). Sirve solo como dato
       para agrupar/hacer galería MÁS ADELANTE; esta ronda no cambia en nada
       cómo se ve el thread hoy. Un solo id por lote, generado una vez (no
       se regenera en un reintento — las fotos que faltan siguen siendo del
       MISMO lote original). */
    pb.uploadBatchId = uid();
  }
  var attempted = pb.items.slice();
  pb.uploading = true;
  pb.progress = { done: 0, total: attempted.length };
  render();
  var results = await runQueueWithConcurrency(attempted, function(item){
    return uploadOnePhoto(t, item.file, pb.caption, pb.uploadBatchId);
  }, photoBatchConcurrency(), function(done, total){
    pb.progress = { done: done, total: total };
    render();
  });
  var failed = [];
  var okCount = 0;
  attempted.forEach(function(item, i){
    if(results[i] && results[i].ok){ okCount++; try{ URL.revokeObjectURL(item.previewUrl); }catch(e){} }
    else failed.push(item);
  });
  pb.succeededSoFar += okCount;
  pb.items = failed;
  pb.uploading = false;
  await refreshFromServer({refocus:true});
  if(!failed.length){
    var totalDone = pb.totalOriginal;
    resetPhotoBatch();
    UI.composer = null;
    render();
    showToast(totalDone + (totalDone === 1 ? " fotografía subida" : " fotografías subidas"));
  } else {
    render();
  }
}

/* Núcleo compartido de creación de documento — usado por el modal de
   documento (submitDocFormCreate) Y por los comandos de un solo paso
   /factura y /cotizacion (sección 13/14), para no duplicar la lógica de
   guardado ni el evento de bitácora. Desde la sección 17 ("SNAPSHOT
   HISTÓRICO"), extendida en V0.5 (§18), aquí se congela TODO lo que un
   documento no debe volver a recalcular jamás: cobrado_al_crear, bill_to,
   y ahora también pricing_snapshot completo (subtotal/tax/fee/due-date/
   terms/PO/valid-until). `pricing` es opcional — si se omite (nunca
   debería pasar tras V0.5, pero por robustez), el documento se crea sin
   tax/fee, igual que un documento pre-V0.5.
   IMPORTANTE (D2 aprobado): `total` que se guarda en documentos.total es
   el TOTAL FINAL (subtotal + tax + fee), no el subtotal — ver comentario
   junto a docSubtotal()/documentAmountDue() más arriba. Devuelve el id del
   documento creado (o null si falló) para que quien llama pueda abrirlo de
   inmediato (sección 20: "el usuario nunca debería tener que ir a
   buscarlo"). */
async function createDocumentoCore(t, tipo, items, clienteNombre, notas, pricing){
  pricing = pricing || {};
  var subtotal = items.reduce(function(sum,it){ return sum + (it.precio==null?0:it.precio*it.cantidad); }, 0);
  var taxApplied = !!pricing.taxApplied;
  var taxRate = pricing.taxRate != null ? Number(pricing.taxRate) : 0;
  var taxAmount = computeTaxAmount(subtotal, taxRate, taxApplied);
  /* Addendum §10/§11: cada fee en pricing.fees se calcula sobre la MISMA
     base (subtotal+tax), independiente de los demás — nunca uno encima de
     otro. */
  var feeBase = subtotal + taxAmount;
  var fees = (pricing.fees || []).map(function(f){
    return { label: f.label || "", type: f.type === "fixed" ? "fixed" : "percentage", value: Number(f.value) || 0, amount: computeFeeAmount(feeBase, f) };
  });
  var feesTotal = fees.reduce(function(s,f){ return s + f.amount; }, 0);
  var total = round2(subtotal + taxAmount + feesTotal);
  var cobradoAlCrear = (t.pagos||[]).reduce(function(s,p){ return s + p.monto; }, 0);
  var linked = t.clienteId ? STATE.clientes.filter(function(c){ return c.id === t.clienteId; })[0] : null;
  var billTo = {
    nombre: clienteNombre || (linked ? linked.nombre : "") || "",
    empresa: (linked && linked.empresa) || null,
    telefono: (linked && linked.telefono) || null,
    email: (linked && linked.email) || null
  };
  var pricingSnapshot = {
    subtotal: subtotal,
    dueDate: pricing.dueDate || null,
    terms: pricing.terms || null,
    validUntil: pricing.validUntil || null,
    poReference: pricing.poReference || null,
    tax: { applied: taxApplied, rate: taxRate, amount: taxAmount, exempt: !!pricing.taxExempt, exemptReason: pricing.taxExemptReason || null },
    fees: fees
  };
  showToast("Creando " + (tipo==="invoice"?"invoice":"cotización") + "…");
  var newDocId = null;
  try{
    var ins = await sb.from("documentos").insert({
      ticket_id: t.id, tipo: tipo, cliente_nombre: clienteNombre, notas: notas || null,
      items: items, total: total, cobrado_al_crear: cobradoAlCrear, bill_to: billTo,
      pricing_snapshot: pricingSnapshot, autor: UI.whoami || null
    }).select().single();
    if(ins.error) throw ins.error;
    var doc = ins.data;
    newDocId = doc.id;
    var r8 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "documento", autor: UI.whoami || null,
      payload: { documento_id: doc.id, tipo: tipo, numero: doc.numero, total: total, cliente_nombre: clienteNombre } });
    if(r8.error) throw r8.error;
  }catch(e){ showToast("No se pudo crear el documento: " + (e.message || "error") + (/pricing_snapshot|column/.test(e.message||"") ? " — ¿ya corriste 0006_v05_operational_commercial.sql?" : "")); }
  await refreshFromServer({refocus:true});
  return newDocId;
}

/* opts.refocus: usado al abrir automáticamente el documento recién creado

  }

/* ---------------- Identidad y pago de Design To Go (secciones 14/18) ----
   Constante simple en el código — "usa la solución más simple compatible
   con la arquitectura actual" (sección 18): no existe todavía un módulo de
   configuración de negocio, y construir uno solo para esto sería inventar
   complejidad para un caso que hoy es un puñado de datos fijos. Si más
   adelante cambian los métodos de pago, se edita aquí en un solo lugar —
   nunca a mano en cada documento. 100% EE.UU./Rio Grande Valley: cero
   referencias a Matamoros/Tamaulipas/México/teléfonos mexicanos. */
var DTG_IDENTITY = {
  name: "Design To Go",
  tagline: "Printing · Signs · Apparel · Custom Production",
  phone: "956-561-2970",
  city: "Brownsville, Texas",
  serviceArea: "Serving the Rio Grande Valley"
};
var DTG_PAYMENT_INFO = [
  { label: "Zelle", value: "956-561-2970 · Design To Go" },
  { label: "Cash App", value: "$DesignToGo" }
];

/* Estado de cobro de un Invoice — se deriva del snapshot congelado en el
   propio documento (cobrado_al_crear), NUNCA de los pagos en vivo del
   ticket (sección 17: "SNAPSHOT HISTÓRICO" — un Invoice ya creado no
   cambia aunque después llegue un pago nuevo). Solo aplica a invoice: una
   cotización no tiene estado de cobro (no es un documento de cobro). */
function documentAmountDue(doc){ return Math.max(0, doc.total - (doc.cobradoAlCrear||0)); }
function documentPaymentStatus(doc){
  if(doc.tipo !== "invoice") return null;
  var due = doc.total - (doc.cobradoAlCrear||0);
  if(due <= 0.005) return "PAID";
  if((doc.cobradoAlCrear||0) > 0) return "PARTIALLY PAID";
  return "UNPAID";
}

/* ---------------- V0.5: Commercial Documents V2 — tax/fee/due-date/terms ----------------
   IMPORTANTE sobre documentos.total (D2 aprobado): a partir de V0.5,
   doc.total es el TOTAL FINAL del documento (subtotal + tax + fee) — NO el
   subtotal de items. Por eso documentAmountDue()/documentPaymentStatus() de
   arriba no necesitaron cambiar: ya restaban/comparaban "el total del
   documento" contra lo cobrado, y eso sigue siendo exactamente correcto
   bajo el nuevo significado. Lo que sí necesita el subtotal por separado
   (para mostrar el desglose) usa docSubtotal() de aquí abajo, que lo lee
   del snapshot — nunca lo deriva de doc.total ni de items en vivo. */
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

/* V0.5 §14/D1: única constante de tasa — NO es una verdad fiscal universal
   ni se calcula por ubicación/geografía (V0.5 §24 prohíbe cálculo
   geográfico automático en esta versión). Es solo el default que se
   PROPONE en un documento nuevo; siempre editable o desactivable antes de
   emitir, y un documento ya emitido queda congelado en su propio
   pricing_snapshot sin importar si esta constante cambia después.
   Brownsville / Cameron County: 8.25% según Texas Comptroller al momento
   de escribir esto — dato provisto por el dueño del negocio. */
var DEFAULT_SALES_TAX_RATE = 0.0825;

/* Addendum "One-Click Tax & Fees" §8/§9: "+ Fee" nunca abre un formulario
   en blanco — ofrece 4 atajos de un toque con los casos reales del
   negocio ya precargados (PayPal/Card con su tasa típica, Rush fee como
   monto fijo, Other totalmente en blanco para lo que no encaje). Todo
   sigue siendo editable después de agregarlo — esto es solo el punto de
   partida, no una categoría cerrada. */
var FEE_PRESETS = {
  paypal: { label: "PayPal processing fee", type: "percentage", value: 3.5 },
  card:   { label: "Card processing fee",   type: "percentage", value: 2.9 },
  rush:   { label: "Rush fee",              type: "fixed",      value: "" },
  other:  { label: "",                      type: "percentage", value: "" }
};

/* V0.5 §13/D5: presets hardcoded, sin Settings. Elegir un preset con días
   fijos recalcula Due Date automáticamente desde la fecha del documento;
   "Custom" no autocalcula nada — el usuario decide Due Date y el texto de
   Terms libremente. */
var TERMS_PRESETS = ["Due on Receipt","Net 7","Net 15","Net 30","Custom"];
var TERMS_NET_DAYS = { "Due on Receipt": 0, "Net 7": 7, "Net 15": 15, "Net 30": 30 };
function dueDateFromTerms(terms, fromDate){
  var days = TERMS_NET_DAYS[terms];
  if(days == null) return null;
  return dateOnlyFromDate(addDays(fromDate || new Date(), days));
}
/* Suma días a un Date en hora LOCAL (nunca UTC) — helper genérico para
   construir la fecha calendario de partida antes de formatearla con
   dateOnlyFromDate. */
function addDays(d, days){ var x = startOfDay(d); x.setDate(x.getDate() + days); return x; }

/* Subtotal real de un documento — snapshot congelado para documentos V0.5,
   o doc.total para documentos anteriores (donde total YA era el subtotal,
   porque tax/fee no existían). Nunca se deriva de items en vivo. */
function docSubtotal(doc){
  var ps = doc.pricingSnapshot;
  return (ps && ps.subtotal != null) ? Number(ps.subtotal) : Number(doc.total);
}
function docTax(doc){ var ps = doc.pricingSnapshot; return (ps && ps.tax) ? ps.tax : null; }
/* Addendum "One-Click Tax & Fees" §10: un documento puede tener cero, uno o
   varios fees — pricing_snapshot.fees es un array, cada elemento ya trae su
   propio amount congelado. Compatibilidad hacia atrás: un documento creado
   ANTES de este addendum (todavía con el shape viejo, singular
   pricing_snapshot.fee) se sigue leyendo igual — se envuelve en un array de
   un elemento en vez de perderse. Documentos sin ningún fee -> []. */
function docFees(doc){
  var ps = doc.pricingSnapshot;
  if(!ps) return [];
  if(Array.isArray(ps.fees)) return ps.fees;
  if(ps.fee && ps.fee.enabled) return [ps.fee];
  return [];
}

function computeTaxAmount(subtotal, rate, applied){ return applied ? round2(subtotal * (Number(rate)||0)) : 0; }
/* V0.5 §16, extendido por el addendum §11: cada fee porcentual se calcula
   sobre la misma base (Subtotal + Tax) de forma INDEPENDIENTE de los demás
   fees — nunca uno encima de otro (nada de gross-up recursivo ni fees
   compuestos). `fee` aquí ya es "el fee que se va a aplicar" (la lista que
   llama a este helper decide qué fees existen; no hay más un flag
   `enabled` que revisar). */
function computeFeeAmount(base, fee){
  if(!fee) return 0;
  if(fee.type === "fixed") return round2(Number(fee.value) || 0);
  return round2(base * ((Number(fee.value) || 0) / 100));
}

/* ---------------- Rediseño de documento (sección 15) ----------------
   El documento se muestra como una "hoja" (.doc-paper) con look de papel
   fijo — SIEMPRE clara, sin importar el tema claro/oscuro de la app — para
   que se vea igual que lo que el cliente recibirá impreso o en PDF. Las
   acciones (Volver / Imprimir / Descargar PDF) sí respetan el tema de la
   app, viven fuera de la hoja. */
function renderDocModal(){
  var docId = UI.viewingDocId;
  if(!docId) return "";
  var doc = findDocumentoById(docId);
  if(!doc){
    return (
      '<div class="doc-modal-overlay" id="doc-modal-overlay">' +
        '<div class="doc-modal"><div class="doc-modal-top"><button class="doc-modal-back" data-action="close-doc">&#8592; Volver al ticket</button></div>' +
        '<div class="doc-paper"><p>Este documento ya no está disponible.</p></div></div>' +
      "</div>"
    );
  }
  var isInvoice = doc.tipo === "invoice";
  var label = isInvoice ? "INVOICE" : "QUOTE / COTIZACIÓN";
  var status = documentPaymentStatus(doc);
  var bt = doc.billTo || {};
  var btNombre = bt.nombre || doc.clienteNombre || "";

  var rows = (doc.items||[]).map(function(it){
    var pending = it.precio == null;
    var subtotal = pending ? null : it.precio * it.cantidad;
    return (
      "<tr><td>" + escapeHtml(it.desc) + "</td><td class=\"num\">" + it.cantidad + "</td>" +
      "<td class=\"num\">" + (pending ? '<span class="doc-modal-pending">pending</span>' : fmtMoney(it.precio)) + "</td>" +
      "<td class=\"num\">" + (pending ? "—" : fmtMoney(subtotal)) + "</td></tr>"
    );
  }).join("");

  /* BILL TO (sección 15): colapsa con gracia — nunca una etiqueta con un
     valor vacío. Solo aparece el bloque completo si hay al menos un dato. */
  var billToLines = [];
  if(btNombre) billToLines.push(escapeHtml(btNombre));
  if(bt.empresa) billToLines.push(escapeHtml(bt.empresa));
  if(bt.telefono) billToLines.push(escapeHtml(bt.telefono));
  if(bt.email) billToLines.push(escapeHtml(bt.email));
  var billToBlock = billToLines.length
    ? '<div class="doc-col"><div class="doc-col-title">Bill To</div>' + billToLines.map(function(l){ return '<div>' + l + "</div>"; }).join("") + "</div>"
    : "";

  /* Details (V0.5 §12): PO/Reference + Terms/Due Date (invoice) o Valid
     Until (quote) — solo lo que el documento realmente tiene congelado en
     su propio pricing_snapshot. Un documento pre-V0.5 (pricingSnapshot
     null) simplemente no muestra esta columna, igual que hoy. */
  var ps = doc.pricingSnapshot || {};
  var detailLines = [];
  if(ps.poReference) detailLines.push(["PO / Reference", escapeHtml(ps.poReference)]);
  if(isInvoice){
    if(ps.terms) detailLines.push(["Terms", escapeHtml(ps.terms)]);
    if(ps.dueDate) detailLines.push(["Due Date", fmtDateOnlyShort(ps.dueDate)]);
  } else if(ps.validUntil){
    detailLines.push(["Valid Until", fmtDateOnlyShort(ps.validUntil)]);
  }
  var detailsBlock = detailLines.length
    ? '<div class="doc-col"><div class="doc-col-title">Details</div>' + detailLines.map(function(l){ return '<div><span class="doc-payment-label">' + l[0] + ": </span>" + l[1] + "</div>"; }).join("") + "</div>"
    : "";
  var billDetailsBlock = (billToBlock || detailsBlock) ? '<div class="doc-two-col doc-two-col-top">' + billToBlock + detailsBlock + "</div>" : "";

  /* Resumen financiero (V0.5 §16/D2/D8/D9): Subtotal/Tax/Fee siempre que
     existan (un documento pre-V0.5 no tiene pricing_snapshot → tax=0/
     fee=0, exactamente el comportamiento de antes). SOLO el invoice tiene
     Amount Due — es un documento de cobro deliberado (sección 5: "PRECIO ≠
     DEUDA" en el ticket; aquí sí puede existir un saldo, porque es
     exactamente para eso que existe un invoice). La cotización se queda en
     un Total simple, tax/fee incluidos. */
  var subtotal = docSubtotal(doc);
  var tax = docTax(doc);
  var fees = docFees(doc);
  var summaryRows = '<div class="doc-summary-row"><span>Subtotal</span><span>' + fmtMoney(subtotal) + "</span></div>";
  if(tax && tax.applied) summaryRows += '<div class="doc-summary-row"><span>Sales Tax (' + (Number(tax.rate)*100).toFixed(2).replace(/\.?0+$/,"") + '%)</span><span>' + fmtMoney(tax.amount) + "</span></div>";
  fees.forEach(function(f){
    summaryRows += '<div class="doc-summary-row"><span>' + escapeHtml(f.label || "Processing fee") + "</span><span>" + fmtMoney(f.amount) + "</span></div>";
  });
  var summaryBlock;
  if(isInvoice){
    var due = documentAmountDue(doc);
    summaryBlock =
      '<div class="doc-summary">' + summaryRows +
        (doc.cobradoAlCrear > 0 ? '<div class="doc-summary-row"><span>Payments received</span><span>-' + fmtMoney(doc.cobradoAlCrear) + "</span></div>" : "") +
        '<div class="doc-summary-row doc-summary-due"><span>AMOUNT DUE</span><span>' + fmtMoney(due) + "</span></div>" +
      "</div>";
  } else {
    summaryBlock = '<div class="doc-summary">' + summaryRows + '<div class="doc-summary-row doc-summary-due"><span>Total</span><span>' + fmtMoney(doc.total) + "</span></div></div>";
  }

  /* Payment + Notes lado a lado (sección 18/19) — solo tiene sentido en un
     documento de cobro, así que es exclusivo del invoice. */
  var paymentNotesBlock = "";
  if(isInvoice){
    var paymentRows = DTG_PAYMENT_INFO.map(function(p){ return '<div class="doc-payment-row"><span class="doc-payment-label">' + escapeHtml(p.label) + "</span><span>" + escapeHtml(p.value) + "</span></div>"; }).join("");
    paymentNotesBlock =
      '<div class="doc-two-col">' +
        '<div class="doc-col"><div class="doc-col-title">Payment</div>' + paymentRows +
          '<div class="doc-payment-ref">Please include Invoice #' + escapeHtml(doc.numero||"") + ' in the payment reference.</div>' +
        "</div>" +
        '<div class="doc-col"><div class="doc-col-title">Notes</div>' +
          '<div>Thank you for your business.</div>' +
          (doc.notas ? "<div>" + escapeHtml(doc.notas) + "</div>" : "") +
          '<div>Please reference Invoice #' + escapeHtml(doc.numero||"") + " when making payment.</div>" +
        "</div>" +
      "</div>";
  } else if(doc.notas){
    paymentNotesBlock = '<div class="doc-paper-notes"><span class="field-label">Notes</span><div>' + escapeHtml(doc.notas) + "</div></div>";
  }

  return (
    '<div class="doc-modal-overlay" id="doc-modal-overlay">' +
      '<div class="doc-modal">' +
        '<div class="doc-modal-top">' +
          '<button class="doc-modal-back" data-action="close-doc">&#8592; Volver al ticket</button>' +
          '<div class="doc-modal-actions">' +
            '<button class="btn btn-ghost" data-action="print-doc">Imprimir</button>' +
            '<button class="btn btn-primary" data-action="download-pdf" data-id="' + escapeHtml(doc.id) + '">&#11015; Descargar PDF</button>' +
          "</div>" +
        "</div>" +
        '<div class="doc-paper">' +
          '<div class="doc-paper-head">' +
            '<div>' +
              '<div class="doc-paper-brand">' + DTG_IDENTITY.name + "</div>" +
              '<div class="doc-paper-tagline">' + DTG_IDENTITY.tagline + "</div>" +
            "</div>" +
            '<div class="doc-paper-type">' +
              '<div class="doc-paper-type-label">' + label + "</div>" +
              '<div class="doc-paper-type-num">#' + escapeHtml(doc.numero||"") + "</div>" +
              (status ? '<div class="doc-status-pill doc-status-' + status.replace(/\s/g,"-").toLowerCase() + '">' + status + "</div>" : "") +
            "</div>" +
          "</div>" +
          '<div class="doc-paper-meta">' +
            '<div><span class="field-label">Date</span>' + fmtDateShort(doc.createdAt) + "</div>" +
          "</div>" +
          billDetailsBlock +
          '<table class="doc-modal-table"><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>' +
            rows +
          "</tbody></table>" +
          summaryBlock +
          paymentNotesBlock +
          '<div class="doc-paper-foot">' + DTG_IDENTITY.name + " · " + DTG_IDENTITY.tagline + " · " + DTG_IDENTITY.phone + " · " + DTG_IDENTITY.city + " · " + DTG_IDENTITY.serviceArea + "</div>" +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

/* ---------------- PDF real descargable, sin librerías externas ----------------
   Arma el archivo PDF byte a byte usando solo los operadores básicos del
   formato (texto, línea, color de relleno/trazo) — nada que traer de un
   CDN, así funciona también sin internet y sin vendorizar nada nuevo en el
   repo. Usa dos de las 14 fuentes estándar que trae cualquier visor de PDF
   (Helvetica / Helvetica-Bold) — no Courier, no hace falta embeber ningún
   programa de fuente — con una tabla AFM de anchos reales (measureText/
   wrapText) para que el wrapping y la alineación de la tabla sean tan
   exactos como con una fuente monoespaciada, pero con tipografía sans-serif
   profesional real. Los mismos colores que .doc-paper en el visor HTML
   (PDF_COLOR), para que el documento descargado y el que se ve en pantalla
   sean, de verdad, la misma representación. */

/* Anchos reales (1/1000 em) de Helvetica y Helvetica-Bold para el rango
   ASCII imprimible — valores AFM estándar de Adobe, los mismos que ya trae
   cualquier visor de PDF sin necesidad de embeber la fuente. */
var HELV_WIDTHS = {" ":278,"!":278,"\"":355,"#":556,"$":556,"%":889,"&":667,"'":191,"(":333,")":333,"*":389,"+":584,",":278,"-":333,".":278,"/":278,"0":556,"1":556,"2":556,"3":556,"4":556,"5":556,"6":556,"7":556,"8":556,"9":556,":":278,";":278,"<":584,"=":584,">":584,"?":556,"@":1015,"A":667,"B":667,"C":722,"D":722,"E":667,"F":611,"G":778,"H":722,"I":278,"J":500,"K":667,"L":556,"M":833,"N":722,"O":778,"P":667,"Q":778,"R":722,"S":667,"T":611,"U":722,"V":667,"W":944,"X":667,"Y":667,"Z":611,"[":278,"\\":278,"]":278,"^":469,"_":556,"`":333,"a":556,"b":556,"c":500,"d":556,"e":556,"f":278,"g":556,"h":556,"i":222,"j":222,"k":500,"l":222,"m":833,"n":556,"o":556,"p":556,"q":556,"r":333,"s":500,"t":278,"u":556,"v":500,"w":722,"x":500,"y":500,"z":500,"{":334,"|":260,"}":334,"~":584};
var HELV_BOLD_WIDTHS = {" ":278,"!":333,"\"":474,"#":556,"$":556,"%":889,"&":722,"'":238,"(":333,")":333,"*":389,"+":584,",":278,"-":333,".":278,"/":278,"0":556,"1":556,"2":556,"3":556,"4":556,"5":556,"6":556,"7":556,"8":556,"9":556,":":333,";":333,"<":584,"=":584,">":584,"?":611,"@":975,"A":722,"B":722,"C":722,"D":722,"E":667,"F":611,"G":778,"H":722,"I":278,"J":556,"K":722,"L":611,"M":833,"N":722,"O":778,"P":667,"Q":778,"R":722,"S":667,"T":611,"U":722,"V":667,"W":944,"X":667,"Y":667,"Z":611,"[":333,"\\":278,"]":333,"^":584,"_":556,"`":333,"a":556,"b":611,"c":556,"d":611,"e":556,"f":333,"g":611,"h":611,"i":278,"j":278,"k":556,"l":278,"m":889,"n":611,"o":611,"p":611,"q":611,"r":389,"s":556,"t":333,"u":611,"v":556,"w":778,"x":556,"y":556,"z":500,"{":389,"|":280,"}":389,"~":584};
/* Vocales acentuadas / ñ / ü / ç: en las métricas AFM reales de Helvetica
   comparten el mismo ancho que su letra base, así que basta con mapear a
   la base en vez de duplicar toda la tabla para cada variante. */
var PDF_ACCENT_BASE = {"á":"a","é":"e","í":"i","ó":"o","ú":"u","à":"a","è":"e","ì":"i","ò":"o","ù":"u","ä":"a","ë":"e","ï":"i","ö":"o","ü":"u","â":"a","ê":"e","î":"i","ô":"o","û":"u","ñ":"n","ç":"c","Á":"A","É":"E","Í":"I","Ó":"O","Ú":"U","À":"A","È":"E","Ì":"I","Ò":"O","Ù":"U","Ä":"A","Ë":"E","Ï":"I","Ö":"O","Ü":"U","Ñ":"N","Ç":"C"};
function pdfCharWidth(ch, bold){
  var table = bold ? HELV_BOLD_WIDTHS : HELV_WIDTHS;
  if(table[ch] != null) return table[ch];
  var base = PDF_ACCENT_BASE[ch];
  if(base && table[base] != null) return table[base];
  return bold ? 611 : 556; // fallback razonable para lo no mapeado — nunca rompe el layout
}
function measureText(str, size, bold){
  var w = 0; str = String(str||"");
  for(var i=0;i<str.length;i++) w += pdfCharWidth(str.charAt(i), bold);
  return w / 1000 * size;
}
/* Wrapping real por ancho disponible en puntos, no por conteo de
   caracteres — es lo que hace posible usar una fuente proporcional
   (Helvetica) en vez de una monoespaciada y seguir alineando la tabla con
   exactitud. Una palabra más larga que la columna se parte a la fuerza
   (búsqueda binaria del corte que sí cabe) para nunca desbordar la página. */
function wrapText(text, size, bold, maxWidth){
  var words = String(text||"").split(/\s+/).filter(Boolean);
  var lines = [], cur = "";
  words.forEach(function(w){
    while(measureText(w, size, bold) > maxWidth && w.length > 1){
      var lo = 1, hi = w.length, fit = 1;
      while(lo <= hi){
        var mid = (lo+hi) >> 1;
        if(measureText(w.slice(0, mid), size, bold) <= maxWidth){ fit = mid; lo = mid+1; } else hi = mid-1;
      }
      if(cur){ lines.push(cur); cur = ""; }
      lines.push(w.slice(0, fit));
      w = w.slice(fit);
    }
    var candidate = cur ? cur + " " + w : w;
    if(cur && measureText(candidate, size, bold) > maxWidth){ lines.push(cur); cur = w; }
    else cur = candidate;
  });
  if(cur || !lines.length) lines.push(cur);
  return lines;
}
/* Un puñado de caracteres Unicode "altos" (los que puede escribir el
   compositor pero no existen tal cual en WinAnsiEncoding) caen igual dentro
   del bloque 0x80-0x9F — sobre todo la raya larga "—" y las comillas
   tipográficas — así que se remapean a su byte real en vez de perderse
   como "?". Todo lo demás fuera de Latin-1 (emoji, CJK) sí cae a "?": no
   hay fuente Unicode embebida en este generador mínimo. */
var PDF_WINANSI_HIGH_MAP = { 0x2013:0x96, 0x2014:0x97, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2026:0x85 };
function pdfEscapeText(s){
  var out = "";
  for(var i=0;i<String(s).length;i++){
    var c = s.charCodeAt(i);
    var byte = c <= 255 ? c : PDF_WINANSI_HIGH_MAP[c];
    var ch = byte == null ? "?" : String.fromCharCode(byte);
    if(ch === "\\" || ch === "(" || ch === ")") out += "\\" + ch;
    else out += ch;
  }
  return out;
}
function pdfDateLong(iso){
  try{ return new Date(iso).toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return ""; }
}
/* Mismo motivo que fmtDateOnlyShort: Due Date/Valid Until son "YYYY-MM-DD"
   puro, sin hora — se arma en hora local para no perder un día por
   interpretación UTC. */
function pdfDateOnlyShort(iso){
  if(!iso) return "";
  var d = parseDateOnly(iso);
  if(!d) return pdfDateLong(iso);
  try{ return d.toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return iso; }
}
/* Misma paleta que .doc-paper en el visor HTML (--pk-ink/--pk-muted/
   --pk-faint/--pk-line/--pk-accent) — el PDF descargado y lo que se ve en
   pantalla usan literalmente los mismos números RGB. */
var PDF_COLOR = {
  ink:    [0.129, 0.122, 0.102],
  muted:  [0.447, 0.424, 0.361],
  faint:  [0.639, 0.612, 0.537],
  line:   [0.894, 0.878, 0.831],
  accent: [0.612, 0.078, 0.345]
};

/* Genera las operaciones de dibujo del documento, página por página, con
   posiciones reales en puntos (US Letter: 612×792pt = 8.5×11in) — texto,
   líneas y color, todo medido con measureText/wrapText en vez de conteo de
   caracteres. Misma información y jerarquía que renderDocModal (BILL TO,
   tabla Description/Qty/Rate/Amount, Subtotal/Payments received/AMOUNT
   DUE, Payment/Notes, pie con la identidad completa) — es la misma fuente
   de datos (doc), solo cambia el motor de dibujo. */
function buildDocumentPdfOps(doc){
  var M = 54, PW = 612, PH = 792, RIGHT = PW - M;
  var isInvoice = doc.tipo === "invoice";
  var label = isInvoice ? "INVOICE" : "QUOTE";
  var status = documentPaymentStatus(doc);
  var bt = doc.billTo || {};
  var btNombre = bt.nombre || doc.clienteNombre || "";

  var COL_DESC_X = M, COL_DESC_W = 300;
  var COL_QTY_R = M + 350;
  var COL_RATE_R = M + 430;
  var COL_AMT_R = RIGHT;

function pdfColorTriplet(c){ return c[0].toFixed(3) + " " + c[1].toFixed(3) + " " + c[2].toFixed(3); }
function pdfOpsToContentStream(ops){
  var parts = [];
  ops.forEach(function(o){
    if(o.op === "l"){
      parts.push(pdfColorTriplet(o.color) + " RG");
      parts.push((o.width||1).toFixed(2) + " w");
      parts.push(o.x1.toFixed(2) + " " + o.y1.toFixed(2) + " m");
      parts.push(o.x2.toFixed(2) + " " + o.y2.toFixed(2) + " l");
      parts.push("S");
    } else if(o.op === "t"){
      var fontRes = o.bold ? "/F2" : "/F1";
      parts.push(pdfColorTriplet(o.color) + " rg");
      parts.push("BT");
      parts.push(fontRes + " " + o.size + " Tf");
      parts.push("1 0 0 1 " + o.x.toFixed(2) + " " + o.y.toFixed(2) + " Tm");
      parts.push("(" + pdfEscapeText(o.str) + ") Tj");
      parts.push("ET");
    }
  });
  return parts.join("\n");
}
function pdfPadOffset(n){ var s = String(n); while(s.length < 10) s = "0" + s; return s; }
function buildDocumentPdfBytes(doc){
  var pages = buildDocumentPdfOps(doc);
  var n = pages.length;
  var objects = [];
  var kids = [];
  for(var i=0;i<n;i++) kids.push((5+i*2) + " 0 R");
  objects[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objects[2] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>";
  objects[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objects[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  for(i=0;i<n;i++){
    var pageObjNum = 5+i*2, contentObjNum = 6+i*2;
    var stream = pdfOpsToContentStream(pages[i]);
    objects[pageObjNum] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + contentObjNum + " 0 R >>";
    objects[contentObjNum] = { stream: stream };
  }
  var out = "%PDF-1.4\n";
  var maxObj = 4 + n*2;
  var offsets = [0];
  for(var num=1; num<=maxObj; num++){
    offsets[num] = out.length;
    var body = objects[num];
    if(body && typeof body === "object" && body.stream != null){
      out += num + " 0 obj\n<< /Length " + body.stream.length + " >>\nstream\n" + body.stream + "\nendstream\nendobj\n";
    } else {
      out += num + " 0 obj\n" + body + "\nendobj\n";
    }
  }
  var xrefStart = out.length;
  out += "xref\n0 " + (maxObj+1) + "\n0000000000 65535 f \n";
  for(num=1; num<=maxObj; num++) out += pdfPadOffset(offsets[num]) + " 00000 n \n";
  out += "trailer\n<< /Size " + (maxObj+1) + " /Root 1 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF";
  return out;
}
function downloadDocumentPdf(docId){
  var doc = findDocumentoById(docId);
  if(!doc) return;
  var bstr = buildDocumentPdfBytes(doc);
  var bytes = new Uint8Array(bstr.length);
  for(var i=0;i<bstr.length;i++) bytes[i] = bstr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: "application/pdf" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = (doc.tipo==="invoice"?"Invoice-":"Cotizacion-") + (doc.numero||doc.id) + ".pdf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function resizeImageToBlob(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error("No se pudo procesar la imagen")); }, "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Hallazgo técnico de esta ronda (sección 45 del pedido): resizeImageToBlob
   de arriba fuerza salida JPEG, que no tiene canal alfa — si se reutilizara
   tal cual para el logo, un PNG transparente saldría con fondo negro sólido
   (comportamiento estándar de canvas.toBlob al serializar sin alfa). Esta
   variante es EXCLUSIVA del logo: mismo decodificado por canvas, misma
   lógica de escalado, pero salida PNG (sin pérdida, conserva transparencia)
   — las fotos de ticket siguen exactamente igual con la función de arriba,
   sin tocar (sección 5 del pedido original). Los logos son gráficos
   pequeños (no fotos de cámara), así que el peso extra de PNG es aceptable. */
function resizeImageToBlobPreservingAlpha(file, maxDim){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error("No se pudo procesar la imagen")); }, "image/png");
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Logo del cliente (§13-16) — orden explícito pedido por el dueño del
   producto, sin excepciones:
     1) subir el archivo nuevo a Storage
     2) confirmar que la subida fue exitosa
     3) recién ahí actualizar clientes.logo_storage_path
     4) solo DESPUÉS intentar borrar el archivo viejo (best-effort)
   Nunca al revés — si algo falla en 1-3, el cliente conserva exactamente el
   logo (o las iniciales) que ya tenía; el borrado del paso 4 nunca bloquea
   ni revierte una operación que ya tuvo éxito, y si falla, el único costo
   es un archivo huérfano en Storage. */
async function uploadClienteLogo(cliente, file){
  var previousPath = cliente.logoStoragePath;
  var blob;
  try{
    blob = await resizeImageToBlobPreservingAlpha(file, 512);
  }catch(e){
    showToast("No se pudo procesar la imagen: " + (e.message || "error"));
    return false;
  }
  var path = "clientes/" + cliente.id + "/logo_" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + ".png";
  try{
    var up = await sb.storage.from(FILES_BUCKET).upload(path, blob, { contentType: "image/png" });
    if(up.error) throw up.error;
  }catch(e){
    showToast("No se pudo subir el logotipo: " + (e.message || "error"));
    return false;
  }
  var ok = await updateClienteCore(cliente.id, { logoStoragePath: path });
  if(!ok){
    /* El archivo nuevo ya quedó en Storage pero el cliente no llegó a
       apuntarlo (updateClienteCore ya mostró su propio error) — no lo
       borramos: mejor un huérfano que arriesgar perder la única referencia
       si el usuario reintenta y esa segunda vez sí funciona. */
    return false;
  }
  if(previousPath && previousPath !== path){
    try{ await sb.storage.from(FILES_BUCKET).remove([previousPath]); }catch(e){ /* best-effort, nunca bloquea */ }
  }
  return true;
}

/* Quitar el logo: limpia el campo PRIMERO — updateClienteCore ya actualiza
   STATE y hace render() de forma optimista antes de tocar la red, así que
   el avatar vuelve a iniciales de inmediato (§16) — y solo después intenta
   borrar el objeto de Storage, también best-effort. */
async function removeClienteLogo(cliente){
  var previousPath = cliente.logoStoragePath;
  if(!previousPath) return true;
  var ok = await updateClienteCore(cliente.id, { logoStoragePath: null });
  if(!ok) return false;
  try{ await sb.storage.from(FILES_BUCKET).remove([previousPath]); }catch(e){ /* best-effort */ }
  return true;
}

async function toggleTaskEstado(ticketId, taskId){
  var t = findTicket(ticketId);
  if(!t) return;
  var task = t.tareas.filter(function(x){ return x.id===taskId; })[0];
  if(!task) return;
  var order = ["pendiente","en_proceso","terminado"];
  var next = order[(order.indexOf(task.estado)+1) % order.length];
  task.estado = next;
  render();
  try{
    var r1 = await sb.from("tareas").update({ estado: next }).eq("id", taskId);

    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Tarea de producción · " + task.desc + " → " + estadoLabel(next) } });

}

/* field -> {dbColumn, label} used by both the optimistic apply and the Supabase update */
var HEADER_FIELDS = {
  "field-cliente":         { key: "cliente",          col: "cliente",          label: "Cliente" },
  "field-responsable":     { key: "responsable",      col: "responsable",      label: "Responsable" },
  "field-fecha-atencion":  { key: "fechaAtencion",     col: "fecha_atencion",   label: "Fecha de atención" },
  "field-fecha-compromiso":{ key: "fechaCompromiso",   col: "fecha_compromiso", label: "Fecha de compromiso" }
};

async function commitHeaderField(elId, value, opts){
  var t = findTicket(UI.selectedTicketId);
  if(!t) return;
  var def = HEADER_FIELDS[elId];
  if(!def) return;
  /* Addendum "Date Correctness" §9: nunca guardar una fecha calendario
     absurda (el bug de "año 0002" — un <input type="date"> con el año a
     medio escribir). Se corta ANTES de tocar STATE/Supabase; render()
     reconstruye el campo desde t[def.key], que no cambió, así que el valor
     inválido que el navegador tenía en el input simplemente desaparece. */
  if(def.col.indexOf("fecha_")===0 && value && !isSaneDateOnly(value)){
    showToast("Fecha inválida — revisa el año e inténtalo de nuevo.");
    UI.headerEditField = null;
    render();
    return;
  }
  if(t[def.key] === value) return;
  t[def.key] = value;
  UI.headerEditField = null;
  render();
  if(def.key === "responsable" && value) rememberName(value);
  try{
    var patch = {}; patch[def.col] = value || (def.col.indexOf("fecha_")===0 ? null : "");
    var r1 = await sb.from("tickets").update(patch).eq("id", t.id);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: def.label + ": " + (value || "(vacío)") } });
  }catch(e){ showToast("No se pudo guardar: " + (e.message || "error")); }
  refreshFromServer(opts);
}

async function commitQueSigue(value, opts){

    var r1 = await sb.from("tickets").update({ que_sigue: value }).eq("id", t.id);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Qué sigue: " + (value || "(vacío)") } });
  }catch(e){ showToast("No se pudo guardar: " + (e.message || "error")); }

}

/* ---------------- Entrega y cierre (sección 6/7 de la iteración "Comanda")
   ----------------
   Dos operaciones centrales, cada una con un único camino de guardado —
   los tres caminos posibles de la UI (botón grande del encabezado, menú
   "•••", y en el futuro un comando) siempre llaman a estas mismas
   funciones (sección 11: redundancia en los caminos, no en la lógica).
   "ENTREGADO NO SIGNIFICA CERRADO": marcarEntregadoCore nunca toca
   cierre_tipo. "PRECIO ≠ DEUDA": ninguna de estas funciones calcula ni
   guarda un saldo/deuda — solo registran hechos (se entregó, se cerró). */
async function marcarEntregadoCore(t){
  if(!t || t.entregadoAt) return;
  var now = new Date().toISOString();
  t.entregadoAt = now; t.entregadoPor = UI.whoami || "";
  render();
  try{
    var r1 = await sb.from("tickets").update({ entregado_at: now, entregado_por: UI.whoami || null }).eq("id", t.id);
    if(r1.error) throw r1.error;
    /* payload.kind (V0.5 §4): discriminador semántico agregado SOLO hacia
       adelante — tipo sigue siendo "sistema" (sin migración de esquema),
       pero el timeline ahora puede distinguir esta fila de una edición
       menor sin parsear payload.text. Eventos ya guardados antes de este
       cambio no tienen "kind" y se siguen viendo genéricos — no se
       reclasifican retroactivamente. */
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Marcado como entregado", kind: "entrega" } });
  }catch(e){ showToast("No se pudo marcar como entregado: " + (e.message || "error")); }
  refreshFromServer();
}
/* Corrección de un error de captura (marcar por accidente) — misma
   sencillez que togglePin, no una "reapertura" de ticket cerrado (eso no
   existe en esta iteración a propósito: no hay máquina de estados nueva). */
async function deshacerEntregaCore(t){
  if(!t || !t.entregadoAt || t.cierreTipo) return;
  t.entregadoAt = null; t.entregadoPor = "";
  render();
  try{
    var r1 = await sb.from("tickets").update({ entregado_at: null, entregado_por: null }).eq("id", t.id);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Se deshizo la entrega" } });
  }catch(e){ showToast("No se pudo deshacer: " + (e.message || "error")); }
  refreshFromServer();
}
/* Cierre explícito — exige tipo + motivo, nunca se infiere. Una vez cerrado,
   el ticket pasa a HISTORIA (ticketIsCerrado) en Clientes; el sidebar solo
   lo hunde al fondo de su grupo de fecha, nunca lo oculta. */
async function cerrarTicketCore(t, tipo, razon){
  if(!t || (tipo !== "pagado" && tipo !== "cancelado") || !(razon||"").trim()) return;
  var now = new Date().toISOString();
  razon = razon.trim();
  t.cierreTipo = tipo; t.cerradoAt = now; t.razonCierre = razon; t.cerradoPor = UI.whoami || "";
  UI.composer = null; UI.cierreDraft = null;
  render();
  try{
    var r1 = await sb.from("tickets").update({ cierre_tipo: tipo, cerrado_at: now, razon_cierre: razon, cerrado_por: UI.whoami || null }).eq("id", t.id);
    if(r1.error) throw r1.error;
    /* payload.kind (V0.5 §4): ver comentario en marcarEntregadoCore — mismo
       mecanismo, valores más específicos porque cierre tiene dos sabores
       (pagado/cancelado) que sí importa distinguir en el timeline. */
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null,
      payload: { text: "Ticket cerrado · " + (tipo==="pagado"?"Pagado":"Cancelado") + " — " + razon, kind: tipo==="pagado" ? "cierre_pagado" : "cierre_cancelado" } });
  }catch(e){ showToast("No se pudo cerrar el ticket: " + (e.message || "error")); }
  refreshFromServer({refocus:true});
}

/* Nunca perder la descripción por una falla de Storage (§3): el texto se
   guarda SIEMPRE primero; la captura es un adjunto best-effort aparte. Si
   la migración 0008 todavía no se corrió, el INSERT falla con el error de
   Supabase tal cual (mismo criterio que el resto de las migraciones
   pendientes de esta app) y se avisa — nunca se pierde el texto ya escrito,
   porque UI.bugReportOpen se queda true hasta que sí se guarda. */
async function submitBugReport(){
  var descEl = document.getElementById("bugreport-desc");
  var desc = (descEl && descEl.value || "").trim();
  if(!desc){ if(descEl) descEl.focus(); showToast("Escribe qué pasó."); return; }
  UI.bugReportSaving = true;
  renderKeepingLiveInputs(); // §30: mostrar "Guardando…" no debe borrar lo ya escrito
  try{
    var ins = await sb.from("app_bug_reports").insert({
      descripcion: desc, severidad: UI.bugReportSeverity, context: bugReportContext()
    }).select().single();
    if(ins.error) throw ins.error;
    var bugId = ins.data.id;
    if(bugReportScreenshotFile){
      try{
        var path = "app-bugs/" + bugId + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + ".jpg";
        var blob = await resizeImageToBlob(bugReportScreenshotFile, 1280, 0.8);
        var up = await sb.storage.from(FILES_BUCKET).upload(path, blob, { contentType: "image/jpeg" });
        if(!up.error){
          await sb.from("app_bug_reports").update({ screenshot_storage_path: path }).eq("id", bugId);
        }
      }catch(e){ /* best-effort: el reporte de texto ya se guardó, la captura nunca lo bloquea */ }
    }
    UI.bugReportOpen = false;
    bugReportScreenshotFile = null;
    UI.bugReportSaving = false;
    render();
    showToast("Reporte guardado. Gracias.");
  }catch(e){
    UI.bugReportSaving = false;
    renderKeepingLiveInputs(); // §30: si Supabase falla, la descripción debe seguir ahí para corregir/reintentar
    showToast("No se pudo guardar el reporte: " + (e.message || "error"));
  }
}

/* §18: nunca comparación cruda de floats ni fingir que cierra — se calcula
   con round2() y se muestra la diferencia tal cual, aunque sea de un
   centavo. Lee directo del DOM (no de UI.totalDraft) porque el usuario
   pudo haber editado cualquier renglón. */
function updateTotalPedidoSummary(){
  var d = UI.totalDraft;
  if(!d) return;
  var el = document.getElementById("total-pedido-summary");
  if(!el) return;
  var actual = 0;
  document.querySelectorAll(".total-row-price").forEach(function(inp){
    var v = parseFloat(inp.value);
    var qty = parseFloat(inp.getAttribute("data-cantidad")) || 1;
    if(!isNaN(v)) actual += qty * v;
  });
  actual = round2(actual);
  var diff = round2(d.monto - actual);
  var html = "Total actual <b>" + fmtMoney(actual) + "</b>";
  if(diff !== 0){
    html += ' · <span class="total-pedido-diff">Diferencia ' + fmtMoney(Math.abs(diff)) + (diff > 0 ? " por asignar" : " de más") + "</span>";
  } else {
    html += ' · <span class="total-pedido-match">✓ Coincide con el total deseado</span>';
  }
  el.innerHTML = html;
}
/* §19/§22: solo escribe los renglones que de verdad cambiaron (nunca
   reescribe todo el pedido) — reutiliza updateProductoCore tal cual, un
   UPDATE por producto modificado, exactamente igual que si el usuario
   hubiera editado ese precio a mano en /productos. Un precio inválido o
   negativo detiene TODO el Aplicar (§22: nunca crea un precio negativo
   solo). Dejar un campo vacío significa "sigue pendiente" — nunca se
   fuerza un valor. */
async function applyTotalPedidoEditor(){
  var d = UI.totalDraft;
  if(!d) return;
  var t = findTicket(d.ticketId);
  if(!t){ closeTotalPedidoEditor(); return; }
  var writes = [];
  for(var i=0;i<d.rows.length;i++){
    var r = d.rows[i];
    var inp = document.getElementById("total-row-price-" + r.id);
    var raw = inp ? inp.value.trim() : "";
    if(raw === "") continue; // se deja pendiente, no se toca
    var v = parseFloat(raw);
    if(isNaN(v) || v < 0){ showToast("Hay un precio inválido en \"" + r.desc + "\"."); return; }
    if(r.precio !== v) writes.push({ id: r.id, precio: v });
  }
  UI.totalDraft = null;
  render();
  for(var j=0;j<writes.length;j++){
    await updateProductoCore(t, writes[j].id, { precio: writes[j].precio });
  }
}

/* ---------------- slash commands: parsing y ejecución ----------------
   Sintaxis pequeña y predecible a propósito — no lenguaje natural. Las
   tres rutas (botón +, /comando, escribir el comando completo) llaman
   siempre a las mismas funciones core de arriba. */

function parseSlashCommand(raw){
  var body = raw.slice(1); // quita el "/"
  var firstSpace = body.indexOf(" ");
  var cmd = (firstSpace === -1 ? body : body.slice(0, firstSpace)).toLowerCase().trim();
  var arg = (firstSpace === -1 ? "" : body.slice(firstSpace + 1)).trim();
  return { cmd: cmd, arg: arg };
}

/* Parser de /producto — sintaxis humana y flexible a propósito (sección 5):
   /producto [cantidad opcional] [descripción] [precio opcional]
   Se usa TAL CUAL, sin ninguna copia, tanto para guardar (COMMANDS
   "producto") como para la vista previa en vivo mientras se escribe (ver
   productoPreviewLine) — un solo parser, nunca dos que puedan desincronizarse.

   Orden de prioridad para detectar el precio (de mayor a menor, se detiene
   en el primero que aplique — nunca se inventa un precio que no esté
   explícito en el texto):
     1) "sin precio" / "no price" en cualquier parte -> precio pendiente,
        sin importar qué números haya alrededor (escape explícito).
     2) "... total <n>" al final -> <n> es el TOTAL; precio unitario = total/cantidad.
     3) "... precio <n>" / "... price <n>" al final -> <n> es el precio unitario.
     4) "...$<n>" / "...$ <n>" al final -> <n> es el precio unitario.
     5) "...<n>dlls|dls|dolares|dólares" (con o sin espacio) al final -> <n> es el precio unitario.
     6) Si después de quitar la cantidad el ÚLTIMO token de todo lo que
        queda es puramente numérico, se toma como precio unitario (ej.
        "banner 50"). Si no, el precio queda pendiente — nunca se asume $0. */
function parseProductoArg(arg){
  var tokens = (arg || "").trim().split(/\s+/).filter(Boolean);
  var cantidad = 1;
  if(tokens.length > 1 && /^\d+(?:\.\d+)?$/.test(tokens[0])){
    cantidad = parseFloat(tokens.shift());
  }
  var rest = tokens.join(" ");

  var sinPrecioRe = /\s*\b(?:sin\s+precio|no\s+price)\b\s*/i;
  if(sinPrecioRe.test(rest)){
    return { desc: rest.replace(sinPrecioRe, " ").trim(), cantidad: cantidad, precio: null, total: null };
  }

  var mTotal = rest.match(/^(.*?)\btotal\s+(\d+(?:\.\d+)?)\s*$/i);
  if(mTotal){
    var total = parseFloat(mTotal[2]);
    return { desc: mTotal[1].trim(), cantidad: cantidad, precio: cantidad ? (total / cantidad) : null, total: total };
  }

  var mPrecioKw = rest.match(/^(.*?)\b(?:precio|price)\s+(\d+(?:\.\d+)?)\s*$/i);
  if(mPrecioKw){
    return { desc: mPrecioKw[1].trim(), cantidad: cantidad, precio: parseFloat(mPrecioKw[2]), total: null };
  }

  var mDollar = rest.match(/^(.*?)\$\s*(\d+(?:\.\d+)?)\s*$/);
  if(mDollar){
    return { desc: mDollar[1].trim(), cantidad: cantidad, precio: parseFloat(mDollar[2]), total: null };
  }

  var mUnidad = rest.match(/^(.*?[^\d])?(\d+(?:\.\d+)?)\s*(?:dlls|dls|dolares|d[oó]lares)\s*$/i);
  if(mUnidad){
    return { desc: (mUnidad[1]||"").trim(), cantidad: cantidad, precio: parseFloat(mUnidad[2]), total: null };
  }

  var restTokens = rest.split(/\s+/).filter(Boolean);
  if(restTokens.length > 1 && /^\d+(?:\.\d+)?$/.test(restTokens[restTokens.length-1])){
    return { desc: restTokens.slice(0,-1).join(" "), cantidad: cantidad, precio: parseFloat(restTokens[restTokens.length-1]), total: null };
  }

  return { desc: rest.trim(), cantidad: cantidad, precio: null, total: null };
}

function parsePagoArg(arg){
  var m = arg.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m) return null;
  return { monto: parseFloat(m[1]), concepto: (m[2]||"").trim() };
}

/* ---------------- /nuevo — quick capture multi-intent (Composer Intelligence §7/§8) ----------------
   Parser determinista y chico a propósito (sección 17: nada de IA/fuzzy):
   corta el texto en segmentos por palabra clave reservada ("producto",
   "pago", "telefono") y delega CADA segmento al parser que ya existe para
   ese dato — parseProductoArg/parsePagoArg tal cual, nunca una copia.
   Primera prioridad (según lo acordado): texto inicial, teléfono
   autodetectado, producto, pago — "nota"/"cliente"/"atender"/"compromiso"/
   "responsable"/"quesigue" NO se reconocen todavía como palabras clave de
   segmento (el propio pedido permite no cubrirlas todas en la primera
   versión); si hace falta agregarlas después, es extender este mismo
   arreglo, no un parser nuevo. */
var NUEVO_SEGMENT_KEYWORDS = ["producto","pago","telefono"];
function parseNuevoArg(raw){
  raw = (raw || "").trim();
  var kwRe = new RegExp("\\b(" + NUEVO_SEGMENT_KEYWORDS.join("|") + ")\\b", "gi");
  var matches = [];
  var m;
  while((m = kwRe.exec(raw))) matches.push({ kw: m[1].toLowerCase(), index: m.index, end: m.index + m[1].length });

  var identityRaw = matches.length ? raw.slice(0, matches[0].index).trim() : raw;
  var segments = matches.map(function(mm, i){
    var end = (i+1 < matches.length) ? matches[i+1].index : raw.length;
    return { kw: mm.kw, text: raw.slice(mm.end, end).trim() };
  });

  /* Teléfono: autodetectado dentro del texto de identidad (el caso
     principal, sección 8) — se RECORTA del título para que "Piñata de
     Spiderman 9565612222" se convierta en identidad "Piñata de Spiderman" +
     teléfono aparte, nunca en un título con el número pegado. Un segmento
     "telefono ..." explícito, si existe, siempre gana sobre el detectado. */
  var identityPhone = detectPhone(identityRaw);
  var identityTitle = identityRaw;
  if(identityPhone){
    identityTitle = (identityRaw.slice(0, identityPhone.index) + " " + identityRaw.slice(identityPhone.end)).replace(/\s+/g, " ").trim();
  }
  var explicitPhoneSeg = segments.filter(function(s){ return s.kw === "telefono" && s.text; })[0];
  var phone = null;
  if(explicitPhoneSeg){
    /* Mismo criterio que ya usa parseEditarClienteArg para su propia
       palabra clave "telefono": normaliza si hay suficientes dígitos, si no
       deja el texto tal cual (nunca inventa). */
    var digits = explicitPhoneSeg.text.replace(/\D/g, "");
    phone = { formatted: digits.length >= 7 ? formatPhoneDigits(digits) : explicitPhoneSeg.text, digits: digits, raw: explicitPhoneSeg.text };
  } else if(identityPhone){
    phone = { formatted: identityPhone.formatted, digits: identityPhone.digits, raw: identityPhone.raw };
  }

  var productos = [], errors = [];
  segments.filter(function(s){ return s.kw === "producto"; }).forEach(function(s){
    if(!s.text) return;
    var p = parseProductoArg(s.text);
    if(!p.desc) errors.push('No entendí el producto: "' + s.text + '" — ej. "producto pinata 55"');
    else productos.push(p);
  });

  var pagos = [];
  segments.filter(function(s){ return s.kw === "pago"; }).forEach(function(s){
    if(!s.text) return;
    var pg = parsePagoArg(s.text);
    if(!pg || isNaN(pg.monto)) errors.push('No entendí el pago: "' + s.text + '" — ej. "pago 10 anticipo"');
    else pagos.push(pg);
  });

  if(!identityTitle && !phone && !productos.length && !pagos.length){
    errors.push('Escribe al menos un título, teléfono, producto o pago, ej. "/nuevo Piñata de Spiderman 9565612222 producto pinata 55 pago 10"');
  }

  return { identityTitle: identityTitle, phone: phone, productos: productos, pagos: pagos, errors: errors, raw: raw };
}

/* V0.5 §13/D5/D8/D10: default de pricing para los comandos de un solo paso
   (/factura, /cotizacion) — NO abren el modal (renderDocFormModal), así que
   necesitan proponer ellos mismos algo razonable sin preguntar nada: tax
   aplicado a la tasa default salvo que el cliente esté marcado exento
   (D7), fee SIEMPRE apagado por default (D8: nunca se asume un método de
   cobro), y en invoice Terms="Due on Receipt" con su Due Date ya calculado
   (D5). Es exactamente lo mismo que el modal propondría al abrirse por
   primera vez — mismo default, dos caminos de entrada. */
function defaultPricingForTicket(t, tipo){
  var linked = t.clienteId ? STATE.clientes.filter(function(c){ return c.id === t.clienteId; })[0] : null;
  var exempt = !!(linked && linked.taxExempt);
  var isInvoice = tipo === "invoice";
  return {
    taxApplied: !exempt,
    taxRate: DEFAULT_SALES_TAX_RATE,
    taxExempt: exempt,
    taxExemptReason: (linked && linked.taxExemptReason) || "",
    /* Addendum §12: "default = ninguno" — /factura y /cotizacion nunca
       asumen un fee por su cuenta, igual que el modal. */
    fees: [],
    terms: isInvoice ? "Due on Receipt" : null,
    dueDate: isInvoice ? dueDateFromTerms("Due on Receipt", new Date()) : null,
    validUntil: null,
    poReference: null
  };
}

/* /factura y /cotizacion (sección 13/14): crean el documento comercial
   completo en un solo paso, reutilizando tal cual los productos y el
   cliente que ya están en el ticket — sin abrir el formulario de varios
   pasos. Todo el texto que sigue al comando (opcional) se guarda como
   notas del documento, ej. "/factura pagado por transferencia". Nunca
   inventa un precio: si algún producto todavía no tiene precio, se pide
   resolverlo primero con /productos en vez de facturar/cotizar con huecos.
   El total que se confirma YA incluye tax/fee del default (D2: doc.total
   siempre es el total final), para que la confirmación no muestre un
   número distinto del que terminará guardado. */
function parseDocCommand(arg, ctx, tipo){
  var t = ctx.ticket;
  var tipoLabel = tipo === "invoice" ? "un invoice" : "una cotización";
  if(!t.productos.length) return { ok:false, error: "Agrega al menos un producto antes de crear " + tipoLabel + ", ej. /producto banner 50" };
  var pending = t.productos.filter(function(p){ return p.precio == null; });
  if(pending.length) return { ok:false, error: "Hay " + pending.length + (pending.length===1?" producto":" productos") + " sin precio — resuélvelo con /productos antes de crear " + tipoLabel };
  var items = t.productos.map(function(p){ return { desc: p.desc, cantidad: p.cantidad, precio: p.precio }; });
  var subtotal = items.reduce(function(s,it){ return s + it.cantidad*it.precio; }, 0);
  var pricing = defaultPricingForTicket(t, tipo);
  var taxAmount = computeTaxAmount(subtotal, pricing.taxRate, pricing.taxApplied);
  /* Addendum §10/§11: mismo criterio que createDocumentoCore — cada fee de
     pricing.fees (aquí siempre [] por D8, pero el cálculo debe seguir
     siendo correcto si eso cambia) se computa independientemente sobre
     subtotal+tax y se suma. */
  var feesTotal = (pricing.fees || []).reduce(function(s,f){ return s + computeFeeAmount(subtotal + taxAmount, f); }, 0);
  var total = round2(subtotal + taxAmount + feesTotal);
  return { ok:true, data: { tipo: tipo, items: items, subtotal: subtotal, total: total, pricing: pricing, clienteNombre: t.cliente || "", notas: (arg||"").trim() } };
}
function docConfirmSummary(data){
  return (data.clienteNombre ? escapeHtml(data.clienteNombre) + " — " : "") +
    data.items.length + (data.items.length===1?" producto":" productos") + " · " + fmtMoney(data.total) +
    (data.pricing && data.pricing.taxApplied ? " (incl. tax)" : "") +
    (data.notas ? " · " + escapeHtml(data.notas) : "");
}

/* Parser de /editarcliente (sección 10) — sintaxis pequeña y predecible,
   nunca lenguaje natural genérico. Dos modos, nunca mezclados:
     1) Forma con palabra clave en cualquier parte del texto ("telefono",
        "email", "empresa", "nombre", "notas", "preautorizado") — todo lo
        que sigue a la palabra clave es el valor de ESE campo. Si hay texto
        antes de la palabra clave y todavía no hay un cliente resuelto por
        contexto (ticket con cliente vinculado), ese texto es el nombre a
        buscar (ej. "/editarcliente Angela telefono 9565612970").
     2) Sin ninguna palabra clave — detección automática por formato: un
        correo (por su forma), un teléfono (una racha de 7+ dígitos, con o
        sin separadores), la primera palabra restante como nombre a buscar
        (si hace falta) y lo que sobra como empresa propuesta.
   Nunca inventa ni sobrescribe un campo que no aparece explícito en el
   texto — el resultado son solo los campos detectados, listos para
   mostrarse en confirmación antes de guardar nada. */
function normalizeWord(w){
  return (w||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}
var CLIENTE_FIELD_KEYWORDS = {
  telefono: "telefono", phone: "telefono",
  email: "email", correo: "email",
  empresa: "empresa", company: "empresa",
  nombre: "nombre", name: "nombre",
  notas: "notasComerciales", notes: "notasComerciales",
  preautorizado: "preautorizado", preauthorized: "preautorizado",
  /* V0.5 D7: exención de impuesto es un atributo VIVO del cliente (no de un
     documento) — texto libre para el motivo/referencia, sin almacenamiento
     de certificado en esta versión (ver comentario de tax_exempt_ref en la
     migración 0006). */
  exento: "taxExempt", exempt: "taxExempt", taxexempt: "taxExempt",
  exentorazon: "taxExemptReason", exemptreason: "taxExemptReason", motivoexento: "taxExemptReason",
  exentoref: "taxExemptRef", exemptref: "taxExemptRef"
};
function formatPhoneDigits(digits){
  if(digits.length === 10) return digits.slice(0,3) + "-" + digits.slice(3,6) + "-" + digits.slice(6);
  return digits;
}

/* ---------------- Composer Intelligence §2: detector central de teléfonos ----------------
   Helper NUEVO, independiente del regex suelto que ya vivía dentro de
   parseEditarClienteArg (más abajo) — evalué reusar uno solo para los dos,
   pero parseEditarClienteArg acepta desde 7 dígitos (contexto donde el
   usuario ya escribió la palabra "telefono", así que hay intención
   explícita) mientras que este detector, pensado para adivinar sobre texto
   libre sin esa pista, solo propone algo con 10-14 dígitos (la forma real
   de un teléfono, sección 2 del pedido) — forzar un solo umbral hubiera
   sido o de más falsos positivos aquí, o de regresión allá. Se documenta
   la decisión en vez de fusionarlos a la fuerza.

   Solo reconoce FORMA (dígitos + espacios/guiones/puntos/paréntesis, "+"
   opcional al inicio) — nunca valida que el número exista. Nunca destruye
   el texto original: solo informa dónde está el candidato (índice/fin) para
   que quien llama decida si lo recorta del texto que va a guardar. */
function scanPhoneCandidates(text){
  var re = /(\+\d{1,3}[\s.-]?)?(\(\d{3}\)[\s.-]?\d{3}[\s.-]?\d{4}|\d{3}[\s.-]\d{3}[\s.-]\d{4}|\b\d{10,14}\b)/g;
  var out = [];
  var m;
  while((m = re.exec(text || ""))){
    var raw = m[0];
    out.push({ raw: raw, digits: raw.replace(/\D/g, ""), index: m.index, end: m.index + raw.length });
  }
  return out;
}
/* Alta confianza = exactamente UN candidato de 10-14 dígitos en todo el
   texto. Con cero, o con más de uno (ambigüedad real), no propone nada —
   "no interpretar como teléfono cualquier número aislado" (sección 2):
   mejor no adivinar que adivinar mal. */
function detectPhone(text){
  var candidates = scanPhoneCandidates(text).filter(function(c){ return c.digits.length >= 10 && c.digits.length <= 14; });
  if(candidates.length !== 1) return null;
  var c = candidates[0];
  return { raw: c.raw, digits: c.digits, formatted: formatPhoneDigits(c.digits), index: c.index, end: c.end };
}

function parseEditarClienteArg(arg){
  var tokens = (arg||"").trim().split(/\s+/).filter(Boolean);
  var kwIndex = -1, kwField = null;
  for(var i=0;i<tokens.length;i++){
    var f = CLIENTE_FIELD_KEYWORDS[normalizeWord(tokens[i])];
    if(f){ kwIndex = i; kwField = f; break; }
  }
  var patch = {}, nameQuery = null;
  if(kwField){
    var before = tokens.slice(0, kwIndex).join(" ").trim();
    var value = tokens.slice(kwIndex+1).join(" ").trim();
    if(kwField === "telefono"){
      var digits = value.replace(/\D/g, "");
      patch.telefono = digits.length >= 7 ? formatPhoneDigits(digits) : value;
    } else if(kwField === "preautorizado"){
      var v = normalizeWord(value);
      patch.preautorizado = (v === "si" || v === "true" || v === "yes" || v === "1");
    } else if(kwField === "taxExempt"){
      var ve = normalizeWord(value);
      patch.taxExempt = (ve === "si" || ve === "true" || ve === "yes" || ve === "1");
    } else if(value){
      patch[kwField] = value;
    }
    /* Si hay texto ANTES de la palabra clave, es explícitamente el nombre
       del cliente a buscar (ej. "Angela telefono 9565612970") y siempre
       gana sobre cualquier cliente ya vinculado por contexto. Sin texto
       antes ("telefono 9565612970" a secas), no hay nombre explícito: el
       llamador decide si cae al cliente vinculado del ticket actual. */
    if(before) nameQuery = before;
    return { nameQuery: nameQuery, patch: patch };
  }

  var rest = (arg||"").trim();
  var emailMatch = rest.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/);
  if(emailMatch){
    patch.email = emailMatch[0];
    rest = (rest.slice(0, emailMatch.index) + " " + rest.slice(emailMatch.index + emailMatch[0].length)).replace(/\s+/g, " ").trim();
  }
  var phoneMatch = rest.match(/(\+?\d[\d\-.\s]{5,}\d)/);
  if(phoneMatch){
    var digits2 = phoneMatch[0].replace(/\D/g, "");
    if(digits2.length >= 7){
      patch.telefono = formatPhoneDigits(digits2);
      rest = (rest.slice(0, phoneMatch.index) + " " + rest.slice(phoneMatch.index + phoneMatch[0].length)).replace(/\s+/g, " ").trim();
    }
  }
  /* Sin palabra clave, la PRIMERA palabra que sobra es siempre el nombre a
     buscar (ej. "Angela Top Builders 9565612970 ..." -> nombre "Angela",
     el resto se propone como empresa) — igual gana sobre un cliente ya
     vinculado por contexto si el texto trae un nombre explícito. */
  var restTokens = rest.split(/\s+/).filter(Boolean);
  if(restTokens.length) nameQuery = restTokens.shift();
  var empresa = restTokens.join(" ").trim();
  if(empresa) patch.empresa = empresa;
  return { nameQuery: nameQuery, patch: patch };
}

/* ---------------- fecha humana: un solo parser reutilizable ----------------
   Distingue tres resultados a propósito: "confident" (se puede guardar tal
   cual), "ambiguous" y "unrecognized" (nunca se guarda nada en estos dos
   últimos casos — el comando que llama cae de vuelta al selector de fecha
   que ya existe en el encabezado del ticket, en vez de adivinar). */

var WEEKDAY_NAMES = {
  domingo:0, dom:0, sunday:0, sun:0,
  lunes:1, lun:1, monday:1, mon:1,
  martes:2, mar:2, tuesday:2, tue:2,
  miercoles:3, "miércoles":3, mie:3, wednesday:3, wed:3,
  jueves:4, jue:4, thursday:4, thu:4,
  viernes:5, vie:5, friday:5, fri:5,
  sabado:6, "sábado":6, sab:6, saturday:6, sat:6
};
/* Addendum "Date Correctness" §5: /atender y /compromiso deben reconocer
   también un mes por nombre ("4 septiembre 2026", "septiembre 4"), no solo
   fechas numéricas. Claves sin acento porque se comparan contra
   normalizeWord(), que ya los quita. */
var MONTH_NAMES = {
  enero:0, ene:0, january:0, jan:0,
  febrero:1, feb:1, february:1,
  marzo:2, mar:2, march:2,
  abril:3, abr:3, april:3, apr:3,
  mayo:4, may:4,
  junio:5, jun:5, june:5,
  julio:6, jul:6, july:6,
  agosto:7, ago:7, august:7, aug:7,
  septiembre:8, setiembre:8, sep:8, sept:8, september:8,
  octubre:9, oct:9, october:9,
  noviembre:10, nov:10, november:10,
  diciembre:11, dic:11, december:11, dec:11
};

function parseHumanDate(raw, now){
  now = now || new Date();
  var text = (raw || "").trim().toLowerCase();
  if(!text) return { status: "unrecognized" };

  if(text === "hoy" || text === "today"){
    return { status: "confident", date: startOfDay(now) };
  }
  if(text === "mañana" || text === "manana" || text === "tomorrow"){
    var d0 = startOfDay(now); d0.setDate(d0.getDate()+1);
    return { status: "confident", date: d0 };
  }

  var mSlash = text.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
  if(mSlash){
    var day = parseInt(mSlash[1],10), month = parseInt(mSlash[2],10);
    if(month < 1 || month > 12 || day < 1 || day > 31) return { status: "unrecognized" };
    var year = mSlash[3] ? (mSlash[3].length===2 ? 2000+parseInt(mSlash[3],10) : parseInt(mSlash[3],10)) : now.getFullYear();
    /* Addendum "Date Correctness" §5/§9: nunca aceptar un año fuera de un
       rango humano razonable (protege contra un año mal tecleado, ej. un
       "0002" por un "2026" a medio escribir — mismo espíritu que
       isSaneDateOnly, aplicado aquí al texto libre). */
    if(year < DATE_ONLY_MIN_YEAR || year > DATE_ONLY_MAX_YEAR) return { status: "unrecognized" };
    var d1 = new Date(year, month-1, day);
    if(d1.getMonth() !== month-1 || d1.getDate() !== day) return { status: "unrecognized" }; // ej. 31/02
    if(!mSlash[3] && startOfDay(d1) < startOfDay(now)){
      d1 = new Date(year+1, month-1, day); // sin año: siempre la próxima ocurrencia futura
    }
    return { status: "confident", date: d1 };
  }

  /* "<día> [de] <mes> [[de] <año>]" o "<mes> <día>[, <año>]" — con o sin
     año explícito, con o sin los conectores "de"/",". Sin año, usa el
     mismo criterio que mSlash: la próxima ocurrencia futura. */
  var mDayMonth = text.match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóúñ]+)\.?(?:\s+(?:de\s+)?(\d{4}))?$/);
  var mMonthDay = !mDayMonth && text.match(/^([a-záéíóúñ]+)\.?\s+(\d{1,2})\.?,?(?:\s+(\d{4}))?$/);
  var mn = mDayMonth || mMonthDay;
  if(mn){
    var dayTok = mDayMonth ? mn[1] : mn[2];
    var monthTok = mDayMonth ? mn[2] : mn[1];
    var yearTok = mn[3];
    var monthIdx = MONTH_NAMES[normalizeWord(monthTok)];
    if(monthIdx != null){
      var mday = parseInt(dayTok,10);
      if(mday < 1 || mday > 31) return { status: "unrecognized" };
      var myear = yearTok ? parseInt(yearTok,10) : now.getFullYear();
      if(myear < DATE_ONLY_MIN_YEAR || myear > DATE_ONLY_MAX_YEAR) return { status: "unrecognized" };
      var dm = new Date(myear, monthIdx, mday);
      if(dm.getMonth() !== monthIdx || dm.getDate() !== mday) return { status: "unrecognized" }; // ej. 31 de febrero
      if(!yearTok && startOfDay(dm) < startOfDay(now)){
        dm = new Date(myear+1, monthIdx, mday);
      }
      return { status: "confident", date: dm };
    }
  }

  var mRel = text.match(/^en\s+(\d+)\s+d[ií]as?$/) || text.match(/^in\s+(\d+)\s+days?$/);
  if(mRel){
    var d2 = startOfDay(now); d2.setDate(d2.getDate() + parseInt(mRel[1],10));
    return { status: "confident", date: d2 };
  }

  var wd = text.replace(/^(el|on)\s+/, "");
  if(WEEKDAY_NAMES.hasOwnProperty(wd)){
    var target = WEEKDAY_NAMES[wd];
    var d3 = startOfDay(now);
    var diff = (target - d3.getDay() + 7) % 7;
    if(diff === 0) diff = 7; // "el lunes" es el próximo lunes, no hoy si hoy ya es lunes
    d3.setDate(d3.getDate() + diff);
    return { status: "confident", date: d3 };
  }

  if(/^(el\s+)?\d{1,2}$/.test(text)){
    return { status: "ambiguous" }; // un número suelto: no sabemos a qué mes se refiere
  }

  return { status: "unrecognized" };
}

var ALIAS_INDEX = {};
var COMMANDS_BY_KEY = {};
COMMANDS.forEach(function(c){
  COMMANDS_BY_KEY[c.key] = c;
  c.aliases.forEach(function(a){ ALIAS_INDEX[a.toLowerCase()] = c.key; });
});

/* El botón "+", escribir el comando completo, y elegirlo del menú de "/"
   terminan siempre aquí. Los comandos "read" solo llaman a run(), nunca
   tocan Supabase ni la bitácora — eso es exclusivo de los comandos "write". */
async function dispatchCommand(raw){
  var parsed = parseSlashCommand(raw);
  var aliasKey = parsed.cmd.toLowerCase();
  var t = findTicket(UI.selectedTicketId);
  var hasTicket = !!t;

  if(aliasKey === "help" || aliasKey === "ayuda"){
    /* §16 (paridad "/"-"-"): "/help -nota" tiene que encontrar /nota igual
       que "/help /nota" — antes solo se quitaba un "/" inicial del
       argumento, así que "-nota" se buscaba tal cual (con el guion incluido)
       y nunca hacía match ni por key ni por alias. */
    pushEphemeral("help", hasTicket ? t.id : null, { query: parsed.arg.replace(/^[\/\-]/, "").trim() });
    return;
  }
  if(!aliasKey){
    UI.slashMenuOpen = true; UI.slashQuery = ""; UI.slashActiveIndex = 0;
    render();
    restoreComposerText("/");
    return;
  }

  var key = ALIAS_INDEX[aliasKey];
  if(!key){
    showToast('Comando no reconocido: "/' + parsed.cmd + '". Escribe /help para ver la lista.');
    return;
  }
  var cmd = COMMANDS_BY_KEY[key];
  if(cmd.requiresTicket && !hasTicket){
    showToast("Selecciona un ticket primero.");
    return;
  }
  var ctx = { ticket: t };
  var result = cmd.parse(parsed.arg, ctx);
  if(!result.ok){
    if(result.showHelp){ pushEphemeral("help", hasTicket ? t.id : null, { query: key }); }
    else if(result.error){
      /* Fecha ambigua/no reconocida: en vez de solo avisar, mandamos el foco
         directo al selector de fecha nativo del encabezado — cuando el
         usuario termine con él (bindField), el foco vuelve al compositor
         porque UI.dateFallbackElId lo marca como "vino de un fallback".
         render() reconstruye el DOM (incluido el toast, que empieza vacío),
         así que el aviso siempre se muestra DESPUÉS de renderizar. */
      if(result.focusElId){
        UI.dateFallbackElId = result.focusElId;
        UI.pendingFocus = { elId: result.focusElId };
        render();
      }
      showToast(result.error);
    }
    return;
  }
  return runWithConfirm(cmd, result.data, ctx);
}

function runWithConfirm(cmd, data, ctx){
  var needsConfirm = typeof cmd.confirm === "function" ? cmd.confirm(data, ctx) : !!cmd.confirm;
  if(needsConfirm){
    UI.pendingConfirm = { key: cmd.key, data: data, ticketId: ctx.ticket ? ctx.ticket.id : null };
    render();
    restoreComposerText("");
    return;
  }
  return cmd.run(data, ctx);
}

async function confirmPendingSlash(){
  var c = UI.pendingConfirm;
  if(!c) return;
  var cmd = COMMANDS_BY_KEY[c.key];
  UI.pendingConfirm = null;
  render();
  restoreComposerText("");
  if(!cmd) return;
  var t = c.ticketId ? findTicket(c.ticketId) : findTicket(UI.selectedTicketId);
  await cmd.run(c.data, { ticket: t });
}
