    }).join("");
    return { title: title, html: rows + '<div class="ephemeral-sub">Varias coincidencias — toca la correcta.</div>' };
  }
  var html = '<div class="ephemeral-sub">No encontré ningún cliente que coincida con "' + escapeHtml(query) + '".</div>';
  if(mode === "ticket" && t){
    html += '<button class="help-cmd-btn cliente-cta cliente-cta-create" data-action="cliente-create" data-name="' + escapeHtml(query) + '" data-ticket="' + t.id + '"><span class="desc">+ Crear y vincular cliente "' + escapeHtml(query) + '"</span></button>';
  }
  return { title: title, html: html };
}

/* ---------------- /editarcliente (sección 10): siempre confirma antes de
   guardar — nunca sobrescribe en silencio, y muestra "actual → nuevo"
   cuando un valor va a cambiar de verdad. */
function editarClienteEntryContent(entry){
  if(STATE.clientesTableMissing){
    return { title: "Editar cliente", html: '<div class="ephemeral-sub">La función de clientes todavía no está activada — falta aplicar una migración pendiente en Supabase.</div>' };
  }
  var patch = (entry.params && entry.params.patch) || {};
  if(!Object.keys(patch).length){
    return { title: "Editar cliente", html: '<div class="ephemeral-sub">No reconocí ningún dato para actualizar. Ejemplo: /editarcliente Angela telefono 9565612970</div>' };
  }
  var target = null;
  var nameQuery = entry.params && entry.params.nameQuery;
  if(entry.params && entry.params.targetId){
    target = STATE.clientes.filter(function(c){ return c.id === entry.params.targetId; })[0];
  } else if(nameQuery){
    var matches = findClienteMatches(nameQuery);
    if(!matches.length){
      return { title: 'Editar cliente — "' + nameQuery + '"', html: '<div class="ephemeral-sub">No encontré ningún cliente llamado "' + escapeHtml(nameQuery) + '". Usa /cliente para crearlo primero.</div>' };
    }
    if(matches.length > 1){
      var rows = matches.map(function(c){
        return '<button class="help-cmd-btn" data-action="editarcliente-select" data-client-id="' + c.id + '" data-ephemeral-id="' + entry.id + '"><span class="desc">' + escapeHtml(clienteLabel(c)) + "</span></button>";
      }).join("");
      return { title: 'Editar cliente — "' + nameQuery + '"', html: rows + '<div class="ephemeral-sub">Varias coincidencias — toca la correcta para revisar los cambios.</div>' };
    }
    target = matches[0];
  } else {
    return { title: "Editar cliente", html: '<div class="ephemeral-sub">Fuera de un ticket, especifica primero el nombre del cliente, ej. /editarcliente Angela telefono 9565612970.</div>' };
  }
  if(!target) return { title: "Editar cliente", html: '<div class="ephemeral-sub">Ese cliente ya no existe.</div>' };

  var fieldLabels = {
    nombre:"Cliente", empresa:"Empresa", telefono:"Teléfono", email:"Email",
    notasComerciales:"Notas comerciales", preautorizado:"Preautorizado",
    taxExempt:"Tax exempt", taxExemptReason:"Motivo de exención", taxExemptRef:"Referencia de exención"
  };
  var boolFields = { preautorizado:1, taxExempt:1 };
  var rows2 = Object.keys(patch).map(function(f){
    var newVal = patch[f];
    var curVal = target[f];
    var newDisplay = boolFields[f] ? (newVal ? "Sí" : "No") : newVal;
    var curDisplay = boolFields[f] ? (curVal ? "Sí" : "No") : (curVal || "(sin definir)");
    var changed = String(curVal||"") !== String(newVal);
    return '<div class="ephemeral-row"><strong>' + fieldLabels[f] + ":</strong> " +
      (changed ? escapeHtml(String(curDisplay)) + " &rarr; <strong>" + escapeHtml(String(newDisplay)) + "</strong>" : escapeHtml(String(newDisplay)) + " (sin cambio)") +
      "</div>";
  }).join("");
  /* Línea informativa "Cliente: X" para confirmar CUÁL cliente se resolvió
     antes de mostrar los cambios — salvo que "nombre" ya sea uno de los
     campos que cambian, donde esa misma fila ya lo deja claro. */
  var headerLine = patch.nombre === undefined ? '<div class="ephemeral-row"><strong>Cliente:</strong> ' + escapeHtml(target.nombre) + "</div>" : "";
  var html = headerLine + rows2 + '<button class="help-cmd-btn" data-action="editarcliente-confirm" data-client-id="' + target.id + '" data-ephemeral-id="' + entry.id + '"><span class="desc">Guardar cambios de ' + escapeHtml(target.nombre) + "</span></button>";
  return { title: "Confirmar edición — " + clienteLabel(target), html: html };
}

function helpEntryContent(entry){
  var hasTicket = !!(entry.ticketId && findTicket(entry.ticketId));
  var query = ((entry.params && entry.params.query) || "").toLowerCase().trim();
  var exact = query ? COMMANDS.filter(function(c){ return c.key===query || c.aliases.indexOf(query)!==-1; })[0] : null;
  var html = "", title;
  if(exact){
    title = "/" + exact.aliases[0] + " — " + exact.summary;
    html += '<button class="help-cmd-btn" data-action="help-fill" data-text="/' + exact.aliases[0] + ' "><code>' + escapeHtml(exact.syntax) + "</code></button>";
    (exact.examples || []).forEach(function(ex){
      html += '<button class="help-example-btn" data-action="help-fill" data-text="' + escapeHtml(ex) + '">' + escapeHtml(ex) + "</button>";
    });
    if(exact.aliases.length > 1){
      html += '<div class="ephemeral-sub">También: ' + exact.aliases.slice(1).map(function(a){ return "/"+a; }).join(", ") + "</div>";
    }
  } else {
    title = query ? 'Ayuda — "' + query + '"' : "Ayuda — comandos disponibles";
    var list = query ? filterCommands(hasTicket, query) : visibleCommands(hasTicket);
    if(!list.length){
      html += '<div class="ephemeral-sub">Sin comandos que coincidan con "' + escapeHtml(query) + '".</div>';
    } else {
      list.forEach(function(c){
        html += '<button class="help-cmd-btn" data-action="help-fill" data-text="/' + c.aliases[0] + ' "><code>/' + c.aliases[0] + "</code><span class=\"desc\">" + escapeHtml(c.summary) + "</span></button>";
      });
      html += '<div class="ephemeral-sub">Toca un comando para escribirlo · /help &lt;comando&gt; para ver ejemplos.</div>';
    }
  }
  return { title: title, html: html };
}

/* Ronda "Fluidez, Confiabilidad, Realtime y QA" §14: este banner (/pago,
   /factura, /cotizacion, /nuevo) SOLO tenía el texto "Enter para confirmar ·
   Esc para cancelar" — bug real confirmado en la auditoría: sin teclado
   físico (cualquier iPhone/iPad normal) no había forma de confirmar estos
   comandos, ni siquiera tocando el botón de enviar (▲), porque submitNote()
   nunca revisa UI.pendingConfirm. Se agregan botones táctiles reales que
   llaman a los mismos confirmPendingSlash()/cancelar de siempre — el hint de
   teclado se queda para quien sí tiene uno (desktop), y se oculta en mobile
   por CSS (los botones son ahí la instrucción principal). El label del
   botón de confirmar reutiliza cmd.confirmTitle tal cual ya existe
   ("Registrar pago", "Crear invoice"…) — no se inventa un campo nuevo. */
function slashConfirmBanner(){
  var c = UI.pendingConfirm;
  var cmd = c && COMMANDS_BY_KEY[c.key];
  if(!cmd) return "";
  var confirmLabel = cmd.confirmTitle || cmd.summary || "Confirmar";
  return (
    '<div class="slash-confirm" id="slash-confirm">' +
      '<div class="slash-confirm-title">' + escapeHtml(cmd.confirmTitle || cmd.summary) + "</div>" +
      '<div class="slash-confirm-amount">' + cmd.confirmSummary(c.data) + "</div>" +
      '<div class="slash-confirm-hint">Enter para confirmar · Esc para cancelar</div>' +
      '<div class="popover-actions"><button type="button" class="btn btn-ghost" data-action="slash-confirm-cancel">Cancelar</button><button type="button" class="btn btn-primary" data-action="slash-confirm-ok">' + escapeHtml(confirmLabel) + "</button></div>" +
    "</div>"
  );
}

/* ---------------- tarjetas efímeras (/estado, /pendientes, /dinero) ----------------
   Se calculan al vuelo a partir de STATE y nunca se guardan: no generan fila
   en ninguna tabla ni evento en la bitácora, y se recalculan en cada render
   (nunca inventan datos ni duplican lo que ya existe en el hilo). */

function estadoCardLines(t){
  var lines = [];
  lines.push(["Cliente", t.cliente || "—"]);
  lines.push(["Qué sigue", t.queSigue || "—"]);
  if(t.responsable) lines.push(["Responsable", t.responsable]);
  if(t.fechaAtencion) lines.push(["Atender", fmtDateOnlyShort(t.fechaAtencion)]);
  if(t.fechaCompromiso) lines.push(["Compromiso", fmtDateOnlyShort(t.fechaCompromiso)]);
  if(t.productos.length){
    var totals = computeTotals(t);
    lines.push(["Total", fmtMoney(totals.known) + (totals.pending ? " (+" + totals.pending + " sin precio)" : "")]);
  }
  if(t.pagos.length){
    var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
    lines.push(["Cobrado", fmtMoney(cobrado)]);
  }
  var pend = t.tareas.filter(function(x){ return x.estado !== "terminado"; });
  if(pend.length){
    lines.push(["Tareas pendientes", pend.length + ": " + pend.slice(0,3).map(function(x){ return x.desc; }).join(", ") + (pend.length>3?"…":"")]);
  }
  if(t.documentos.length){
    lines.push(["Documentos", t.documentos.map(function(d){ return d.numero; }).join(", ")]);
  }
  return lines;
}

function pendientesLinesForTicket(t){
  var lines = [];
  var pendTasks = t.tareas.filter(function(x){ return x.estado !== "terminado"; });
  if(pendTasks.length){
    lines.push(["Tareas", pendTasks.map(function(x){ return x.desc + (x.tipo==="produccion" ? " ("+estadoLabel(x.estado)+")" : ""); }).join(" · ")]);
  }
  var pendProd = t.productos.filter(function(p){ return p.precio == null; });
  if(pendProd.length){
    lines.push(["Precios pendientes", pendProd.map(function(p){ return p.desc; }).join(", ")]);
  }
  if(!lines.length) lines.push(["", "Nada pendiente en este ticket."]);
  return lines;
}
function pendientesLinesGlobal(){
  var conQueSigue = STATE.tickets.filter(function(t){ return t.queSigue; })
    .sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
  if(!conQueSigue.length) return [["", 'No hay tickets con "Qué sigue" activo.']];
  return [["Con \"Qué sigue\" activo", conQueSigue.slice(0,8).map(function(t){ return ticketLabel(t) + " (" + t.queSigue + ")"; }).join(" · ")]];
}

/* V0.5 §8.4/D9: "conocido − cobrado" ya no se muestra ni se llama "Saldo" —
   son tres hechos separados, nunca restados entre sí (known ≠ facturado). */
function dineroLinesForTicket(t){
  var totals = computeTotals(t);
  var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  var lines = [["Total conocido", fmtMoney(totals.known)]];
  lines.push(["Pagos registrados", fmtMoney(cobrado)]);
  if(totals.pending) lines.push(["Productos sin precio", totals.pending]);
  return lines;
}
function dineroLinesGlobal(){
  var known=0, cobrado=0, pend=0;
  STATE.tickets.forEach(function(t){
    var totals = computeTotals(t);
    known += totals.known; pend += totals.pending;
    cobrado += t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  });
  var lines = [["Total conocido (todos los tickets)", fmtMoney(known)]];
  lines.push(["Pagos registrados (todos los tickets)", fmtMoney(cobrado)]);
  if(pend) lines.push(["Productos sin precio", pend]);
  return lines;
}

/* ---------------- log efímero: consola dentro del hilo, no ventanas flotantes ----------------
   /help, /estado, /pendientes, /dinero (y en el futuro /productos, /cliente…)
   ya no son popovers — quedan anotados en UI.ephemeralLog como entradas
   ligeras ({id, ticketId, kind, ts, params}) y su contenido se recalcula
   EN VIVO a partir de STATE en cada render (nunca se guarda un snapshot),
   así que si algo cambia mientras el mensaje sigue visible, se actualiza
   solo. Nunca se escribe nada en Supabase ni en la bitácora por esto. */

function pushEphemeral(kind, ticketId, params){
  UI.ephemeralLog.push({ id: uid(), ticketId: ticketId || null, kind: kind, ts: new Date().toISOString(), params: params || {} });
  UI.pendingFocus = "composer";
  render();
}
function dismissEphemeral(id){
  UI.ephemeralLog = UI.ephemeralLog.filter(function(e){ return e.id !== id; });
  UI.pendingFocus = "composer";
  render();
}
/* /clear · /limpiar: solo quita los mensajes efímeros de la vista actual
   (los de este ticket, o los globales si estamos en Inicio) — nunca toca
   notas/productos/pagos/tareas/documentos, que son permanentes. */
function clearEphemeralForContext(ticketId){
  var scope = ticketId || null;
  UI.ephemeralLog = UI.ephemeralLog.filter(function(e){ return e.ticketId !== scope; });
}

function lineRow(l){
  return '<div class="ephemeral-row">' + (l[0] ? "<strong>" + escapeHtml(l[0]) + ":</strong> " : "") + escapeHtml(String(l[1])) + "</div>";
}

function renderEphemeralEntry(entry){
  var t = entry.ticketId ? findTicket(entry.ticketId) : null;
  var title, bodyHtml;
  if(entry.kind === "estado"){
    if(!t) return "";
    title = "Estado actual — " + ticketLabel(t);
    bodyHtml = estadoCardLines(t).map(lineRow).join("");
  } else if(entry.kind === "pendientes"){
    title = t ? "Pendientes — " + ticketLabel(t) : "Pendientes (todos los tickets)";
    bodyHtml = (t ? pendientesLinesForTicket(t) : pendientesLinesGlobal()).map(lineRow).join("");
  } else if(entry.kind === "dinero"){
    title = t ? "Dinero — " + ticketLabel(t) : "Dinero (todos los tickets)";
    bodyHtml = (t ? dineroLinesForTicket(t) : dineroLinesGlobal()).map(lineRow).join("");
  } else if(entry.kind === "help"){
    var hc = helpEntryContent(entry);
    title = hc.title;
    bodyHtml = hc.html;
  } else if(entry.kind === "productos"){
    var pc = productosEntryContent(entry);
    title = pc.title;
    bodyHtml = pc.html;
  } else if(entry.kind === "cliente"){
    var clc = clienteEntryContent(entry);
    title = clc.title;
    bodyHtml = clc.html;
  } else if(entry.kind === "editarcliente"){
    var ecc = editarClienteEntryContent(entry);
    title = ecc.title;
    bodyHtml = ecc.html;
  } else if(entry.kind === "documentos"){
    var dc = documentosEntryContent(entry);
    title = dc.title;
    bodyHtml = dc.html;
  } else {
    return "";
  }
  return (
    '<div class="thread-item ephemeral-item">' +
      '<div class="thread-dot ephemeral"></div>' +
      '<div class="thread-body">' +
        '<div class="thread-meta"><span>' + fmtTime(entry.ts) + ' · no se guarda</span>' +
          '<button class="btn-plain ephemeral-dismiss" data-action="dismiss-ephemeral" data-id="' + entry.id + '" title="Quitar">&times;</button>' +
        "</div>" +
        '<div class="ephemeral-card">' +
          '<div class="ephemeral-title">' + escapeHtml(title) + "</div>" +
          bodyHtml +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

/* Fusiona lo permanente (t.thread) con lo efímero de este ticket, ordenado
   por fecha, para que la consola se lea como un solo hilo continuo — igual
   que un chat — en vez de dos zonas separadas. */
function mergedThreadHtml(t){
  var permanent = t.thread.map(function(ev){ return { ts: ev.ts, html: renderThreadItem(ev, t.id) }; });
  var ephemeral = UI.ephemeralLog.filter(function(e){ return e.ticketId === t.id; })
    .map(function(e){ return { ts: e.ts, html: renderEphemeralEntry(e) }; });
  var merged = permanent.concat(ephemeral);
  merged.sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
  return joinWithDaySeparators(merged);
}
/* Mismo criterio para Inicio / Centro de consulta: solo hay mensajes
   efímeros globales (ticketId null) — no hay hilo permanente sin ticket. */
function globalEphemeralHtml(){
  var ephemeral = UI.ephemeralLog.filter(function(e){ return !e.ticketId; })
    .sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); })
    .map(function(e){ return { ts: e.ts, html: renderEphemeralEntry(e) }; });
  return joinWithDaySeparators(ephemeral);
}

/* ---------------- sección Clientes (vista visual completa) ----------------
   No es un CRM aparte: solo dos vistas nuevas sobre datos que ya existen
   (clientes, tickets, productos, tareas, pagos, documentos, bitácora),
   usando exactamente rankClientes/ticketsForCliente/clienteFinancials/
   ticketIsCerrado/ticketEstado — nada de esto guarda ni lee una tabla nueva. */

function fmtRelativeActivity(iso){
  if(!iso) return "";
  var diff = Date.now() - new Date(iso).getTime();
  var days = Math.floor(diff / 86400000);
  if(days <= 0) return "hoy";
  if(days === 1) return "ayer";
  if(days < 7) return "hace " + days + " días";
  if(days < 30) return "hace " + Math.floor(days/7) + (Math.floor(days/7)===1?" semana":" semanas");
  return "hace " + Math.floor(days/30) + (Math.floor(days/30)===1?" mes":" meses");
}

function renderClienteRow(c){
  var fin = clienteFinancials(c);
  var active = c.id === UI.selectedClienteId;
  var meta = [];
  if(fin.tickets.length) meta.push(fin.tickets.length + (fin.tickets.length===1?" ticket":" tickets"));
  if(fin.lastActivityAt) meta.push(fmtRelativeActivity(fin.lastActivityAt));
  return (
    '<button class="ticket-row cliente-row cliente-row-with-avatar' + (active?" active":"") + '" data-action="open-cliente-ficha" data-client-id="' + c.id + '">' +
      clientAvatar(c, {size:"sm"}) +
      '<div class="cliente-row-body">' +
        '<div class="ticket-row-top">' +
          '<span class="ticket-title">' + escapeHtml(c.nombre) + (c.empresa ? ' <span class="cliente-row-empresa">· ' + escapeHtml(c.empresa) + "</span>" : "") + "</span>" +
          (c.preautorizado ? '<span class="pill pill-accent" title="Preautorizado">Preautorizado</span>' : "") +
        "</div>" +
        (meta.length ? '<div class="ticket-meta"><span>' + meta.join(" · ") + "</span></div>" : "") +
      "</div>" +
    "</button>"
  );
}

function renderClientesListView(){

/* Un solo consolidado cronológico con filtros simples (sección 1.4) en vez
   de pestañas separadas por tipo — Todo/Tickets/Productos/Documentos/
   Pagos/Archivos son solo un filtro sobre la MISMA lista, nunca datos
   distintos ni copias. Cada evento sale del thread YA existente de cada
   ticket del cliente — nunca se crea un álbum o historial paralelo. */
function clienteHistoryItems(c, filter){
  var fin = clienteFinancials(c);
  var items = [];
  fin.tickets.forEach(function(t){
    /* V0.5 §9: "Tickets" = TODOS los tickets del cliente (abiertos,
       entregados y cerrados), no solo los cerrados — antes este filtro
       agregaba a la lista únicamente los ya cerrados, que es el bug que se
       reporta. "Todo" conserva su criterio original: solo agrega el ticket
       como fila cuando ya está cerrado, porque los vivos ya se ven
       completos en la sección "Ahora" y listarlos también aquí sería
       duplicar sin razón. Es la única diferencia entre ambos filtros. */
    if(filter === "tickets"){
      items.push({ ts: t.lastActivityAt, kind: "ticket", ticket: t });
    } else if(ticketIsCerrado(t) && filter === "todo"){
      items.push({ ts: t.lastActivityAt, kind: "ticket", ticket: t });
    }
    if(filter === "todo" || filter === "productos" || filter === "documentos" || filter === "pagos" || filter === "archivos"){
      (t.thread||[]).forEach(function(ev){
        var wantKind = { producto:"productos", documento:"documentos", pago:"pagos", archivo:"archivos" }[ev.type];
        if(!wantKind) return;
        if(filter !== "todo" && filter !== wantKind) return;
        items.push({ ts: ev.ts, kind: ev.type, event: ev, ticket: t });
      });
    }
  });
  items.sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  return items;
}
function renderClienteHistoryItem(item){
  if(item.kind === "ticket"){
    /* V0.5 §9: reutiliza renderTicketRow tal cual (con su pill de estado
       ABIERTO/ENTREGADO/CERRADO·PAGADO/CERRADO·CANCELADO) en vez de un
       renderer reducido aparte — ver ejemplo del brief. */
    return renderTicketRow(item.ticket);
  }
  return (
    '<div class="cliente-history-item">' +
      '<button class="history-ticket-pill" data-action="open-ticket" data-id="' + item.ticket.id + '">Ticket #' + item.ticket.seq + " &rsaquo;</button>" +
      renderThreadItem(item.event, item.ticket.id) +
    "</div>"
  );
}
var HISTORIA_FILTERS = [["todo","Todo"],["tickets","Tickets"],["productos","Productos"],["documentos","Documentos"],["pagos","Pagos"],["archivos","Archivos"]];
function renderClienteFichaView(){
  var c = STATE.clientes.filter(function(x){ return x.id === UI.selectedClienteId; })[0];
  if(!c){
    return (
      '<div class="home-header"><button class="btn-plain" data-action="go-clientes">&larr; Clientes</button></div>' +
      '<div class="empty-state"><h1>Este cliente ya no existe</h1></div>'
    );
  }
  var fin = clienteFinancials(c);
  var ahora = fin.tickets.filter(function(t){ return !ticketIsCerrado(t); });
  var breadcrumb = UI.clienteReturnTicketId
    ? '<button class="btn-plain" data-action="open-ticket" data-id="' + UI.clienteReturnTicketId + '">&larr; Volver al Ticket #' + (findTicket(UI.clienteReturnTicketId) ? findTicket(UI.clienteReturnTicketId).seq : "") + "</button>"
    : '<button class="btn-plain" data-action="go-clientes">&larr; Clientes</button>';
  /* Affordances §31-33: teléfono/email salen de infoLines genérico — tienen
     su propio renderer (clienteContactLine) con tel:/mailto: + edición
     separada, nunca texto plano muerto. El resto de infoLines sigue exactamente
     igual (lineRow, sin cambios). */
  var contactHtml = "";
  if(c.telefono) contactHtml += clienteContactLine(c, "telefono", c.telefono);
  if(c.email) contactHtml += clienteContactLine(c, "email", c.email);
  var infoLines = [];
  if(c.notasComerciales) infoLines.push(["Notas comerciales", c.notasComerciales]);
  infoLines.push(["Preautorizado", c.preautorizado ? "Sí" : "No"]);
  infoLines.push(["Tickets activos", String(fin.activos)]);
  /* V0.5 §8.4/D9: dos hechos por separado, nunca restados como "saldo". */
  if(fin.tickets.length){
    infoLines.push(["Total conocido", fmtMoney(fin.known) + (fin.pend ? " (+" + fin.pend + " sin precio)" : "")]);
    infoLines.push(["Cobrado", fmtMoney(fin.cobrado)]);
  }
  infoLines.push(["Última actividad", fin.lastActivityAt ? fmtRelativeActivity(fin.lastActivityAt) : "Sin actividad todavía"]);

  var ahoraHtml = ahora.length
    ? ahora.map(renderTicketRow).join("")
    : '<div class="empty-list">Nada activo ahora mismo con este cliente.</div>';

  var histItems = clienteHistoryItems(c, UI.clienteHistoriaFilter || "todo");
  var histHtml = histItems.length
    ? joinWithDaySeparators(histItems.map(function(it){ return { ts: it.ts, html: renderClienteHistoryItem(it) }; }))
    : '<div class="empty-list">Sin eventos históricos todavía en este filtro.</div>';
  var tabsHtml = HISTORIA_FILTERS.map(function(f){
    return '<button class="ficha-tab' + ((UI.clienteHistoriaFilter||"todo")===f[0]?" active":"") + '" data-action="cliente-historia-filter" data-filter="' + f[0] + '">' + f[1] + "</button>";
  }).join("");

  /* Logotipo (§13-16): un input de archivo escondido, compartido por
     "Agregar"/"Cambiar" (ambos solo lo abren — uploadClienteLogo decide qué
     hacer con el resultado, sección 14: el logo pertenece al CLIENTE, nunca
     al ticket, así que no hay nada de esto en renderTicketHeader). */
  var logoActionsHtml = c.logoStoragePath
    ? '<button type="button" class="btn btn-ghost btn-sm" data-action="cliente-logo-pick" data-client-id="' + c.id + '">Cambiar</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-action="cliente-logo-remove" data-client-id="' + c.id + '">Eliminar</button>'
    : '<button type="button" class="btn btn-ghost btn-sm" data-action="cliente-logo-pick" data-client-id="' + c.id + '">Agregar logotipo</button>';
  var logoHtml =
    '<div class="ficha-identity-row">' +
      clientAvatar(c, {size:"lg"}) +
      '<div class="ficha-identity-main">' +
        '<h1 class="ficha-name">' + escapeHtml(c.nombre) + (c.empresa ? ' <span class="ficha-empresa">· ' + escapeHtml(c.empresa) + "</span>" : "") + "</h1>" +
        '<div class="ficha-logo-actions">' + logoActionsHtml + "</div>" +
      "</div>" +
    "</div>" +
    '<input type="file" id="cliente-logo-input" accept="image/*" data-client-id="' + c.id + '" hidden>';

  return (
    '<div class="home-header">' + breadcrumb + "</div>" +
    '<div class="clientes-view ficha-view">' +
      '<div class="ficha-header">' +
        logoHtml +
        contactHtml +
        infoLines.map(lineRow).join("") +
      "</div>" +
      '<div class="ficha-section"><div class="ficha-section-title">Ahora</div>' + ahoraHtml + "</div>" +
      '<div class="ficha-section">' +
        '<div class="ficha-section-title">Historia</div>' +
        '<div class="ficha-tabs">' + tabsHtml + "</div>" +
        '<div class="ficha-history-list">' + histHtml + "</div>" +
      "</div>" +
    "</div>"
  );
}

function renderMain(){
  if(UI.mainView === "clientes" && !UI.selectedTicketId){
    return UI.selectedClienteId ? renderClienteFichaView() : renderClientesListView();
  }
  /* V0.5 §8: mismo patrón — solo se activan cuando no hay un ticket abierto
     encima (abrir un ticket desde cualquiera de estas vistas navega al
     ticket normalmente, igual que ya pasa desde Clientes). */
  if(UI.mainView === "atencion" && !UI.selectedTicketId) return renderAtencionView();
  if(UI.mainView === "produccion" && !UI.selectedTicketId) return renderProduccionView();
  if(UI.mainView === "cerrados" && !UI.selectedTicketId) return renderCerradosView();
  if(UI.mainView === "cxc" && !UI.selectedTicketId) return renderCxcPlaceholderView();
  var t = UI.selectedTicketId ? findTicket(UI.selectedTicketId) : null;
  if(!t){
    /* Inicio / Centro de consulta: no selecciona ni modifica ningún ticket.
       Sin nada efímero todavía, es la bienvenida de siempre; en cuanto se
       usa /pendientes, /dinero, /help o /buscar aparece la misma consola
       que dentro de un ticket, para que "consultar sin abrir nada" también
       se sienta como el mismo hilo continuo. */
    var globalHtml = globalEphemeralHtml();
    if(!globalHtml){
      return (
        '<div class="empty-state">' +
          "<h1>¿Qué necesitas encontrar?</h1>" +
          "<p>Este es el centro de consulta: usa / para buscar un ticket, abrir uno por número, ver pendientes o dinero de todos los tickets, o pedir ayuda. Nada de esto modifica ningún ticket.</p>" +
          '<button class="btn btn-primary" data-action="new-ticket">+ Nuevo ticket</button>' +
        "</div>" +
        renderComposer()
      );
    }
    return (
      '<div class="home-header"><h1>¿Qué necesitas encontrar?</h1><button class="btn btn-ghost" data-action="new-ticket">+ Nuevo ticket</button></div>' +
      '<div class="thread" id="thread-scroll">' + globalHtml + "</div>" +
      renderComposer()
    );
  }
  return (
    renderTicketHeader(t) +
    renderTasksPanel(t) +
    '<div class="thread" id="thread-scroll">' + mergedThreadHtml(t) + "</div>" +
    renderComposer()
  );
}

function render(){
  var app = document.getElementById("app");
  if(FATAL_ERROR){
    app.innerHTML = '<div class="app"><div class="empty-state" style="width:100%;"><h1>No se pudo conectar</h1><p>' + escapeHtml(FATAL_ERROR) + "</p></div></div>";
    return;
  }
  var teamOptions = STATE.meta.teamNames.map(function(n){ return '<option value="' + escapeHtml(n) + '">'; }).join("");
  app.innerHTML =
    '<datalist id="dtg-team-names">' + teamOptions + "</datalist>" +
    '<div class="app">' +
      '<div class="sidebar' + (UI.sidebarOpen?" open":"") + '" id="sidebar">' + renderSidebar() + "</div>" +
      (UI.sidebarOpen ? '<div class="sidebar-backdrop" data-action="close-sidebar"></div>' : "") +
      '<div class="main">' +
        '<div class="mobile-topbar"><button class="sidebar-toggle" data-action="toggle-sidebar" aria-label="Abrir menú">&#9776;</button><span class="mobile-topbar-brand">Design To Go</span></div>' +
        renderMain() +
      "</div>" +
    "</div>" +
    renderDocModal() +
    renderCierreModal() +
    renderDocFormModal() +
    renderHelpPanel() +
    renderBugReportPanel() +
    renderTotalPedidoModal() +
    '<div class="toast" id="toast"></div>';
  wireEvents();
  hydrateImages();
  var threadEl = document.getElementById("thread-scroll");
  if(threadEl) threadEl.scrollTop = threadEl.scrollHeight;
  updateTotalPedidoSummary();
  var composerInput = document.getElementById("composer-input");
  if(composerInput){
    updateProductoPreview(composerInput.value);
    composerInput.addEventListener("input", function(){
      var v = composerInput.value;
      document.getElementById("composer-send").disabled = !v.trim();
      composerInput.style.height = "auto";
      composerInput.style.height = Math.min(composerInput.scrollHeight, 120) + "px";
      /* El único overlay que se descarta en cuanto el usuario vuelve a
         escribir o borra el texto es la confirmación pendiente — nunca debe
         quedar "pegada" mostrando algo viejo. Los mensajes efímeros
         (/help, /estado, /pendientes, /dinero) ya no son overlays: viven
         dentro del hilo como una consola y se quedan ahí hasta que se
         cierran uno por uno o con /clear, sin importar lo que se escriba
         después en el compositor. */
      var hadOverlay = !!UI.pendingConfirm;
      UI.pendingConfirm = null;
      /* Composer Intelligence §3: "-" abre el mismo menú que "/" — importante
         en teclados móviles/mexicanos donde "/" no está a la mano. Se
         detecta en vivo aquí (no solo al enviar) para que el autocomplete
         funcione igual de bien con cualquiera de los dos. */
      var m = v.match(/^[\/\-]([a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]*)$/);
      var shouldOpen = !!m;
      var fragment = m ? m[1] : "";
      var barePrefix = false;
      /* §15: predicción SIN escribir "/" o "-" primero — "prod" debe sugerir
         "/producto" igual que "/prod" ya lo hace. Guardas explícitas para
         nunca secuestrar una nota normal:
           1) la única forma en que esto se activa es si el compositor
              ENTERO es una sola palabra sin espacios (ver \s abajo) — en
              cuanto hay un espacio ("producción de playeras…") esta rama ni
              se evalúa, es una nota como cualquier otra;
           2) mínimo 3 letras (mismo umbral que ya usa filterCommands() para
              su propio fallback de texto libre);
           3) solo cuenta si matchea por PREFIJO DE ALIAS real del registro
              COMMANDS (filterCommandsByAliasPrefix) — nunca por texto de la
              descripción, eso sería demasiado impreciso para algo sin "/".
         Enter nunca autoejecuta este caso (ver el manejo de Enter más abajo,
         UI.slashBarePrefix) — solo Tab o tocar la sugerencia completan. */
      if(!shouldOpen && v.length >= 3 && !/\s/.test(v)){
        var hasTicketBare = !!findTicket(UI.selectedTicketId);
        if(filterCommandsByAliasPrefix(hasTicketBare, v).length){
          shouldOpen = true;
          fragment = v;
          barePrefix = true;
        }
      }
      var menuChanged = (shouldOpen !== !!UI.slashMenuOpen || fragment !== UI.slashQuery || barePrefix !== UI.slashBarePrefix);
      if(menuChanged){
        UI.slashMenuOpen = shouldOpen;
        UI.slashQuery = fragment;
        UI.slashBarePrefix = barePrefix;
        UI.slashActiveIndex = 0;
      }
      /* Autocomplete predictivo del ARGUMENTO de /cliente (secciones 1.2/6.2):
         mismo patrón de interacción que el menú de "/" de arriba (↑/↓/Enter/
         Esc/Tab), pero sobre lo que se escribe después del nombre del
         comando — nunca dos sistemas de autocomplete distintos, solo el
         mismo aplicado a otro momento de la escritura. Se actualiza en cada
         tecla, sin esperar Enter. */
      var argMatch = shouldOpen ? null : v.match(/^[\/\-](cliente|client)\s(.*)$/i);
      var shouldSuggest = !!argMatch;
      var suggestQuery = argMatch ? argMatch[2] : "";
      var suggestChanged = (shouldSuggest !== !!UI.cliSuggestOpen || suggestQuery !== UI.cliSuggestQuery);
      if(suggestChanged){
        UI.cliSuggestOpen = shouldSuggest;
        UI.cliSuggestQuery = suggestQuery;
        UI.cliSuggestIndex = 0;
      }
      /* Addendum final "Composer ultrarrápido" §1/§2/§9/§12: la Smart Palette
         ya NO espera a Enter — se calcula en cada tecla, igual que el
         autocomplete de comandos de arriba. Prioridad explícita: si el
         autocomplete de comandos (shouldOpen, con o sin prefijo) o el de
         argumento de /cliente (shouldSuggest) está activo, Smart Actions ni
         se calcula — nunca compiten por el mismo teclado. Tampoco se
         calcula sobre texto que empieza con "/" o "-" (esa es la vía de
         comandos aunque todavía no matchee nada), ni sobre texto vacío. */
      var startsAsCommand = v.charAt(0) === "/" || v.charAt(0) === "-";
      var wantSmartActions = !!v.trim() && !shouldOpen && !shouldSuggest && !startsAsCommand;
      var smartActionsChanged = false;
      if(wantSmartActions){
        var sameTextAsBefore = UI.smartActions && UI.smartActions.text === v;
        if(!sameTextAsBefore){
          /* Texto nuevo -> se recalculan las opciones y SIEMPRE se vuelve a
             Nota (índice 0) como selección por defecto — cualquier edición
             real de por sí ya "sale" de una selección de navegación vieja
             que ya no correspondía a este texto (§9). suggestActionsForText
             ya garantiza que Nota sea la primera opción (§2). */
          UI.smartActions = { text: v, actions: suggestActionsForText(v, { ticket: findTicket(UI.selectedTicketId) }), navIndex: 0, navMode: false };
          smartActionsChanged = true;
        }
      } else if(UI.smartActions){
        UI.smartActions = null;
        smartActionsChanged = true;
      }
      if(menuChanged || suggestChanged || smartActionsChanged || hadOverlay){
        render();
        restoreComposerText(v);
      }
      updateProductoPreview(v);
    });
    composerInput.addEventListener("keydown", function(e){
      if(UI.slashMenuOpen){
        var hasTicket = !!findTicket(UI.selectedTicketId);
        var list = filterCommands(hasTicket, UI.slashQuery);
        if(e.key === "ArrowDown"){ e.preventDefault(); if(list.length) UI.slashActiveIndex = (UI.slashActiveIndex+1) % list.length; var v1=composerInput.value; render(); restoreComposerText(v1); scrollActiveMenuItemIntoView("slash-menu"); return; }
        if(e.key === "ArrowUp"){ e.preventDefault(); if(list.length) UI.slashActiveIndex = (UI.slashActiveIndex-1+list.length) % list.length; var v2=composerInput.value; render(); restoreComposerText(v2); scrollActiveMenuItemIntoView("slash-menu"); return; }
        if(e.key === "Enter"){
          /* §15: si esta sugerencia apareció SIN que el usuario escribiera
             "/" o "-" (UI.slashBarePrefix), Enter nunca autoejecuta nada —
             eso es justo la regla "nunca secuestrar texto normal". Se cierra
             el menú y se deja caer al Enter normal de más abajo, que envía
             el texto tal cual (misma ruta que si este menú no existiera). */
          if(UI.slashBarePrefix){
            UI.slashMenuOpen = false;
            UI.slashBarePrefix = false;
          } else {
            e.preventDefault();
            UI.slashMenuOpen = false;
            if(!list.length){
              /* Sin coincidencias en el autocomplete: no nos quedamos callados
                 — se envía tal cual para que el despachador avise con el
                 mensaje de "comando no reconocido", igual que si no hubiera
                 menú de por medio. */
              submitNote();
              return;
            }
            /* Si ya se escribió el nombre completo de un comando (sin espacio
               final), Enter lo ejecuta directo en vez de solo autocompletarlo
               — evita que comandos sin argumento (/estado, /help…) necesiten
               dos Enter seguidos para hacer algo. */
            var typed = composerInput.value.trim().slice(1).toLowerCase();
            if(typed && ALIAS_INDEX[typed]){
              var full = composerInput.value.trim();
              composerInput.value = "";
              dispatchCommand(full);
            } else {
              pickSlashCommand(list[UI.slashActiveIndex].aliases[0]);
            }
            return;
          }
        }
        if(e.key === "Escape"){ e.preventDefault(); UI.slashMenuOpen = false; UI.slashBarePrefix = false; var v3=composerInput.value; render(); restoreComposerText(v3); return; }
        if(e.key === "Tab"){
          /* Dentro del autocomplete de "/", Tab completa el comando
             seleccionado sin ejecutarlo (a diferencia de Enter) — igual que
             cualquier autocomplete de terminal/IDE. */
          e.preventDefault();
          if(list.length) pickSlashCommand(list[UI.slashActiveIndex].aliases[0]);
          return;
        }
      }
      if(UI.cliSuggestOpen){
        var cliList = rankClientes(UI.cliSuggestQuery).slice(0, 8);
        if(e.key === "ArrowDown"){ e.preventDefault(); if(cliList.length) UI.cliSuggestIndex = (UI.cliSuggestIndex+1) % cliList.length; var cv1=composerInput.value; render(); restoreComposerText(cv1); scrollActiveMenuItemIntoView("cli-suggest-menu"); return; }
        if(e.key === "ArrowUp"){ e.preventDefault(); if(cliList.length) UI.cliSuggestIndex = (UI.cliSuggestIndex-1+cliList.length) % cliList.length; var cv2=composerInput.value; render(); restoreComposerText(cv2); scrollActiveMenuItemIntoView("cli-suggest-menu"); return; }
        if(e.key === "Enter"){
          /* A propósito NO ejecuta la sugerencia resaltada: Enter siempre
             corre el comando con el texto que el usuario realmente escribió
             (igual que cualquier otro comando de la app) — así una
             coincidencia exacta como "/cliente Angela" nunca se resuelve
             "sola" al primer sugerido más reciente si hay varios clientes
             parecidos. Elegir una sugerencia puntual es cosa de tocarla,
             o de Tab para completar el texto antes de decidir. */
          e.preventDefault();
          UI.cliSuggestOpen = false;
          submitNote();
          return;
        }
        if(e.key === "Escape"){ e.preventDefault(); UI.cliSuggestOpen = false; var cv3=composerInput.value; render(); restoreComposerText(cv3); return; }
        if(e.key === "Tab"){
          /* Tab acepta la recomendación (completa el texto) sin ejecutar,
             y solo aplica mientras el foco está en el compositor — nunca
             un atajo global (sección 6.3). */
          e.preventDefault();
          if(cliList.length) chooseCliSuggestion(UI.cliSuggestIndex, false);
          return;
        }
      }
      if(UI.pendingConfirm){
        if(e.key === "Enter"){ e.preventDefault(); confirmPendingSlash(); return; }
        if(e.key === "Escape"){ e.preventDefault(); UI.pendingConfirm = null; render(); return; }
      }
      /* Addendum final "Composer ultrarrápido" §3-§9: captura continua con
         un solo Enter, y navegación ArrowLeft/ArrowRight entre Smart
         Actions. Prioridad (§12): este bloque solo corre si ninguno de los
         autocompletes/confirmación de arriba ya interceptó la tecla (todos
         ellos `return` en sus propias ramas). */
      if(UI.smartActions){
        var saActions = UI.smartActions.actions;
        var noMods = !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey;
        /* §3: Enter sobre texto plano ejecuta DIRECTO la Smart Action
           actualmente seleccionada — Nota por defecto (índice 0) si nunca
           se navegó, o la que haya quedado marcada tras Right/Left. Shift+Enter
           nunca entra aquí (sigue siendo salto de línea nativo del
           textarea, sección 4) porque exige !e.shiftKey. */
        if(e.key === "Enter" && !e.shiftKey){
          e.preventDefault();
          runSmartAction(saActions[UI.smartActions.navIndex].key);
          return;
        }
        if(UI.smartActions.navMode){
          if(e.key === "ArrowRight" && noMods){ e.preventDefault(); UI.smartActions.navIndex = (UI.smartActions.navIndex+1) % saActions.length; var sv1=composerInput.value; render(); restoreComposerText(sv1); return; }
          if(e.key === "ArrowLeft" && noMods){ e.preventDefault(); UI.smartActions.navIndex = (UI.smartActions.navIndex-1+saActions.length) % saActions.length; var sv2=composerInput.value; render(); restoreComposerText(sv2); return; }
          if(e.key === "Escape"){ e.preventDefault(); UI.smartActions.navMode = false; var sv3=composerInput.value; render(); restoreComposerText(sv3); return; }
          /* §9: CUALQUIER otra cosa (letra, número, Space, Backspace,
             Delete, paste, Shift+flecha para seleccionar, ArrowUp/Down,
             etc.) saca del modo navegación SIN perder la tecla — nunca se
             hace preventDefault ni return aquí, se deja caer al
             comportamiento normal de abajo (o al del propio textarea
             nativo). Nunca queda un modo invisible del que no se pueda
             salir escribiendo. */
          UI.smartActions.navMode = false;
        } else if(e.key === "ArrowRight" && noMods){
          /* §5/§7: ArrowRight SOLO se secuestra cuando el cursor ya está
             EXACTAMENTE al final del texto y no hay ninguna selección —
             fuera de ahí (a media edición, corrigiendo algo) se comporta
             como un ArrowRight normal de textarea, nunca entra a
             navegación. */
          if(composerInput.selectionStart === composerInput.selectionEnd && composerInput.selectionStart === composerInput.value.length){
            e.preventDefault();
            UI.smartActions.navMode = true;
            UI.smartActions.navIndex = (UI.smartActions.navIndex + 1) % saActions.length;
            var sv4 = composerInput.value; render(); restoreComposerText(sv4);
            return;
          }
        } else if(e.key === "Escape"){
          /* Nunca se entró a modo navegación con flechas: Escape cierra el
             panel completo y devuelve el texto EXACTO tal cual estaba
             (comportamiento heredado de la ronda anterior). */
          e.preventDefault();
          var saText = UI.smartActions.text;
          UI.smartActions = null;
          render();
          restoreComposerText(saText);
          return;
        }
      }
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submitNote(); }
    });
    /* §9: salir del modo navegación también al hacer clic dentro del
       compositor o cambiar la selección con el mouse — mismo criterio que
       "cualquier edición saca del modo navegación", solo que estos dos no
       son eventos de teclado. No hace falta un listener de "select"
       aparte: cambiar la posición del cursor con teclado (flechas
       arriba/abajo, Home/End, etc.) ya sale de modo navegación en el
       keydown de arriba porque no es ninguna de las 3 teclas que sí
       intercepta (Right/Left/Escape). */
    composerInput.addEventListener("click", function(){
      if(UI.smartActions && UI.smartActions.navMode){
        UI.smartActions.navMode = false;
        var v = composerInput.value;
        render();
        restoreComposerText(v);
      }
    });
  }
  applyFocus();
}

/* Único punto que decide qué se enfoca después de cada render() — el
   helper de foco reutilizable que pide la sección 1: nadie más debe
   llamar a .focus() directamente sobre el compositor o un campo de
   fecha, todos pasan por aquí vía UI.pendingFocus. Prioridad:
   1) un elemento explícito (fallback de fecha no reconocida)
   2) el primer campo dentro de un popover del compositor ya abierto
      (confirmación, ayuda, autocomplete)
   3) el compositor en genérico, vacío y listo para el siguiente comando. */
/* elId -> qué campo de la comanda hay que "revelar" antes de poder
   enfocarlo — desde que esos campos son clic-para-editar (sección 4) ya no
   están siempre en el DOM, así que un fallback como "/atender 15" (fecha
   ambigua) necesita abrir la edición en línea antes de poder enfocar el
   selector de fecha nativo. */
var HEADER_EDIT_FIELD_BY_EL = { "field-cliente":"cliente", "field-quesigue":"quesigue", "field-responsable":"responsable", "field-fecha-atencion":"atencion", "field-fecha-compromiso":"compromiso" };
function applyFocus(){
  var target = UI.pendingFocus;
  UI.pendingFocus = null;
  if(!target) return;
  if(typeof target === "object" && target.elId){
    var wantField = HEADER_EDIT_FIELD_BY_EL[target.elId];
    if(wantField){
      /* Bumpear el token SIEMPRE, incluso si el campo ya estaba "abierto"
         lógicamente: el composer pudo haber robado el foco un instante
         antes (p.ej. al escribir "/compromiso 15"), dejando agendado un
         cierre por blur que de otro modo cerraría este campo 150ms después
         de haberlo vuelto a enfocar aquí — ver comentario en openHeaderEdit. */
      UI.headerEditToken = (UI.headerEditToken||0) + 1;
      if(UI.headerEditField !== wantField){ UI.headerEditField = wantField; render(); }
    }
    var explicit = document.getElementById(target.elId);
    if(explicit){ explicit.focus(); try{ explicit.select(); }catch(e){} return; }
  }
  var popoverField = document.querySelector('#composer-popover input, #composer-popover select, #composer-popover textarea, #composer-popover button');
  if(popoverField){ popoverField.focus(); return; }
  if(target === "composer"){
    var input = document.getElementById("composer-input");
    if(input){
      input.value = "";
      input.style.height = "auto";
      var sendBtn = document.getElementById("composer-send");
      if(sendBtn) sendBtn.disabled = true;
      input.focus();
    }
  }
}

function restoreComposerText(v){
  var el = document.getElementById("composer-input");
  if(!el) return;
  el.value = v;
  el.focus();
  el.selectionStart = el.selectionEnd = v.length;
  var sendBtn = document.getElementById("composer-send");
  if(sendBtn) sendBtn.disabled = !v.trim();
  updateProductoPreview(v);
}

/* render() reconstruye TODO el DOM de #app desde cero (app.innerHTML = ...)
   — es lo que mantiene toda la UI en un solo camino de verdad, pero
   significa que cualquier valor que el usuario haya tecleado y todavía no
   haya confirmado (el compositor, un campo de la comanda abierto para
   editar, un formulario del "+", el precio de un renglón en un borrador de
   documento, el motivo de un cierre) vive solo en el DOM viejo y se pierde
   en la reconstrucción. Para una acción del propio usuario eso no importa
   (la acción ya terminó, o el flujo decide explícitamente qué hacer con el
   foco vía UI.pendingFocus/applyFocus). Para un refresh de FONDO disparado
   por Realtime, sí importa — nunca debe sentirse como que otra persona en
   otro dispositivo te borra lo que estás escribiendo. Este wrapper es la
   única diferencia: toma una foto de cada campo vivo antes de renderizar y
   la restaura después, sin tocar STATE/UI ni la lógica de guardado. */
function renderKeepingLiveInputs(){
  var appBefore = document.getElementById("app");
  var active = document.activeElement;
  var activeId = (active && appBefore && appBefore.contains(active)) ? active.id : null;
  var activeSel = null;
  if(activeId && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")){
    try{ activeSel = [active.selectionStart, active.selectionEnd]; }catch(e){ activeSel = null; }
  }
  var values = {};
  var checks = {};
  var docPriceValues = {};
  if(appBefore){
    appBefore.querySelectorAll("input[id], textarea[id], select[id]").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") checks[el.id] = el.checked;
      else values[el.id] = el.value;
    });
    appBefore.querySelectorAll("[data-docform-item-price]").forEach(function(el){ docPriceValues[el.getAttribute("data-docform-item-price")] = el.value; });
  }

  render();

  var appAfter = document.getElementById("app");
  if(appAfter){
    appAfter.querySelectorAll("input[id], textarea[id], select[id]").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio"){
        if(el.id in checks) el.checked = checks[el.id];
      } else if(el.id in values) el.value = values[el.id];
    });
    appAfter.querySelectorAll("[data-docform-item-price]").forEach(function(el){
      var idx = el.getAttribute("data-docform-item-price");
      if(idx in docPriceValues) el.value = docPriceValues[idx];
    });
  }
  var composerInput = document.getElementById("composer-input");
  if(composerInput){
    composerInput.style.height = "auto";
    composerInput.style.height = Math.min(composerInput.scrollHeight, 120) + "px";
    var sendBtn = document.getElementById("composer-send");
    if(sendBtn) sendBtn.disabled = !composerInput.value.trim();
    updateProductoPreview(composerInput.value);
  }
  if(activeId){
    var newActive = document.getElementById(activeId);
    if(newActive){
      newActive.focus();
      if(activeSel){
        try{ newActive.selectionStart = activeSel[0]; newActive.selectionEnd = activeSel[1]; }catch(e){}
      }
    }
  }
}

/* El menú "/" y el de sugerencia de cliente comparten el mismo problema:
   con ~20 comandos registrados, el contenedor ya tenía scroll (overflow-y:
   auto + max-height) pero navegar con ↑/↓ nunca movía ese scroll — la
   selección se salía del recuadro visible y, sin ningún indicio de que
   había más abajo, se sentía como si el menú solo tuviera los primeros 6-8
   comandos. block:"nearest" mueve lo mínimo necesario para que el
   seleccionado quede visible, sin saltar de más cuando ya lo está. */
function scrollActiveMenuItemIntoView(containerId){
  var container = document.getElementById(containerId);
  if(!container) return;
  var active = container.querySelector(".slash-menu-item.active");
  if(active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
}

function pickSlashCommand(cmd){
  UI.slashMenuOpen = false;
  UI.slashBarePrefix = false;
  render();
  restoreComposerText("/" + cmd + " ");
}

function hydrateImages(){
  var imgs = document.querySelectorAll("img[data-storage-path]");
  imgs.forEach(async function(img){
    var path = img.getAttribute("data-storage-path");
    if(!path) return;
    if(signedUrlCache[path]){ img.src = signedUrlCache[path]; return; }
    try{
      var res = await sb.storage.from(FILES_BUCKET).createSignedUrl(path, 3600);
      if(res.data && res.data.signedUrl){
        signedUrlCache[path] = res.data.signedUrl;
        if(document.body.contains(img)) img.src = res.data.signedUrl;
      }
    }catch(e){ /* leave broken silently, non-critical */ }
  });
}

var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

/* ---------------- mutations: optimistic local update, then write to Supabase, then reconcile ---------------- */

/* Composer Intelligence §11: núcleo compartido de "crear un ticket" —
   extraído de lo que ya hacía createTicketFlow() tal cual (mismo insert,
   mismo registro en bitácora, mismo mensaje de error), solo que ahora NO
   abre el ticket ni refresca por sí solo — eso lo decide quien lo llama,
   porque "+ Nuevo ticket" y /nuevo necesitan la misma creación pero un
   orden distinto de pasos después (ver createTicketFromNuevo). initialData
   es opcional: hoy solo se usa `cliente` (identidad inicial en texto libre,
   D3 — /nuevo es el primer llamador que la aprovecha; "+ Nuevo ticket"
   sigue llamando sin argumento y crea el ticket exactamente igual que
   antes). */
async function createTicketCore(initialData){
  initialData = initialData || {};
  try{
    var row = {};
    if(initialData.cliente) row.cliente = initialData.cliente;
    var ins = await sb.from("tickets").insert(row).select().single();
    if(ins.error) throw ins.error;
    var newId = ins.data.id;
    await sb.from("bitacora").insert({ ticket_id: newId, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Ticket creado" } });
    return newId;
  }catch(e){
    showToast("No se pudo crear el ticket: " + (e.message || "error"));
    return null;
  }
}

async function createTicketFlow(){
  var newId = await createTicketCore();
  if(!newId) return;
  openTicketById(newId);
  await refreshFromServer({refocus:true});
}

/* Composer Intelligence §7-11: run() de /nuevo — crea el ticket y encadena,
   EN ORDEN, cada sub-operación sobre el mismo core que usaría el comando
   equivalente (createClienteCore/linkClienteToTicket vía
   applyDetectedPhoneToTicket, addProductoCore, addPagoCore) — nunca una
   escritura nueva/paralela. Regla explícita del addendum (§10): si el
   ticket se crea pero una sub-operación falla, el ticket NUNCA se borra —
   se deja abierto, y se informa exactamente cuál falló (nunca un error
   silencioso). Cada sub-operación relee el ticket con findTicket(newId)
   antes de usarlo porque los cores anteriores ya llamaron
   refreshFromServer(), que reemplaza STATE por completo — reusar la
   referencia vieja de `t` sería trabajar sobre un objeto ya reemplazado. */
async function createTicketFromNuevo(data){
  var newId = await createTicketCore({ cliente: data.identityTitle || "" });
  if(!newId) return;
  var failures = [];
  var t;

  if(data.phone){
    t = findTicket(newId);
    if(t){
      var phoneOk = await applyDetectedPhoneToTicket(t, data.phone);
      if(!phoneOk) failures.push("teléfono " + data.phone.formatted);
    }
  }

  for(var i=0; i<data.productos.length; i++){
    var p = data.productos[i];
    t = findTicket(newId);
    if(!t) break;
    var prodOk = await addProductoCore(t, p.desc, p.cantidad, p.precio);
    if(!prodOk) failures.push('producto "' + p.desc + '"');
  }

  for(var j=0; j<data.pagos.length; j++){
    var pg = data.pagos[j];
    t = findTicket(newId);
    if(!t) break;
    var pagoOk = await addPagoCore(t, pg.monto, todayLocalYYYYMMDD(), "", pg.concepto || "");
    if(!pagoOk) failures.push("pago " + fmtMoney(pg.monto));
  }

  openTicketById(newId);
  await refreshFromServer({refocus:true});
  if(failures.length){
    showToast("Ticket creado, pero no se pudo guardar: " + failures.join(", ") + ".");
  }
}

/* Resumen multi-sección del banner de confirmación de /nuevo — reutiliza
   UI.pendingConfirm/slashConfirmBanner() tal cual (mismo mecanismo que ya
   usan /pago y /factura), solo con un confirmSummary más largo porque
   /nuevo puede tocar varias cosas a la vez (§9: preview antes de crear,
   nunca 4 escrituras silenciosas). */
function nuevoConfirmSummary(data){
  var rows = [];
  rows.push('<div class="nuevo-confirm-row"><b>Ticket:</b> ' + escapeHtml(data.identityTitle || "(sin título)") + "</div>");
  if(data.phone){
    rows.push('<div class="nuevo-confirm-row"><b>Teléfono:</b> ' + escapeHtml(data.phone.formatted) + " — crea un cliente nuevo</div>");
  }
  if(data.productos.length){
    var prodLines = data.productos.map(function(p){
      return escapeHtml(p.desc) + " × " + p.cantidad + (p.precio != null ? " — " + fmtMoney(p.precio) : " — precio pendiente");
    }).join("<br>");
    rows.push('<div class="nuevo-confirm-row"><b>Producto' + (data.productos.length > 1 ? "s" : "") + ":</b><br>" + prodLines + "</div>");
  }
  if(data.pagos.length){
    var pagoLines = data.pagos.map(function(pg){
      return fmtMoney(pg.monto) + (pg.concepto ? " — " + escapeHtml(pg.concepto) : "");
    }).join("<br>");
    rows.push('<div class="nuevo-confirm-row"><b>Pago' + (data.pagos.length > 1 ? "s" : "") + ":</b><br>" + pagoLines + "</div>");
  }
  return rows.join("");
}

/* Composer Intelligence §1: decide qué 4-6 acciones ofrecer sobre un texto
   plano — parser chico y determinista (nada de heurística difusa ni IA,
   sección 17), reutilizando exactamente los mismos parsers que ya deciden
   "cómo se ve"/"qué se guarda" en el resto de la app (parseProductoArg,
   detectPhone) — esta función solo los usa para DECIDIR EL ORDEN de los
   chips, nunca para guardar nada. */
function suggestActionsForText(text, ctx){
  var hasTicket = !!ctx.ticket;
  var phone = detectPhone(text);
  var actions = [];
  if(hasTicket){
    /* Addendum final §2: Nota es SIEMPRE la primera opción — la selección
       por defecto de Enter — para texto plano dentro de un ticket. La
       detección de abajo puede reordenar/ofrecer opciones SECUNDARIAS,
       pero nunca puede desplazar a Nota del primer lugar ni convertir
       silenciosamente el texto en algo estructurado. */
    actions.push({ key:"nota", label:"Nota" });
    /* "Parece producto" = el mismo parser que usa /producto reconoce una
       descripción Y el texto trae al menos un número (cantidad o precio) —
       igual criterio con el que un humano distinguiría "50 playeras negras
       12" de una nota cualquiera. Nunca un segundo criterio de qué es un
       producto. */
    var prodGuess = parseProductoArg(text);
    var looksLikeProducto = !!(prodGuess.desc && /\d/.test(text));
    if(looksLikeProducto) actions.push({ key:"producto", label:"Producto" });
    if(phone) actions.push({ key:"telefono", label:"Teléfono: " + phone.formatted });
    /* §18/§13: "Pago / abono" y "Total del pedido" son dos interpretaciones
       DISTINTAS de la misma cantidad pura — el sistema nunca elige por el
       usuario, solo ofrece ambas (§23: nunca comparten semántica
       financiera; Pago sigue siendo parsePagoArg/addPagoCore, Total del
       pedido nunca toca pagos). Criterio a propósito ESTRICTO (sección 17:
       nada de heurística difusa) y alineado EXACTO con lo que parsePagoArg
       ya acepta como monto (sin "$" ni comas): el texto COMPLETO tiene que
       ser solo dígitos con decimales opcionales — "5 playeras" o
       "producción de playeras para mañana" nunca califican, solo algo como
       "100" o "350.50" tal cual. §21/§24: un teléfono detectado (secuencia
       de 10 dígitos) nunca compite por ninguna de las dos — mismo
       detectPhone() de siempre, sin lógica nueva. */
    var looksLikeMonto = !phone && /^\d+(\.\d{1,2})?$/.test(text.trim());
    if(looksLikeMonto){
      actions.push({ key:"pago", label:"Pago / abono" });
      actions.push({ key:"total", label:"Total del pedido" });
    }
    if(!looksLikeProducto) actions.push({ key:"producto", label:"Producto" });
    actions.push({ key:"cliente", label:"Cliente" });
    actions.push({ key:"sigue", label:"Qué sigue" });
  } else {
    actions.push({ key:"buscar", label:"Buscar" });
    actions.push({ key:"nuevo", label:"Nuevo ticket" });
    actions.push({ key:"cliente", label:"Cliente" });
  }
  return actions.slice(0, 6);
}

/* Composer Intelligence §1: acción elegida en el panel de "Usar como…".
   Cada rama reutiliza dispatchCommand() (mismo COMMANDS/parse/run que
   escribir el comando a mano) salvo "telefono", que necesita decidir entre
   editar un cliente ya vinculado o crear uno nuevo (D1) — ninguna de las
   dos cosas es un guardado nuevo, son los mismos cores de siempre
   (createClienteCore/linkClienteToTicket/updateClienteCore vía
   /editarcliente). */
/* Ronda "Fluidez, Confiabilidad, Realtime y QA" §20: bug real de la
   auditoría — antes esta función limpiaba el compositor con
   restoreComposerText("") y despachaba el comando ANTES de saber si
   cmd.parse() lo iba a aceptar. Si la interpretación elegida fallaba
   validación (ej. tocar "Producto" sobre un texto sin descripción real), el
   texto ya estaba perdido para cuando aparecía el error. Ahora se llama
   primero al MISMO cmd.parse() real (el que dispatchCommand() llamaría de
   todos modos un instante después) en modo "solo verificar", exactamente
   con el mismo (arg, ctx) que recibiría al ejecutarse — y el compositor
   solo se limpia cuando esa verificación ya dice que sí va a funcionar. El
   comportamiento optimista de siempre (limpiar antes de que termine el
   guardado en Supabase) se queda igual, porque esa parte nunca fue el
   problema. */
function runSmartAction(key){
  var sa = UI.smartActions;
  if(!sa) return;
  var text = sa.text;
  var t = findTicket(UI.selectedTicketId);
  UI.smartActions = null;
  if(key === "telefono"){
    var phone = detectPhone(text);
    if(!phone || !t) { render(); restoreComposerText(text); return; }
    applyDetectedPhoneToTicket(t, phone);
    return;
  }
  /* §18: "Pago / abono" es otro camino más hacia el mismo /pago de siempre
     — mismo parsePagoArg, misma confirmación, mismo addPagoCore. Se agrega
     aquí al mapa (no hay lógica nueva de negocio, solo una entrada más). */
  var cmdMap = { nota:"nota", producto:"producto", cliente:"cliente", sigue:"sigue", buscar:"buscar", nuevo:"nuevo", pago:"pago", total:"total" };
  var cmdKey = cmdMap[key];
  if(!cmdKey){ render(); restoreComposerText(text); return; }
  var cmd = COMMANDS_BY_KEY[cmdKey];
  var ctx = { ticket: t };
  if(cmd.requiresTicket && !t){ render(); restoreComposerText(text); showToast("Selecciona un ticket primero."); return; }
  var peek = cmd.parse(text, ctx);
  if(!peek.ok){
    render();
    restoreComposerText(text);
    if(peek.error) showToast(peek.error);
    return;
  }
  restoreComposerText("");
  dispatchCommand("/" + cmdKey + " " + text);
}

/* D1 (decidido con el dueño del producto): un teléfono detectado sin
   cliente vinculado en el ticket crea un cliente nuevo usando el propio
   número como nombre provisional (editable después) — nunca queda "sin
   dónde guardarse". Si el ticket YA tiene un cliente vinculado, en cambio,
   se PROPONE editar ese cliente (vía /editarcliente, que ya pide
   confirmación) en vez de crear uno nuevo — crear uno nuevo ahí sería
   claramente el comportamiento incorrecto. Compartida entre el chip
   "Teléfono" del panel y la confirmación de /nuevo (sección 8). */
function applyDetectedPhoneToTicket(t, phone){
  if(t.clienteId){
    dispatchCommand("/editarcliente telefono " + phone.formatted);
    /* No es un fallo — /editarcliente ya pide su propia confirmación, así
       que "no se aplicó todavía de forma síncrona" no es un error que
       /nuevo deba reportar (este camino, de hecho, nunca ocurre desde
       /nuevo: un ticket recién creado nunca trae clienteId). */
    return Promise.resolve(false);
  }
  return createClienteCore(phone.formatted, { telefono: phone.formatted }).then(function(c){
    if(c) return linkClienteToTicket(t, c);
    return false;
  });
}

/* Punto único para cerrar el overlay del compositor ("+"/popover), usado
   por el botón "+", "Cancelar" y el clic afuera — antes los tres tocaban
   UI.composer directo. Ahora, si hay una selección de fotos en curso,
   también libera sus miniaturas (resetPhotoBatch) para no dejar fugas de
   memoria; y si el lote SE ESTÁ subiendo en este momento, se niega a cerrar
   (nunca se abandona una subida en curso solo por un clic afuera). Devuelve
   true si cerró de verdad, false si se negó — quien llama decide si hace
   falta re-renderizar. */
function closeComposerOverlay(){
  if(UI.photoBatch){
    if(UI.photoBatch.uploading) return false;
    resetPhotoBatch();
  }
  UI.composer = null;
  UI.docDraft = null;
  return true;
}

async function submitNote(){
  var input = document.getElementById("composer-input");
  if(!input) return;
  var text = input.value.trim();
  if(!text) return;
  /* Composer Intelligence §3: "-" como primer carácter abre/ejecuta un
     comando exactamente igual que "/" — se normaliza aquí, una sola vez,
     antes de que nada más vea el texto (parseSlashCommand nunca se entera
     de que existió un "-"). Nunca se interpreta "-" en cualquier otra
     posición (sección 3: "cliente - mañana" sigue siendo texto plano). */
  if(text.charAt(0) === "/" || text.charAt(0) === "-"){
    var normalized = text.charAt(0) === "-" ? "/" + text.slice(1) : text;
    input.value = "";
    UI.slashMenuOpen = false;
    dispatchCommand(normalized);
    return;
  }
  /* Composer Intelligence §1: texto plano ya no se rechaza con un solo
     toast — se ofrecen acciones sugeridas sobre ESE texto. El texto se
     queda en el compositor (nunca se pierde) mientras el panel está
     abierto; solo se limpia cuando una acción realmente arranca (mismo
     criterio "optimista" que ya usa toda la app: /nota manuscrito también
     limpia el compositor antes de que la escritura a Supabase termine). */
  UI.smartActions = { text: text, actions: suggestActionsForText(text, { ticket: findTicket(UI.selectedTicketId) }) };
  render();
  restoreComposerText(text);
}

/* ---------------- mutaciones compartidas ----------------
   El botón "+" y los slash commands terminan aquí, en las mismas
   funciones — nunca hay dos caminos distintos para la misma operación. */

/* Composer Intelligence: return true/false además de todo lo que ya hacía
   (toast + optimistic update + refresh) — cambio aditivo, nadie que ya
   llama a esta función leía su valor de retorno (era undefined siempre),
   así que nada existente cambia de comportamiento. Lo necesita /nuevo para
   poder reportar "qué sí se guardó y qué falló" sin inventar un segundo
   sistema de manejo de errores. */
async function addProductoCore(t, desc, cantidad, precio){
  t.productos.push({ id: uid(), desc: desc, cantidad: cantidad, precio: precio });
  render();
  var ok = true;
  try{
    var r1 = await sb.from("productos").insert({ ticket_id: t.id, descripcion: desc, cantidad: cantidad, precio: precio });
    if(r1.error) throw r1.error;
    var r2 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "producto", autor: UI.whoami || null, payload: { desc: desc, cantidad: cantidad, precio: precio } });
    if(r2.error) throw r2.error;
  }catch(e){ showToast("No se pudo guardar el producto: " + (e.message || "error")); ok = false; }
  refreshFromServer({refocus:true});
  return ok;
}

/* Edición de un producto ya existente (sección 7) — misma tabla, mismo
   bitácora-trace que cualquier otra mutación, así que "editar un producto"
   y "agregar uno nuevo" nunca se sienten como dos sistemas distintos. Solo
   toca la tabla productos: los documentos comerciales ya creados guardan su
   propia fotografía (items) y jamás se leen ni se recalculan desde aquí, así
   que editar un producto del ticket nunca altera una cotización/invoice ya
   emitida. */
async function updateProductoCore(t, productoId, patch){
  var prod = t.productos.filter(function(p){ return p.id === productoId; })[0];
  if(!prod) return;
  Object.assign(prod, patch);
  render();
  try{
    var dbPatch = {};
    if(patch.desc !== undefined) dbPatch.descripcion = patch.desc;
    if(patch.cantidad !== undefined) dbPatch.cantidad = patch.cantidad;
    if("precio" in patch) dbPatch.precio = patch.precio;
    var r1 = await sb.from("productos").update(dbPatch).eq("id", productoId);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Producto editado: " + prod.desc + " — " + (prod.precio==null ? "precio pendiente" : prod.cantidad + " × " + fmtMoney(prod.precio)) } });
  }catch(e){ showToast("No se pudo actualizar el producto: " + (e.message || "error")); }
  refreshFromServer();
}

/* ---------------- clientes (sección 8/9): entidad mínima, "no Salesforce" ----------------
   Crear y vincular son mutaciones explícitas de un clic (igual que agregar
   un producto desde el botón "+"), disparadas desde dentro de un mensaje
   efímero de /cliente — nunca automáticas, nunca por el solo hecho de
   buscar. Vincular denormaliza el nombre también en tickets.cliente para
   que todo el código existente que ya lee ese campo de texto libre siga
   funcionando exactamente igual. */
async function linkClienteToTicket(t, cliente){
  t.clienteId = cliente.id;
  t.cliente = cliente.nombre;
  render();
  var ok = true;
  try{
    var r1 = await sb.from("tickets").update({ cliente_id: cliente.id, cliente: cliente.nombre }).eq("id", t.id);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Cliente vinculado: " + clienteLabel(cliente) } });
  }catch(e){ showToast("No se pudo vincular el cliente: " + (e.message || "error")); ok = false; }
  refreshFromServer({refocus:true});
  return ok;
}
/* Composer Intelligence D2: segundo parámetro opcional (telefono/empresa/
   email) — decisión delegada por el dueño del producto. Ningún llamador
   existente pasa un segundo argumento, así que todos siguen creando un
   cliente con solo nombre exactamente igual que antes; /nuevo es el primer
   llamador que aprovecha `extra` para no tener que crear y luego actualizar
   en dos escrituras separadas. */
async function createClienteCore(nombre, extra){
  extra = extra || {};
  try{
    var insertRow = { nombre: nombre };
    if(extra.telefono) insertRow.telefono = extra.telefono;
    if(extra.empresa) insertRow.empresa = extra.empresa;
    if(extra.email) insertRow.email = extra.email;
    var ins = await sb.from("clientes").insert(insertRow).select().single();
    if(ins.error) throw ins.error;
    var c = mapClienteRow(ins.data);
    STATE.clientes.push(c);
    return c;
  }catch(e){
    showToast("No se pudo crear el cliente: " + (e.message || "error"));
    return null;
  }
}
/* Aplica los cambios ya confirmados por el usuario en /editarcliente
   (nunca se llama antes de esa confirmación explícita). Si el nombre
   cambia, también actualiza tickets.cliente en cualquier ticket vinculado
   para no desincronizar el texto libre que el resto de la app ya lee. */
async function updateClienteCore(clientId, patch, ticketIdForLog){
  var c = STATE.clientes.filter(function(x){ return x.id === clientId; })[0];
  if(!c) return false;
  Object.assign(c, patch);
  render();
  try{
    var dbPatch = {};
    if(patch.nombre !== undefined) dbPatch.nombre = patch.nombre;
    if(patch.empresa !== undefined) dbPatch.empresa = patch.empresa;
    if(patch.telefono !== undefined) dbPatch.telefono = patch.telefono;
    if(patch.email !== undefined) dbPatch.email = patch.email;
    if(patch.notasComerciales !== undefined) dbPatch.notas_comerciales = patch.notasComerciales;
    if(patch.preautorizado !== undefined) dbPatch.preautorizado = patch.preautorizado;
    /* V0.5 D7 — requiere clientes.tax_exempt/tax_exempt_reason/tax_exempt_ref
       de 0006_v05_operational_commercial.sql. Antes de correr esa migración,
       este UPDATE falla (columna inexistente) — el catch de abajo ya
       muestra el error de Supabase tal cual, así que no hace falta un
       mensaje especial aquí. */
    if(patch.taxExempt !== undefined) dbPatch.tax_exempt = patch.taxExempt;
    if(patch.taxExemptReason !== undefined) dbPatch.tax_exempt_reason = patch.taxExemptReason;
    if(patch.taxExemptRef !== undefined) dbPatch.tax_exempt_ref = patch.taxExemptRef;
    /* Logo (0007_v05_client_logo.sql) — mismo criterio "falla con el error
       de Supabase tal cual hasta que se corra la migración". `!== undefined`
       (no `if(patch.logoStoragePath)`) a propósito: `null` es un valor válido
       aquí (quitar el logo), distinto de "no tocar este campo". */
    if(patch.logoStoragePath !== undefined) dbPatch.logo_storage_path = patch.logoStoragePath;
    var r1 = await sb.from("clientes").update(dbPatch).eq("id", clientId);
    if(r1.error) throw r1.error;
    if(patch.nombre !== undefined){
      var linked = STATE.tickets.filter(function(t){ return t.clienteId === clientId; });
      if(linked.length){
        linked.forEach(function(t){ t.cliente = patch.nombre; });
        var r2 = await sb.from("tickets").update({ cliente: patch.nombre }).eq("cliente_id", clientId);
        if(r2.error) throw r2.error;
      }
    }
    if(ticketIdForLog){
      await sb.from("bitacora").insert({ ticket_id: ticketIdForLog, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Cliente editado: " + Object.keys(patch).join(", ") } });
    }
  }catch(e){
    showToast("No se pudo actualizar el cliente: " + (e.message || "error"));
    return false;
  }
  await refreshFromServer({refocus:true});
  return true;
}
