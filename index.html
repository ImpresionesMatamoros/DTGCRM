<!DOCTYPE html>
<meta charset="utf-8">
<!-- Addendum "Mobile/PWA UX", Ronda C §1: el archivo no tenía <!DOCTYPE>/
     viewport/etiquetas PWA — ni una sola. Sin DOCTYPE el navegador renderiza
     en quirks mode, donde box-sizing/vh/safe-area no son fiables; sin
     viewport, un navegador móvil escala la página completa como si fuera
     desktop (todo se ve diminuto y hay que hacer pinch-zoom). Esto es la
     base de la que depende todo lo demás de esta ronda. viewport-fit=cover
     habilita los env(safe-area-inset-*) usados más abajo (notch/home
     indicator de iPhone). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161A">
<!-- Addendum §PWA: permite "Agregar a inicio" en iOS/Android con ícono e
     identidad propios. Deliberadamente SIN service worker (ver
     ADDENDUM-ROUND-C-MOBILE-PWA.md §7): esta app depende de datos en vivo
     de Supabase — cachear el shell de forma agresiva arriesga mostrar datos
     desactualizados sin necesidad real (no hay caso de uso offline). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Design To Go">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<title>Design To Go</title>
<style id="dtg-style">
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#ECE9E0; --surface-3:#E1DDD0;
  --border:#DEDACB; --text:#211F1A; --text-muted:#726C5C; --text-faint:#A39C89;
  --accent:#C4006B; --accent-ink:#8C004C; --accent-soft:#F7DCE9;
  --cyan:#00728F; --cyan-soft:#D9EDF2;
  --gold:#9C6A08; --gold-soft:#F1E3BF;
  --danger:#B3261E; --danger-soft:#F6DCD9;
  --success:#1D7A3C; --success-soft:#DDEFE1; --success-ink:#145C2C;
  --shadow:0 1px 2px rgba(33,31,26,.07),0 8px 24px rgba(33,31,26,.08);
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme: light;
  /* Ronda "Fluidez, Confiabilidad, Realtime y QA" §12: fuente única de las
     safe-areas de iOS (notch/Dynamic Island/Home Indicator) — antes cada
     selector escribía su propio env(safe-area-inset-*) suelto, lo que hacía
     fácil que un overlay nuevo (como el panel de Ayuda o el reporte de bug
     de esta ronda) se olvidara de aplicarlas. Todo lo demás en este archivo
     que usaba env(...) directo ahora usa estas variables — mismo valor
     resultante, un solo lugar para revisar. viewport-fit=cover (ya en el
     <meta> de arriba) es lo que hace que env() no sea siempre 0. */
  --safe-top:env(safe-area-inset-top); --safe-right:env(safe-area-inset-right);
  --safe-bottom:env(safe-area-inset-bottom); --safe-left:env(safe-area-inset-left);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17161A; --surface:#1D1C21; --surface-2:#232228; --surface-3:#2B2A32;
    --border:#35333B; --text:#EDEBE6; --text-muted:#9A968C; --text-faint:#69655C;
    --accent:#FF4FA0; --accent-ink:#FF86BF; --accent-soft:#3B1E2C;
    --cyan:#3FC3E8; --cyan-soft:#12313B;
    --gold:#E7B23D; --gold-soft:#3A2E12;
    --danger:#FF6B61; --danger-soft:#3A2220;
    --success:#3FD97A; --success-soft:#173321; --success-ink:#8FF0B3;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17161A; --surface:#1D1C21; --surface-2:#232228; --surface-3:#2B2A32;
  --border:#35333B; --text:#EDEBE6; --text-muted:#9A968C; --text-faint:#69655C;
  --accent:#FF4FA0; --accent-ink:#FF86BF; --accent-soft:#3B1E2C;
  --cyan:#3FC3E8; --cyan-soft:#12313B;
  --gold:#E7B23D; --gold-soft:#3A2E12;
  --danger:#FF6B61; --danger-soft:#3A2220;
  --success:#3FD97A; --success-soft:#173321; --success-ink:#8FF0B3;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;}
/* Addendum §2: 100vh en iOS Safari mide la pantalla completa SIN restar la
   barra de dirección — con el teclado o la barra visibles, cualquier cosa a
   100vh queda tapada. 100dvh (dynamic viewport height) sí se ajusta cuando
   esa barra aparece/desaparece. Se mantiene 100vh como fallback (Safari
   viejo, o cualquier navegador sin soporte) — dvh solo pisa el valor cuando
   el navegador lo entiende, así el fallback nunca es "sin altura". */
html,body{height:100%; height:100dvh;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,select,textarea{font:inherit; color:inherit;}
input,select,textarea{background:transparent;}
button{cursor:pointer;}
::selection{background:var(--accent-soft);}
.app{display:flex; height:100vh; height:100dvh; width:100vw;}

/* ---------- sidebar ---------- */
.sidebar{
  width:290px; flex-shrink:0; background:var(--surface-2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100%;
}
.sidebar-top{padding:14px 14px 10px; display:flex; flex-direction:column; gap:8px;}
.brand{
  display:flex; align-items:baseline; gap:6px; padding:2px 2px 6px;
  font-family:var(--font-mono); letter-spacing:.02em;
  background:none; border:none; cursor:pointer; text-align:left; border-radius:var(--radius-s);
}
.brand:hover{ opacity:.75; }
.brand-mark{color:var(--accent); font-weight:600;}
.brand-name{color:var(--text); font-weight:600; font-size:13px;}
.btn{
  border:1px solid transparent; border-radius:var(--radius-s); padding:8px 12px;
  font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:background .12s ease, border-color .12s ease, opacity .12s ease;
}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
.btn-primary{background:var(--accent); color:#fff; justify-content:center;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
.btn-sm{padding:5px 10px; font-size:12.5px;}
.btn-ghost:hover{background:var(--surface-3);}
.btn-plain{background:transparent; border:none; color:var(--text-muted); padding:6px 8px;}
.btn-plain:hover, .btn-plain:active{color:var(--text); background:var(--surface-3); border-radius:var(--radius-s);}
.search-wrap{position:relative;}
.search-wrap input{
  width:100%; padding:8px 10px 8px 30px; border:1px solid var(--border); border-radius:var(--radius-s);
  background:var(--surface); font-size:13px;
}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55;}
.nav-stubs{list-style:none; margin:4px 0 2px; padding:0 6px; display:flex; flex-direction:column; gap:1px;}
.nav-stub{
  display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:var(--radius-s);
  color:var(--text-muted); font-size:13px; background:none; border:none; width:100%; text-align:left;
}
.nav-stub:hover{background:var(--surface-3); color:var(--text);}
.nav-stub.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.nav-stub .tag{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); border:1px solid var(--border); border-radius:999px; padding:1px 6px;}
/* Composer Intelligence §4/§5: único hint de atajo de teclado visible en
   toda la interfaz — a propósito discreto (mismo tono que .tag "pronto"),
   nunca compite visualmente con el texto del propio nav-stub. Se oculta en
   el breakpoint móvil (880px, ver abajo): ahí no hay teclado físico, así
   que el hint solo sería ruido. */
.kbd-hint{font-size:10px; font-family:var(--font-mono); color:var(--text-faint); letter-spacing:.02em;}
.sidebar-scroll{flex:1; overflow-y:auto; padding:6px 8px 10px;}
.group-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);
  padding:14px 8px 6px; font-weight:600;
}
.group-label:first-child{padding-top:6px;}
.ticket-row{
  display:flex; flex-direction:column; gap:3px; width:100%; text-align:left; border:none; background:none;
  padding:8px 8px; border-radius:var(--radius-s); position:relative;
}
.ticket-row:hover, .ticket-row:active{background:var(--surface-3);}
/* V0.5 §7: acento del ticket activo reforzado con un borde izquierdo fino
   vía box-shadow inset (no cambia el padding/ancho de la fila, así que no
   hay salto de layout al activarse/desactivarse). */
.ticket-row.active{background:var(--surface); box-shadow:var(--shadow), inset 3px 0 0 var(--accent);}
.ticket-row-top{display:flex; align-items:baseline; gap:6px;}
.ticket-num{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); flex-shrink:0;}
.ticket-title{font-weight:600; font-size:13.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
.ticket-title.muted{font-weight:500; color:var(--text-faint); font-style:italic;}
.ticket-pin{color:var(--gold); flex-shrink:0;}
/* V0.5 §6: × de cancelar — discreta, solo visible en hover/focus, no
   compite con el texto de cliente/producto (esquina superior derecha,
   fuera del flujo del contenido). */
.ticket-row-wrap{position:relative;}
.ticket-row-cancel{
  position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%;
  border:none; background:transparent; color:var(--text-faint); font-size:15px; line-height:1;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s ease, background .12s ease, color .12s ease;
}
.ticket-row-wrap:hover .ticket-row-cancel, .ticket-row-cancel:focus-visible{opacity:1;}
.ticket-row-cancel:hover{background:var(--danger-soft); color:var(--danger);}
.ticket-row-product{font-size:11.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
.ticket-row-product.muted{color:var(--text-faint); font-style:italic;}
.ticket-meta{display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:11.5px; margin-top:3px;}
.ticket-meta:empty{display:none;}
.pill{
  display:inline-flex; align-items:center; padding:1px 7px; border-radius:999px; font-size:11px;
  font-weight:600; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis;
}
.pill-neutral{background:var(--surface-3); color:var(--text-muted);}
.pill-accent{background:var(--accent-soft); color:var(--accent-ink);}
.empty-list{color:var(--text-faint); font-size:12.5px; padding:16px 10px; text-align:center;}
.whoami-bar{
  border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:8px;
  font-size:12.5px; color:var(--text-muted);
}
.whoami-bar input{
  flex:1; min-width:0; border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 8px;
  background:var(--surface); color:var(--text); font-size:12.5px;
}

/* ---------- sección Clientes ---------- */
.clientes-view{padding:14px 22px 22px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px;}
.clientes-search-wrap{max-width:360px;}
.clientes-search-wrap input{width:100%;}
.clientes-list{display:flex; flex-direction:column; gap:1px;}
.cliente-row-empresa{color:var(--text-muted); font-weight:500;}
.cliente-row-with-avatar{flex-direction:row!important; align-items:center; gap:10px;}
.cliente-row-body{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1;}
/* Identidad de cliente en el encabezado del ticket (secciones 1.8/1.9/5.1):
   el color y la forma distinguen "vinculado a una entidad real" de
   "todavía solo texto libre" sin usar una alerta — un poka-yoke visual,
   nunca un bloqueo (sección 1.9). */
.cliente-chip-row{display:flex;}
.cliente-chip{
  display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:600;
  border-radius:var(--radius-s); padding:3px 8px; margin:0; border:none; max-width:100%;
}
.cliente-chip-linked{
  background:var(--accent-soft); color:var(--accent-ink); cursor:pointer;
  text-decoration:none; border:1px solid transparent;
}
.cliente-chip-linked:hover, .cliente-chip-linked:active{ text-decoration:underline; border-color:var(--accent-ink); }
.cliente-chip-empresa{font-weight:500; opacity:.85;}
.cliente-chip-chevron{opacity:.7;}
.cliente-chip-provisional{
  background:transparent; color:var(--text-muted); font-weight:500; font-style:italic;
  border:1px dashed var(--border); cursor:default;
}
.ficha-header{border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:2px;}
.ficha-name{font-size:19px; margin:0 0 8px; color:var(--text);}
.ficha-empresa{color:var(--text-muted); font-weight:500; font-size:15px;}
/* Logotipo del cliente (§13-19): avatar grande junto al nombre, acciones
   Agregar/Cambiar/Eliminar debajo — flujo corto a propósito (sección 13). */
.ficha-identity-row{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
.ficha-identity-main{display:flex; flex-direction:column; gap:6px; min-width:0;}
.ficha-identity-main .ficha-name{margin:0;}
.ficha-logo-actions{display:flex; gap:6px; flex-wrap:wrap;}
/* Teléfono/email (§31-33): el valor mismo es la acción (tel:/mailto:), el
   ✎ es una intención completamente distinta — nunca el mismo texto sirve
   para las dos cosas (sección 32, literal). */
.cliente-contact-row{display:flex; align-items:center; gap:6px;}
.cliente-contact-link{color:var(--accent-ink); text-decoration:none;}
.cliente-contact-link:hover, .cliente-contact-link:active{text-decoration:underline;}
.cliente-contact-edit{
  border:none; background:none; color:var(--text-faint); cursor:pointer; font-size:13px;
  padding:4px 6px; border-radius:var(--radius-s); line-height:1; display:inline-flex; align-items:center; justify-content:center;
}
.cliente-contact-edit:hover, .cliente-contact-edit:active{color:var(--text); background:var(--surface-3);}
.cliente-contact-input{
  border:1px solid var(--accent); border-radius:var(--radius-s); padding:4px 8px; font-size:13px;
  background:var(--surface); color:var(--text); font:inherit; flex:1; max-width:240px;
}
.ficha-section-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600; margin-bottom:6px;}
.ficha-section{display:flex; flex-direction:column; gap:2px;}
.ficha-tabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px;}
.ficha-tab{
  background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px 12px;
  font-size:12.5px; color:var(--text-muted);
}
.ficha-tab:hover, .ficha-tab:active{background:var(--surface-3); color:var(--text);}
.ficha-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.ficha-history-list{display:flex; flex-direction:column; gap:8px;}
.cliente-history-item{border:1px solid var(--border); border-radius:var(--radius-m); padding:8px 10px; background:var(--surface);}
.cliente-history-ticket{border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface); margin-bottom:2px;}
.history-ticket-pill{
  background:none; border:none; color:var(--cyan); font-size:11px; font-weight:600; padding:0 0 4px;
  cursor:pointer;
}
.history-ticket-pill:hover, .history-ticket-pill:active{text-decoration:underline;}
/* Lenguaje de color por tipo de dato dentro de una misma línea (sección 4):
   cantidad/descripción/precio son datos distintos y se ven distintos —
   nunca toda la línea del mismo color — con subrayado/cursor como
   refuerzo no dependiente del color (sección 4.1). */
.hist-producto-line{
  background:none; border:none; padding:0; font:inherit; color:inherit; text-align:left;
  display:block; width:100%; cursor:pointer;
}
button.hist-producto-line:hover, button.hist-producto-line:active{text-decoration:underline; color:var(--accent-ink);}
.hist-cantidad{color:var(--cyan); font-weight:600;}
.hist-desc{color:var(--text);}
.hist-precio{color:var(--gold); font-weight:600;}
.hist-precio:not(.hist-pending){color:#2E7D32;}
:root[data-theme="dark"] .hist-precio:not(.hist-pending){color:#7FD98A;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hist-precio:not(.hist-pending){color:#7FD98A;} }
.hist-total{color:var(--text-muted); font-weight:600;}

/* ---------- main ---------- */
.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%; position:relative;}
.readonly-banner{
  background:var(--gold-soft); color:var(--gold); font-size:12.5px; font-weight:600;
  padding:7px 20px; border-bottom:1px solid var(--border); text-align:center;
}
.empty-state{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--text-muted); text-align:center; padding:20px;
}
.empty-state h1{font-size:17px; color:var(--text); font-weight:600; margin:0;}
.empty-state p{margin:0; max-width:340px; font-size:13.5px;}

/* V0.5 §3: "la cabecera explica el presente, el thread explica el pasado"
   — más separación de profundidad (sombra sutil hacia abajo) y más aire
   que antes para que la comanda se sienta como una superficie propia,
   sin convertirla en una card ni cambiar su lógica. */
.ticket-header{
  border-bottom:1px solid var(--border); padding:16px 22px 16px; background:var(--surface);
  display:flex; flex-direction:column; gap:9px; flex-shrink:0;
  box-shadow:0 6px 14px -10px rgba(0,0,0,.55);
  position:relative; z-index:1;
}
.ticket-header-top{display:flex; align-items:center; gap:10px; justify-content:space-between;}
.home-header{
  border-bottom:1px solid var(--border); padding:14px 22px; background:var(--surface);
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0;
}
.home-header h1{font-size:15px; margin:0; color:var(--text); font-weight:600;}
.ticket-id{font-family:var(--font-mono); color:var(--text-faint); font-size:12px;}
.ticket-header-actions{display:flex; align-items:center; gap:4px;}
.field-grid{display:flex; flex-wrap:wrap; gap:6px 4px; align-items:center;}
.field{display:flex; align-items:center; gap:6px; min-width:0;}
.field-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); white-space:nowrap;}
.field input[type=text], .field input[type=date], .field select{
  border:1px solid transparent; background:transparent; border-radius:var(--radius-s);
  padding:4px 7px; font-size:13px; color:var(--text); min-width:60px;
}
.field input[type=text]{width:150px;}
.field input:hover, .field select:hover{background:var(--surface-3);}
.field input:focus, .field select:focus{background:var(--surface); border-color:var(--border);}
.field input::placeholder{color:var(--text-faint);}
.totals-line{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono);}
.totals-line .known{color:var(--text); font-weight:600;}
.totals-line .pending{color:var(--gold);}
.totals-link{
  background:none; border:none; padding:4px 2px; margin:-4px 0; font:inherit; color:inherit; cursor:pointer;
  border-bottom:1px dashed var(--text-faint); min-height:28px;
}
.totals-link:hover, .totals-link:active{border-bottom-color:var(--accent);}
.totals-link.pending{color:var(--gold); border-bottom-color:var(--gold);}

/* ---------- Comanda del ticket (sección 3/4/5) ----------
   "LA CABECERA EXPLICA EL PRESENTE": más jerarquía visual que el
   historial (que sigue chico y denso, sin tocar). Sigue siendo una barra
   compacta, sin cards ni cajas dentro de cajas — la jerarquía se logra con
   tipografía/ritmo, no con contenedores nuevos. */
.status-pill.status-abierto{background:var(--cyan-soft); color:var(--cyan);}
.status-pill.status-entregado{background:var(--success-soft); color:var(--success-ink);}
.status-pill.status-cerrado_pagado{background:var(--surface-3); color:var(--text-muted);}
.status-pill.status-cerrado_cancelado{background:var(--danger-soft); color:var(--danger);}
.ticket-row-inactive .ticket-title{color:var(--text-muted);}

.comanda-meta{font-family:var(--font-mono); color:var(--text-faint); font-size:11.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.comanda-identity{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:2px;}
.comanda-identity-btn{
  background:none; border:none; padding:0; font:inherit; cursor:pointer; text-align:left;
  font-size:25px; font-weight:700; letter-spacing:-.01em; line-height:1.15;
  display:inline-flex; align-items:baseline; gap:6px;
}
/* .comanda-cliente-btn: SOLO cuando hay un cliente real vinculado (distinto
   de .comanda-cliente-plain) — algo se apoya en esta distinción para saber
   si el ticket ya tiene una entidad de cliente real, no solo texto libre. */
.comanda-cliente-btn{color:var(--text);align-items:center;}
.comanda-cliente-btn .client-avatar{flex-shrink:0;}
.comanda-cliente-name{display:inline-flex;align-items:baseline;}
.comanda-cliente-btn:hover, .comanda-cliente-btn:active{color:var(--accent-ink);}
.comanda-cliente-chevron{font-size:16px; color:var(--text-faint); font-weight:500;}
.comanda-cliente-plain{color:var(--text-muted); font-style:italic; font-size:21px;}
.comanda-cliente-plain:hover, .comanda-cliente-plain:active{color:var(--text);}
.comanda-summary{font-size:13.5px; color:var(--text-muted); margin-top:2px;}
.comanda-actions-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px;}
/* Addendum final §28: sigue siendo la acción positiva (verde), pero ya no
   debe ser lo más prominente de la cabecera — mismo data-action/
   marcarEntregadoCore de siempre, solo se le baja tamaño/peso al nivel de
   un botón secundario (criterio .btn-sm) en vez de un botón "hero". */
.btn-success{background:var(--success); color:#fff; font-weight:600; justify-content:center; padding:5px 10px; font-size:12.5px;}
.btn-success:hover, .btn-success:active{background:var(--success-ink);}
.btn-cierre-secondary{
  background:transparent; border:1px solid var(--border); color:var(--text-muted); font-size:12.5px; padding:7px 12px;
}
.btn-cierre-secondary:hover, .btn-cierre-secondary:active{background:var(--surface-3); color:var(--text);}
.comanda-entregado-note{font-size:12px; color:var(--text-muted);}
.comanda-entregado-note button{background:none; border:none; padding:0; color:var(--text-faint); text-decoration:underline; cursor:pointer; font:inherit;}
.comanda-cerrado-note{
  font-size:12.5px; color:var(--text-muted); background:var(--surface-2); border-radius:var(--radius-s);
  padding:7px 10px; margin-top:2px;
}
.comanda-cerrado-note b{color:var(--text);}

/* OPERACIÓN | COMERCIAL: dos zonas realmente diferenciadas — separador
   vertical fino entre ellas (nunca una caja/card nueva) y cada campo es un
   botón compacto tipo "stat" que aprovecha el ancho en horizontal en vez de
   apilarse en una lista vertical de filas sueltas. */
/* V0.5 §3: divisor vertical suavizado a propósito — ya no separa OPERACIÓN/
   COMERCIAL como dos zonas fuertemente distintas, es una sola superficie
   operativa. Se quita el border-left; el espaciado y las dos tipografías ya
   existentes (etiqueta-primero vs número-primero) siguen bastando para
   distinguir cada campo sin una línea dura entre ambos grupos. */
.comanda-zones{display:flex; align-items:stretch; gap:0; flex-wrap:wrap; row-gap:12px; margin-top:12px; padding-top:10px; border-top:1px solid var(--border);}
.comanda-zone{display:flex; flex-direction:column; gap:6px; padding-right:22px;}
.comanda-zone-comercial{padding-left:4px;}
.comanda-zone-title{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:700;}
.comanda-zone-fields{display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; row-gap:8px;}
.comanda-zone:not(.comanda-zone-comercial) .comanda-zone-fields{align-items:flex-start;}
.comanda-field{
  display:flex; flex-direction:column; gap:2px; font-size:13px;
  background:none; border:none; padding:3px 6px; margin:-3px -6px; text-align:left; cursor:pointer; color:var(--text); border-radius:var(--radius-s);
}
.comanda-field:hover, .comanda-field:active{background:var(--surface-3);}
.comanda-field-label{color:var(--text-faint); font-size:11px;}
.comanda-field-value{font-weight:600; color:var(--text); font-size:14.5px;}
.comanda-field-value.muted{color:var(--text-faint); font-weight:500; font-style:italic;}
.comanda-field-value.accent{color:var(--accent-ink); font-weight:700;}
.comanda-field-value.known{color:var(--text);}
.comanda-field-value.pending{color:var(--gold);}
/* .comanda-stat: COMERCIAL invierte el orden (número primero, etiqueta
   debajo) — en esta zona lo que se escanea es la cifra, no el nombre del
   campo (sección "valores importantes fáciles de escanear"). */
.comanda-stat{gap:1px;}
.comanda-stat .comanda-field-value{font-family:var(--font-mono); font-size:17px; font-weight:700;}
.comanda-stat .comanda-field-value.cobrado{color:var(--success-ink);}
.comanda-stat .comanda-field-label{font-size:10.5px;}
.comanda-edit-inline{padding:2px; display:flex; align-items:center; gap:6px;}
.comanda-edit-inline .field-label{display:none;}
@media (max-width:640px){
  .comanda-identity-btn, .comanda-cliente-plain{font-size:20px;}
  .comanda-zone-comercial{border-left:none; padding-left:0; margin-left:0; margin-top:2px; padding-top:10px; border-top:1px dashed var(--border);}
  /* Addendum §6: la comanda ya se reacomoda sola en columnas por el
     flex-wrap existente (OPERACIÓN/COMERCIAL) — lo que faltaba era zona de
     toque: en escritorio .comanda-field usa un padding visual mínimo (queda
     bien con mouse), pero en dedo real conviene más aire vertical entre
     "Atender"/"Compromiso"/etc. sin cambiar la jerarquía tipográfica que ya
     tiene la sección (sección "cabecera explica el presente"). */
  .comanda-zone-fields{ row-gap:14px; column-gap:18px; }
  .comanda-field{ padding:6px 8px; margin:-6px -8px; }
}

/* Modal de cierre: chico y centrado, se dispara desde el encabezado (no
   desde el compositor de abajo) — mismo criterio que el visor de doc. */
/* §12: esta clase ahora la comparten tres overlays (cierre de ticket, panel
   de Ayuda, reportar un problema) — antes tenía padding:16px fijo, sin
   safe-area, así que en un iPhone con notch el modal podía quedar pegado al
   borde real de la pantalla. calc() con las variables --safe-* de :root
   asegura los 16px mínimos de siempre MÁS lo que el sistema reserve. */
.cierre-modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
  padding:calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
  z-index:60;
}
.cierre-modal{
  background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:18px;
  width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px;
  max-height:calc(100vh - 32px - var(--safe-top) - var(--safe-bottom)); overflow-y:auto;
}
.cierre-modal-title{font-size:15px; font-weight:700; color:var(--text);}
.cierre-modal-sub{font-size:12px; color:var(--text-faint); margin-top:-6px;}
.cierre-tipo-btn{
  display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;
  border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 12px; background:var(--surface-2); cursor:pointer;
}
.cierre-tipo-btn:hover{background:var(--surface-3);}
.cierre-tipo-label{font-weight:700; font-size:13.5px; color:var(--text);}
.cierre-tipo-desc{font-size:12px; color:var(--text-muted);}
.cierre-razon-label{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--text-muted);}
.cierre-razon-label textarea{
  font:inherit; font-size:13.5px; border:1px solid var(--border); border-radius:var(--radius-s); padding:8px;
  background:var(--surface); color:var(--text); resize:vertical;
}

.thread{flex:1; overflow-y:auto; padding:16px 22px 8px;}
.thread-item{display:flex; gap:10px; padding:7px 0; max-width:640px;}
.thread-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--text-faint);}
.thread-dot.nota{background:var(--accent);}
.thread-dot.producto{background:var(--cyan);}
.thread-dot.tarea{background:var(--text-faint);}
.thread-dot.tarea_produccion{background:var(--cyan);}
.thread-dot.pago{background:var(--gold);}
.thread-dot.documento{background:var(--accent);}
.thread-dot.archivo{background:var(--text-muted);}
.thread-dot.sistema{background:var(--border);}
.thread-body{min-width:0; flex:1;}
.thread-meta{font-size:11.5px; color:var(--text-faint); margin-bottom:2px;}
.thread-meta:empty{display:none;}
.thread-meta .autor{color:var(--text-muted); font-weight:600;}
/* V0.5 §4: separador discreto de día dentro del timeline — reemplaza la
   fecha repetida en cada evento. */
.thread-day-sep{display:flex; align-items:center; gap:10px; margin:16px 0 8px; font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--text-faint);}
.thread-day-sep:first-child{margin-top:2px;}
.thread-day-sep-line{flex:1; height:1px; background:var(--border);}
.thread-text{font-size:13.5px; color:var(--text); white-space:pre-wrap; word-break:break-word;}
.thread-sub{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono); margin-top:1px;}
.thread-img{margin-top:6px; max-width:260px; border-radius:var(--radius-m); border:1px solid var(--border); display:block;}

/* Mensajes efímeros (/help, /estado, /pendientes, /dinero…): viven dentro
   del mismo hilo que las notas/productos/pagos, pero se distinguen a
   propósito — borde punteado, sin punto de color sólido — para que sea
   obvio de un vistazo que esto es una consulta momentánea, no algo
   guardado. */
.thread-dot.ephemeral{background:transparent; border:1.5px dashed var(--text-faint); width:7px; height:7px;}
.ephemeral-item .thread-meta{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.ephemeral-dismiss{font-size:14px; line-height:1; padding:2px 7px;}
.ephemeral-card{
  border:1px dashed var(--border); border-radius:var(--radius-m); background:var(--surface-2);
  padding:10px 12px;
}
.ephemeral-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;}
.ephemeral-row{font-size:12.5px; color:var(--text-muted); margin-bottom:3px;}
.ephemeral-row strong{color:var(--text);}
.ephemeral-sub{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.help-cmd-btn, .help-example-btn{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; box-sizing:border-box;
  border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface); color:var(--text);
  padding:9px 10px; margin-bottom:5px; font-size:12.5px; min-height:36px; cursor:pointer;
}
.help-cmd-btn:hover, .help-example-btn:hover{background:var(--surface-3); border-color:var(--accent);}
.help-cmd-btn code{font-family:var(--font-mono); color:var(--accent); flex-shrink:0;}
.help-cmd-btn .desc{color:var(--text-muted);}

/* Ronda "Fluidez, Confiabilidad, Realtime y QA" §1: panel global "?" —
   reutiliza .cierre-modal/.cierre-modal-title/.popover-actions tal cual
   (misma familia visual), esto solo agrega lo específico del panel:
   la lista de accesos (Comandos/Atajos/Actualizar/Reportar) y el pie
   "Design To Go CRM · Versión · Build". */
.help-panel{ max-width:340px; }
.help-panel-item{
  display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; box-sizing:border-box;
  border:none; border-radius:var(--radius-s); background:transparent; color:var(--text);
  padding:11px 8px; font-size:13.5px; min-height:40px; cursor:pointer;
}
.help-panel-item:hover, .help-panel-item:active{background:var(--surface-2);}
.help-panel-refresh-icon{color:var(--text-faint); font-size:15px;}
.help-panel-sep{height:1px; background:var(--border); margin:2px 0;}
.help-panel-about{padding:2px 8px;}
.help-panel-about-name{font-size:12.5px; font-weight:700; color:var(--text-muted);}
.help-panel-about-meta{font-size:11.5px; color:var(--text-faint); margin-top:1px; font-family:var(--font-mono);}
.help-panel-back{align-self:flex-start; font-size:12.5px; padding:4px 6px; margin:-4px 0 -2px -6px;}
.help-panel-list{max-height:50vh; overflow-y:auto; margin:0 -4px;}
.help-shortcut-row{
  display:flex; align-items:center; gap:10px; padding:7px 4px; font-size:12.5px; color:var(--text-muted);
  border-bottom:1px solid var(--border);
}
.help-shortcut-row:last-child{border-bottom:none;}
.help-shortcut-row code{font-family:var(--font-mono); color:var(--accent); flex-shrink:0; min-width:64px;}
/* Botón "?" discreto al pie del sidebar/drawer (mismo elemento en desktop y
   mobile, ver renderSidebar()) — vive junto al selector "Trabajando como",
   así que se ancla a la derecha sin empujar el input. */
.help-panel-open-btn{
  flex-shrink:0; font-weight:700; font-size:13px; border:1px solid var(--border); border-radius:50%;
  width:26px; height:26px; min-width:0; padding:0; display:inline-flex; align-items:center; justify-content:center;
}

/* §3: Reportar un problema — mismo overlay/tarjeta que el panel de Ayuda. */
.bugreport-modal{ max-width:380px; }
.bugreport-severity-row{display:flex; flex-wrap:wrap; gap:6px;}
.bugreport-severity-chip{
  border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text-muted);
  padding:7px 12px; font-size:12.5px; cursor:pointer;
}
.bugreport-severity-chip:hover{background:var(--surface-3);}
.bugreport-severity-chip.active{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); font-weight:600;}
.bugreport-attach-btn{width:100%; text-align:left; border:1px dashed var(--border); border-radius:var(--radius-s); padding:9px 10px; font-size:12.5px;}

/* Addendum final §17/§19: editor compacto de "Total del pedido" — misma
   familia visual que .cierre-modal/.bugreport-modal. */
.total-pedido-modal{ max-width:420px; }
.total-pedido-desired{ font-size:14px; color:var(--text); }
.total-pedido-desired b{ font-family:var(--font-mono); }
.total-rows{ display:flex; flex-direction:column; gap:6px; max-height:40vh; overflow-y:auto; }
.total-row{ display:flex; align-items:center; gap:8px; }
.total-row-desc{ flex:1; min-width:0; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.total-row-qty{ font-size:12px; color:var(--text-faint); font-family:var(--font-mono); flex-shrink:0; }
.total-row-price{
  width:96px; flex-shrink:0; border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 8px;
  background:var(--surface); color:var(--text); font-size:13px; font-family:var(--font-mono); text-align:right;
}
.total-pedido-summary{ font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:8px; }
.total-pedido-diff{ color:var(--gold); font-weight:600; }
.total-pedido-match{ color:var(--success-ink); font-weight:600; }
/* Vincular/crear cliente (sección 5): la decisión principal de /cliente NO
   puede leerse como texto informativo gris — necesita contraste real de
   acción, igual que cualquier otro botón primario de la app. Mismo botón,
   misma lógica (cliente-link/cliente-create) — solo cambia el peso visual. */
.cliente-cta{border-color:var(--accent-soft); background:var(--accent-soft);}
.cliente-cta .desc{color:var(--accent-ink); font-weight:700;}
.cliente-cta:hover, .cliente-cta:active{background:var(--accent); border-color:var(--accent);}
.cliente-cta:hover .desc{color:#fff;}
.help-example-btn{font-family:var(--font-mono); color:var(--text-muted);}

/* Vista editable de productos (sección 7) — dentro de un mensaje efímero,
   así que nunca compite por espacio con un módulo aparte. Grid de 4
   columnas: descripción se estira, cantidad/precio angostos, total fijo. */
.producto-edit-row{
  display:grid; grid-template-columns:1fr 56px 84px 84px; gap:6px; align-items:center; margin-bottom:6px;
}
.producto-edit-header{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin-bottom:4px;
}
.producto-edit-row input{
  border:1px solid var(--border); border-radius:var(--radius-s); padding:7px 8px; font-size:12.5px;
  background:var(--surface); color:var(--text); min-height:32px; width:100%; box-sizing:border-box;
}
.producto-edit-row .pe-total{font-family:var(--font-mono); font-size:12.5px; text-align:right; color:var(--text);}
.producto-edit-row .pe-total.pending{color:var(--gold);}
@media (max-width:520px){
  .producto-edit-row{grid-template-columns:1fr; gap:4px; border-bottom:1px dashed var(--border); padding-bottom:8px;}
  .producto-edit-header{display:none;}
  .producto-edit-row .pe-total{text-align:left;}
}
.prod-toggle{
  display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; flex-shrink:0;
}
.prod-toggle button{
  border:none; background:var(--surface); padding:3px 9px; font-size:11px; color:var(--text-muted); font-weight:600;
}
.prod-toggle button.on{background:var(--cyan); color:#fff;}
.prod-toggle button+button{border-left:1px solid var(--border);}

.tasks-panel{border-bottom:1px solid var(--border); background:var(--surface); padding:10px 22px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; max-height:130px; overflow-y:auto;}
.tasks-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600;}
.task-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.task-row.done .task-desc{color:var(--text-faint); text-decoration:line-through;}
.task-check{
  width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); flex-shrink:0; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
}
.task-check.on{background:var(--cyan); border-color:var(--cyan);}
.task-desc{flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.task-extra{color:var(--text-faint); font-size:11px; white-space:nowrap;}

.composer-wrap{border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; position:relative;}
/* Preview en vivo de /producto (sección 6): mismo parser que guarda, en
   modo solo-lectura — se actualiza con cada tecla, nunca toca datos.
   Colores discretos para distinguir cantidad/descripción/precio de un
   vistazo, sin competir visualmente con el compositor. */
.producto-preview{padding:2px 14px 8px; font-size:12px; color:var(--text-muted); font-family:var(--font-mono);}
.producto-preview[hidden]{display:none;}
.producto-preview .pv-qty{color:var(--cyan); font-weight:600;}
.producto-preview .pv-desc{color:var(--text);}
.producto-preview .pv-price, .producto-preview .pv-total{color:var(--accent); font-weight:600;}
.producto-preview .pv-pending{color:var(--gold); font-weight:600;}
.popover{
  position:absolute; bottom:100%; left:20px; margin-bottom:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-m); box-shadow:var(--shadow); padding:10px; width:280px; z-index:20;
}
.popover-menu-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 8px; border:none;
  background:none; border-radius:var(--radius-s); font-size:13px;
}
.popover-menu-item:hover, .popover-menu-item:active{background:var(--surface-3);}
.popover-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:2px 6px 8px; font-weight:600;}
.popover-form{display:flex; flex-direction:column; gap:8px;}
.popover-form label{font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:3px;}
.popover-form input, .popover-form select{
  border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 8px; font-size:13px; background:var(--surface);
}
.popover-row{display:flex; gap:6px;}
.popover-row > label{flex:1; min-width:0;}
.popover-actions{display:flex; justify-content:flex-end; gap:6px; margin-top:2px;}
.radio-row{display:flex; gap:12px; font-size:12.5px; color:var(--text); align-items:center;}
.radio-row label{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text);}

/* ---------- fotos múltiples: mismo .popover de siempre en desktop, pantalla
   casi completa en móvil (ver el bloque @media 640px más abajo) — misma
   estructura HTML en los dos casos, nunca dos sistemas de upload. ---------- */
.photo-batch-popover{ display:flex; flex-direction:column; gap:8px; width:320px; }
.photo-batch-count{ font-size:12px; color:var(--text-muted); }
.photo-batch-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:6px;
  max-height:200px; overflow-y:auto; padding:2px;
}
.photo-batch-thumb{ position:relative; aspect-ratio:1/1; border-radius:var(--radius-s); overflow:hidden; background:var(--surface-2); }
.photo-batch-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-batch-remove{
  position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:none;
  background:rgba(0,0,0,.6); color:#fff; font-size:14px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-batch-remove:hover{ background:rgba(0,0,0,.8); }
.photo-batch-hint{ font-size:11.5px; color:var(--text-faint); }
.photo-batch-progress-label{ font-size:13px; color:var(--text); font-weight:600; }
.photo-batch-progress-bar{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.photo-batch-progress-fill{ height:100%; background:var(--accent); transition:width .15s ease; }
.photo-batch-result-line{ font-size:13px; color:var(--text); font-weight:600; }
.photo-batch-result-fail{ font-size:12.5px; color:var(--danger); }

/* ---------- avatar de cliente: logo o iniciales (§16-19) ----------
   object-fit:contain a propósito (§45): nunca deforma un logo horizontal
   ni uno vertical para "llenar" el círculo a la fuerza — puede quedar aire
   dentro del contenedor circular, y eso es preferible a estirar la imagen. */
.client-avatar{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  width:32px; height:32px; border-radius:50%; overflow:hidden;
  background:var(--surface-3); font-size:12px; font-weight:700; color:var(--text-muted);
  letter-spacing:.02em;
}
.client-avatar img{ width:100%; height:100%; object-fit:contain; }
.client-avatar-sm{ width:22px; height:22px; font-size:9.5px; }
.client-avatar-lg{ width:56px; height:56px; font-size:19px; }

/* Cabecera móvil colapsable §21-28: estos tres elementos SOLO existen para
   mobile/tablet — en desktop quedan display:none siempre (la cabecera de
   escritorio no cambia en absoluto) y el @media(max-width:880px) de abajo
   es el único lugar que los enciende. */
.comanda-header-controls{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.comanda-more-toggle{
  display:none; width:32px; height:32px; align-items:center; justify-content:center;
  border:none; background:none; color:var(--text-muted); cursor:pointer; border-radius:var(--radius-s); flex-shrink:0;
  font-size:18px;
}
.comanda-more-toggle:hover, .comanda-more-toggle:active{background:var(--surface-3); color:var(--text);}
/* Addendum final §26: reemplaza el triángulo suelto por una affordance
   explícita de texto+chevron — mismo data-action/handler de siempre, solo
   cambia la presentación. Pastilla (no círculo) para que se lea como "más
   opciones de texto", nunca como un ícono ambiguo. */
.comanda-expand-toggle{
  display:none; align-items:center; gap:4px; height:26px; padding:0 10px; flex-shrink:0;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
  cursor:pointer; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;
}
.comanda-expand-toggle:hover, .comanda-expand-toggle:active{background:var(--surface-3); color:var(--text);}
.comanda-expand-chevron{font-size:10px;}
.comanda-expand-label-short{display:none;}
.comanda-compact-summary{display:none; font-size:12.5px; color:var(--text-muted); font-weight:600; padding:0 20px 10px;}
.comanda-compact-sep{opacity:.5;}
.composer{display:flex; align-items:flex-end; gap:8px; padding:12px 20px;}
.composer-plus{
  width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; color:var(--text-muted);
}
.composer-plus:hover, .composer-plus:active{background:var(--surface-3); color:var(--text);}
.composer textarea{
  flex:1; resize:none; border:1px solid var(--border); border-radius:var(--radius-l); padding:9px 14px;
  font-size:13.5px; max-height:120px; background:var(--bg);
}
.composer-send{
  width:32px; height:32px; border-radius:50%; border:none; background:var(--accent); color:#fff; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.composer-send:disabled{opacity:.35; cursor:default;}
.composer-send:not(:disabled):hover, .composer-send:not(:disabled):active{background:var(--accent-ink);}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
  padding:9px 16px; border-radius:999px; font-size:12.5px; box-shadow:var(--shadow); z-index:50; opacity:0;
  pointer-events:none; transition:opacity .18s ease, transform .18s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;} }

@media (max-width: 880px){
  /* Addendum §3: el cajón (drawer) del sidebar ya existía de una ronda
     anterior — aquí solo se audita/pule: ancho completo hasta un tope
     razonable (no 290px fijo en un teléfono angosto) y respeto del notch/
     home-indicator con env(safe-area-inset-*) (requiere viewport-fit=cover,
     agregado arriba en esta misma ronda). */
  .sidebar{
    position:fixed; inset:0 auto 0 0; z-index:30; transform:translateX(-100%); transition:transform .18s ease;
    width:min(86vw, 340px);
    padding-left:var(--safe-left); padding-bottom:var(--safe-bottom);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-toggle{display:inline-flex!important;}
  .mobile-topbar{display:flex!important;}
  .sidebar-backdrop{display:block!important;}
  .mobile-topbar{padding-top:calc(10px + var(--safe-top)); padding-left:calc(16px + var(--safe-left)); padding-right:calc(16px + var(--safe-right));}

  /* Addendum §4: cualquier input/select/textarea por debajo de 16px de
     font-size dispara el auto-zoom de iOS Safari al enfocarlo (comportamiento
     nativo del navegador, no un bug de la app) — el usuario "entra" a un
     campo y la pantalla entera hace zoom in sola. Se sube a 16px SOLO en
     este breakpoint móvil, para no tocar la densidad visual del desktop. */
  .app input, .app select, .app textarea{ font-size:16px; }

  /* Addendum §5: zonas táctiles — 44×44 es el mínimo recomendado (Apple
     HIG/Material) para no fallar el toque en un dedo real; en desktop estos
     mismos controles se quedan en 32px (con mouse la precisión no es un
     problema, y agrandarlos ahí solo desperdicia espacio). */
  .composer-plus, .composer-send, .sidebar-toggle{ width:44px; height:44px; }
  .btn-plain{ min-width:40px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; }
  .docform-fee-row .btn-plain{ min-width:36px; min-height:36px; }
  .btn{ min-height:42px; }
  /* Affordances §41: el ✎ de teléfono/email es chico a propósito (discreto,
     sección 30), pero su zona de toque debe seguir siendo cómoda. */
  .cliente-contact-edit{ min-width:36px; min-height:36px; }

  /* Composer Intelligence §15: los chips de "Usar como:" son botones nuevos
     de esta ronda — mismo criterio de 44px que el resto de los controles
     táctiles de Ronda C, aplicado aquí (no en la regla base) por la misma
     razón que ya vale para .btn-plain/.composer-plus: en desktop, con
     mouse, 32px de alto ya es cómodo y agrandarlo solo quita densidad. */
  .smart-action-chip{ min-height:44px; padding:9px 14px; }

  /* Addendum §5: el popover angosto de "+" (Producto/Tarea/Pago) es
     position:absolute con ancho fijo (280px) anclado al compositor — en un
     teléfono angosto (320-375px) eso puede salirse del borde derecho. Se
     limita el ancho al viewport disponible sin convertirlo en un bottom-
     sheet (eso sí se hizo para el formulario de documento, mucho más
     grande — ver más abajo). */
  .popover{ width:calc(100vw - 40px); max-width:340px; }

  /* Addendum §8: manejo de teclado en iOS. .composer-wrap NO usa
     position:fixed (a propósito, ya desde antes de esta ronda) — es un
     hijo flex normal dentro de .main, que a su vez vive dentro de .app a
     100dvh. Ese es el patrón correcto: cuando aparece el teclado nativo,
     dvh se reduce y todo el layout flex se reacomoda solo, así que el
     compositor nunca queda tapado detrás del teclado (el bug clásico de
     barras con position:fixed). Lo único que faltaba era el padding del
     home-indicator cuando el teclado está cerrado. */
  .composer{ padding-bottom:calc(12px + var(--safe-bottom)); padding-left:calc(20px + var(--safe-left)); padding-right:calc(20px + var(--safe-right)); }

  /* Composer Intelligence §4/§5: el hint "⌘H"/"Ctrl+Shift+H" solo tiene
     sentido con teclado físico — en móvil se oculta (no es información útil
     ahí, y el nav-stub ya está apretado de espacio). */
  .kbd-hint{ display:none; }

  /* Cabecera móvil colapsable §21-28/§39: SIGUE siendo renderTicketHeader(t)
     — nada de esto agrega una segunda función ni una segunda mutación, solo
     decide qué se ve. Colapsado (default, §22) = SOLO folio/estado/cliente/
     resumen de trabajo/acción primaria/resumen comercial compacto/control
     de expandir; todo lo demás (Operación, Comercial completo, Documentos/
     Fijar/Cerrar ticket) queda oculto. Expandido (§26) muestra Operación y
     Comercial completos; Documentos/Fijar/Cerrar ticket (acciones
     secundarias, §39) se agrupan detrás de "•••" en vez de mostrarse
     siempre — mismos botones y mismo data-action de siempre, nunca una
     copia. Ninguna de estas reglas toca nada fuera de este @media, así que
     desktop queda exactamente igual que antes de esta ronda. */
  .comanda-more-toggle{ display:inline-flex!important; width:40px; height:40px; font-size:20px; }
  .comanda-expand-toggle{ display:inline-flex!important; height:34px; font-size:13px; padding:0 12px; }
  .th-collapsed .comanda-zones{ display:none; }
  .th-collapsed .ticket-header-actions{ display:none; }
  .th-collapsed .comanda-secondary-btn{ display:none; }
  .th-collapsed .comanda-more-toggle{ display:none!important; }
  .th-collapsed .comanda-compact-summary{ display:block!important; }
  .th-expanded .ticket-header-actions{ display:none; }
  .th-expanded .comanda-secondary-btn{ display:none; }
  .th-expanded.th-more-open .ticket-header-actions{ display:flex!important; }
  .th-expanded.th-more-open .comanda-secondary-btn{ display:inline-flex!important; }
}
/* Addendum final §26: en mobile MUY angosto "Ver detalles"/"Ocultar
   detalles" puede no caber junto al resto de la barra superior — se acorta
   a solo "Detalles", pero NUNCA vuelve a depender solo del triángulo/
   chevron a secas. */
@media (max-width:400px){
  .comanda-expand-label-full{ display:none; }
  .comanda-expand-label-short{ display:inline; }
}
.sidebar-toggle{display:none; margin-right:4px; align-items:center; justify-content:center; width:32px; height:32px; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface); color:var(--text); font-size:16px; cursor:pointer;}
.mobile-topbar{display:none; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface);}
.mobile-topbar-brand{font-weight:600; font-size:13.5px;}
.sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:25;}
.fatal-banner{
  background:var(--danger-soft); color:var(--danger); font-size:12.5px; font-weight:600;
  padding:7px 20px; border-bottom:1px solid var(--border); text-align:center;
}
.syncing-dot{
  width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; margin-left:6px;
  animation:pulse 1s ease-in-out infinite;
}
/* §9/§10: sin esto, la regla de arriba (display:inline-block, especificidad
   de una sola clase) le gana a la regla nativa del navegador para
   [hidden] (que es de hoja de estilo de usuario, siempre pierde contra
   cualquier regla de autor) — el punto se quedaría visible SIEMPRE, sin
   importar el atributo hidden que setSyncIndicator() prende/apaga. */
.syncing-dot[hidden]{display:none;}
@keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
@media (prefers-reduced-motion: reduce){ .syncing-dot{animation:none;} }

/* ---------- documento comercial: tarjeta en el thread ---------- */
.doc-card{
  display:flex; flex-direction:column; gap:2px; text-align:left; width:100%; max-width:340px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:10px 14px; margin-top:2px; cursor:pointer; transition:border-color .12s ease, box-shadow .12s ease;
}
.doc-card:hover, .doc-card:active{ border-color:var(--accent); box-shadow:var(--shadow); }
.doc-card-title{ font-weight:600; font-size:13.5px; color:var(--text); }
.doc-card-cliente{ font-size:12.5px; color:var(--text-muted); }
.doc-card-total{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--text); margin-top:2px; }
.doc-card-meta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.doc-card-link{ font-size:12px; color:var(--accent); font-weight:600; margin-top:4px; }
.doc-badge{ font-size:12.5px; border:1px solid var(--border); border-radius:999px; padding:4px 10px; white-space:nowrap; }
.doc-new-actions{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
.doc-new-actions .help-cmd-btn{ width:auto; flex:1 1 140px; justify-content:center; }
@media (max-width:520px){ .doc-new-actions{ flex-direction:column; } .doc-new-actions .help-cmd-btn{ width:100%; } }

/* ---------- documento comercial: elección de tipo + formulario ---------- */
.doc-type-choice{ display:flex; flex-direction:column; gap:6px; }
.doc-items-list{ display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
.doc-item-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.doc-item-desc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-item-qty{ color:var(--text-muted); flex-shrink:0; }
.doc-item-price{ width:80px; flex-shrink:0; }
.doc-item-price input{ width:100%; border:1px solid var(--border); border-radius:var(--radius-s); padding:4px 6px; font-size:12.5px; background:var(--surface); }
.doc-item-price.pending input{ border-color:var(--gold); background:var(--gold-soft); }
.doc-pending-note{ font-size:11.5px; color:var(--gold); }
.doc-total-preview{ font-family:var(--font-mono); font-weight:600; font-size:13.5px; border-top:1px solid var(--border); padding-top:6px; margin-top:2px; }

/* ---------- documento comercial: modal de creación (V0.5 §10-18/D10) ----------
   Modal propio (no popover del compositor) porque el formulario ahora
   incluye tax/fee/due-date/terms/PO además de los productos — necesitaba
   una pantalla completa, no 300px flotando sobre el compositor. Misma
   familia visual que .doc-modal/.cierre-modal (overlay oscuro + tarjeta
   centrada), pero más ancho para que Cliente/PO y Terms/Due Date quepan
   en dos columnas sin apretarse. */
.docform-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.docform-modal{
  background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow);
  width:100%; max-width:560px; max-height:90vh; overflow-y:auto;
  display:flex; flex-direction:column;
}
.docform-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  padding:16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0;
  background:var(--surface); z-index:1;
}
.docform-title{ font-size:15px; font-weight:700; color:var(--text); display:flex; flex-direction:column; gap:2px; }
.docform-title-sub{ font-size:11.5px; font-weight:400; color:var(--text-faint); }
.docform-body{ padding:14px 18px 4px; display:flex; flex-direction:column; gap:10px; }
.docform-body label{ font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:3px; }
.docform-body input:not([type="checkbox"]), .docform-body select{
  border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 8px; font-size:13px;
  background:var(--surface); color:var(--text); font:inherit;
}
.docform-check input[type="checkbox"]{ width:16px; height:16px; flex-shrink:0; }
.docform-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
@media (max-width:480px){ .docform-grid{ grid-template-columns:1fr; } }
.docform-section-title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600;
  margin-top:4px; padding-top:8px; border-top:1px dashed var(--border);
}
.docform-check{ flex-direction:row!important; align-items:center; gap:7px!important; font-size:13px!important; color:var(--text)!important; }
.docform-check input{ width:auto; }
.docform-summary{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:10px 12px; display:flex; flex-direction:column; gap:4px;
}
.docform-sum-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted); }
.docform-sum-total{ font-size:14.5px; font-weight:700; color:var(--text); border-top:1px solid var(--border); padding-top:6px; margin-top:2px; }

/* Addendum "One-Click Tax & Fees" §6-§10: Sales Tax y "+ Fee" en una sola
   fila, como dos controles de un toque cada uno. */
.docform-quickrow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.docform-chip{
  display:flex!important; flex-direction:row!important; align-items:center; gap:6px!important;
  font-size:13px!important; color:var(--text-muted)!important; background:var(--surface-2);
  border:1px solid var(--border); border-radius:999px; padding:6px 12px; cursor:pointer; user-select:none;
}
.docform-chip input{ width:auto; }
.docform-chip.on{ color:var(--text)!important; border-color:var(--accent,#4f7cff); background:var(--surface); }
.docform-fee-add{ position:relative; }
.docform-chip-btn{
  font-size:13px; border:1px dashed var(--border); border-radius:999px; padding:6px 12px;
  background:none; color:var(--text-muted); cursor:pointer;
}
.docform-chip-btn:hover{ color:var(--text); border-color:var(--text-muted); }
.docform-fee-menu{
  position:absolute; top:calc(100% + 4px); left:0; z-index:5; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow);
  min-width:160px; overflow:hidden;
}
.docform-fee-menu button{
  text-align:left; padding:8px 12px; font-size:12.5px; border:none; background:none; color:var(--text);
  cursor:pointer;
}
.docform-fee-menu button:hover{ background:var(--surface-2); }
.docform-fee-rows{ display:flex; flex-direction:column; gap:6px; }
.docform-fee-row{ display:grid; grid-template-columns:1fr 60px 90px auto; gap:6px; align-items:center; }
.docform-fee-row input, .docform-fee-row select{
  border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 8px; font-size:12.5px;
  background:var(--surface); color:var(--text); font:inherit;
}
.docform-fee-row .btn-plain{ font-size:16px; line-height:1; padding:2px 6px; }
/* Addendum §4: columnas un poco más anchas que antes en este breakpoint —
   con el input a 16px (regla móvil de arriba, antes zoom-en-iOS), 52px/76px
   quedaba justo para "$"/"999.99". */
@media (max-width:480px){ .docform-fee-row{ grid-template-columns:1fr 58px 84px auto; } }
.docform-actions{
  display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border);
  position:sticky; bottom:0; background:var(--surface);
}
/* Addendum §7: el formulario de documento (modal más grande y con más
   campos de toda la app) pasa de "tarjeta centrada" a pantalla completa en
   móvil — no hay suficiente ancho en un teléfono para un modal flotante con
   márgenes, y un modal flotante angosto obliga a hacer scroll dentro de
   scroll. Se mantiene la MISMA estructura (head sticky arriba, body con
   scroll, actions sticky abajo) — solo deja de estar "flotando" sobre un
   fondo oscuro y pasa a ocupar el viewport completo, respetando el notch/
   home-indicator. */
@media (max-width:640px){
  .docform-overlay{ padding:0; align-items:stretch; }
  .docform-modal{
    max-width:none; width:100vw; height:100vh; height:100dvh; max-height:none;
    border-radius:0;
  }
  .docform-head{ padding-top:calc(16px + var(--safe-top)); padding-left:calc(18px + var(--safe-left)); padding-right:calc(18px + var(--safe-right)); }
  .docform-actions{
    flex-direction:column-reverse; padding-bottom:calc(14px + var(--safe-bottom));
    padding-left:calc(18px + var(--safe-left)); padding-right:calc(18px + var(--safe-right));
  }
  .docform-actions .btn{ width:100%; }
  .docform-body{ padding-left:calc(18px + var(--safe-left)); padding-right:calc(18px + var(--safe-right)); }
}

/* Ajuste explícito del dueño del producto: en desktop el flujo de fotos se
   queda como el popover compacto de siempre; en móvil/PWA pasa a pantalla
   casi completa — mismo breakpoint y mismo criterio que ya usa el modal de
   documento arriba (10-15 miniaturas + nota + progreso + reintentos no
   caben cómodas en un popover angosto con scroll interno). Es EL MISMO
   elemento (.photo-batch-popover, misma función renderPhotoBatchPopover(),
   mismo estado UI.photoBatch) — nunca dos sistemas de upload, solo cambia
   la presentación vía CSS, igual que el modal de documento. */
@media (max-width:640px){
  .photo-batch-popover{
    position:fixed; inset:0; width:100vw; max-width:none; height:100vh; height:100dvh;
    margin:0; border-radius:0; z-index:60;
    padding:calc(16px + var(--safe-top)) calc(18px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(18px + var(--safe-left));
  }
  .photo-batch-grid{ flex:1 1 auto; overflow-y:auto; max-height:none; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); }
  .photo-batch-popover .popover-form{ flex-shrink:0; }
}

/* ---------- documento comercial: modal + "hoja" con look de papel ----------
   La barra de acciones (.doc-modal-top) respeta el tema de la app; la hoja
   (.doc-paper) NO — siempre se ve clara/impresa, igual en modo oscuro,
   porque es exactamente lo que el cliente recibe impreso o en PDF. */
.doc-modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.doc-modal{
  background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow);
  width:100%; max-width:900px; max-height:90vh; overflow-y:auto; padding:16px 16px 0;
  display:flex; flex-direction:column; gap:12px;
}

  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
/* Un objeto Date (ya en hora local) -> "YYYY-MM-DD", sin pasar por UTC. */
function dateOnlyFromDate(d){
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
/* "YYYY-MM-DD" -> Date en medianoche LOCAL (para sumar/restar días con
   setDate). Rechaza formato inválido Y fechas imposibles (ej. 2026-02-30 —
   verificado con un round-trip: si Date "corrige" el día/mes al construir,
   es que no era una fecha real). */
function parseDateOnly(str){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str||"").trim());
  if(!m) return null;
  var y = Number(m[1]), mo = Number(m[2]), day = Number(m[3]);
  if(mo < 1 || mo > 12 || day < 1 || day > 31) return null;
  var d = new Date(y, mo-1, day);
  if(d.getFullYear() !== y || d.getMonth() !== mo-1 || d.getDate() !== day) return null;
  return d;
}
/* Suma/resta días a una fecha calendario en hora local — reemplaza el
   patrón viejo `startOfDay(x); x.setDate(...); isoDate(x)` que terminaba
   convirtiendo a UTC al formatear. */
function addDaysToDateOnly(str, days){
  var d = parseDateOnly(str);
  if(!d) return null;
  d.setDate(d.getDate() + days);
  return dateOnlyFromDate(d);
}
/* Rango humano razonable para una fecha calendario en este CRM. Existe
   específicamente para atrapar el bug de "año 0002": algunos navegadores
   (sobre todo iOS Safari) pueden persistir un <input type="date"> con el
   segmento de año a medio escribir (ej. el usuario tecleó "2" y todavía no
   "2026") como una fecha válida pero absurda. Nunca se guarda una fecha
   fuera de este rango — vacío sigue siendo válido (campo sin definir). */
var DATE_ONLY_MIN_YEAR = 2000, DATE_ONLY_MAX_YEAR = 2100;
var DATE_INPUT_MIN = DATE_ONLY_MIN_YEAR + "-01-01", DATE_INPUT_MAX = DATE_ONLY_MAX_YEAR + "-12-31";
function isSaneDateOnly(str){
  if(!str) return true;
  var d = parseDateOnly(str);
  if(!d) return false;
  var y = d.getFullYear();
  return y >= DATE_ONLY_MIN_YEAR && y <= DATE_ONLY_MAX_YEAR;
}
/* V0.5: Due Date/Valid Until/Atender/Compromiso se guardan como
   "YYYY-MM-DD" puro (sin hora), así que parsearlos con `new Date(iso)`
   (UTC medianoche) puede mostrar el día anterior según la zona horaria del
   navegador. Se arma la fecha en hora LOCAL a partir de sus partes en vez
   de dejar que Date interprete la cadena como UTC. */
function fmtDateOnlyShort(iso){
  if(!iso) return "";
  var d = parseDateOnly(iso);
  if(!d) return fmtDateShort(iso);
  try{ return d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"}); }catch(e){ return iso; }
}
/* ---------------- V0.5 §4: limpieza del timeline ----------------
   La hora/fecha SIGUE guardándose igual en cada fila de bitácora — esto es
   puramente de presentación. dayKey() agrupa eventos por día calendario
   (para el separador "HOY · 1 SEP"); eventShowsTime() decide, por tipo de
   evento, si la hora se muestra discreta junto al evento o se oculta por
   defecto (queda disponible siempre vía el title/tooltip del renglón). */
function dayKey(iso){ try{ return startOfDay(new Date(iso)).toDateString(); }catch(e){ return ""; } }
function fmtDaySeparatorLabel(iso){
  var d = startOfDay(new Date(iso));
  var today = startOfDay(new Date());
  var diffDays = Math.round((today - d) / 86400000);
  var datePart = fmtDateShort(iso).toUpperCase();
  if(diffDays === 0) return "HOY · " + datePart;
  if(diffDays === 1) return "AYER · " + datePart;
  return datePart;
}
function daySeparatorHtml(iso){
  return '<div class="thread-day-sep"><span class="thread-day-sep-line"></span><span class="thread-day-sep-label">' +
    escapeHtml(fmtDaySeparatorLabel(iso)) + '</span><span class="thread-day-sep-line"></span></div>';
}
/* Trazabilidad temporal real (pago, documento, entrega, cierre) muestra
   hora discreta junto al evento; todo lo demás (nota, producto, tarea,
   archivo, ediciones menores de "sistema") la oculta por defecto — el día
   ya lo da el separador, y la hora exacta sigue disponible en el title del
   renglón (ver renderThreadItem). */
function eventShowsTime(ev){
  if(ev.type === "pago" || ev.type === "documento") return true;
  if(ev.type === "sistema" && (ev.kind === "entrega" || ev.kind === "cierre_pagado" || ev.kind === "cierre_cancelado")) return true;
  return false;
}
/* Fusiona una lista ya ordenada cronológicamente de {ts, html} insertando
   un separador de día cada vez que cambia el día calendario — un solo
   helper reutilizado por el thread del ticket y por el historial de la
   ficha de cliente (ambos son, en el fondo, "una lista cronológica de
   eventos"), sin importar si el orden es ascendente o descendente. */
function joinWithDaySeparators(items){
  var out = "", lastDay = null;
  items.forEach(function(m){
    var dk = dayKey(m.ts);
    if(dk !== lastDay){ out += daySeparatorHtml(m.ts); lastDay = dk; }
    out += m.html;
  });
  return out;
}

async function ensureSession(){
  var got = await sb.auth.getSession();
  if(got.data && got.data.session) return got.data.session;
  var signed = await sb.auth.signInAnonymously();
  if(signed.error) throw signed.error;

}

   el arranque de toda la app). */
async function fetchClientes(){
  try{
    var res = await sb.from("clientes").select("*");
    if(res.error) throw res.error;
    return { rows: res.data || [], missing: false };
  }catch(e){

}
function mapClienteRow(row){
  return {

    email: row.email || "", notasComerciales: row.notas_comerciales || "", preautorizado: !!row.preautorizado,
    /* V0.5 §15: atributo vivo del cliente (no es snapshot) — solo se lee al
       ABRIR un documento nuevo para proponer un default de tax; un
       documento ya creado nunca vuelve a leer esto (queda congelado en su
       propio pricing_snapshot). row.tax_exempt puede no existir todavía si
