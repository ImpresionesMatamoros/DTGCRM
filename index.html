<meta charset="utf-8">
<title>Design To Go</title>
<style id="dtg-style">
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#ECE9E0; --surface-3:#E1DDD0;
  --border:#DEDACB; --text:#211F1A; --text-muted:#726C5C; --text-faint:#A39C89;
  --accent:#C4006B; --accent-ink:#8C004C; --accent-soft:#F7DCE9;
  --cyan:#00728F; --cyan-soft:#D9EDF2;
  --gold:#9C6A08; --gold-soft:#F1E3BF;
  --danger:#B3261E; --danger-soft:#F6DCD9;
  --success:#1D7A3C; --success-soft:#DDEFE1; --success-ink:#145C2C;
  --shadow:0 1px 2px rgba(33,31,26,.07),0 8px 24px rgba(33,31,26,.08);
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17161A; --surface:#1D1C21; --surface-2:#232228; --surface-3:#2B2A32;
    --border:#35333B; --text:#EDEBE6; --text-muted:#9A968C; --text-faint:#69655C;
    --accent:#FF4FA0; --accent-ink:#FF86BF; --accent-soft:#3B1E2C;
    --cyan:#3FC3E8; --cyan-soft:#12313B;
    --gold:#E7B23D; --gold-soft:#3A2E12;
    --danger:#FF6B61; --danger-soft:#3A2220;
    --success:#3FD97A; --success-soft:#173321; --success-ink:#8FF0B3;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17161A; --surface:#1D1C21; --surface-2:#232228; --surface-3:#2B2A32;
  --border:#35333B; --text:#EDEBE6; --text-muted:#9A968C; --text-faint:#69655C;
  --accent:#FF4FA0; --accent-ink:#FF86BF; --accent-soft:#3B1E2C;
  --cyan:#3FC3E8; --cyan-soft:#12313B;
  --gold:#E7B23D; --gold-soft:#3A2E12;
  --danger:#FF6B61; --danger-soft:#3A2220;
  --success:#3FD97A; --success-soft:#173321; --success-ink:#8FF0B3;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,select,textarea{font:inherit; color:inherit;}
input,select,textarea{background:transparent;}
button{cursor:pointer;}
::selection{background:var(--accent-soft);}
.app{display:flex; height:100vh; width:100vw;}

/* ---------- sidebar ---------- */
.sidebar{
  width:290px; flex-shrink:0; background:var(--surface-2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100%;
}
.sidebar-top{padding:14px 14px 10px; display:flex; flex-direction:column; gap:8px;}
.brand{
  display:flex; align-items:baseline; gap:6px; padding:2px 2px 6px;
  font-family:var(--font-mono); letter-spacing:.02em;
  background:none; border:none; cursor:pointer; text-align:left; border-radius:var(--radius-s);
}
.brand:hover{ opacity:.75; }
.brand-mark{color:var(--accent); font-weight:600;}
.brand-name{color:var(--text); font-weight:600; font-size:13px;}
.btn{
  border:1px solid transparent; border-radius:var(--radius-s); padding:8px 12px;
  font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:background .12s ease, border-color .12s ease, opacity .12s ease;
}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
.btn-primary{background:var(--accent); color:#fff; justify-content:center;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
.btn-ghost:hover{background:var(--surface-3);}
.btn-plain{background:transparent; border:none; color:var(--text-muted); padding:6px 8px;}
.btn-plain:hover{color:var(--text); background:var(--surface-3); border-radius:var(--radius-s);}
.search-wrap{position:relative;}
.search-wrap input{
  width:100%; padding:8px 10px 8px 30px; border:1px solid var(--border); border-radius:var(--radius-s);
  background:var(--surface); font-size:13px;
}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55;}
.nav-stubs{list-style:none; margin:4px 0 2px; padding:0 6px; display:flex; flex-direction:column; gap:1px;}
.nav-stub{
  display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:var(--radius-s);
  color:var(--text-muted); font-size:13px; background:none; border:none; width:100%; text-align:left;
}
.nav-stub:hover{background:var(--surface-3); color:var(--text);}
.nav-stub.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.nav-stub .tag{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); border:1px solid var(--border); border-radius:999px; padding:1px 6px;}
.sidebar-scroll{flex:1; overflow-y:auto; padding:6px 8px 10px;}
.group-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);
  padding:14px 8px 6px; font-weight:600;
}
.group-label:first-child{padding-top:6px;}
.ticket-row{
  display:flex; flex-direction:column; gap:3px; width:100%; text-align:left; border:none; background:none;
  padding:8px 8px; border-radius:var(--radius-s); position:relative;
}
.ticket-row:hover{background:var(--surface-3);}
.ticket-row.active{background:var(--surface); box-shadow:var(--shadow);}
.ticket-row-top{display:flex; align-items:center; gap:6px; justify-content:space-between;}
.ticket-title{font-weight:600; font-size:13.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ticket-pin{color:var(--gold); flex-shrink:0;}
.ticket-meta{display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:11.5px;}
.pill{
  display:inline-flex; align-items:center; padding:1px 7px; border-radius:999px; font-size:11px;
  font-weight:600; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis;
}
.pill-neutral{background:var(--surface-3); color:var(--text-muted);}
.pill-accent{background:var(--accent-soft); color:var(--accent-ink);}
.empty-list{color:var(--text-faint); font-size:12.5px; padding:16px 10px; text-align:center;}
.whoami-bar{
  border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:8px;
  font-size:12.5px; color:var(--text-muted);
}
.whoami-bar input{
  flex:1; min-width:0; border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 8px;
  background:var(--surface); color:var(--text); font-size:12.5px;
}

/* ---------- sección Clientes ---------- */
.clientes-view{padding:14px 22px 22px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px;}
.clientes-search-wrap{max-width:360px;}
.clientes-search-wrap input{width:100%;}
.clientes-list{display:flex; flex-direction:column; gap:1px;}
.cliente-row-empresa{color:var(--text-muted); font-weight:500;}
/* Identidad de cliente en el encabezado del ticket (secciones 1.8/1.9/5.1):
   el color y la forma distinguen "vinculado a una entidad real" de
   "todavía solo texto libre" sin usar una alerta — un poka-yoke visual,
   nunca un bloqueo (sección 1.9). */
.cliente-chip-row{display:flex;}
.cliente-chip{
  display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:600;
  border-radius:var(--radius-s); padding:3px 8px; margin:0; border:none; max-width:100%;
}
.cliente-chip-linked{
  background:var(--accent-soft); color:var(--accent-ink); cursor:pointer;
  text-decoration:none; border:1px solid transparent;
}
.cliente-chip-linked:hover{ text-decoration:underline; border-color:var(--accent-ink); }
.cliente-chip-empresa{font-weight:500; opacity:.85;}
.cliente-chip-chevron{opacity:.7;}
.cliente-chip-provisional{
  background:transparent; color:var(--text-muted); font-weight:500; font-style:italic;
  border:1px dashed var(--border); cursor:default;
}
.ficha-header{border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:2px;}
.ficha-name{font-size:19px; margin:0 0 8px; color:var(--text);}
.ficha-empresa{color:var(--text-muted); font-weight:500; font-size:15px;}
.ficha-section-title{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600; margin-bottom:6px;}
.ficha-section{display:flex; flex-direction:column; gap:2px;}
.ficha-tabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px;}
.ficha-tab{
  background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px 12px;
  font-size:12.5px; color:var(--text-muted);
}
.ficha-tab:hover{background:var(--surface-3); color:var(--text);}
.ficha-tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.ficha-history-list{display:flex; flex-direction:column; gap:8px;}
.cliente-history-item{border:1px solid var(--border); border-radius:var(--radius-m); padding:8px 10px; background:var(--surface);}
.cliente-history-ticket{border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface); margin-bottom:2px;}
.history-ticket-pill{
  background:none; border:none; color:var(--cyan); font-size:11px; font-weight:600; padding:0 0 4px;
  cursor:pointer;
}
.history-ticket-pill:hover{text-decoration:underline;}
/* Lenguaje de color por tipo de dato dentro de una misma línea (sección 4):
   cantidad/descripción/precio son datos distintos y se ven distintos —
   nunca toda la línea del mismo color — con subrayado/cursor como
   refuerzo no dependiente del color (sección 4.1). */
.hist-producto-line{
  background:none; border:none; padding:0; font:inherit; color:inherit; text-align:left;
  display:block; width:100%; cursor:pointer;
}
button.hist-producto-line:hover{text-decoration:underline; color:var(--accent-ink);}
.hist-cantidad{color:var(--cyan); font-weight:600;}
.hist-desc{color:var(--text);}
.hist-precio{color:var(--gold); font-weight:600;}
.hist-precio:not(.hist-pending){color:#2E7D32;}
:root[data-theme="dark"] .hist-precio:not(.hist-pending){color:#7FD98A;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hist-precio:not(.hist-pending){color:#7FD98A;} }
.hist-total{color:var(--text-muted); font-weight:600;}

/* ---------- main ---------- */
.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%; position:relative;}
.readonly-banner{
  background:var(--gold-soft); color:var(--gold); font-size:12.5px; font-weight:600;
  padding:7px 20px; border-bottom:1px solid var(--border); text-align:center;
}
.empty-state{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--text-muted); text-align:center; padding:20px;
}
.empty-state h1{font-size:17px; color:var(--text); font-weight:600; margin:0;}
.empty-state p{margin:0; max-width:340px; font-size:13.5px;}

.ticket-header{
  border-bottom:1px solid var(--border); padding:14px 22px 10px; background:var(--surface);
  display:flex; flex-direction:column; gap:8px; flex-shrink:0;
}
.ticket-header-top{display:flex; align-items:center; gap:10px; justify-content:space-between;}
.home-header{
  border-bottom:1px solid var(--border); padding:14px 22px; background:var(--surface);
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0;
}
.home-header h1{font-size:15px; margin:0; color:var(--text); font-weight:600;}
.ticket-id{font-family:var(--font-mono); color:var(--text-faint); font-size:12px;}
.ticket-header-actions{display:flex; align-items:center; gap:4px;}
.field-grid{display:flex; flex-wrap:wrap; gap:6px 4px; align-items:center;}
.field{display:flex; align-items:center; gap:6px; min-width:0;}
.field-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); white-space:nowrap;}
.field input[type=text], .field input[type=date], .field select{
  border:1px solid transparent; background:transparent; border-radius:var(--radius-s);
  padding:4px 7px; font-size:13px; color:var(--text); min-width:60px;
}
.field input[type=text]{width:150px;}
.field input:hover, .field select:hover{background:var(--surface-3);}
.field input:focus, .field select:focus{background:var(--surface); border-color:var(--border);}
.field input::placeholder{color:var(--text-faint);}
.totals-line{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono);}
.totals-line .known{color:var(--text); font-weight:600;}
.totals-line .pending{color:var(--gold);}
.totals-link{
  background:none; border:none; padding:4px 2px; margin:-4px 0; font:inherit; color:inherit; cursor:pointer;
  border-bottom:1px dashed var(--text-faint); min-height:28px;
}
.totals-link:hover{border-bottom-color:var(--accent);}
.totals-link.pending{color:var(--gold); border-bottom-color:var(--gold);}

/* ---------- Comanda del ticket (sección 3/4/5) ----------
   "LA CABECERA EXPLICA EL PRESENTE": más jerarquía visual que el
   historial (que sigue chico y denso, sin tocar). */
.status-pill.status-abierto{background:var(--cyan-soft); color:var(--cyan);}
.status-pill.status-entregado{background:var(--success-soft); color:var(--success-ink);}
.status-pill.status-cerrado_pagado{background:var(--surface-3); color:var(--text-muted);}
.status-pill.status-cerrado_cancelado{background:var(--danger-soft); color:var(--danger);}
.ticket-row-inactive .ticket-title{color:var(--text-muted);}

.comanda-meta{font-family:var(--font-mono); color:var(--text-faint); font-size:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.comanda-identity{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.comanda-identity-btn{
  background:none; border:none; padding:0; font:inherit; cursor:pointer; text-align:left;
  font-size:21px; font-weight:700; display:inline-flex; align-items:baseline; gap:5px;
}
/* .comanda-cliente-btn: SOLO cuando hay un cliente real vinculado (distinto
   de .comanda-cliente-plain) — algo se apoya en esta distinción para saber
   si el ticket ya tiene una entidad de cliente real, no solo texto libre. */
.comanda-cliente-btn{color:var(--text);}
.comanda-cliente-btn:hover{color:var(--accent-ink);}
.comanda-cliente-chevron{font-size:15px; color:var(--text-faint); font-weight:500;}
.comanda-cliente-plain{color:var(--text-muted); font-style:italic;}
.comanda-summary{font-size:13px; color:var(--text-muted); margin-top:1px;}
.comanda-actions-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px;}
.btn-success{background:var(--success); color:#fff; font-weight:600; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.15);}
.btn-success:hover{background:var(--success-ink);}
.btn-cierre-secondary{
  background:transparent; border:1px solid var(--border); color:var(--text-muted); font-size:12.5px; padding:7px 12px;
}
.btn-cierre-secondary:hover{background:var(--surface-3); color:var(--text);}
.comanda-entregado-note{font-size:12px; color:var(--text-muted);}
.comanda-entregado-note button{background:none; border:none; padding:0; color:var(--text-faint); text-decoration:underline; cursor:pointer; font:inherit;}
.comanda-cerrado-note{
  font-size:12.5px; color:var(--text-muted); background:var(--surface-2); border-radius:var(--radius-s);
  padding:7px 10px; margin-top:2px;
}
.comanda-cerrado-note b{color:var(--text);}

.comanda-zones{display:flex; gap:18px; flex-wrap:wrap; margin-top:4px;}
.comanda-zone{display:flex; flex-direction:column; gap:3px; min-width:180px; flex:1;}
.comanda-zone-title{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; margin-bottom:1px;}
.comanda-row{
  display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px;
  background:none; border:none; padding:3px 2px; text-align:left; cursor:pointer; color:var(--text); border-radius:var(--radius-s);
}
.comanda-row:hover{background:var(--surface-3);}
.comanda-row-label{color:var(--text-faint); font-size:12px;}
.comanda-row-value{font-weight:600; color:var(--text); text-align:right;}
.comanda-row-value.muted{color:var(--text-faint); font-weight:500; font-style:italic;}
.comanda-row-value.accent{color:var(--accent-ink);}
.comanda-row-value.known{color:var(--text);}
.comanda-row-value.pending{color:var(--gold);}
.comanda-edit-inline{padding:2px; display:flex; align-items:center; gap:6px;}
.comanda-edit-inline .field-label{display:none;}

/* Modal de cierre: chico y centrado, se dispara desde el encabezado (no
   desde el compositor de abajo) — mismo criterio que el visor de doc. */
.cierre-modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
  padding:16px; z-index:60;
}
.cierre-modal{
  background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:18px;
  width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px;
}
.cierre-modal-title{font-size:15px; font-weight:700; color:var(--text);}
.cierre-modal-sub{font-size:12px; color:var(--text-faint); margin-top:-6px;}
.cierre-tipo-btn{
  display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;
  border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 12px; background:var(--surface-2); cursor:pointer;
}
.cierre-tipo-btn:hover{background:var(--surface-3);}
.cierre-tipo-label{font-weight:700; font-size:13.5px; color:var(--text);}
.cierre-tipo-desc{font-size:12px; color:var(--text-muted);}
.cierre-razon-label{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--text-muted);}
.cierre-razon-label textarea{
  font:inherit; font-size:13.5px; border:1px solid var(--border); border-radius:var(--radius-s); padding:8px;
  background:var(--surface); color:var(--text); resize:vertical;
}

.thread{flex:1; overflow-y:auto; padding:16px 22px 8px;}
.thread-item{display:flex; gap:10px; padding:7px 0; max-width:640px;}
.thread-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--text-faint);}
.thread-dot.nota{background:var(--accent);}
.thread-dot.producto{background:var(--cyan);}
.thread-dot.tarea{background:var(--text-faint);}
.thread-dot.tarea_produccion{background:var(--cyan);}
.thread-dot.pago{background:var(--gold);}
.thread-dot.documento{background:var(--accent);}
.thread-dot.archivo{background:var(--text-muted);}
.thread-dot.sistema{background:var(--border);}
.thread-body{min-width:0; flex:1;}
.thread-meta{font-size:11.5px; color:var(--text-faint); margin-bottom:2px;}
.thread-meta .autor{color:var(--text-muted); font-weight:600;}
.thread-text{font-size:13.5px; color:var(--text); white-space:pre-wrap; word-break:break-word;}
.thread-sub{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono); margin-top:1px;}
.thread-img{margin-top:6px; max-width:260px; border-radius:var(--radius-m); border:1px solid var(--border); display:block;}

/* Mensajes efímeros (/help, /estado, /pendientes, /dinero…): viven dentro
   del mismo hilo que las notas/productos/pagos, pero se distinguen a
   propósito — borde punteado, sin punto de color sólido — para que sea
   obvio de un vistazo que esto es una consulta momentánea, no algo
   guardado. */
.thread-dot.ephemeral{background:transparent; border:1.5px dashed var(--text-faint); width:7px; height:7px;}
.ephemeral-item .thread-meta{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.ephemeral-dismiss{font-size:14px; line-height:1; padding:2px 7px;}
.ephemeral-card{
  border:1px dashed var(--border); border-radius:var(--radius-m); background:var(--surface-2);
  padding:10px 12px;
}
.ephemeral-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;}
.ephemeral-row{font-size:12.5px; color:var(--text-muted); margin-bottom:3px;}
.ephemeral-row strong{color:var(--text);}
.ephemeral-sub{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.help-cmd-btn, .help-example-btn{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; box-sizing:border-box;
  border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface); color:var(--text);
  padding:9px 10px; margin-bottom:5px; font-size:12.5px; min-height:36px; cursor:pointer;
}
.help-cmd-btn:hover, .help-example-btn:hover{background:var(--surface-3); border-color:var(--accent);}

  };

async function fetchAllState(){
  var results = await Promise.all([
    sb.from("tickets").select("*"),
    sb.from("productos").select("*"),
    sb.from("tareas").select("*"),
    sb.from("pagos").select("*"),
    sb.from("bitacora").select("*").order("ts", {ascending:true}),
    sb.from("app_settings").select("*"),
    sb.from("documentos").select("*")
  ]);
  for(var i=0;i<results.length;i++){ if(results[i].error) throw results[i].error; }
  var ticketsRows = results[0].data, productosRows = results[1].data, tareasRows = results[2].data,
      pagosRows = results[3].data, bitacoraRows = results[4].data, settingsRows = results[5].data,
      documentosRows = results[6].data;
  var clientesInfo = await fetchClientes();

  var byTicket = {};
  ticketsRows.forEach(function(row){
    byTicket[row.id] = {
      id: row.id, seq: row.seq, createdAt: row.created_at, lastActivityAt: row.last_activity_at,
      pinned: row.pinned, cliente: row.cliente || "", clienteId: row.cliente_id || null, queSigue: row.que_sigue || "",
      responsable: row.responsable || "", fechaAtencion: row.fecha_atencion || "", fechaCompromiso: row.fecha_compromiso || "",
      entregadoAt: row.entregado_at || null, entregadoPor: row.entregado_por || "",
      cierreTipo: row.cierre_tipo || null, cerradoAt: row.cerrado_at || null,
      razonCierre: row.razon_cierre || "", cerradoPor: row.cerrado_por || "",
      productos: [], tareas: [], pagos: [], documentos: [], thread: []
    };
  });
  productosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.productos.push({ id: row.id, desc: row.descripcion, cantidad: row.cantidad==null?1:Number(row.cantidad), precio: row.precio==null?null:Number(row.precio) });
  });
  tareasRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.tareas.push({ id: row.id, desc: row.descripcion, tipo: row.tipo, responsable: row.responsable || "", fechaAtencion: row.fecha_atencion || "", estado: row.estado });
  });
  pagosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.pagos.push({ id: row.id, monto: Number(row.monto), fecha: row.fecha, metodo: row.metodo || "", concepto: row.concepto || "" });
  });
  documentosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.documentos.push({ id: row.id, tipo: row.tipo, numero: row.numero, clienteNombre: row.cliente_nombre || "", notas: row.notas || "", items: row.items || [], total: Number(row.total), cobradoAlCrear: Number(row.cobrado_al_crear||0), billTo: row.bill_to || {}, autor: row.autor, createdAt: row.created_at });
  });
  bitacoraRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    var ev = Object.assign({ id: row.id, type: row.tipo, ts: row.ts, autor: row.autor }, row.payload || {});
    t.thread.push(ev);
  });
  var settings = { queSigueOptions: [], teamNames: [] };
  settingsRows.forEach(function(row){
    if(row.key === "que_sigue_options") settings.queSigueOptions = row.values || [];
    if(row.key === "team_names") settings.teamNames = row.values || [];
  });
  return {
    meta: settings,
    tickets: Object.keys(byTicket).map(function(k){ return byTicket[k]; }),
    clientes: clientesInfo.rows.map(mapClienteRow),
    clientesTableMissing: clientesInfo.missing
  };
}

var refreshInFlight = null;
/* opts.refocus: la próxima vez que esto termine en un render(), el
   compositor debe quedar vacío y enfocado — lo pide cualquier mutación
   disparada desde un comando o desde el botón "+", nunca las
   actualizaciones de fondo (realtime) ni las ediciones directas de campos
   del encabezado. Ver applyFocus(). */
async function refreshFromServer(opts){
  opts = opts || {};
  if(opts.refocus) UI.pendingFocus = UI.pendingFocus || "composer";
  if(refreshInFlight) return refreshInFlight;
  refreshInFlight = (async function(){
    try{
      var fresh = await fetchAllState();
      STATE = fresh;
      if(UI.selectedTicketId && !findTicket(UI.selectedTicketId)) UI.selectedTicketId = null;
      render();
    }catch(e){
      showToast("No se pudo sincronizar: " + (e.message || "error de red"));
    }finally{
      refreshInFlight = null;
    }
  })();
  return refreshInFlight;
}

var realtimeTimer = null;
function scheduleRefresh(){ clearTimeout(realtimeTimer); realtimeTimer = setTimeout(refreshFromServer, 300); }
function subscribeRealtime(){
  var channel = sb.channel("dtg-changes");
  ["tickets","productos","tareas","pagos","bitacora","app_settings","documentos","clientes"].forEach(function(table){
    channel.on("postgres_changes", { event: "*", schema: "public", table: table }, scheduleRefresh);
  });
  channel.subscribe();
}

function computeTotals(t){
  var known = 0, pending = 0;
  (t.productos||[]).forEach(function(p){
    if(p.precio == null || isNaN(p.precio)){ pending++; }
    else { known += (p.cantidad || 1) * Number(p.precio); }
  });
  return { known: known, pending: pending };
}

function bucketFor(t){
  var d = startOfDay(t.lastActivityAt);
  var today = startOfDay(new Date());
  var diff = Math.round((today - d) / 86400000);
  if(diff <= 0) return "Hoy";
  if(diff === 1) return "Ayer";
  if(diff <= 7) return "Últimos días";
  return "Anteriores";
}

function ticketLabel(t){ return t.cliente ? t.cliente : ("Ticket #" + t.seq); }

function matchesSearch(t, q){
  q = q.toLowerCase();
  if(("#" + t.seq).indexOf(q) !== -1) return true;
  if((t.cliente||"").toLowerCase().indexOf(q) !== -1) return true;
  var i;
  for(i=0;i<(t.productos||[]).length;i++){ if((t.productos[i].desc||"").toLowerCase().indexOf(q)!==-1) return true; }
  for(i=0;i<(t.thread||[]).length;i++){
    var ev = t.thread[i];
    if(ev.type==="nota" && (ev.text||"").toLowerCase().indexOf(q)!==-1) return true;
  }
  return false;
}

function estadoLabel(e){
  return e === "en_proceso" ? "En proceso" : (e === "terminado" ? "Terminado" : "Pendiente");

/* Una sola función construye el orden agrupado (fijados + Hoy/Ayer/…) y
   otra aplana ese mismo orden para búsqueda o navegación por teclado — el
   renderer y J/K comparten exactamente el mismo criterio, nunca dos
   ordenamientos que puedan desalinearse. */
function groupedTicketOrder(){
  var tickets = STATE.tickets.slice();
  /* Dentro de cada grupo, primero por estado (abierto < entregado < cerrado
     — sección 6: "entregado se mueve debajo de los activos", cerrado al
     fondo) y solo como desempate por actividad reciente. Nada desaparece,
     solo se hunde dentro de su propio grupo de fecha. */
  function byRankThenActivity(a,b){
    var ra = ticketOrderRank(a), rb = ticketOrderRank(b);
    if(ra !== rb) return ra - rb;
    return new Date(b.lastActivityAt) - new Date(a.lastActivityAt);
  }
  var pinned = tickets.filter(function(t){ return t.pinned; }).sort(byRankThenActivity);
  var rest = tickets.filter(function(t){ return !t.pinned; });
  var groups = {"Hoy":[], "Ayer":[], "Últimos días":[], "Anteriores":[]};
  rest.forEach(function(t){ groups[bucketFor(t)].push(t); });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(byRankThenActivity);
  });
  return { pinned: pinned, groups: groups };
}
function visualTicketOrder(){
  if(UI.search.trim()){
    var q = UI.search.trim();
    var filtered = STATE.tickets.filter(function(t){ return matchesSearch(t, q); });
    filtered.sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
    return filtered;
  }
  var g = groupedTicketOrder();
  var ordered = g.pinned.slice();
  ["Hoy","Ayer","Últimos días","Anteriores"].forEach(function(k){ ordered = ordered.concat(g.groups[k]); });
  return ordered;
}

function renderSidebarList(){
  if(UI.search.trim()){
    var q = UI.search.trim();
    var ordered = visualTicketOrder();
    if(!ordered.length) return '<div class="empty-list">Sin resultados para “' + escapeHtml(q) + '”.</div>';
    return ordered.map(renderTicketRow).join("");
  }
  if(!STATE.tickets.length){
    return '<div class="empty-list">Todavía no hay tickets. Crea el primero arriba.</div>';
  }
  var g = groupedTicketOrder();
  var html = "";
  if(g.pinned.length){
    html += '<div class="group-label">Fijados</div>' + g.pinned.map(renderTicketRow).join("");
  }
  ["Hoy","Ayer","Últimos días","Anteriores"].forEach(function(k){
    if(g.groups[k].length){
      html += '<div class="group-label">' + k + '</div>' + g.groups[k].map(renderTicketRow).join("");
    }
  });
  return html || '<div class="empty-list">Sin resultados.</div>';
}

function renderThreadItem(ev, ticketId){
  var dotClass = ev.type;
  var body = "";
  var meta = (ev.autor ? '<span class="autor">' + escapeHtml(ev.autor) + "</span> · " : "") + fmtTime(ev.ts) + " · " + fmtDateShort(ev.ts);
  if(ev.type === "nota"){
    body = '<div class="thread-text">' + escapeHtml(ev.text).replace(/\n/g,"<br>") + "</div>";
  } else if(ev.type === "sistema"){
    body = '<div class="thread-sub">' + escapeHtml(ev.text) + "</div>";
  } else if(ev.type === "producto"){
    /* El historial nunca se reescribe (sección 3): este renglón sigue
       diciendo exactamente lo que pasó cuando se agregó. Lo nuevo es que
       ahora es clicable — abre el MISMO editor de productos que ya usan
       /productos y los botones "Total conocido"/"pendientes" del
       encabezado, nunca una copia — y usa color como lenguaje funcional
       (sección 4): cantidad en cian, precio en verde o dorado si está
       pendiente, sin que la línea completa comparta un solo color. */
    var cantidadSpan = '<span class="hist-cantidad">' + ev.cantidad + " ×</span>";
    var precioSpan = ev.precio == null
      ? '<span class="hist-precio hist-pending">precio pendiente</span>'
      : '<span class="hist-precio">' + fmtMoney(ev.precio) + " c/u</span> = <span class=\"hist-total\">" + fmtMoney(ev.cantidad*ev.precio) + "</span>";
    var descSpan = '<span class="hist-desc">' + escapeHtml(ev.desc) + "</span>";
    var clickable = ticketId ? (' data-action="show-productos" data-ticket="' + ticketId + '" data-filter="all"') : "";
    var Tag = ticketId ? "button" : "div";
    body = '<' + Tag + ' class="thread-text hist-producto-line"' + clickable + '>Producto agregado</' + Tag + '>' +
      '<div class="thread-sub">' + cantidadSpan + " " + descSpan + " · " + precioSpan + "</div>";
  } else if(ev.type === "tarea" || ev.type === "tarea_produccion"){
    var label = ev.type === "tarea_produccion" ? "Tarea de producción" : "Tarea";
    body = '<div class="thread-text">' + label + ": " + escapeHtml(ev.desc) + "</div>";
    var extra = [];
    if(ev.responsable) extra.push(escapeHtml(ev.responsable));
    if(ev.estado) extra.push(estadoLabel(ev.estado));
    if(ev.fechaAtencion) extra.push("atender " + ev.fechaAtencion);
    if(extra.length) body += '<div class="thread-sub">' + extra.join(" · ") + "</div>";
  } else if(ev.type === "pago"){
    body = '<div class="thread-text">Pago registrado' + (ev.concepto ? " — " + escapeHtml(ev.concepto) : "") + "</div>";
    body += '<div class="thread-sub">' + fmtMoney(ev.monto) + (ev.metodo ? " · " + escapeHtml(ev.metodo) : "") + (ev.fecha ? " · " + ev.fecha : "") + "</div>";
  } else if(ev.type === "archivo"){
    body = '<div class="thread-text">' + (ev.caption ? escapeHtml(ev.caption) : "Archivo adjunto") + "</div>";
    if(ev.storage_path){ body += '<img class="thread-img" data-storage-path="' + escapeHtml(ev.storage_path) + '" alt="' + escapeHtml(ev.filename||"adjunto") + '">'; }
    else { body += '<div class="thread-sub">' + escapeHtml(ev.filename||"") + "</div>"; }
  } else if(ev.type === "documento"){
    var docLabel = ev.tipo === "invoice" ? "Invoice" : "Cotización";
    body =
      '<button class="doc-card" data-action="open-doc" data-id="' + escapeHtml(ev.documento_id||"") + '">' +
        '<div class="doc-card-title">' + docLabel + " #" + escapeHtml(ev.numero||"") + "</div>" +
        (ev.cliente_nombre ? '<div class="doc-card-cliente">' + escapeHtml(ev.cliente_nombre) + "</div>" : "") +
        '<div class="doc-card-total">' + fmtMoney(ev.total) + "</div>" +
        '<div class="doc-card-link">Abrir ' + (ev.tipo==="invoice"?"invoice":"cotización") + " &#8594;</div>" +
      "</button>";
  }
  return (
    '<div class="thread-item">' +
      '<div class="thread-dot ' + dotClass + '"></div>' +
      '<div class="thread-body"><div class="thread-meta">' + meta + "</div>" + body + "</div>" +
    "</div>"
  );
}

/* Nota: la identidad del cliente en el encabezado del ticket (vinculado vs.
   provisional, secciones 1.8/1.9/5.1) ahora vive directamente en

/* OPERACIÓN/identidad como "clic para actuar" en vez de inputs siempre
   visibles (sección 4): un solo campo se revela a la vez, con el mismo
   input/select y el mismo commitHeaderField/commitQueSigue de siempre —
   nunca una segunda lógica de guardado por abrir/cerrar la vista. */
var HEADER_EDIT_FOCUS_EL = { cliente:"field-cliente", quesigue:"field-quesigue", responsable:"field-responsable", atencion:"field-fecha-atencion", compromiso:"field-fecha-compromiso" };
function openHeaderEdit(field){
  UI.headerEditField = field;
  /* Token que cambia en cada apertura: el blur de un input de comanda agenda
     su cierre 150ms después (ver wireEvents), pero si en ese lapso el mismo
     u otro campo se reabre programáticamente (p.ej. el fallback de fecha
     ambigua en applyFocus), ese cierre quedaría "viejo" y borraría la
     reapertura sin que el usuario haya tocado nada. Comparando el token en
     ese momento contra el actual, un cierre viejo simplemente no hace nada. */
  UI.headerEditToken = (UI.headerEditToken||0) + 1;
  UI.pendingFocus = { elId: HEADER_EDIT_FOCUS_EL[field] };
  render();
}
function closeHeaderEdit(){
  if(UI.headerEditField){ UI.headerEditField = null; render(); }
}

/* Resumen corto de trabajo (sección 3.2) — derivado de los productos que ya
   existen, nunca un campo nuevo obligatorio. Sin productos, simplemente no
   hay subtítulo (no se inventa texto). */
function ticketWorkSummary(t){
  if(!t.productos.length) return "";
  var first = t.productos[0];
  var head = ((first.cantidad && first.cantidad !== 1) ? (first.cantidad + " ") : "") + first.desc;
  var rest = t.productos.length - 1;
  return head + (rest > 0 ? " · +" + rest + (rest===1 ? " producto más" : " productos más") : "");
}

/* Fila "clic para actuar" reutilizada por OPERACIÓN y COMERCIAL (sección
   10: "ver algo debe acercarme a actuar sobre ello") — un solo renderer,
   nunca una copia por zona. */
function comandaRow(label, valueHtml, dataAttrs){
  return '<button class="comanda-row" ' + (dataAttrs||"") + '><span class="comanda-row-label">' + label + '</span><span class="comanda-row-value' + "" + '">' + valueHtml + "</span></button>";
}

function renderTicketHeader(t){
  var totals = computeTotals(t);
  var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  var estado = ticketEstado(t);
  var editing = UI.headerEditField;

  /* 3.1 — barra superior chica: folio+fecha+pastilla de estado a la
     izquierda, Documentos/Fijar a la derecha (el "•••" de la sección 3.1
     no agrega nada más que "deshacer entrega", que ya vive junto al botón
     de entrega — no se construye un menú aparte solo para eso). */
  var topBar =
    '<div class="ticket-header-top">' +
      '<div class="comanda-meta"><span class="ticket-id">#' + t.seq + " · creado " + fmtDateShort(t.createdAt) + '</span>' +
        '<span class="pill status-pill status-' + estado + '">' + ticketEstadoLabel(estado) + "</span></div>" +
      '<div class="ticket-header-actions">' +
        '<button class="btn-plain doc-badge" data-action="show-documentos" data-ticket="' + t.id + '">&#128196; Documentos · ' + t.documentos.length + "</button>" +
        '<button class="btn-plain" data-action="toggle-pin" data-id="' + t.id + '" title="' + (t.pinned?"Desfijar":"Fijar") + '">' + (t.pinned?"&#9733; Fijado":"&#9734; Fijar") + "</button>" +
      "</div>" +
    "</div>";

  /* 3.2 — identidad: cliente grande y clicable (o el mismo campo libre
     editable en línea si todavía no está vinculado a un cliente real),
     más el resumen de trabajo derivado de productos. */
  var identityMain;
  if(t.clienteId){
    var c = STATE.clientes.filter(function(x){ return x.id === t.clienteId; })[0];
    identityMain = c
      ? '<button class="comanda-identity-btn comanda-cliente-btn" data-action="open-cliente-ficha" data-client-id="' + c.id + '" data-ticket="' + t.id + '">' +
          escapeHtml(c.nombre) + (c.empresa ? ' <span class="cliente-chip-empresa">· ' + escapeHtml(c.empresa) + "</span>" : "") +
          ' <span class="comanda-cliente-chevron">&rsaquo;</span>' +
        "</button>"
      : "";
  } else if(editing === "cliente"){
    identityMain = '<div class="comanda-edit-inline"><input type="text" id="field-cliente" placeholder="Sin definir" value="' + escapeHtml(t.cliente) + '"></div>';
  } else {
    identityMain = '<button class="comanda-identity-btn comanda-cliente-plain" data-action="header-edit" data-field="cliente">' +
      (t.cliente ? escapeHtml(t.cliente) : "Sin cliente definido") + " <span class=\"comanda-cliente-chevron\">&rsaquo;</span></button>";
  }
  var workSummary = ticketWorkSummary(t);
  var identity =
    '<div class="comanda-identity"><div>' + identityMain +
      (workSummary ? '<div class="comanda-summary">' + escapeHtml(workSummary) + "</div>" : "") +
    "</div></div>";

  /* 6/7 — acciones primaria/secundaria, y el estado ya resuelto (nota de
     entrega o de cierre) cuando aplica. "ENTREGADO NO SIGNIFICA CERRADO":
     el botón de cerrar sigue disponible después de entregar. */
  var actionsRow = "";
  if(estado === "abierto" || estado === "entregado"){
    actionsRow = '<div class="comanda-actions-row">';
    if(estado === "abierto"){
      actionsRow += '<button class="btn btn-success" data-action="marcar-entregado" data-ticket="' + t.id + '">&#10003; Marcar entregado</button>';
    } else {
      actionsRow += '<span class="comanda-entregado-note">Entregado ' + fmtDateShort(t.entregadoAt) + (t.entregadoPor ? " · " + escapeHtml(t.entregadoPor) : "") +
        ' · <button data-action="deshacer-entrega" data-ticket="' + t.id + '">deshacer</button></span>';
    }
    actionsRow += '<button class="btn btn-cierre-secondary" data-action="abrir-cierre">Cerrar ticket &#9662;</button>';
    actionsRow += "</div>";
  } else {
    actionsRow = '<div class="comanda-cerrado-note"><b>' + ticketEstadoLabel(estado) + "</b> · " + fmtDateShort(t.cerradoAt) +
      (t.cerradoPor ? " · " + escapeHtml(t.cerradoPor) : "") +
      (t.razonCierre ? '<div>' + escapeHtml(t.razonCierre) + "</div>" : "") + "</div>";
  }

  /* 4 — OPERACIÓN: clic para actuar, no inputs siempre visibles. Cada fila,
     al abrirse, es EXACTAMENTE el mismo control que ya existía (misma
     commitHeaderField/commitQueSigue) — solo cambia cuándo se muestra. */
  var opRows = "";
  opRows += (editing === "quesigue")
    ? '<div class="comanda-edit-inline">' + renderQueSigueSelect(t) + "</div>"
    : comandaRow("Qué sigue", t.queSigue ? escapeHtml(t.queSigue) + " &rsaquo;" : '<span class="comanda-row-value muted">Sin definir &rsaquo;</span>', 'data-action="header-edit" data-field="quesigue"');
  opRows += (editing === "responsable")
    ? '<div class="comanda-edit-inline"><input type="text" id="field-responsable" list="dtg-team-names" placeholder="Sin asignar" value="' + escapeHtml(t.responsable) + '"></div>'
    : comandaRow("Responsable", t.responsable ? escapeHtml(t.responsable) + " &rsaquo;" : '<span class="comanda-row-value muted">Sin asignar &rsaquo;</span>', 'data-action="header-edit" data-field="responsable"');
  opRows += (editing === "atencion")
    ? '<div class="comanda-edit-inline"><input type="date" id="field-fecha-atencion" value="' + (t.fechaAtencion||"") + '"></div>'
    : comandaRow("Atender", t.fechaAtencion ? fmtDateShort(t.fechaAtencion) + " &rsaquo;" : '<span class="comanda-row-value muted">Sin definir &rsaquo;</span>', 'data-action="header-edit" data-field="atencion"');
  opRows += (editing === "compromiso")
    ? '<div class="comanda-edit-inline"><input type="date" id="field-fecha-compromiso" value="' + (t.fechaCompromiso||"") + '"></div>'
    : comandaRow("Compromiso", t.fechaCompromiso ? fmtDateShort(t.fechaCompromiso) + " &rsaquo;" : '<span class="comanda-row-value muted">Sin definir &rsaquo;</span>', 'data-action="header-edit" data-field="compromiso"');

  /* 5 — COMERCIAL: SOLO hechos ya calculados en otro lado (computeTotals,
     pagos) — jamás una deuda/saldo inventada aquí ("PRECIO ≠ DEUDA"). */
  var comRows = "";
  comRows += t.productos.length
    ? comandaRow("Total conocido", '<span class="comanda-row-value known">' + fmtMoney(totals.known) + "</span> &rsaquo;", 'data-action="show-productos" data-ticket="' + t.id + '" data-filter="all"')
    : comandaRow("Total conocido", '<span class="comanda-row-value muted">Sin productos &rsaquo;</span>', 'data-action="show-productos" data-ticket="' + t.id + '" data-filter="all"');
  comRows += comandaRow("Cobrado", '<span class="comanda-row-value known">' + fmtMoney(cobrado) + "</span> &rsaquo;", 'data-action="show-dinero" data-ticket="' + t.id + '"');
  if(totals.pending){
    comRows += comandaRow("Precio pendiente", '<span class="comanda-row-value pending">' + totals.pending + (totals.pending===1?" pendiente":" pendientes") + "</span> &rsaquo;", 'data-action="show-productos" data-ticket="' + t.id + '" data-filter="pending"');
  }

  return (
    '<div class="ticket-header">' +
      topBar +
      identity +
      actionsRow +
      '<div class="comanda-zones">' +
        '<div class="comanda-zone"><div class="comanda-zone-title">Operación</div>' + opRows + "</div>" +
        '<div class="comanda-zone"><div class="comanda-zone-title">Comercial</div>' + comRows + "</div>" +
      "</div>" +
    "</div>"
  );
}

/* Vista previa en vivo de /producto (sección 6): usa el MISMO parser que
   guarda (parseProductoArg) en modo solo-lectura — nunca hay una segunda
   copia de la lógica para "cómo se ve" vs "qué se guarda". Se actualiza con
   cada tecla directamente sobre el DOM (sin pasar por render()) para no
   perder la posición del cursor a media edición; es puramente ephemeral,
   nunca toca STATE ni Supabase. */
function updateProductoPreview(rawValue){
  var el = document.getElementById("producto-preview");
  if(!el) return;
  var m = rawValue.match(/^\/(producto|product)(\s+(.*))?$/i);
  if(!m || !(m[3] || "").trim()){ el.hidden = true; el.innerHTML = ""; return; }
  var p = parseProductoArg(m[3]);
  if(!p.desc){ el.hidden = true; el.innerHTML = ""; return; }
  var html = '<span class="pv-qty">' + p.cantidad + " ×</span> <span class=\"pv-desc\">" + escapeHtml(p.desc) + "</span>";
  if(p.precio == null){
    html += ' · <span class="pv-pending">precio pendiente</span>';
  } else {
    html += ' · <span class="pv-price">' + fmtMoney(p.precio) + " c/u</span> · <span class=\"pv-total\">Total " + fmtMoney(p.cantidad * p.precio) + "</span>";
  }
  el.innerHTML = html;
  el.hidden = false;
}

/* ---------------- slash commands: UI (autocomplete, ayuda, confirmación, tarjetas efímeras) ----------------
   Todo esto lee del registro COMMANDS (definido más abajo junto a su lógica
   de despacho) — no existe una segunda lista ni un segundo texto de ayuda
   que haya que mantener sincronizado a mano. */

function visibleCommands(hasTicket){
  return COMMANDS.filter(function(c){ return hasTicket || !c.requiresTicket; });
}
function filterCommands(hasTicket, fragment){
  var pool = visibleCommands(hasTicket);
  fragment = (fragment || "").toLowerCase();
  if(!fragment) return pool;
  var byAlias = pool.filter(function(c){
    return c.aliases.some(function(a){ return a.toLowerCase().indexOf(fragment) === 0; });
  });
  if(byAlias.length) return byAlias;
  // Sin coincidencia de alias: solo buscamos también en la descripción si el
  // fragmento ya es específico — con 1-2 letras casi cualquier texto libre
  // "matchea" algo, y eso deja de ser un filtro útil.
  if(fragment.length < 3) return [];
  return pool.filter(function(c){ return c.summary.toLowerCase().indexOf(fragment) !== -1; });
}

function slashMenu(){
  var hasTicket = !!findTicket(UI.selectedTicketId);
  var list = filterCommands(hasTicket, UI.slashQuery);
  if(UI.slashActiveIndex >= list.length) UI.slashActiveIndex = 0;
  var html = '<div class="slash-menu" id="slash-menu">';
  if(!list.length){
    html += '<div class="slash-menu-item" style="color:var(--text-faint);">Sin comandos que coincidan.</div>';
  } else {
    list.forEach(function(c, idx){
      html += '<button class="slash-menu-item' + (idx===UI.slashActiveIndex?" active":"") + '" data-slash-cmd="' + c.aliases[0] + '"><code>/' + c.aliases[0] + '</code><span class="desc">' + escapeHtml(c.summary) + '</span></button>';
    });
  }
  html += "</div>";
  return html;
}

/* Autocomplete predictivo de /cliente (secciones 1.2/6.2/6.3): mismo
   componente visual que el menú de "/" (.slash-menu), mismo rankClientes
   que usa la sección Clientes — nunca un tercer buscador con su propio
   criterio. Vacío después de "/cliente " ya muestra frecuentes, escribir
   filtra en vivo sin esperar Enter. */
function clienteSuggestList(){ return rankClientes(UI.cliSuggestQuery).slice(0, 8); }
function clienteSuggestPopover(){
  var list = clienteSuggestList();
  if(UI.cliSuggestIndex >= list.length) UI.cliSuggestIndex = 0;
  var html = '<div class="slash-menu" id="cli-suggest-menu">';
  if(!list.length){
    html += '<div class="slash-menu-item" style="color:var(--text-faint);">' +
      (STATE.clientes.length ? "Sin coincidencias — Enter para buscar de todos modos." : "Aún no hay clientes registrados.") +
      "</div>";
  } else {
    list.forEach(function(c, idx){
      html += '<button class="slash-menu-item' + (idx===UI.cliSuggestIndex?" active":"") + '" data-cli-suggest-idx="' + idx + '"><code>' + escapeHtml(c.nombre) + '</code><span class="desc">' + (c.empresa ? escapeHtml(c.empresa) : "") + "</span></button>";
    });
  }
  html += "</div>";
  return html;
}
/* execute=true (Enter o clic): resuelve directamente al cliente elegido,
   igual que tocar un resultado de "varias coincidencias" en /cliente.
   execute=false (Tab): solo completa el texto del compositor, sin
   ejecutar — el usuario decide cuándo confirmar. */
function chooseCliSuggestion(idx, execute){
  var list = clienteSuggestList();
  var chosen = list[idx];
  if(!chosen) return;
  UI.cliSuggestOpen = false;
  if(execute){
    var hasTicket = !!findTicket(UI.selectedTicketId);
    pushEphemeral("cliente", hasTicket ? UI.selectedTicketId : null, { mode: hasTicket ? "ticket" : "home", resolvedId: chosen.id });
  } else {
    var text = "/cliente " + chosen.nombre;
    render();
    restoreComposerText(text);
  }
}

/* Contenido de un mensaje efímero de /help — sigue derivando exclusivamente
   del registro COMMANDS (única fuente de verdad para comandos/alias/ayuda),
   pero ahora cada comando y cada ejemplo es un botón: tocarlo escribe el
   texto en el compositor (con el cursor al final) SIN ejecutarlo, para que
   /help sirva a la vez de documentación, menú táctil y atajo de captura
   rápida (sección 4). El detalle de un comando exacto también puede
   completarse tecleando /help <comando>. */

/* Vista editable de productos (sección 7) — un solo renderer parametrizado
   reutilizado por /productos, por "Total conocido" y por "N pendientes de
   precio" en el encabezado (nunca un módulo de productos aparte). Cada
   campo se guarda solo (blur/change) llamando a updateProductoCore, la
   misma función que usaría cualquier otro camino de edición. */
function productoEditRow(t, p){

    '<div class="producto-edit-row">' +
      '<input type="text" class="pe-desc" data-producto-edit="' + p.id + '" data-field="desc" data-ticket="' + t.id + '" value="' + escapeHtml(p.desc) + '">' +
      '<input type="number" class="pe-cant" min="0" step="1" data-producto-edit="' + p.id + '" data-field="cantidad" data-ticket="' + t.id + '" value="' + p.cantidad + '">' +
      '<input type="number" class="pe-precio" min="0" step="0.01" placeholder="pendiente" data-producto-edit="' + p.id + '" data-field="precio" data-ticket="' + t.id + '" value="' + (p.precio==null?"":p.precio) + '">' +
      '<span class="pe-total' + (p.precio==null?" pending":"") + '">' + (p.precio==null ? "pendiente" : fmtMoney(p.cantidad*p.precio)) + "</span>" +
    "</div>"
  );
}
function productosEntryContent(entry){
  var t = entry.ticketId ? findTicket(entry.ticketId) : null;
  if(!t) return { title: "Productos", html: '<div class="ephemeral-sub">Este ticket ya no está disponible.</div>' };
  var onlyPending = !!(entry.params && entry.params.filter === "pending");
  var list = onlyPending ? t.productos.filter(function(p){ return p.precio == null; }) : t.productos;
  var title = (onlyPending ? "Productos pendientes de precio — " : "Productos — ") + ticketLabel(t);
  if(!list.length){
    var msg = onlyPending ? "Ya no hay productos pendientes de precio." : "Este ticket todavía no tiene productos.";
    return { title: title, html: '<div class="ephemeral-sub">' + msg + "</div>" };
  }
  var header = '<div class="producto-edit-row producto-edit-header"><span>Descripción</span><span>Cant.</span><span>Precio u.</span><span>Total</span></div>';
  var rows = list.map(function(p){ return productoEditRow(t, p); }).join("");

  return { title: title, html: header + rows + note };
}

/* ---------------- Documentos (sección 12): badge "Documentos · N" en el

/* ---------------- /cliente (sección 9): contextual — dentro de un ticket
   actúa sobre ese ticket, fuera de un ticket solo consulta. Todo lo que
   aparece aquí sale de STATE.clientes en vivo, igual que el resto de los
   mensajes efímeros. */
function clienteLabel(c){ return c.nombre + (c.empresa ? " · " + c.empresa : ""); }

/* Única función de ranking/orden de clientes (sección 1.2): la usan por
   igual la sección Clientes, /cliente y cualquier otro selector de
   clientes que exista o se agregue — "no crear tres buscadores con
   comportamientos diferentes". Criterio, en este orden:
     1) coincide al inicio del nombre
     2) coincide al inicio de la empresa
     3) coincidencia parcial en el nombre
     4) coincidencia parcial en la empresa
     5) frecuencia de uso / actividad reciente, solo como desempate
   Sin texto de búsqueda, se listan directamente por actividad reciente
   (clientes "frecuentes/relevantes") — nada de esto usa una tabla ni un
   campo nuevo, todo sale de tickets ya existentes vía ticketsForCliente. */
function clienteActivityScore(c){
  var tickets = ticketsForCliente(c);
  var lastTs = 0;
  tickets.forEach(function(t){
    var ts = t.lastActivityAt ? new Date(t.lastActivityAt).getTime() : 0;
    if(ts > lastTs) lastTs = ts;
  });
  return { count: tickets.length, lastTs: lastTs };
}
function compareClienteRelevance(a, b){
  var sa = clienteActivityScore(a), sb = clienteActivityScore(b);
  if(sb.lastTs !== sa.lastTs) return sb.lastTs - sa.lastTs;
  if(sb.count !== sa.count) return sb.count - sa.count;
  return (a.nombre||"").localeCompare(b.nombre||"");
}
function clienteRankTier(c, q){
  var nombre = normalizeWord(c.nombre||"");
  var empresa = normalizeWord(c.empresa||"");
  if(nombre.indexOf(q) === 0) return 1;
  if(empresa.indexOf(q) === 0) return 2;
  if(nombre.indexOf(q) !== -1) return 3;
  if(empresa.indexOf(q) !== -1) return 4;
  return 99;
}
function rankClientes(query){
  var q = normalizeWord((query||"").trim());
  var list = STATE.clientes.slice();
  if(!q) return list.sort(compareClienteRelevance);
  return list
    .filter(function(c){ return clienteRankTier(c, q) < 99; })
    .sort(function(a,b){
      var ta = clienteRankTier(a, q), tb = clienteRankTier(b, q);
      if(ta !== tb) return ta - tb;
      return compareClienteRelevance(a, b);
    });
}
/* Envoltorio delgado sobre rankClientes que conserva el contrato original
   (query vacía = sin resultados) para no tocar el comportamiento de sus
   llamadores existentes (clienteEntryContent con resolvedId, editarcliente). */
function findClienteMatches(query){
  var q = (query || "").trim();
  if(!q) return [];
  return rankClientes(q);
}
function ticketsForCliente(c){
  return STATE.tickets.filter(function(t){ return t.clienteId === c.id; });
}
/* Cierre explícito del ticket (sección 7 de la iteración "Comanda + Entrega
   + Cierre"): fuente ÚNICA de verdad para si un ticket está vivo o
   terminado. Reemplaza al heurístico anterior (ticketIsActivo, que deducía
   "activo" observando qué sigue/tareas/precio pendiente) — ese heurístico
   generaba falsos "cerrados" apenas un ticket se quedaba sin qué-sigue
   aunque el trabajo siguiera vivo. Ahora:
     - "abierto": sin cierre — vive en AHORA, sin importar qué sigue/tareas.
     - "entregado": se marcó entregado pero NO se cerró — sigue en AHORA
       ("entregado no significa cerrado": puede faltar cobrar o admin).
     - "cerrado_pagado" / "cerrado_cancelado": cierre explícito — HISTORIA.
   Qué sigue, tareas y productos sin precio siguen existiendo igual que
   antes; simplemente ya no deciden esto. */
function ticketEstado(t){
  if(t.cierreTipo === "pagado") return "cerrado_pagado";
  if(t.cierreTipo === "cancelado") return "cerrado_cancelado";
  if(t.entregadoAt) return "entregado";
  return "abierto";
}
function ticketEstadoLabel(estado){
  return { abierto: "Abierto", entregado: "Entregado", cerrado_pagado: "Cerrado · Pagado", cerrado_cancelado: "Cerrado · Cancelado" }[estado] || "Abierto";
}
function ticketIsCerrado(t){ return !!t.cierreTipo; }
/* Rango de orden para el sidebar (sección 6: "entregado se mueve debajo de
   los activos") — solo reordena, nunca oculta: abiertos primero, entregados
   sin cerrar después, cerrados al final de su mismo grupo de fecha. */
function ticketOrderRank(t){
  var e = ticketEstado(t);
  if(e === "abierto") return 0;
  if(e === "entregado") return 1;
  return 2; // cerrado_pagado / cerrado_cancelado
}
function clienteFinancials(c){
  var tickets = ticketsForCliente(c);
  var known = 0, cobrado = 0, pend = 0, activos = 0, lastTs = 0;
  tickets.forEach(function(t){
    var totals = computeTotals(t);
    known += totals.known; pend += totals.pending;
    cobrado += t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
    if(!ticketIsCerrado(t)) activos++;
    var ts = t.lastActivityAt ? new Date(t.lastActivityAt).getTime() : 0;
    if(ts > lastTs) lastTs = ts;
  });
  return { tickets: tickets, known: known, cobrado: cobrado, pend: pend, saldo: known - cobrado,
    activos: activos, lastActivityAt: lastTs ? new Date(lastTs).toISOString() : null };
}
function clienteFichaContent(c, t, mode){
  var fin = clienteFinancials(c);
  var lines = [["Cliente", c.nombre]];
  if(c.empresa) lines.push(["Empresa", c.empresa]);
  if(c.telefono) lines.push(["Teléfono", c.telefono]);
  if(c.email) lines.push(["Email", c.email]);
  if(c.notasComerciales) lines.push(["Notas comerciales", c.notasComerciales]);
  lines.push(["Preautorizado", c.preautorizado ? "Sí" : "No"]);
  if(fin.tickets.length){
    lines.push(["Tickets relacionados", fin.tickets.map(ticketLabel).join(", ")]);
    lines.push(["Total conocido (todos sus tickets)", fmtMoney(fin.known) + (fin.pend ? " (+" + fin.pend + " sin precio)" : "")]);
    lines.push(["Cobrado (todos sus tickets)", fmtMoney(fin.cobrado)]);
    lines.push(["Saldo", fmtMoney(fin.saldo)]);
  }
  var html = lines.map(lineRow).join("");
  if(mode === "ticket" && t){
    if(t.clienteId === c.id){
      html += '<div class="ephemeral-sub">Ya vinculado a este ticket.</div>';
    } else {
      html += '<button class="help-cmd-btn" data-action="cliente-link" data-client-id="' + c.id + '" data-ticket="' + t.id + '"><span class="desc">Vincular "' + escapeHtml(c.nombre) + '" a este ticket</span></button>';
    }
  } else {
    /* Fuera de un ticket, /cliente solo consulta (sección 1.10) — el
       resumen efímero siempre ofrece el camino a la ficha completa, que es
       donde vive AHORA/HISTORIA, archivos y documentos. */
    html += '<button class="help-cmd-btn" data-action="open-cliente-ficha" data-client-id="' + c.id + '"><span class="desc">Abrir ficha completa &#8594;</span></button>';
  }
  return { title: clienteLabel(c), html: html };
}
function clienteEntryContent(entry){
  if(STATE.clientesTableMissing){
    return { title: "Clientes", html: '<div class="ephemeral-sub">La función de clientes todavía no está activada — falta aplicar una migración pendiente en Supabase. Mientras tanto, "Cliente" sigue funcionando como texto libre en el encabezado del ticket.</div>' };
  }
  var t = entry.ticketId ? findTicket(entry.ticketId) : null;
  var mode = (entry.params && entry.params.mode) || (t ? "ticket" : "home");
  var query = (entry.params && entry.params.query) || "";
  if(entry.params && entry.params.resolvedId){
    var resolved = STATE.clientes.filter(function(c){ return c.id === entry.params.resolvedId; })[0];
    if(!resolved) return { title: "Cliente", html: '<div class="ephemeral-sub">Ese cliente ya no existe.</div>' };
    return clienteFichaContent(resolved, t, mode);
  }
  if(!query.trim()){
    /* /cliente sin nada después (sección 1.2): en vez de pedir ayuda,
       muestra de inmediato los clientes frecuentes/relevantes — mismo
       rankClientes("") que usa la sección Clientes con el buscador vacío. */
    var frequent = rankClientes("").slice(0, 8);
    if(!frequent.length){
      var emptyHtml = '<div class="ephemeral-sub">Todavía no hay clientes registrados.' +
        (mode === "ticket" ? " Escribe /cliente seguido de un nombre para crear el primero." : "") + "</div>";
      return { title: "Clientes", html: emptyHtml };
    }
    var freqRows = frequent.map(function(c){
      return '<button class="help-cmd-btn" data-action="cliente-select" data-client-id="' + c.id + '" data-ticket="' + (t?t.id:"") + '" data-mode="' + mode + '"><span class="desc">' + escapeHtml(clienteLabel(c)) + "</span></button>";
    }).join("");
    var freqFooter = mode !== "ticket" ? '<button class="help-cmd-btn" data-action="go-clientes"><span class="desc">Ver todos en Clientes &#8594;</span></button>' : "";
    return { title: "Clientes frecuentes", html: freqRows + freqFooter + '<div class="ephemeral-sub">Sigue escribiendo un nombre o empresa para buscar.</div>' };
  }
  var matches = findClienteMatches(query);
  var title = 'Cliente — "' + query + '"';
  if(matches.length === 1) return clienteFichaContent(matches[0], t, mode);
  if(matches.length > 1){
    var rows = matches.map(function(c){
      return '<button class="help-cmd-btn" data-action="cliente-select" data-client-id="' + c.id + '" data-ticket="' + (t?t.id:"") + '" data-mode="' + mode + '"><span class="desc">' + escapeHtml(clienteLabel(c)) + "</span></button>";
    }).join("");
    return { title: title, html: rows + '<div class="ephemeral-sub">Varias coincidencias — toca la correcta.</div>' };
  }
  var html = '<div class="ephemeral-sub">No encontré ningún cliente que coincida con "' + escapeHtml(query) + '".</div>';
  if(mode === "ticket" && t){
    html += '<button class="help-cmd-btn" data-action="cliente-create" data-name="' + escapeHtml(query) + '" data-ticket="' + t.id + '"><span class="desc">+ Crear cliente "' + escapeHtml(query) + '"</span></button>';
  }
  return { title: title, html: html };
}

/* ---------------- /editarcliente (sección 10): siempre confirma antes de
   guardar — nunca sobrescribe en silencio, y muestra "actual → nuevo"
   cuando un valor va a cambiar de verdad. */
function editarClienteEntryContent(entry){
  if(STATE.clientesTableMissing){
    return { title: "Editar cliente", html: '<div class="ephemeral-sub">La función de clientes todavía no está activada — falta aplicar una migración pendiente en Supabase.</div>' };
  }
  var patch = (entry.params && entry.params.patch) || {};
  if(!Object.keys(patch).length){
    return { title: "Editar cliente", html: '<div class="ephemeral-sub">No reconocí ningún dato para actualizar. Ejemplo: /editarcliente Angela telefono 9565612970</div>' };
  }
  var target = null;
  var nameQuery = entry.params && entry.params.nameQuery;
  if(entry.params && entry.params.targetId){
    target = STATE.clientes.filter(function(c){ return c.id === entry.params.targetId; })[0];
  } else if(nameQuery){
    var matches = findClienteMatches(nameQuery);
    if(!matches.length){
      return { title: 'Editar cliente — "' + nameQuery + '"', html: '<div class="ephemeral-sub">No encontré ningún cliente llamado "' + escapeHtml(nameQuery) + '". Usa /cliente para crearlo primero.</div>' };
    }
    if(matches.length > 1){
      var rows = matches.map(function(c){
        return '<button class="help-cmd-btn" data-action="editarcliente-select" data-client-id="' + c.id + '" data-ephemeral-id="' + entry.id + '"><span class="desc">' + escapeHtml(clienteLabel(c)) + "</span></button>";
      }).join("");
      return { title: 'Editar cliente — "' + nameQuery + '"', html: rows + '<div class="ephemeral-sub">Varias coincidencias — toca la correcta para revisar los cambios.</div>' };
    }
    target = matches[0];
  } else {
    return { title: "Editar cliente", html: '<div class="ephemeral-sub">Fuera de un ticket, especifica primero el nombre del cliente, ej. /editarcliente Angela telefono 9565612970.</div>' };
  }
  if(!target) return { title: "Editar cliente", html: '<div class="ephemeral-sub">Ese cliente ya no existe.</div>' };

  var fieldLabels = { nombre:"Cliente", empresa:"Empresa", telefono:"Teléfono", email:"Email", notasComerciales:"Notas comerciales", preautorizado:"Preautorizado" };
  var rows2 = Object.keys(patch).map(function(f){
    var newVal = patch[f];
    var curVal = target[f];
    var newDisplay = f === "preautorizado" ? (newVal ? "Sí" : "No") : newVal;
    var curDisplay = f === "preautorizado" ? (curVal ? "Sí" : "No") : (curVal || "(sin definir)");
    var changed = String(curVal||"") !== String(newVal);
    return '<div class="ephemeral-row"><strong>' + fieldLabels[f] + ":</strong> " +
      (changed ? escapeHtml(String(curDisplay)) + " &rarr; <strong>" + escapeHtml(String(newDisplay)) + "</strong>" : escapeHtml(String(newDisplay)) + " (sin cambio)") +
      "</div>";
  }).join("");
  /* Línea informativa "Cliente: X" para confirmar CUÁL cliente se resolvió
     antes de mostrar los cambios — salvo que "nombre" ya sea uno de los
     campos que cambian, donde esa misma fila ya lo deja claro. */
  var headerLine = patch.nombre === undefined ? '<div class="ephemeral-row"><strong>Cliente:</strong> ' + escapeHtml(target.nombre) + "</div>" : "";
  var html = headerLine + rows2 + '<button class="help-cmd-btn" data-action="editarcliente-confirm" data-client-id="' + target.id + '" data-ephemeral-id="' + entry.id + '"><span class="desc">Guardar cambios de ' + escapeHtml(target.nombre) + "</span></button>";
  return { title: "Confirmar edición — " + clienteLabel(target), html: html };
}

/* ---------------- tarjetas efímeras (/estado, /pendientes, /dinero) ----------------
   Se calculan al vuelo a partir de STATE y nunca se guardan: no generan fila
   en ninguna tabla ni evento en la bitácora, y se recalculan en cada render
   (nunca inventan datos ni duplican lo que ya existe en el hilo). */

function estadoCardLines(t){
  var lines = [];
  lines.push(["Cliente", t.cliente || "—"]);
  lines.push(["Qué sigue", t.queSigue || "—"]);
  if(t.responsable) lines.push(["Responsable", t.responsable]);
  if(t.fechaAtencion) lines.push(["Atender", t.fechaAtencion]);
  if(t.fechaCompromiso) lines.push(["Compromiso", t.fechaCompromiso]);
  if(t.productos.length){
    var totals = computeTotals(t);
    lines.push(["Total", fmtMoney(totals.known) + (totals.pending ? " (+" + totals.pending + " sin precio)" : "")]);
  }
  if(t.pagos.length){
    var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
    lines.push(["Cobrado", fmtMoney(cobrado)]);
  }
  var pend = t.tareas.filter(function(x){ return x.estado !== "terminado"; });
  if(pend.length){
    lines.push(["Tareas pendientes", pend.length + ": " + pend.slice(0,3).map(function(x){ return x.desc; }).join(", ") + (pend.length>3?"…":"")]);
  }
  if(t.documentos.length){
    lines.push(["Documentos", t.documentos.map(function(d){ return d.numero; }).join(", ")]);
  }
  return lines;
}

function pendientesLinesForTicket(t){
  var lines = [];
  var pendTasks = t.tareas.filter(function(x){ return x.estado !== "terminado"; });
  if(pendTasks.length){
    lines.push(["Tareas", pendTasks.map(function(x){ return x.desc + (x.tipo==="produccion" ? " ("+estadoLabel(x.estado)+")" : ""); }).join(" · ")]);
  }
  var pendProd = t.productos.filter(function(p){ return p.precio == null; });
  if(pendProd.length){
    lines.push(["Precios pendientes", pendProd.map(function(p){ return p.desc; }).join(", ")]);
  }
  if(!lines.length) lines.push(["", "Nada pendiente en este ticket."]);
  return lines;
}
function pendientesLinesGlobal(){
  var conQueSigue = STATE.tickets.filter(function(t){ return t.queSigue; })
    .sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
  if(!conQueSigue.length) return [["", 'No hay tickets con "Qué sigue" activo.']];
  return [["Con \"Qué sigue\" activo", conQueSigue.slice(0,8).map(function(t){ return ticketLabel(t) + " (" + t.queSigue + ")"; }).join(" · ")]];
}

function dineroLinesForTicket(t){
  var totals = computeTotals(t);
  var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  var lines = [["Total conocido", fmtMoney(totals.known)]];
  if(totals.pending) lines.push(["Pendientes de precio", totals.pending + " producto(s)"]);
  lines.push(["Cobrado", fmtMoney(cobrado)]);
  lines.push(["Saldo", fmtMoney(totals.known - cobrado)]);
  return lines;
}
function dineroLinesGlobal(){
  var known=0, cobrado=0, pend=0;
  STATE.tickets.forEach(function(t){
    var totals = computeTotals(t);
    known += totals.known; pend += totals.pending;
    cobrado += t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  });
  var lines = [["Total conocido (todos los tickets)", fmtMoney(known)]];
  if(pend) lines.push(["Productos pendientes de precio", pend]);
  lines.push(["Cobrado (todos los tickets)", fmtMoney(cobrado)]);
  lines.push(["Saldo", fmtMoney(known - cobrado)]);
  return lines;
}

/* ---------------- log efímero: consola dentro del hilo, no ventanas flotantes ----------------
   /help, /estado, /pendientes, /dinero (y en el futuro /productos, /cliente…)
   ya no son popovers — quedan anotados en UI.ephemeralLog como entradas
   ligeras ({id, ticketId, kind, ts, params}) y su contenido se recalcula
   EN VIVO a partir de STATE en cada render (nunca se guarda un snapshot),
   así que si algo cambia mientras el mensaje sigue visible, se actualiza
   solo. Nunca se escribe nada en Supabase ni en la bitácora por esto. */

function pushEphemeral(kind, ticketId, params){
  UI.ephemeralLog.push({ id: uid(), ticketId: ticketId || null, kind: kind, ts: new Date().toISOString(), params: params || {} });
  UI.pendingFocus = "composer";
  render();
}
function dismissEphemeral(id){
  UI.ephemeralLog = UI.ephemeralLog.filter(function(e){ return e.id !== id; });
  UI.pendingFocus = "composer";
  render();
}
/* /clear · /limpiar: solo quita los mensajes efímeros de la vista actual
   (los de este ticket, o los globales si estamos en Inicio) — nunca toca
   notas/productos/pagos/tareas/documentos, que son permanentes. */
function clearEphemeralForContext(ticketId){
  var scope = ticketId || null;
  UI.ephemeralLog = UI.ephemeralLog.filter(function(e){ return e.ticketId !== scope; });
}

function lineRow(l){
  return '<div class="ephemeral-row">' + (l[0] ? "<strong>" + escapeHtml(l[0]) + ":</strong> " : "") + escapeHtml(String(l[1])) + "</div>";
}

function renderEphemeralEntry(entry){
  var t = entry.ticketId ? findTicket(entry.ticketId) : null;
  var title, bodyHtml;
  if(entry.kind === "estado"){
    if(!t) return "";
    title = "Estado actual — " + ticketLabel(t);
    bodyHtml = estadoCardLines(t).map(lineRow).join("");
  } else if(entry.kind === "pendientes"){
    title = t ? "Pendientes — " + ticketLabel(t) : "Pendientes (todos los tickets)";
    bodyHtml = (t ? pendientesLinesForTicket(t) : pendientesLinesGlobal()).map(lineRow).join("");
  } else if(entry.kind === "dinero"){
    title = t ? "Dinero — " + ticketLabel(t) : "Dinero (todos los tickets)";
    bodyHtml = (t ? dineroLinesForTicket(t) : dineroLinesGlobal()).map(lineRow).join("");
  } else if(entry.kind === "help"){
    var hc = helpEntryContent(entry);
    title = hc.title;
    bodyHtml = hc.html;
  } else if(entry.kind === "productos"){
    var pc = productosEntryContent(entry);
    title = pc.title;
    bodyHtml = pc.html;
  } else if(entry.kind === "cliente"){
    var clc = clienteEntryContent(entry);
    title = clc.title;
    bodyHtml = clc.html;
  } else if(entry.kind === "editarcliente"){
    var ecc = editarClienteEntryContent(entry);
    title = ecc.title;
    bodyHtml = ecc.html;
  } else if(entry.kind === "documentos"){
    var dc = documentosEntryContent(entry);
    title = dc.title;
    bodyHtml = dc.html;
  } else {
    return "";
  }
  return (
    '<div class="thread-item ephemeral-item">' +
      '<div class="thread-dot ephemeral"></div>' +
      '<div class="thread-body">' +
        '<div class="thread-meta"><span>' + fmtTime(entry.ts) + ' · no se guarda</span>' +
          '<button class="btn-plain ephemeral-dismiss" data-action="dismiss-ephemeral" data-id="' + entry.id + '" title="Quitar">&times;</button>' +
        "</div>" +
        '<div class="ephemeral-card">' +
          '<div class="ephemeral-title">' + escapeHtml(title) + "</div>" +
          bodyHtml +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

/* Fusiona lo permanente (t.thread) con lo efímero de este ticket, ordenado
   por fecha, para que la consola se lea como un solo hilo continuo — igual
   que un chat — en vez de dos zonas separadas. */
function mergedThreadHtml(t){
  var permanent = t.thread.map(function(ev){ return { ts: ev.ts, html: renderThreadItem(ev, t.id) }; });
  var ephemeral = UI.ephemeralLog.filter(function(e){ return e.ticketId === t.id; })
    .map(function(e){ return { ts: e.ts, html: renderEphemeralEntry(e) }; });
  var merged = permanent.concat(ephemeral);
  merged.sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
  return merged.map(function(m){ return m.html; }).join("");
}
/* Mismo criterio para Inicio / Centro de consulta: solo hay mensajes
   efímeros globales (ticketId null) — no hay hilo permanente sin ticket. */
function globalEphemeralHtml(){
  var ephemeral = UI.ephemeralLog.filter(function(e){ return !e.ticketId; })
    .sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
  return ephemeral.map(renderEphemeralEntry).join("");
}

/* ---------------- sección Clientes (vista visual completa) ----------------
   No es un CRM aparte: solo dos vistas nuevas sobre datos que ya existen
   (clientes, tickets, productos, tareas, pagos, documentos, bitácora),
   usando exactamente rankClientes/ticketsForCliente/clienteFinancials/
   ticketIsCerrado/ticketEstado — nada de esto guarda ni lee una tabla nueva. */

function fmtRelativeActivity(iso){
  if(!iso) return "";
  var diff = Date.now() - new Date(iso).getTime();
  var days = Math.floor(diff / 86400000);
  if(days <= 0) return "hoy";
  if(days === 1) return "ayer";
  if(days < 7) return "hace " + days + " días";
  if(days < 30) return "hace " + Math.floor(days/7) + (Math.floor(days/7)===1?" semana":" semanas");
  return "hace " + Math.floor(days/30) + (Math.floor(days/30)===1?" mes":" meses");
}

  return (

/* Un solo consolidado cronológico con filtros simples (sección 1.4) en vez
   de pestañas separadas por tipo — Todo/Tickets/Productos/Documentos/
   Pagos/Archivos son solo un filtro sobre la MISMA lista, nunca datos
   distintos ni copias. Cada evento sale del thread YA existente de cada
   ticket del cliente — nunca se crea un álbum o historial paralelo. */
function clienteHistoryItems(c, filter){
  var fin = clienteFinancials(c);
  var items = [];
  fin.tickets.forEach(function(t){
    if(ticketIsCerrado(t) && (filter === "todo" || filter === "tickets")){
      items.push({ ts: t.lastActivityAt, kind: "ticket", ticket: t });
    }
    if(filter === "todo" || filter === "productos" || filter === "documentos" || filter === "pagos" || filter === "archivos"){
      (t.thread||[]).forEach(function(ev){
        var wantKind = { producto:"productos", documento:"documentos", pago:"pagos", archivo:"archivos" }[ev.type];
        if(!wantKind) return;
        if(filter !== "todo" && filter !== wantKind) return;
        items.push({ ts: ev.ts, kind: ev.type, event: ev, ticket: t });
      });
    }
  });
  items.sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  return items;
}
function renderClienteHistoryItem(item){
  if(item.kind === "ticket"){
    return (
      '<button class="ticket-row cliente-history-ticket" data-action="open-ticket" data-id="' + item.ticket.id + '">' +
        '<div class="ticket-row-top"><span class="ticket-title">' + escapeHtml(ticketLabel(item.ticket)) + "</span></div>" +
        '<div class="ticket-meta"><span>#' + item.ticket.seq + " · " + fmtDateShort(item.ticket.lastActivityAt) + "</span></div>" +
      "</button>"
    );
  }
  return (
    '<div class="cliente-history-item">' +
      '<button class="history-ticket-pill" data-action="open-ticket" data-id="' + item.ticket.id + '">Ticket #' + item.ticket.seq + " &rsaquo;</button>" +
      renderThreadItem(item.event, item.ticket.id) +
    "</div>"
  );
}
var HISTORIA_FILTERS = [["todo","Todo"],["tickets","Tickets"],["productos","Productos"],["documentos","Documentos"],["pagos","Pagos"],["archivos","Archivos"]];

    : '<button class="btn-plain" data-action="go-clientes">&larr; Clientes</button>';
  var infoLines = [];
  if(c.telefono) infoLines.push(["Teléfono", c.telefono]);

  var tabsHtml = HISTORIA_FILTERS.map(function(f){
    return '<button class="ficha-tab' + ((UI.clienteHistoriaFilter||"todo")===f[0]?" active":"") + '" data-action="cliente-historia-filter" data-filter="' + f[0] + '">' + f[1] + "</button>";
  }).join("");

  return (
    '<div class="home-header">' + breadcrumb + "</div>" +
    '<div class="clientes-view ficha-view">' +
