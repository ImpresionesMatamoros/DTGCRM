function render(){
  var app = document.getElementById("app");
  if(FATAL_ERROR){
    app.innerHTML = '<div class="app"><div class="empty-state" style="width:100%;"><h1>No se pudo conectar</h1><p>' + escapeHtml(FATAL_ERROR) + "</p></div></div>";
    return;
  }
  var teamOptions = STATE.meta.teamNames.map(function(n){ return '<option value="' + escapeHtml(n) + '">'; }).join("");
  app.innerHTML =
    '<datalist id="dtg-team-names">' + teamOptions + "</datalist>" +
    '<div class="app">' +
      '<div class="sidebar' + (UI.sidebarOpen?" open":"") + '" id="sidebar">' + renderSidebar() + "</div>" +
      (UI.sidebarOpen ? '<div class="sidebar-backdrop" data-action="close-sidebar"></div>' : "") +
      '<div class="main">' +
        '<div class="mobile-topbar"><button class="sidebar-toggle" data-action="toggle-sidebar" aria-label="Abrir menú">&#9776;</button><span class="mobile-topbar-brand">Design To Go</span></div>' +
        renderMain() +
      "</div>" +
    "</div>" +
    renderDocModal() +
    renderCierreModal() +
    '<div class="toast" id="toast"></div>';
  wireEvents();
  hydrateImages();
  var threadEl = document.getElementById("thread-scroll");
  if(threadEl) threadEl.scrollTop = threadEl.scrollHeight;
  var composerInput = document.getElementById("composer-input");
  if(composerInput){
    updateProductoPreview(composerInput.value);
    composerInput.addEventListener("input", function(){
      var v = composerInput.value;
      document.getElementById("composer-send").disabled = !v.trim();
      composerInput.style.height = "auto";
      composerInput.style.height = Math.min(composerInput.scrollHeight, 120) + "px";
      /* El único overlay que se descarta en cuanto el usuario vuelve a
         escribir o borra el texto es la confirmación pendiente — nunca debe
         quedar "pegada" mostrando algo viejo. Los mensajes efímeros
         (/help, /estado, /pendientes, /dinero) ya no son overlays: viven
         dentro del hilo como una consola y se quedan ahí hasta que se
         cierran uno por uno o con /clear, sin importar lo que se escriba
         después en el compositor. */
      var hadOverlay = !!UI.pendingConfirm;
      UI.pendingConfirm = null;
      var m = v.match(/^\/([a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]*)$/);
      var shouldOpen = !!m;
      var fragment = m ? m[1] : "";
      var menuChanged = (shouldOpen !== !!UI.slashMenuOpen || fragment !== UI.slashQuery);
      if(menuChanged){
        UI.slashMenuOpen = shouldOpen;
        UI.slashQuery = fragment;
        UI.slashActiveIndex = 0;
      }
      /* Autocomplete predictivo del ARGUMENTO de /cliente (secciones 1.2/6.2):
         mismo patrón de interacción que el menú de "/" de arriba (↑/↓/Enter/
         Esc/Tab), pero sobre lo que se escribe después del nombre del
         comando — nunca dos sistemas de autocomplete distintos, solo el
         mismo aplicado a otro momento de la escritura. Se actualiza en cada
         tecla, sin esperar Enter. */
      var argMatch = shouldOpen ? null : v.match(/^\/(cliente|client)\s(.*)$/i);
      var shouldSuggest = !!argMatch;
      var suggestQuery = argMatch ? argMatch[2] : "";
      var suggestChanged = (shouldSuggest !== !!UI.cliSuggestOpen || suggestQuery !== UI.cliSuggestQuery);
      if(suggestChanged){
        UI.cliSuggestOpen = shouldSuggest;
        UI.cliSuggestQuery = suggestQuery;
        UI.cliSuggestIndex = 0;
      }
      if(menuChanged || suggestChanged || hadOverlay){
        render();
        restoreComposerText(v);
      }
      updateProductoPreview(v);
    });
    composerInput.addEventListener("keydown", function(e){
      if(UI.slashMenuOpen){
        var hasTicket = !!findTicket(UI.selectedTicketId);
        var list = filterCommands(hasTicket, UI.slashQuery);
        if(e.key === "ArrowDown"){ e.preventDefault(); if(list.length) UI.slashActiveIndex = (UI.slashActiveIndex+1) % list.length; var v1=composerInput.value; render(); restoreComposerText(v1); return; }
        if(e.key === "ArrowUp"){ e.preventDefault(); if(list.length) UI.slashActiveIndex = (UI.slashActiveIndex-1+list.length) % list.length; var v2=composerInput.value; render(); restoreComposerText(v2); return; }
        if(e.key === "Enter"){
          e.preventDefault();
          UI.slashMenuOpen = false;
          if(!list.length){
            /* Sin coincidencias en el autocomplete: no nos quedamos callados
               — se envía tal cual para que el despachador avise con el
               mensaje de "comando no reconocido", igual que si no hubiera
               menú de por medio. */
            submitNote();
            return;
          }
          /* Si ya se escribió el nombre completo de un comando (sin espacio
             final), Enter lo ejecuta directo en vez de solo autocompletarlo
             — evita que comandos sin argumento (/estado, /help…) necesiten
             dos Enter seguidos para hacer algo. */
          var typed = composerInput.value.trim().slice(1).toLowerCase();
          if(typed && ALIAS_INDEX[typed]){
            var full = composerInput.value.trim();
            composerInput.value = "";
            dispatchCommand(full);
          } else {
            pickSlashCommand(list[UI.slashActiveIndex].aliases[0]);
          }
          return;
        }
        if(e.key === "Escape"){ e.preventDefault(); UI.slashMenuOpen = false; var v3=composerInput.value; render(); restoreComposerText(v3); return; }
        if(e.key === "Tab"){
          /* Dentro del autocomplete de "/", Tab completa el comando
             seleccionado sin ejecutarlo (a diferencia de Enter) — igual que
             cualquier autocomplete de terminal/IDE. */
          e.preventDefault();
          if(list.length) pickSlashCommand(list[UI.slashActiveIndex].aliases[0]);
          return;
        }
      }
      if(UI.cliSuggestOpen){
        var cliList = rankClientes(UI.cliSuggestQuery).slice(0, 8);
        if(e.key === "ArrowDown"){ e.preventDefault(); if(cliList.length) UI.cliSuggestIndex = (UI.cliSuggestIndex+1) % cliList.length; var cv1=composerInput.value; render(); restoreComposerText(cv1); return; }
        if(e.key === "ArrowUp"){ e.preventDefault(); if(cliList.length) UI.cliSuggestIndex = (UI.cliSuggestIndex-1+cliList.length) % cliList.length; var cv2=composerInput.value; render(); restoreComposerText(cv2); return; }
        if(e.key === "Enter"){
          /* A propósito NO ejecuta la sugerencia resaltada: Enter siempre
             corre el comando con el texto que el usuario realmente escribió
             (igual que cualquier otro comando de la app) — así una
             coincidencia exacta como "/cliente Angela" nunca se resuelve
             "sola" al primer sugerido más reciente si hay varios clientes
             parecidos. Elegir una sugerencia puntual es cosa de tocarla,
             o de Tab para completar el texto antes de decidir. */
          e.preventDefault();
          UI.cliSuggestOpen = false;
          submitNote();
          return;
        }
        if(e.key === "Escape"){ e.preventDefault(); UI.cliSuggestOpen = false; var cv3=composerInput.value; render(); restoreComposerText(cv3); return; }
        if(e.key === "Tab"){
          /* Tab acepta la recomendación (completa el texto) sin ejecutar,
             y solo aplica mientras el foco está en el compositor — nunca
             un atajo global (sección 6.3). */
          e.preventDefault();
          if(cliList.length) chooseCliSuggestion(UI.cliSuggestIndex, false);
          return;
        }
      }
      if(UI.pendingConfirm){
        if(e.key === "Enter"){ e.preventDefault(); confirmPendingSlash(); return; }
        if(e.key === "Escape"){ e.preventDefault(); UI.pendingConfirm = null; render(); return; }
      }
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submitNote(); }
    });
  }
  applyFocus();
}

/* Único punto que decide qué se enfoca después de cada render() — el
   helper de foco reutilizable que pide la sección 1: nadie más debe
   llamar a .focus() directamente sobre el compositor o un campo de
   fecha, todos pasan por aquí vía UI.pendingFocus. Prioridad:
   1) un elemento explícito (fallback de fecha no reconocida)
   2) el primer campo dentro de un popover del compositor ya abierto
      (confirmación, ayuda, autocomplete)
   3) el compositor en genérico, vacío y listo para el siguiente comando. */
/* elId -> qué campo de la comanda hay que "revelar" antes de poder
   enfocarlo — desde que esos campos son clic-para-editar (sección 4) ya no
   están siempre en el DOM, así que un fallback como "/atender 15" (fecha
   ambigua) necesita abrir la edición en línea antes de poder enfocar el
   selector de fecha nativo. */
var HEADER_EDIT_FIELD_BY_EL = { "field-cliente":"cliente", "field-quesigue":"quesigue", "field-responsable":"responsable", "field-fecha-atencion":"atencion", "field-fecha-compromiso":"compromiso" };
function applyFocus(){
  var target = UI.pendingFocus;
  UI.pendingFocus = null;
  if(!target) return;
  if(typeof target === "object" && target.elId){
    var wantField = HEADER_EDIT_FIELD_BY_EL[target.elId];
    if(wantField){
      /* Bumpear el token SIEMPRE, incluso si el campo ya estaba "abierto"
         lógicamente: el composer pudo haber robado el foco un instante
         antes (p.ej. al escribir "/compromiso 15"), dejando agendado un
         cierre por blur que de otro modo cerraría este campo 150ms después
         de haberlo vuelto a enfocar aquí — ver comentario en openHeaderEdit. */
      UI.headerEditToken = (UI.headerEditToken||0) + 1;
      if(UI.headerEditField !== wantField){ UI.headerEditField = wantField; render(); }
    }
    var explicit = document.getElementById(target.elId);
    if(explicit){ explicit.focus(); try{ explicit.select(); }catch(e){} return; }
  }
  var popoverField = document.querySelector('#composer-popover input, #composer-popover select, #composer-popover textarea, #composer-popover button');
  if(popoverField){ popoverField.focus(); return; }
  if(target === "composer"){
    var input = document.getElementById("composer-input");
    if(input){
      input.value = "";
      input.style.height = "auto";
      var sendBtn = document.getElementById("composer-send");
      if(sendBtn) sendBtn.disabled = true;
      input.focus();
    }
  }
}

function restoreComposerText(v){
  var el = document.getElementById("composer-input");
  if(!el) return;
  el.value = v;
  el.focus();
  el.selectionStart = el.selectionEnd = v.length;
  var sendBtn = document.getElementById("composer-send");
  if(sendBtn) sendBtn.disabled = !v.trim();
  updateProductoPreview(v);
}

function pickSlashCommand(cmd){
  UI.slashMenuOpen = false;
  render();
  restoreComposerText("/" + cmd + " ");
}

function hydrateImages(){
  var imgs = document.querySelectorAll("img[data-storage-path]");
  imgs.forEach(async function(img){
    var path = img.getAttribute("data-storage-path");
    if(!path) return;
    if(signedUrlCache[path]){ img.src = signedUrlCache[path]; return; }
    try{
      var res = await sb.storage.from(FILES_BUCKET).createSignedUrl(path, 3600);
      if(res.data && res.data.signedUrl){
        signedUrlCache[path] = res.data.signedUrl;
        if(document.body.contains(img)) img.src = res.data.signedUrl;
      }
    }catch(e){ /* leave broken silently, non-critical */ }
  });
}

var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

async function submitNote(){
  var input = document.getElementById("composer-input");
  if(!input) return;
  var text = input.value.trim();
  if(!text) return;
  if(text.charAt(0) === "/"){
    input.value = "";
    UI.slashMenuOpen = false;
    dispatchCommand(text);
    return;
  }
  /* Escribir no significa guardar: solo /nota crea una nota. Texto plano
     nunca modifica nada, ni aquí ni en ningún otro comando. */
  var hasTicket = !!findTicket(UI.selectedTicketId);
  if(hasTicket){
    showToast('Escribir no guarda nada por sí solo — usa "/nota" para agregar una nota, o "/" para ver los comandos.');
  } else {
    showToast('Usa "/" para ver los comandos disponibles (buscar, ticket, ayuda…).');

/* Edición de un producto ya existente (sección 7) — misma tabla, mismo
   bitácora-trace que cualquier otra mutación, así que "editar un producto"
   y "agregar uno nuevo" nunca se sienten como dos sistemas distintos. Solo
   toca la tabla productos: los documentos comerciales ya creados guardan su
   propia fotografía (items) y jamás se leen ni se recalculan desde aquí, así
   que editar un producto del ticket nunca altera una cotización/invoice ya
   emitida. */
async function updateProductoCore(t, productoId, patch){
  var prod = t.productos.filter(function(p){ return p.id === productoId; })[0];
  if(!prod) return;
  Object.assign(prod, patch);
  render();
  try{
    var dbPatch = {};
    if(patch.desc !== undefined) dbPatch.descripcion = patch.desc;
    if(patch.cantidad !== undefined) dbPatch.cantidad = patch.cantidad;
    if("precio" in patch) dbPatch.precio = patch.precio;
    var r1 = await sb.from("productos").update(dbPatch).eq("id", productoId);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Producto editado: " + prod.desc + " — " + (prod.precio==null ? "precio pendiente" : prod.cantidad + " × " + fmtMoney(prod.precio)) } });
  }catch(e){ showToast("No se pudo actualizar el producto: " + (e.message || "error")); }
  refreshFromServer();
}

/* Aplica los cambios ya confirmados por el usuario en /editarcliente
   (nunca se llama antes de esa confirmación explícita). Si el nombre
   cambia, también actualiza tickets.cliente en cualquier ticket vinculado
   para no desincronizar el texto libre que el resto de la app ya lee. */
async function updateClienteCore(clientId, patch, ticketIdForLog){
  var c = STATE.clientes.filter(function(x){ return x.id === clientId; })[0];
  if(!c) return false;
  Object.assign(c, patch);
  render();
  try{
    var dbPatch = {};
    if(patch.nombre !== undefined) dbPatch.nombre = patch.nombre;
    if(patch.empresa !== undefined) dbPatch.empresa = patch.empresa;
    if(patch.telefono !== undefined) dbPatch.telefono = patch.telefono;
    if(patch.email !== undefined) dbPatch.email = patch.email;
    if(patch.notasComerciales !== undefined) dbPatch.notas_comerciales = patch.notasComerciales;
    if(patch.preautorizado !== undefined) dbPatch.preautorizado = patch.preautorizado;
    var r1 = await sb.from("clientes").update(dbPatch).eq("id", clientId);
    if(r1.error) throw r1.error;
    if(patch.nombre !== undefined){
      var linked = STATE.tickets.filter(function(t){ return t.clienteId === clientId; });
      if(linked.length){
        linked.forEach(function(t){ t.cliente = patch.nombre; });
        var r2 = await sb.from("tickets").update({ cliente: patch.nombre }).eq("cliente_id", clientId);
        if(r2.error) throw r2.error;
      }
    }
    if(ticketIdForLog){
      await sb.from("bitacora").insert({ ticket_id: ticketIdForLog, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Cliente editado: " + Object.keys(patch).join(", ") } });
    }
  }catch(e){
    showToast("No se pudo actualizar el cliente: " + (e.message || "error"));
    return false;
  }
  await refreshFromServer({refocus:true});
  return true;
}

  var t = findTicket(UI.selectedTicketId);
  if(!t) return;
  if(kind === "producto"){
    var desc = (document.getElementById("f-desc").value || "").trim();
    if(!desc){ showToast("Descripción requerida."); return; }
    var cantidad = parseFloat(document.getElementById("f-cantidad").value) || 1;
    var precioRaw = document.getElementById("f-precio").value;
    var precio = precioRaw === "" ? null : parseFloat(precioRaw);

  } else if(kind === "tarea" || kind === "tarea_produccion"){
    var tdesc = (document.getElementById("f-desc").value || "").trim();
    if(!tdesc){ showToast("Descripción requerida."); return; }
    var resp = (document.getElementById("f-responsable").value || "").trim();
    var fecha = document.getElementById("f-fecha").value || "";
    var tipo = kind === "tarea_produccion" ? "produccion" : "normal";
    UI.composer = null; render();
    await addTareaCore(t, tipo, tdesc, resp, fecha);
  } else if(kind === "pago"){
    var montoRaw = document.getElementById("f-monto").value;
    var monto = parseFloat(montoRaw);
    if(!montoRaw || isNaN(monto)){ showToast("Ingresa un monto válido."); return; }
    var pfecha = document.getElementById("f-fecha").value || new Date().toISOString().slice(0,10);
    var metodo = document.getElementById("f-metodo").value || "";
    var concepto = (document.getElementById("f-concepto").value || "").trim();
    UI.composer = null; render();
    await addPagoCore(t, monto, pfecha, metodo, concepto);
  } else if(kind === "archivo"){
    var fileInput = document.getElementById("f-file");
    var caption = (document.getElementById("f-caption").value || "").trim();
    var file = fileInput.files && fileInput.files[0];
    if(!file){ showToast("Selecciona una imagen."); return; }
    UI.composer = null; render();
    showToast("Subiendo foto…");
    try{
      var blob = await resizeImageToBlob(file, 1280, 0.8);
      var ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
      var path = t.id + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "." + ext;
      var up = await sb.storage.from(FILES_BUCKET).upload(path, blob, { contentType: "image/jpeg" });
      if(up.error) throw up.error;
      var r7 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "archivo", autor: UI.whoami || null, payload: { storage_path: path, filename: file.name, caption: caption } });
      if(r7.error) throw r7.error;
    }catch(e){ showToast("No se pudo subir la foto: " + (e.message || "error")); }
    refreshFromServer({refocus:true});
  }
}

/* Núcleo compartido de creación de documento — usado por el formulario
   multi-paso (composer "doc_form") Y por los comandos de un solo paso
   /factura y /cotizacion (sección 13/14), para no duplicar la lógica de
   guardado ni el evento de bitácora. Desde la sección 17 ("SNAPSHOT
   HISTÓRICO"), aquí también se congela lo que hace falta para que el
   documento nunca cambie después: cobrado_al_crear (para Amount Due) y
   bill_to (nombre/empresa/teléfono/email tal como estaban en ese momento —
   nunca una referencia en vivo a clientes ni a pagos). Devuelve el id del
   documento creado (o null si falló) para que quien llama pueda abrirlo de
   inmediato (sección 20: "el usuario nunca debería tener que ir a
   buscarlo"). */
async function createDocumentoCore(t, tipo, items, clienteNombre, notas){
  var total = items.reduce(function(sum,it){ return sum + (it.precio==null?0:it.precio*it.cantidad); }, 0);
  var cobradoAlCrear = (t.pagos||[]).reduce(function(s,p){ return s + p.monto; }, 0);
  var linked = t.clienteId ? STATE.clientes.filter(function(c){ return c.id === t.clienteId; })[0] : null;
  var billTo = {
    nombre: clienteNombre || (linked ? linked.nombre : "") || "",
    empresa: (linked && linked.empresa) || null,
    telefono: (linked && linked.telefono) || null,
    email: (linked && linked.email) || null
  };
  showToast("Creando " + (tipo==="invoice"?"invoice":"cotización") + "…");
  var newDocId = null;
  try{
    var ins = await sb.from("documentos").insert({
      ticket_id: t.id, tipo: tipo, cliente_nombre: clienteNombre, notas: notas || null,
      items: items, total: total, cobrado_al_crear: cobradoAlCrear, bill_to: billTo, autor: UI.whoami || null
    }).select().single();
    if(ins.error) throw ins.error;
    var doc = ins.data;
    newDocId = doc.id;
    var r8 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "documento", autor: UI.whoami || null,
      payload: { documento_id: doc.id, tipo: tipo, numero: doc.numero, total: total, cliente_nombre: clienteNombre } });
    if(r8.error) throw r8.error;
  }catch(e){ showToast("No se pudo crear el documento: " + (e.message || "error")); }
  await refreshFromServer({refocus:true});
  return newDocId;
}

async function createDocumento(){
  var t = findTicket(UI.selectedTicketId);
  if(!t || !UI.docDraft) return;
  var clienteEl = document.getElementById("doc-cliente");
  var notasEl = document.getElementById("doc-notas");
  var clienteNombre = (clienteEl && clienteEl.value || "").trim();
  var notas = (notasEl && notasEl.value || "").trim();
  var priceInputs = document.querySelectorAll("[data-doc-item-price]");
  priceInputs.forEach(function(inp){
    var idx = Number(inp.getAttribute("data-doc-item-price"));
    var raw = inp.value;
    UI.docDraft.items[idx].precio = raw === "" ? null : parseFloat(raw);
  });
  var items = UI.docDraft.items;
  var tipo = UI.docDraft.tipo;

  UI.docDraft = null;

  if(newDocId) openDocumentViewer(newDocId, {refocus:true});

/* opts.refocus: usado al abrir automáticamente el documento recién creado
   (sección 20) — el compositor debe seguir listo para lo siguiente en
   cuanto el usuario cierre el visor (foco continuo, sección 12), y como
   render() reemplaza todo el DOM, el pendingFocus tiene que fijarse en el
   MISMO render que abre el visor — si se fijó en un render() anterior
   (como el de refreshFromServer), este nuevo render lo pierde. */
function openDocumentViewer(docId, opts){
  UI.viewingDocId = docId;
  if(opts && opts.refocus) UI.pendingFocus = UI.pendingFocus || "composer";
  render();
}
function closeDocumentViewer(){
  UI.viewingDocId = null;
  /* Volver al ticket debe dejar el compositor listo para lo siguiente
     (sección 12, foco continuo) — más aún ahora que el visor se abre solo
     al crear un documento (sección 20): cerrar "Cerrar ticket" es, en la
     práctica, el último paso de ese flujo. */
  UI.pendingFocus = UI.pendingFocus || "composer";
  render();
}

function findDocumentoById(docId){
  var doc = null;
  for(var i=0;i<STATE.tickets.length && !doc;i++){
    doc = (STATE.tickets[i].documentos||[]).filter(function(d){ return d.id === docId; })[0] || null;
  }
  return doc;
}

/* Estado de cobro de un Invoice — se deriva del snapshot congelado en el
   propio documento (cobrado_al_crear), NUNCA de los pagos en vivo del
   ticket (sección 17: "SNAPSHOT HISTÓRICO" — un Invoice ya creado no
   cambia aunque después llegue un pago nuevo). Solo aplica a invoice: una
   cotización no tiene estado de cobro (no es un documento de cobro). */
function documentAmountDue(doc){ return Math.max(0, doc.total - (doc.cobradoAlCrear||0)); }
function documentPaymentStatus(doc){
  if(doc.tipo !== "invoice") return null;
  var due = doc.total - (doc.cobradoAlCrear||0);
  if(due <= 0.005) return "PAID";
  if((doc.cobradoAlCrear||0) > 0) return "PARTIALLY PAID";
  return "UNPAID";
}

/* ---------------- Rediseño de documento (sección 15) ----------------
   El documento se muestra como una "hoja" (.doc-paper) con look de papel
   fijo — SIEMPRE clara, sin importar el tema claro/oscuro de la app — para
   que se vea igual que lo que el cliente recibirá impreso o en PDF. Las
   acciones (Volver / Imprimir / Descargar PDF) sí respetan el tema de la
   app, viven fuera de la hoja. */
function renderDocModal(){
  var docId = UI.viewingDocId;
  if(!docId) return "";
  var doc = findDocumentoById(docId);
  if(!doc){
    return (
      '<div class="doc-modal-overlay" id="doc-modal-overlay">' +
        '<div class="doc-modal"><div class="doc-modal-top"><button class="doc-modal-back" data-action="close-doc">&#8592; Volver al ticket</button></div>' +
        '<div class="doc-paper"><p>Este documento ya no está disponible.</p></div></div>' +
      "</div>"
    );
  }
  var isInvoice = doc.tipo === "invoice";
  var label = isInvoice ? "INVOICE" : "QUOTE / COTIZACIÓN";
  var status = documentPaymentStatus(doc);
  var bt = doc.billTo || {};
  var btNombre = bt.nombre || doc.clienteNombre || "";

  var rows = (doc.items||[]).map(function(it){
    var pending = it.precio == null;
    var subtotal = pending ? null : it.precio * it.cantidad;
    return (
      "<tr><td>" + escapeHtml(it.desc) + "</td><td class=\"num\">" + it.cantidad + "</td>" +
      "<td class=\"num\">" + (pending ? '<span class="doc-modal-pending">pending</span>' : fmtMoney(it.precio)) + "</td>" +
      "<td class=\"num\">" + (pending ? "—" : fmtMoney(subtotal)) + "</td></tr>"
    );
  }).join("");

  /* BILL TO (sección 15): colapsa con gracia — nunca una etiqueta con un
     valor vacío. Solo aparece el bloque completo si hay al menos un dato. */
  var billToLines = [];
  if(btNombre) billToLines.push(escapeHtml(btNombre));
  if(bt.empresa) billToLines.push(escapeHtml(bt.empresa));
  if(bt.telefono) billToLines.push(escapeHtml(bt.telefono));
  if(bt.email) billToLines.push(escapeHtml(bt.email));
  var billToBlock = billToLines.length
    ? '<div class="doc-billto"><div class="doc-billto-label">Bill To</div>' + billToLines.map(function(l){ return '<div>' + l + "</div>"; }).join("") + "</div>"
    : "";

  /* Resumen financiero: SOLO el invoice tiene Amount Due — es un
     documento de cobro deliberado (sección 5: "PRECIO ≠ DEUDA" en el
     ticket; aquí sí puede existir un saldo, porque es exactamente para
     eso que existe un invoice). La cotización se queda en un Total simple. */
  var summaryBlock;
  if(isInvoice){
    var due = documentAmountDue(doc);
    summaryBlock =
      '<div class="doc-summary">' +
        '<div class="doc-summary-row"><span>Subtotal</span><span>' + fmtMoney(doc.total) + "</span></div>" +
        (doc.cobradoAlCrear > 0 ? '<div class="doc-summary-row"><span>Payments received</span><span>-' + fmtMoney(doc.cobradoAlCrear) + "</span></div>" : "") +
        '<div class="doc-summary-row doc-summary-due"><span>AMOUNT DUE</span><span>' + fmtMoney(due) + "</span></div>" +
      "</div>";
  } else {
    summaryBlock = '<div class="doc-summary"><div class="doc-summary-row doc-summary-due"><span>Total</span><span>' + fmtMoney(doc.total) + "</span></div></div>";
  }

/* ---------------- PDF real descargable, sin librerías externas ----------------
   Arma el archivo PDF byte a byte usando solo los operadores básicos de
   texto y línea del formato PDF (nada que traer de un CDN, así funciona
   también sin internet). Usa Courier/Courier-Bold — ancho fijo por
   carácter — para que alinear la tabla y partir renglones largos sea
   aritmética exacta, sin tener que medir texto con métricas de fuente. */
function pdfPad(ch, n){ return n > 0 ? new Array(n+1).join(ch) : ""; }
function padR(s, n){ s = String(s); return s.length >= n ? s.slice(0, n) : s + pdfPad(" ", n - s.length); }
function padL(s, n){ s = String(s); return s.length >= n ? s.slice(-n) : pdfPad(" ", n - s.length) + s; }
function wrapMonoText(text, width){
  var words = String(text||"").split(/\s+/).filter(Boolean);
  var lines = [], cur = "";
  words.forEach(function(w){
    while(w.length > width){
      if(cur){ lines.push(cur); cur = ""; }
      lines.push(w.slice(0, width));
      w = w.slice(width);
    }
    var candidate = cur ? cur + " " + w : w;
    if(candidate.length > width){ lines.push(cur); cur = w; }
    else cur = candidate;
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [""];
}
/* Un puñado de caracteres Unicode "altos" caen igual dentro de WinAnsiEncoding
   (Windows-1252) en el bloque 0x80-0x9F — sobre todo la raya larga "—" que
   usamos en el pie del documento — así que se remapean a su byte real en
   vez de perderse como "?". Todo lo demás fuera de Latin-1 (emoji, CJK,
   etc., si algún día alguien los escribe en una descripción) sí cae a "?":
   no hay fuente Unicode embebida en este generador mínimo. */
var PDF_WINANSI_HIGH_MAP = { 0x2013:0x96, 0x2014:0x97, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95, 0x2026:0x85 };
function pdfEscapeText(s){
  var out = "";
  for(var i=0;i<String(s).length;i++){
    var c = s.charCodeAt(i);
    var byte = c <= 255 ? c : PDF_WINANSI_HIGH_MAP[c];
    var ch = byte == null ? "?" : String.fromCharCode(byte);
    if(ch === "\\" || ch === "(" || ch === ")") out += "\\" + ch;
    else out += ch;
  }
  return out;
}
function pdfDateLong(iso){
  try{ return new Date(iso).toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric"}); }catch(e){ return ""; }
}
/* Reorganizado para el nuevo diseño (sección 21): mismo motor propio byte a
   byte (Courier/Courier-Bold, sin librería externa — cdnjs está bloqueado
   en este sandbox, ver plan), ahora reflejando BILL TO / status / Subtotal
   · Payments received · AMOUNT DUE / Payment · Notes / pie con la
   identidad completa — nunca contenido en español ni referencias a México. */
function buildDocumentPdfOps(doc){
  var M = 54, PW = 612, PH = 792, RIGHT = PW - M;
  var pages = [], curOps = [], y = PH - M;
  function newPage(){ pages.push(curOps); curOps = []; y = PH - M; }
  function ensure(space){ if(y - space < M) newPage(); }
  function line(str, font, size, opts){
    opts = opts || {};
    if(opts.gray != null) curOps.push({ op:"g", v:opts.gray });
    curOps.push({ op:"t", x: M, y: y, font: font, size: size, str: str });
    if(opts.gray != null) curOps.push({ op:"g", v:0 });
    y -= (opts.leading || (size + 4));
  }
  function rule(){ curOps.push({ op:"l", x1:M, y1:y, x2:RIGHT, y2:y }); y -= 10; }
  function blank(n){ y -= (n||10); }

  var W_DESC=38, W_CANT=7, W_PRECIO=13, W_SUB=15;
  var FULL = W_DESC+W_CANT+W_PRECIO+W_SUB;
  var isInvoice = doc.tipo === "invoice";
  var label = isInvoice ? "INVOICE" : "QUOTE / COTIZACION";
  var status = documentPaymentStatus(doc);
  var bt = doc.billTo || {};
  var btNombre = bt.nombre || doc.clienteNombre || "";

  line(DTG_IDENTITY.name.toUpperCase(), "CB", 20);
  line(DTG_IDENTITY.tagline, "C", 9, { gray:0.45 });
  blank(6);
  line(label + "   No. " + (doc.numero||""), "CB", 13);
  if(status) line("Status: " + status, "CB", 9.5);
  line("Date: " + pdfDateLong(doc.createdAt), "C", 10, { gray:0.25 });
  blank(4);

  var billToLines = [];
  if(btNombre) billToLines.push(btNombre);
  if(bt.empresa) billToLines.push(bt.empresa);
  if(bt.telefono) billToLines.push(bt.telefono);
  if(bt.email) billToLines.push(bt.email);
  if(billToLines.length){
    line("BILL TO", "CB", 9);
    billToLines.forEach(function(l){ line(l, "C", 10); });
    blank(2);
  }

  rule();
  line(padR("DESCRIPTION", W_DESC) + padL("QTY", W_CANT) + padL("RATE", W_PRECIO) + padL("AMOUNT", W_SUB), "CB", 9.5);
  rule();

  (doc.items||[]).forEach(function(it){
    var pending = it.precio == null;
    var subtotal = pending ? null : it.precio * it.cantidad;
    var descLines = wrapMonoText(it.desc, W_DESC);
    ensure(14);
    line(padR(descLines[0], W_DESC) + padL(String(it.cantidad), W_CANT) + padL(pending?"pending":fmtMoney(it.precio), W_PRECIO) + padL(pending?"—":fmtMoney(subtotal), W_SUB), "C", 9.5);
    for(var i=1;i<descLines.length;i++){ ensure(14); line(padR(descLines[i], W_DESC), "C", 9.5); }
  });

  rule();
  ensure(18);
  if(isInvoice){
    line(padR("Subtotal", W_DESC+W_CANT+W_PRECIO) + padL(fmtMoney(doc.total), W_SUB), "C", 10);
    if(doc.cobradoAlCrear > 0) line(padR("Payments received", W_DESC+W_CANT+W_PRECIO) + padL("-" + fmtMoney(doc.cobradoAlCrear), W_SUB), "C", 10);
    line(padR("AMOUNT DUE", W_DESC+W_CANT+W_PRECIO) + padL(fmtMoney(documentAmountDue(doc)), W_SUB), "CB", 12);
  } else {
    line(padR("TOTAL", W_DESC+W_CANT+W_PRECIO) + padL(fmtMoney(doc.total), W_SUB), "CB", 11);
  }

  if(isInvoice){
    blank(10);
    ensure(14);
    line("PAYMENT", "CB", 9);
    DTG_PAYMENT_INFO.forEach(function(p){ line(p.label + ": " + p.value, "C", 9.5); });
    line("Please include Invoice #" + (doc.numero||"") + " in the payment reference.", "C", 8.5, { gray:0.45 });
    blank(6);
    ensure(14);
    line("NOTES", "CB", 9);
    line("Thank you for your business.", "C", 9.5);
    if(doc.notas) wrapMonoText(doc.notas, FULL).forEach(function(l){ ensure(14); line(l, "C", 9.5); });
    line("Please reference Invoice #" + (doc.numero||"") + " when making payment.", "C", 9.5);
  } else if(doc.notas){
    blank(8);
    ensure(14);
    line("Notes:", "CB", 9.5);
    wrapMonoText(doc.notas, FULL).forEach(function(l){ ensure(14); line(l, "C", 9.5); });
  }

  blank(16);
  ensure(14);
  line(DTG_IDENTITY.name + " - " + DTG_IDENTITY.tagline, "C", 8.5, { gray:0.45 });
  line(DTG_IDENTITY.phone + " - " + DTG_IDENTITY.city + " - " + DTG_IDENTITY.serviceArea, "C", 8.5, { gray:0.45 });

  pages.push(curOps);
  return pages;
}
function pdfOpsToContentStream(ops){
  var parts = [];
  ops.forEach(function(o){
    if(o.op === "g") parts.push(o.v.toFixed(2) + " g");
    else if(o.op === "l"){
      parts.push("1 w");
      parts.push(o.x1.toFixed(2) + " " + o.y1.toFixed(2) + " m");
      parts.push(o.x2.toFixed(2) + " " + o.y2.toFixed(2) + " l");
      parts.push("S");
    } else if(o.op === "t"){
      var fontRes = o.font === "CB" ? "/F2" : "/F1";
      parts.push("BT");
      parts.push(fontRes + " " + o.size + " Tf");
      parts.push("1 0 0 1 " + o.x.toFixed(2) + " " + o.y.toFixed(2) + " Tm");
      parts.push("(" + pdfEscapeText(o.str) + ") Tj");
      parts.push("ET");
    }
  });
  return parts.join("\n");
}
function pdfPadOffset(n){ var s = String(n); return pdfPad("0", 10-s.length) + s; }
function buildDocumentPdfBytes(doc){
  var pages = buildDocumentPdfOps(doc);
  var n = pages.length;
  var objects = [];
  var kids = [];
  for(var i=0;i<n;i++) kids.push((5+i*2) + " 0 R");
  objects[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objects[2] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>";
  objects[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>";
  objects[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>";
  for(i=0;i<n;i++){
    var pageObjNum = 5+i*2, contentObjNum = 6+i*2;
    var stream = pdfOpsToContentStream(pages[i]);
    objects[pageObjNum] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + contentObjNum + " 0 R >>";
    objects[contentObjNum] = { stream: stream };
  }
  var out = "%PDF-1.4\n";
  var maxObj = 4 + n*2;
  var offsets = [0];
  for(var num=1; num<=maxObj; num++){
    offsets[num] = out.length;
    var body = objects[num];
    if(body && typeof body === "object" && body.stream != null){
      out += num + " 0 obj\n<< /Length " + body.stream.length + " >>\nstream\n" + body.stream + "\nendstream\nendobj\n";
    } else {
      out += num + " 0 obj\n" + body + "\nendobj\n";
    }
  }
  var xrefStart = out.length;
  out += "xref\n0 " + (maxObj+1) + "\n0000000000 65535 f \n";
  for(num=1; num<=maxObj; num++) out += pdfPadOffset(offsets[num]) + " 00000 n \n";
  out += "trailer\n<< /Size " + (maxObj+1) + " /Root 1 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF";
  return out;
}
function downloadDocumentPdf(docId){
  var doc = findDocumentoById(docId);
  if(!doc) return;
  var bstr = buildDocumentPdfBytes(doc);
  var bytes = new Uint8Array(bstr.length);
  for(var i=0;i<bstr.length;i++) bytes[i] = bstr.charCodeAt(i) & 0xFF;
  var blob = new Blob([bytes], { type: "application/pdf" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = (doc.tipo==="invoice"?"Invoice-":"Cotizacion-") + (doc.numero||doc.id) + ".pdf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function resizeImageToBlob(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error("No se pudo procesar la imagen")); }, "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function toggleTaskEstado(ticketId, taskId){

  var task = t.tareas.filter(function(x){ return x.id===taskId; })[0];
  if(!task) return;
  var order = ["pendiente","en_proceso","terminado"];

}

/* ---------------- Entrega y cierre (sección 6/7 de la iteración "Comanda")
   ----------------
   Dos operaciones centrales, cada una con un único camino de guardado —
   los tres caminos posibles de la UI (botón grande del encabezado, menú
   "•••", y en el futuro un comando) siempre llaman a estas mismas
   funciones (sección 11: redundancia en los caminos, no en la lógica).
   "ENTREGADO NO SIGNIFICA CERRADO": marcarEntregadoCore nunca toca
   cierre_tipo. "PRECIO ≠ DEUDA": ninguna de estas funciones calcula ni
   guarda un saldo/deuda — solo registran hechos (se entregó, se cerró). */
async function marcarEntregadoCore(t){
  if(!t || t.entregadoAt) return;
  var now = new Date().toISOString();
  t.entregadoAt = now; t.entregadoPor = UI.whoami || "";
  render();
  try{
    var r1 = await sb.from("tickets").update({ entregado_at: now, entregado_por: UI.whoami || null }).eq("id", t.id);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Marcado como entregado" } });
  }catch(e){ showToast("No se pudo marcar como entregado: " + (e.message || "error")); }
  refreshFromServer();
}

/* Cierre explícito — exige tipo + motivo, nunca se infiere. Una vez cerrado,
   el ticket pasa a HISTORIA (ticketIsCerrado) en Clientes; el sidebar solo
   lo hunde al fondo de su grupo de fecha, nunca lo oculta. */
async function cerrarTicketCore(t, tipo, razon){
  if(!t || (tipo !== "pagado" && tipo !== "cancelado") || !(razon||"").trim()) return;
  var now = new Date().toISOString();
  razon = razon.trim();
  t.cierreTipo = tipo; t.cerradoAt = now; t.razonCierre = razon; t.cerradoPor = UI.whoami || "";
  UI.composer = null; UI.cierreDraft = null;
  render();
  try{
    var r1 = await sb.from("tickets").update({ cierre_tipo: tipo, cerrado_at: now, razon_cierre: razon, cerrado_por: UI.whoami || null }).eq("id", t.id);
    if(r1.error) throw r1.error;
    await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "sistema", autor: UI.whoami || null,

/* ---------------- slash commands: parsing y ejecución ----------------
   Sintaxis pequeña y predecible a propósito — no lenguaje natural. Las
   tres rutas (botón +, /comando, escribir el comando completo) llaman
   siempre a las mismas funciones core de arriba. */

function parseSlashCommand(raw){
  var body = raw.slice(1); // quita el "/"
  var firstSpace = body.indexOf(" ");
  var cmd = (firstSpace === -1 ? body : body.slice(0, firstSpace)).toLowerCase().trim();
  var arg = (firstSpace === -1 ? "" : body.slice(firstSpace + 1)).trim();
  return { cmd: cmd, arg: arg };
}

/* Parser de /producto — sintaxis humana y flexible a propósito (sección 5):
   /producto [cantidad opcional] [descripción] [precio opcional]
   Se usa TAL CUAL, sin ninguna copia, tanto para guardar (COMMANDS
   "producto") como para la vista previa en vivo mientras se escribe (ver
   productoPreviewLine) — un solo parser, nunca dos que puedan desincronizarse.

   Orden de prioridad para detectar el precio (de mayor a menor, se detiene
   en el primero que aplique — nunca se inventa un precio que no esté
   explícito en el texto):
     1) "sin precio" / "no price" en cualquier parte -> precio pendiente,
        sin importar qué números haya alrededor (escape explícito).
     2) "... total <n>" al final -> <n> es el TOTAL; precio unitario = total/cantidad.
     3) "... precio <n>" / "... price <n>" al final -> <n> es el precio unitario.
     4) "...$<n>" / "...$ <n>" al final -> <n> es el precio unitario.
     5) "...<n>dlls|dls|dolares|dólares" (con o sin espacio) al final -> <n> es el precio unitario.
     6) Si después de quitar la cantidad el ÚLTIMO token de todo lo que
        queda es puramente numérico, se toma como precio unitario (ej.
        "banner 50"). Si no, el precio queda pendiente — nunca se asume $0. */
function parseProductoArg(arg){
  var tokens = (arg || "").trim().split(/\s+/).filter(Boolean);
  var cantidad = 1;
  if(tokens.length > 1 && /^\d+(?:\.\d+)?$/.test(tokens[0])){
    cantidad = parseFloat(tokens.shift());
  }
  var rest = tokens.join(" ");

  var sinPrecioRe = /\s*\b(?:sin\s+precio|no\s+price)\b\s*/i;
  if(sinPrecioRe.test(rest)){
    return { desc: rest.replace(sinPrecioRe, " ").trim(), cantidad: cantidad, precio: null, total: null };
  }

  var mTotal = rest.match(/^(.*?)\btotal\s+(\d+(?:\.\d+)?)\s*$/i);
  if(mTotal){
    var total = parseFloat(mTotal[2]);
    return { desc: mTotal[1].trim(), cantidad: cantidad, precio: cantidad ? (total / cantidad) : null, total: total };
  }

  var mPrecioKw = rest.match(/^(.*?)\b(?:precio|price)\s+(\d+(?:\.\d+)?)\s*$/i);
  if(mPrecioKw){
    return { desc: mPrecioKw[1].trim(), cantidad: cantidad, precio: parseFloat(mPrecioKw[2]), total: null };
  }

  var mDollar = rest.match(/^(.*?)\$\s*(\d+(?:\.\d+)?)\s*$/);
  if(mDollar){
    return { desc: mDollar[1].trim(), cantidad: cantidad, precio: parseFloat(mDollar[2]), total: null };
  }

  var mUnidad = rest.match(/^(.*?[^\d])?(\d+(?:\.\d+)?)\s*(?:dlls|dls|dolares|d[oó]lares)\s*$/i);
  if(mUnidad){
    return { desc: (mUnidad[1]||"").trim(), cantidad: cantidad, precio: parseFloat(mUnidad[2]), total: null };
  }

  var restTokens = rest.split(/\s+/).filter(Boolean);
  if(restTokens.length > 1 && /^\d+(?:\.\d+)?$/.test(restTokens[restTokens.length-1])){
    return { desc: restTokens.slice(0,-1).join(" "), cantidad: cantidad, precio: parseFloat(restTokens[restTokens.length-1]), total: null };
  }

  return { desc: rest.trim(), cantidad: cantidad, precio: null, total: null };
}

function parsePagoArg(arg){
  var m = arg.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m) return null;
  return { monto: parseFloat(m[1]), concepto: (m[2]||"").trim() };
}

/* /factura y /cotizacion (sección 13/14): crean el documento comercial
   completo en un solo paso, reutilizando tal cual los productos y el
   cliente que ya están en el ticket — sin abrir el formulario de varios
   pasos. Todo el texto que sigue al comando (opcional) se guarda como
   notas del documento, ej. "/factura pagado por transferencia". Nunca
   inventa un precio: si algún producto todavía no tiene precio, se pide
   resolverlo primero con /productos en vez de facturar/cotizar con huecos. */
function parseDocCommand(arg, ctx, tipo){
  var t = ctx.ticket;
  var tipoLabel = tipo === "invoice" ? "un invoice" : "una cotización";
  if(!t.productos.length) return { ok:false, error: "Agrega al menos un producto antes de crear " + tipoLabel + ", ej. /producto banner 50" };
  var pending = t.productos.filter(function(p){ return p.precio == null; });
  if(pending.length) return { ok:false, error: "Hay " + pending.length + (pending.length===1?" producto":" productos") + " sin precio — resuélvelo con /productos antes de crear " + tipoLabel };
  var items = t.productos.map(function(p){ return { desc: p.desc, cantidad: p.cantidad, precio: p.precio }; });
  var total = items.reduce(function(s,it){ return s + it.cantidad*it.precio; }, 0);
  return { ok:true, data: { tipo: tipo, items: items, total: total, clienteNombre: t.cliente || "", notas: (arg||"").trim() } };
}
function docConfirmSummary(data){
  return (data.clienteNombre ? escapeHtml(data.clienteNombre) + " — " : "") +
    data.items.length + (data.items.length===1?" producto":" productos") + " · " + fmtMoney(data.total) +
    (data.notas ? " · " + escapeHtml(data.notas) : "");
}

/* Parser de /editarcliente (sección 10) — sintaxis pequeña y predecible,
   nunca lenguaje natural genérico. Dos modos, nunca mezclados:
     1) Forma con palabra clave en cualquier parte del texto ("telefono",
        "email", "empresa", "nombre", "notas", "preautorizado") — todo lo
        que sigue a la palabra clave es el valor de ESE campo. Si hay texto
        antes de la palabra clave y todavía no hay un cliente resuelto por
        contexto (ticket con cliente vinculado), ese texto es el nombre a
        buscar (ej. "/editarcliente Angela telefono 9565612970").
     2) Sin ninguna palabra clave — detección automática por formato: un
        correo (por su forma), un teléfono (una racha de 7+ dígitos, con o
        sin separadores), la primera palabra restante como nombre a buscar
        (si hace falta) y lo que sobra como empresa propuesta.
   Nunca inventa ni sobrescribe un campo que no aparece explícito en el
   texto — el resultado son solo los campos detectados, listos para
   mostrarse en confirmación antes de guardar nada. */
function normalizeWord(w){
  return (w||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}
var CLIENTE_FIELD_KEYWORDS = {
  telefono: "telefono", phone: "telefono",
  email: "email", correo: "email",
  empresa: "empresa", company: "empresa",
  nombre: "nombre", name: "nombre",
  notas: "notasComerciales", notes: "notasComerciales",
  preautorizado: "preautorizado", preauthorized: "preautorizado"
};
function formatPhoneDigits(digits){
  if(digits.length === 10) return digits.slice(0,3) + "-" + digits.slice(3,6) + "-" + digits.slice(6);
  return digits;
}
function parseEditarClienteArg(arg){
  var tokens = (arg||"").trim().split(/\s+/).filter(Boolean);
  var kwIndex = -1, kwField = null;
  for(var i=0;i<tokens.length;i++){
    var f = CLIENTE_FIELD_KEYWORDS[normalizeWord(tokens[i])];
    if(f){ kwIndex = i; kwField = f; break; }
  }
  var patch = {}, nameQuery = null;
  if(kwField){
    var before = tokens.slice(0, kwIndex).join(" ").trim();
    var value = tokens.slice(kwIndex+1).join(" ").trim();
    if(kwField === "telefono"){
      var digits = value.replace(/\D/g, "");
      patch.telefono = digits.length >= 7 ? formatPhoneDigits(digits) : value;
    } else if(kwField === "preautorizado"){
      var v = normalizeWord(value);
      patch.preautorizado = (v === "si" || v === "true" || v === "yes" || v === "1");
    } else if(value){
      patch[kwField] = value;
    }
    /* Si hay texto ANTES de la palabra clave, es explícitamente el nombre
       del cliente a buscar (ej. "Angela telefono 9565612970") y siempre
       gana sobre cualquier cliente ya vinculado por contexto. Sin texto
       antes ("telefono 9565612970" a secas), no hay nombre explícito: el
       llamador decide si cae al cliente vinculado del ticket actual. */
    if(before) nameQuery = before;
    return { nameQuery: nameQuery, patch: patch };
  }

  var rest = (arg||"").trim();
  var emailMatch = rest.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/);
  if(emailMatch){
    patch.email = emailMatch[0];
    rest = (rest.slice(0, emailMatch.index) + " " + rest.slice(emailMatch.index + emailMatch[0].length)).replace(/\s+/g, " ").trim();
  }
  var phoneMatch = rest.match(/(\+?\d[\d\-.\s]{5,}\d)/);
  if(phoneMatch){
    var digits2 = phoneMatch[0].replace(/\D/g, "");
    if(digits2.length >= 7){
      patch.telefono = formatPhoneDigits(digits2);
      rest = (rest.slice(0, phoneMatch.index) + " " + rest.slice(phoneMatch.index + phoneMatch[0].length)).replace(/\s+/g, " ").trim();
    }
  }
  /* Sin palabra clave, la PRIMERA palabra que sobra es siempre el nombre a
     buscar (ej. "Angela Top Builders 9565612970 ..." -> nombre "Angela",
     el resto se propone como empresa) — igual gana sobre un cliente ya
     vinculado por contexto si el texto trae un nombre explícito. */
  var restTokens = rest.split(/\s+/).filter(Boolean);
  if(restTokens.length) nameQuery = restTokens.shift();
  var empresa = restTokens.join(" ").trim();
  if(empresa) patch.empresa = empresa;
  return { nameQuery: nameQuery, patch: patch };
}

/* ---------------- fecha humana: un solo parser reutilizable ----------------
   Distingue tres resultados a propósito: "confident" (se puede guardar tal
   cual), "ambiguous" y "unrecognized" (nunca se guarda nada en estos dos
   últimos casos — el comando que llama cae de vuelta al selector de fecha
   que ya existe en el encabezado del ticket, en vez de adivinar). */

var WEEKDAY_NAMES = {
  domingo:0, dom:0, sunday:0, sun:0,
  lunes:1, lun:1, monday:1, mon:1,
  martes:2, mar:2, tuesday:2, tue:2,
  miercoles:3, "miércoles":3, mie:3, wednesday:3, wed:3,
  jueves:4, jue:4, thursday:4, thu:4,
  viernes:5, vie:5, friday:5, fri:5,
  sabado:6, "sábado":6, sab:6, saturday:6, sat:6
};

function parseHumanDate(raw, now){
  now = now || new Date();
  var text = (raw || "").trim().toLowerCase();
  if(!text) return { status: "unrecognized" };

  if(text === "hoy" || text === "today"){
    return { status: "confident", date: startOfDay(now) };
  }
  if(text === "mañana" || text === "manana" || text === "tomorrow"){
    var d0 = startOfDay(now); d0.setDate(d0.getDate()+1);
    return { status: "confident", date: d0 };
  }

  var mSlash = text.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
  if(mSlash){
    var day = parseInt(mSlash[1],10), month = parseInt(mSlash[2],10);
    if(month < 1 || month > 12 || day < 1 || day > 31) return { status: "unrecognized" };
    var year = mSlash[3] ? (mSlash[3].length===2 ? 2000+parseInt(mSlash[3],10) : parseInt(mSlash[3],10)) : now.getFullYear();
    var d1 = new Date(year, month-1, day);
    if(!mSlash[3] && startOfDay(d1) < startOfDay(now)){
      d1 = new Date(year+1, month-1, day); // sin año: siempre la próxima ocurrencia futura
    }
    return { status: "confident", date: d1 };
  }

  var mRel = text.match(/^en\s+(\d+)\s+d[ií]as?$/) || text.match(/^in\s+(\d+)\s+days?$/);
  if(mRel){
    var d2 = startOfDay(now); d2.setDate(d2.getDate() + parseInt(mRel[1],10));
    return { status: "confident", date: d2 };
  }

  var wd = text.replace(/^(el|on)\s+/, "");
  if(WEEKDAY_NAMES.hasOwnProperty(wd)){
    var target = WEEKDAY_NAMES[wd];
    var d3 = startOfDay(now);
    var diff = (target - d3.getDay() + 7) % 7;
    if(diff === 0) diff = 7; // "el lunes" es el próximo lunes, no hoy si hoy ya es lunes
    d3.setDate(d3.getDate() + diff);
    return { status: "confident", date: d3 };
  }

  if(/^(el\s+)?\d{1,2}$/.test(text)){
    return { status: "ambiguous" }; // un número suelto: no sabemos a qué mes se refiere
  }

  return { status: "unrecognized" };
}
function isoDate(d){ return d.toISOString().slice(0,10); }

/* ---------------- registro de comandos: fuente única de verdad ----------------
   Cada entrada describe un comando completo: alias ES/EN, si lee o escribe,

var ALIAS_INDEX = {};
var COMMANDS_BY_KEY = {};
COMMANDS.forEach(function(c){
  COMMANDS_BY_KEY[c.key] = c;
  c.aliases.forEach(function(a){ ALIAS_INDEX[a.toLowerCase()] = c.key; });
});

/* El botón "+", escribir el comando completo, y elegirlo del menú de "/"
   terminan siempre aquí. Los comandos "read" solo llaman a run(), nunca
   tocan Supabase ni la bitácora — eso es exclusivo de los comandos "write". */
async function dispatchCommand(raw){
  var parsed = parseSlashCommand(raw);
  var aliasKey = parsed.cmd.toLowerCase();
  var t = findTicket(UI.selectedTicketId);
  var hasTicket = !!t;

  if(aliasKey === "help" || aliasKey === "ayuda"){
    pushEphemeral("help", hasTicket ? t.id : null, { query: parsed.arg.replace(/^\//, "").trim() });
    return;
  }
  if(!aliasKey){
    UI.slashMenuOpen = true; UI.slashQuery = ""; UI.slashActiveIndex = 0;
    render();
    restoreComposerText("/");
    return;
  }

  var key = ALIAS_INDEX[aliasKey];
  if(!key){
    showToast('Comando no reconocido: "/' + parsed.cmd + '". Escribe /help para ver la lista.');
    return;
  }
  var cmd = COMMANDS_BY_KEY[key];
  if(cmd.requiresTicket && !hasTicket){
    showToast("Selecciona un ticket primero.");
    return;
  }
  var ctx = { ticket: t };
  var result = cmd.parse(parsed.arg, ctx);
  if(!result.ok){
    if(result.showHelp){ pushEphemeral("help", hasTicket ? t.id : null, { query: key }); }
    else if(result.error){
      /* Fecha ambigua/no reconocida: en vez de solo avisar, mandamos el foco
         directo al selector de fecha nativo del encabezado — cuando el
         usuario termine con él (bindField), el foco vuelve al compositor
         porque UI.dateFallbackElId lo marca como "vino de un fallback".
         render() reconstruye el DOM (incluido el toast, que empieza vacío),
         así que el aviso siempre se muestra DESPUÉS de renderizar. */
      if(result.focusElId){
        UI.dateFallbackElId = result.focusElId;
        UI.pendingFocus = { elId: result.focusElId };
        render();
      }
      showToast(result.error);
    }
    return;
  }
  return runWithConfirm(cmd, result.data, ctx);
}

function runWithConfirm(cmd, data, ctx){
  var needsConfirm = typeof cmd.confirm === "function" ? cmd.confirm(data, ctx) : !!cmd.confirm;
  if(needsConfirm){
    UI.pendingConfirm = { key: cmd.key, data: data, ticketId: ctx.ticket ? ctx.ticket.id : null };
    render();
    restoreComposerText("");
    return;
  }
  return cmd.run(data, ctx);
}

async function confirmPendingSlash(){
  var c = UI.pendingConfirm;
  if(!c) return;
  var cmd = COMMANDS_BY_KEY[c.key];
  UI.pendingConfirm = null;
  render();
  restoreComposerText("");
  if(!cmd) return;
  var t = c.ticketId ? findTicket(c.ticketId) : findTicket(UI.selectedTicketId);
  await cmd.run(c.data, { ticket: t });
}

function bindField(id, evtName){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener(evtName, function(){
    /* Si este campo recibió el foco como fallback de una fecha ambigua
       (/atender, /compromiso), terminar de usarlo devuelve el foco al
       compositor — en cualquier otro caso (edición directa del encabezado
       con el mouse) el foco se queda donde el usuario lo dejó. */
    var opts;
    if(UI.dateFallbackElId === id){ UI.dateFallbackElId = null; opts = {refocus:true}; }
    commitHeaderField(id, el.value, opts);
  });
}

/* single delegated document-level listener, registered once at boot (never re-added on render).
   CAPTURE phase so it sees the DOM before any handler-triggered render() replaces it. */
document.addEventListener("click", function(e){
  var prodBtn = e.target.closest && e.target.closest("[data-toggle-task]");
  if(prodBtn){ toggleTaskEstado(prodBtn.getAttribute("data-ticket"), prodBtn.getAttribute("data-toggle-task")); return; }
  var normalBtn = e.target.closest && e.target.closest("[data-toggle-normal-task]");
  if(normalBtn){ toggleNormalTask(normalBtn.getAttribute("data-ticket"), normalBtn.getAttribute("data-toggle-normal-task")); return; }
  var docCard = e.target.closest && e.target.closest('[data-action="open-doc"]');
  if(docCard){ openDocumentViewer(docCard.getAttribute("data-id")); return; }
  var dismissBtn = e.target.closest && e.target.closest('[data-action="dismiss-ephemeral"]');
  if(dismissBtn){ dismissEphemeral(dismissBtn.getAttribute("data-id")); return; }
  var helpFillBtn = e.target.closest && e.target.closest('[data-action="help-fill"]');
  if(helpFillBtn){ restoreComposerText(helpFillBtn.getAttribute("data-text")); return; }
  var showProdBtn = e.target.closest && e.target.closest('[data-action="show-productos"]');
  if(showProdBtn){ pushEphemeral("productos", showProdBtn.getAttribute("data-ticket"), { filter: showProdBtn.getAttribute("data-filter") }); return; }
  var showDocsBtn = e.target.closest && e.target.closest('[data-action="show-documentos"]');
  if(showDocsBtn){ pushEphemeral("documentos", showDocsBtn.getAttribute("data-ticket"), {}); return; }
  var showDineroBtn = e.target.closest && e.target.closest('[data-action="show-dinero"]');
  if(showDineroBtn){ pushEphemeral("dinero", showDineroBtn.getAttribute("data-ticket"), {}); return; }
  var clienteSelectBtn = e.target.closest && e.target.closest('[data-action="cliente-select"]');
  if(clienteSelectBtn){
    pushEphemeral("cliente", clienteSelectBtn.getAttribute("data-ticket") || null, { mode: clienteSelectBtn.getAttribute("data-mode"), resolvedId: clienteSelectBtn.getAttribute("data-client-id") });
    return;
  }
  var clienteLinkBtn = e.target.closest && e.target.closest('[data-action="cliente-link"]');
  if(clienteLinkBtn){
    var linkTicket = findTicket(clienteLinkBtn.getAttribute("data-ticket"));
    var linkCliente = STATE.clientes.filter(function(c){ return c.id === clienteLinkBtn.getAttribute("data-client-id"); })[0];
    if(linkTicket && linkCliente) linkClienteToTicket(linkTicket, linkCliente);
    return;
  }
  var openFichaBtn = e.target.closest && e.target.closest('[data-action="open-cliente-ficha"]');
  if(openFichaBtn){
    var fichaClientId = openFichaBtn.getAttribute("data-client-id");
    var fichaFromTicket = openFichaBtn.getAttribute("data-ticket") || null;
    openClienteFicha(fichaClientId, { fromTicketId: fichaFromTicket });
    return;
  }
  var historiaFilterBtn = e.target.closest && e.target.closest('[data-action="cliente-historia-filter"]');
  if(historiaFilterBtn){
    UI.clienteHistoriaFilter = historiaFilterBtn.getAttribute("data-filter");
    render();
    return;
  }
  var clienteCreateBtn = e.target.closest && e.target.closest('[data-action="cliente-create"]');
  if(clienteCreateBtn){
    var createTicket = findTicket(clienteCreateBtn.getAttribute("data-ticket"));
    var createName = clienteCreateBtn.getAttribute("data-name");
    if(createTicket && createName){
      createClienteCore(createName).then(function(c){ if(c) linkClienteToTicket(createTicket, c); });
    }
    return;
  }
  var editSelectBtn = e.target.closest && e.target.closest('[data-action="editarcliente-select"]');
  if(editSelectBtn){
    var oldEntry = UI.ephemeralLog.filter(function(en){ return en.id === editSelectBtn.getAttribute("data-ephemeral-id"); })[0];
    if(oldEntry){
      var reTicketId = oldEntry.ticketId, rePatch = oldEntry.params.patch;
      dismissEphemeral(oldEntry.id);
      pushEphemeral("editarcliente", reTicketId, { patch: rePatch, targetId: editSelectBtn.getAttribute("data-client-id"), nameQuery: null });
    }
    return;
  }
  var editConfirmBtn = e.target.closest && e.target.closest('[data-action="editarcliente-confirm"]');
  if(editConfirmBtn){
    var confEntry = UI.ephemeralLog.filter(function(en){ return en.id === editConfirmBtn.getAttribute("data-ephemeral-id"); })[0];
    var confClientId = editConfirmBtn.getAttribute("data-client-id");
    if(confEntry){
      updateClienteCore(confClientId, confEntry.params.patch, confEntry.ticketId).then(function(ok){
        if(ok){ dismissEphemeral(confEntry.id); showToast("Cliente actualizado."); }
      });
    }
    return;
  }
  if(UI.composer){
    var pop = document.getElementById("composer-popover");
    var plus = document.querySelector('[data-action="toggle-menu"]');
    var clickedInsidePop = pop && pop.contains(e.target);
    var clickedPlus = plus && (e.target === plus || plus.contains(e.target));
    if(!clickedInsidePop && !clickedPlus){ UI.composer = null; render(); }
  }
}, true);

/* Edición inline de productos (sección 7) dentro de un mensaje efímero de
   /productos: delegado a nivel documento porque las filas se recrean en
   cada render() (el log efímero se recalcula en vivo) — un listener normal
   atado en wireEvents() se perdería en cuanto el usuario editara un segundo
   campo y el DOM se reconstruyera. "change" ya burbujea, así que no hace
   falta capture. */
document.addEventListener("change", function(e){
  var el = e.target.closest && e.target.closest("[data-producto-edit]");
  if(!el) return;
  var productoId = el.getAttribute("data-producto-edit");
  var field = el.getAttribute("data-field");
  var t = findTicket(el.getAttribute("data-ticket"));
  if(!t) return;
  var patch = {};
  if(field === "desc"){
    var desc = el.value.trim();
    if(!desc){ showToast("La descripción no puede quedar vacía."); render(); return; }
    patch.desc = desc;
  } else if(field === "cantidad"){
    var cantidad = parseFloat(el.value);
    if(!cantidad || cantidad <= 0){ showToast("Cantidad inválida."); render(); return; }
    patch.cantidad = cantidad;
  } else if(field === "precio"){
    patch.precio = el.value === "" ? null : parseFloat(el.value);
  } else {
    return;
  }
  updateProductoCore(t, productoId, patch);
});

/* true si el evento viene de algo donde escribir es normal (campo de texto,
   select, contenteditable) — ahí J/K deben comportarse como letras, nunca
   como navegación. Caso especial: el compositor VACÍO es el estado de
   "listo para el siguiente comando" (foco continuo, sección 1) — justo
   después de cambiar de ticket el foco vuelve ahí, así que si contara como
   "escribiendo" la navegación consecutiva (J, J, J…) sería imposible sin
   hacer clic para quitarle el foco. En cuanto el compositor tiene contenido
   (una letra, "/", lo que sea) vuelve a comportarse como cualquier campo de
   texto normal y J/K dejan de interceptarse. */
function isTypingTarget(el){
  if(!el) return false;
  var tag = (el.tagName || "").toLowerCase();
  if(el.id === "composer-input") return !!el.value;
  if(tag === "input" || tag === "textarea" || tag === "select") return true;
  if(el.isContentEditable) return true;
  return false;
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && UI.viewingDocId){ closeDocumentViewer(); return; }
  if(e.key === "Escape" && UI.cierreModal){ closeCierreModal(); return; }
  if(e.key === "Escape" && UI.headerEditField){ closeHeaderEdit(); return; }

  /* Navegación J/K entre tickets, respetando el mismo orden visual que ve
     el usuario en el sidebar (visualTicketOrder — pinneados, luego
     agrupados por fecha, o el resultado de una búsqueda activa). No debe
     interferir con la navegación estándar de formularios: se ignora por
     completo mientras se escribe en cualquier campo, dentro de un modal de
     documento, con el menú de "/" abierto, con una confirmación pendiente,
     con un popover del compositor abierto, o con Ctrl/Cmd/Alt presionados. */
  if((e.key === "j" || e.key === "k" || e.key === "J" || e.key === "K") &&
     !e.ctrlKey && !e.metaKey && !e.altKey &&
     !isTypingTarget(e.target) &&
     !UI.viewingDocId && !UI.cierreModal && !UI.slashMenuOpen && !UI.pendingConfirm && !UI.composer){
    var order = visualTicketOrder();
    if(order.length){
      var idx = order.findIndex(function(t){ return t.id === UI.selectedTicketId; });
      var dir = (e.key === "j" || e.key === "J") ? 1 : -1;
      var nextIdx;
      if(idx === -1) nextIdx = dir === 1 ? 0 : order.length - 1;
      else nextIdx = Math.max(0, Math.min(order.length - 1, idx + dir));
      if(order[nextIdx] && order[nextIdx].id !== UI.selectedTicketId){
        e.preventDefault();
        openTicketById(order[nextIdx].id);
      }
    }
  }
});

/* ---------------- boot ---------------- */

async function boot(){
  loadUi();
  render();
  if(window.__dtgSupabaseLoadFailed || !window.supabase){
    FATAL_ERROR = "No se pudo cargar la librería de Supabase (revisa tu conexión a internet y recarga).";
    render();
    return;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await ensureSession();
    await refreshFromServer();
    if(UI.whoami) rememberName(UI.whoami);
    subscribeRealtime();
  }catch(e){
    FATAL_ERROR = "No se pudo conectar con la base de datos: " + (e.message || "error desconocido") +
      ". Si el proyecto sigue mostrando este error, confirma que \"Anonymous sign-ins\" esté activado en Supabase Auth.";
    render();
  }
}

boot();

})();
</script>
