       caso sin romper el arranque de la app. */
    taxExempt: !!row.tax_exempt, taxExemptReason: row.tax_exempt_reason || "", taxExemptRef: row.tax_exempt_ref || "",
    /* Logo del cliente: mismo criterio tolerante que tax_exempt arriba —
       row.logo_storage_path es undefined (nunca un error) si la migración
       0007 todavía no se corrió, y `|| null` lo deja exactamente como "sin
       logo todavía" — clientAvatar() ya sabe mostrar iniciales en ese caso. */
    logoStoragePath: row.logo_storage_path || null,
    createdAt: row.created_at
  };
}

async function fetchAllState(){
  var results = await Promise.all([
    sb.from("tickets").select("*"),
    sb.from("productos").select("*"),
    sb.from("tareas").select("*"),
    sb.from("pagos").select("*"),
    sb.from("bitacora").select("*").order("ts", {ascending:true}),
    sb.from("app_settings").select("*"),
    sb.from("documentos").select("*")
  ]);
  for(var i=0;i<results.length;i++){ if(results[i].error) throw results[i].error; }
  var ticketsRows = results[0].data, productosRows = results[1].data, tareasRows = results[2].data,
      pagosRows = results[3].data, bitacoraRows = results[4].data, settingsRows = results[5].data,
      documentosRows = results[6].data;
  var clientesInfo = await fetchClientes();

  var byTicket = {};
  ticketsRows.forEach(function(row){
    byTicket[row.id] = {
      id: row.id, seq: row.seq, createdAt: row.created_at, lastActivityAt: row.last_activity_at,
      pinned: row.pinned, cliente: row.cliente || "", clienteId: row.cliente_id || null, queSigue: row.que_sigue || "",
      responsable: row.responsable || "", fechaAtencion: row.fecha_atencion || "", fechaCompromiso: row.fecha_compromiso || "",
      entregadoAt: row.entregado_at || null, entregadoPor: row.entregado_por || "",
      cierreTipo: row.cierre_tipo || null, cerradoAt: row.cerrado_at || null,
      razonCierre: row.razon_cierre || "", cerradoPor: row.cerrado_por || "",
      productos: [], tareas: [], pagos: [], documentos: [], thread: []
    };
  });
  productosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.productos.push({ id: row.id, desc: row.descripcion, cantidad: row.cantidad==null?1:Number(row.cantidad), precio: row.precio==null?null:Number(row.precio) });
  });
  tareasRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.tareas.push({ id: row.id, desc: row.descripcion, tipo: row.tipo, responsable: row.responsable || "", fechaAtencion: row.fecha_atencion || "", estado: row.estado });
  });
  pagosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.pagos.push({ id: row.id, monto: Number(row.monto), fecha: row.fecha, metodo: row.metodo || "", concepto: row.concepto || "" });
  });
  documentosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    /* pricingSnapshot (V0.5 §18): null en documentos pre-V0.5 o si la
       migración 0006 todavía no se corrió — se trata como "sin tax/fee/
       due-date/terms/PO", que es exactamente lo que esos documentos ya
       significaban antes de que existiera este campo. */
    t.documentos.push({ id: row.id, tipo: row.tipo, numero: row.numero, clienteNombre: row.cliente_nombre || "", notas: row.notas || "", items: row.items || [], total: Number(row.total), cobradoAlCrear: Number(row.cobrado_al_crear||0), billTo: row.bill_to || {}, pricingSnapshot: row.pricing_snapshot || null, autor: row.autor, createdAt: row.created_at });
  });
  bitacoraRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    var ev = Object.assign({ id: row.id, type: row.tipo, ts: row.ts, autor: row.autor }, row.payload || {});
    t.thread.push(ev);
  });
  var settings = { queSigueOptions: [], teamNames: [] };
  settingsRows.forEach(function(row){
    if(row.key === "que_sigue_options") settings.queSigueOptions = row.values || [];
    if(row.key === "team_names") settings.teamNames = row.values || [];
  });
  return {
    meta: settings,
    tickets: Object.keys(byTicket).map(function(k){ return byTicket[k]; }),
    clientes: clientesInfo.rows.map(mapClienteRow),
    clientesTableMissing: clientesInfo.missing
  };
}

var refreshInFlight = null;
/* Si llega una mutación (o un evento de Realtime) MIENTRAS ya hay un
   fetchAllState() en camino, no la descartamos con el dedup de abajo:
   la encolamos para correr OTRA vez en cuanto termine la actual. Sin esto,
   una escritura que termina justo después de que arrancó un fetch anterior
   (muy común: cualquier mutación dispara su propio touch_ticket_* trigger
   en Postgres, que a su vez dispara un evento de Realtime sobre "tickets"
   casi al mismo tiempo) podía quedar "tragada" por ese fetch viejo, que
   sobreescribe STATE con una foto tomada antes de que esa escritura se
   reflejara — y como el dedup nunca reintentaba, la comanda se quedaba
   mostrando el valor anterior hasta el siguiente refresh manual. Esa era
   la causa de fondo de "algunos cambios no se reflejan inmediatamente". */
var refreshPending = null; // null | { background: boolean }
/* opts.refocus: la próxima vez que esto termine en un render(), el
   compositor debe quedar vacío y enfocado — lo pide cualquier mutación
   disparada desde un comando o desde el botón "+", nunca las
   actualizaciones de fondo (realtime) ni las ediciones directas de campos
   del encabezado. Ver applyFocus().
   opts.background: SOLO lo pasa scheduleRefresh() (Realtime). Marca que
   este render no lo pidió el usuario, así que debe preservar cualquier
   campo vivo (compositor, edición de la comanda, formulario del "+") que
   esté a medio escribir — ver renderKeepingLiveInputs(). Si mientras tanto
   llega también una llamada "de primera mano" (sin background), esa gana:
   el render final se comporta como uno normal. */
/* §9/§10: prende/apaga #syncing-dot directamente (sin render()) — mismo
   criterio que updateProductoPreview(): una actualización visual mínima no
   tiene por qué reconstruir el DOM completo. Buscarlo con getElementById en
   cada llamada (nunca cachear la referencia) porque render() sí lo
   reconstruye desde cero cada vez que corre — cachear el nodo viejo lo
   dejaría apuntando a un elemento ya fuera del documento. */
function setSyncIndicator(show){
  var dot = document.getElementById("syncing-dot");
  if(dot) dot.hidden = !show;
}
async function refreshFromServer(opts){
  opts = opts || {};
  if(opts.refocus) UI.pendingFocus = UI.pendingFocus || "composer";
  if(refreshInFlight){
    refreshPending = refreshPending || { background: true };
    if(!opts.background) refreshPending.background = false;
    return refreshInFlight;
  }
  refreshInFlight = (async function(){
    var background = !!opts.background;
    for(;;){
      setSyncIndicator(true);
      try{
        var fresh = await fetchAllState();
        STATE = fresh;
        if(UI.selectedTicketId && !findTicket(UI.selectedTicketId)) UI.selectedTicketId = null;
        if(background) renderKeepingLiveInputs(); else render();
      }catch(e){
        showToast("No se pudo sincronizar: " + (e.message || "error de red"));
      }
      if(!refreshPending) break;
      background = refreshPending.background;
      refreshPending = null;
    }
    refreshInFlight = null;
    setSyncIndicator(false);
  })();
  return refreshInFlight;
}

var realtimeTimer = null;
function scheduleRefresh(){ clearTimeout(realtimeTimer); realtimeTimer = setTimeout(function(){ refreshFromServer({ background: true }); }, 300); }
function subscribeRealtime(){
  var channel = sb.channel("dtg-changes");
  ["tickets","productos","tareas","pagos","bitacora","app_settings","documentos","clientes"].forEach(function(table){
    channel.on("postgres_changes", { event: "*", schema: "public", table: table }, scheduleRefresh);
  });
  channel.subscribe();
}

/* Ronda "Fluidez, Confiabilidad, Realtime y QA" §7/§8: la app vuelve a
   primer plano (PWA reabierta, pestaña que recupera foco, celular que se
   desbloquea) o recupera conexión — en ambos casos se sincroniza por el
   MISMO camino central (refreshFromServer({background:true}), el que ya usa
   scheduleRefresh()/Realtime), nunca un fetch paralelo ni
   window.location.reload(). background:true es lo que hace que
   renderKeepingLiveInputs() proteja el compositor/edición en curso — igual
   que cualquier otro refresh de fondo.

   El riesgo específico de iOS: abrir la cámara o el selector de fotos desde
   <input type=file> dispara un visibilitychange (la app "se oculta" y luego
   "vuelve a ser visible" al cerrar el picker) — sin este guard, volver de
   elegir una foto dispararía un refresh justo cuando el usuario está a la
   mitad de esa selección. filePickerOpen es una bandera simple (no una
   máquina de estados): se prende en cuanto CUALQUIER <input type=file> de
   la app recibe foco (fotos de ticket, logo de cliente, captura del reporte
   de bug — un solo listener delegado cubre los tres sin tocarlos uno por
   uno) y se apaga en su "change" (o, como respaldo, sola a los pocos
   segundos si el usuario cancela el picker sin elegir nada). Si el usuario
   vuelve a la app mientras la bandera sigue prendida, el refresh se pospone
   una sola vez y se dispara en cuanto la bandera se apaga. */
var filePickerOpen = false;
var pendingVisibleRefresh = false;
var filePickerGuardTimer = null;
document.addEventListener("focusin", function(e){
  if(e.target && e.target.tagName === "INPUT" && e.target.type === "file"){
    filePickerOpen = true;
    clearTimeout(filePickerGuardTimer);
    /* Addendum final §31 (bug real de QA): si el usuario CANCELA el picker,
       "change" nunca dispara, así que este timeout de respaldo es el único
       lugar que apaga filePickerOpen — pero antes solo hacía eso y dejaba
       pendingVisibleRefresh(true) sin consumir para siempre si ya se había
       armado. Debe seguir el MISMO camino central que "change": apagar la
       bandera y, si quedó un refresh pospuesto, dispararlo ahora. */
    filePickerGuardTimer = setTimeout(function(){
      filePickerOpen = false;
      if(pendingVisibleRefresh){ pendingVisibleRefresh = false; refreshFromServer({ background: true }); }
    }, 5000);
  }
});
document.addEventListener("change", function(e){
  if(!(e.target && e.target.tagName === "INPUT" && e.target.type === "file")) return;
  filePickerOpen = false;
  clearTimeout(filePickerGuardTimer);
  if(pendingVisibleRefresh){ pendingVisibleRefresh = false; refreshFromServer({ background: true }); }
});
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  if(!sb) return; /* aún no terminó boot() */
  if(filePickerOpen){ pendingVisibleRefresh = true; return; }
  refreshFromServer({ background: true });
});
window.addEventListener("online", function(){
  if(!sb) return;
  refreshFromServer({ background: true });
});

/* Addendum final §13-24: decide en qué CASO cae "Total del pedido" — nunca
   escribe nada (eso es tarea exclusiva del `run` del comando /total y de
   applyTotalPedidoEditor()), solo calcula qué mostrar. Reutiliza
   round2() (el mismo que ya usa createDocumentoCore, sección "One-Click Tax
   & Fees") para toda la aritmética — nunca comparación cruda de floats. */
function planTotalDelPedido(t, monto){
  var productos = t.productos || [];
  var known = 0, pendingCount = 0;
  productos.forEach(function(p){
    if(p.precio == null || isNaN(p.precio)) pendingCount++;
    else known += (p.cantidad || 1) * Number(p.precio);
  });
  /* §21: ya es exacto -> caso especial, sin mutación. Solo aplica si TODOS
     los productos ya tienen precio (si hay alguno pendiente, "ya es exacto"
     no tiene sentido: sigue faltando asignar algo). */
  if(productos.length && pendingCount === 0 && round2(known) === round2(monto)){
    return { case: "exact", monto: monto };
  }
  /* §15: sin productos todavía. */
  if(!productos.length){
    return { case: "zero", monto: monto };
  }
  /* §16: exactamente un producto con cantidad 1 -> el total ES el precio,
     sin división de por medio. */
  if(productos.length === 1 && Number(productos[0].cantidad || 1) === 1){
    return { case: "single1", monto: monto, productoId: productos[0].id, desc: productos[0].desc };
  }
  /* §17/§19: 1 producto con cantidad>1, o 2+ productos -> editor compacto.
     Nunca se reparte automáticamente (§19) salvo dos excepciones explícitas
     y siempre PROPUESTAS (nunca escritas solas, sección 20/22):
       - un único renglón (misma cantidad>1): se propone el precio unitario
         (monto/cantidad) porque no hay ninguna otra forma de repartirlo;
       - 2+ renglones con EXACTAMENTE uno pendiente de precio: se propone el
         monto faltante (monto - conocido), nunca si eso diera negativo. */
  var rows = productos.map(function(p){
    return { id: p.id, desc: p.desc, cantidad: Number(p.cantidad || 1), precio: (p.precio == null || isNaN(p.precio)) ? null : Number(p.precio), proposed: null };
  });
  if(rows.length === 1){
    rows[0].proposed = round2(monto / rows[0].cantidad);
  } else {
    var pendingRows = rows.filter(function(r){ return r.precio == null; });
    if(pendingRows.length === 1){
      var othersSum = rows.filter(function(r){ return r.precio != null; }).reduce(function(s,r){ return s + r.cantidad * r.precio; }, 0);
      var proposed = round2(monto - othersSum);
      if(proposed >= 0) pendingRows[0].proposed = proposed;
    }
  }
  return { case: "editor", monto: monto, rows: rows, known: known, pendingCount: pendingCount };
}

function computeTotals(t){
  var known = 0, pending = 0;
  (t.productos||[]).forEach(function(p){
    if(p.precio == null || isNaN(p.precio)){ pending++; }
    else { known += (p.cantidad || 1) * Number(p.precio); }
  });
  return { known: known, pending: pending };
}

function bucketFor(t){
  var d = startOfDay(t.lastActivityAt);
  var today = startOfDay(new Date());
  var diff = Math.round((today - d) / 86400000);
  if(diff <= 0) return "Hoy";
  if(diff === 1) return "Ayer";
  if(diff <= 7) return "Últimos días";
  return "Anteriores";
}

function ticketLabel(t){ return t.cliente ? t.cliente : ("Ticket #" + t.seq); }

function matchesSearch(t, q){
  q = q.toLowerCase();
  if(("#" + t.seq).indexOf(q) !== -1) return true;
  if((t.cliente||"").toLowerCase().indexOf(q) !== -1) return true;
  var i;
  for(i=0;i<(t.productos||[]).length;i++){ if((t.productos[i].desc||"").toLowerCase().indexOf(q)!==-1) return true; }
  for(i=0;i<(t.thread||[]).length;i++){
    var ev = t.thread[i];
    if(ev.type==="nota" && (ev.text||"").toLowerCase().indexOf(q)!==-1) return true;
  }
  return false;
}

function estadoLabel(e){

/* Helpers SOLO para la identificación del sidebar (sección 20) — NO tocar
   ticketLabel(), que se usa en otros contextos (búsqueda, /ticket, ficha de
   cliente) con otro significado. El sidebar necesita reconocerse por
   Número + Cliente + Producto principal, no solo por el nombre del
   cliente. */
function sidebarClienteLabel(t){ return t.cliente ? t.cliente : "Sin cliente"; }
/* Producto principal = mayor cantidad × precio conocido. Un producto sin
   precio (precio null) nunca supera arbitrariamente a uno cuyo valor sí
   conocemos — se le da un valor de comparación de -1, menor que cualquier
   precio real (incluido $0). Si NINGÚN producto tiene precio, ninguno
   supera nunca al primero (todos empatan en -1) y por lo tanto gana el
   primero de la lista, exactamente el fallback pedido. Comparación con ">"
   estricto: en empate se conserva el orden existente, nunca se reordena. */
function sidebarProductoPrincipal(t){
  var productos = t.productos || [];
  if(!productos.length) return "Sin producto";
  var best = productos[0];
  var bestValue = best.precio == null ? -1 : (best.cantidad||1) * best.precio;
  for(var i=1;i<productos.length;i++){
    var p = productos[i];
    var value = p.precio == null ? -1 : (p.cantidad||1) * p.precio;
    if(value > bestValue){ best = p; bestValue = value; }
  }
  return ((best.cantidad && best.cantidad !== 1) ? (best.cantidad + " ") : "") + best.desc;
}

/* opts.showCancel (V0.5 §6): SOLO la lista principal del sidebar lo activa

   <div> de posicionamiento para poder poner el botón "×" al lado sin anidar

function renderTicketRow(t, opts){

/* Una sola función construye el orden agrupado (fijados + Hoy/Ayer/…) y
   otra aplana ese mismo orden para búsqueda o navegación por teclado — el
   renderer y J/K comparten exactamente el mismo criterio, nunca dos
   ordenamientos que puedan desalinearse. */
/* V0.5 §5: la lista principal del sidebar es "solo trabajo vivo" — abierto
   o entregado-sin-cerrar. Los cerrados (pagado/cancelado) no desaparecen de
   la base de datos, solo dejan de listarse aquí; tienen su propia vista
   ("Tickets cerrados", bloque 4) y siguen siendo alcanzables desde la ficha
   de cliente y desde /ticket <número> (navegación histórica deliberada, no
   limitada al conjunto visual del sidebar). */
function groupedTicketOrder(){
  var tickets = STATE.tickets.filter(function(t){ return !ticketIsCerrado(t); });
  /* Dentro de cada grupo, primero por estado (abierto < entregado < cerrado
     — sección 6: "entregado se mueve debajo de los activos", cerrado al
     fondo) y solo como desempate por actividad reciente. Nada desaparece,
     solo se hunde dentro de su propio grupo de fecha. */
  function byRankThenActivity(a,b){
    var ra = ticketOrderRank(a), rb = ticketOrderRank(b);
    if(ra !== rb) return ra - rb;
    return new Date(b.lastActivityAt) - new Date(a.lastActivityAt);
  }
  var pinned = tickets.filter(function(t){ return t.pinned; }).sort(byRankThenActivity);
  var rest = tickets.filter(function(t){ return !t.pinned; });
  var groups = {"Hoy":[], "Ayer":[], "Últimos días":[], "Anteriores":[]};
  rest.forEach(function(t){ groups[bucketFor(t)].push(t); });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(byRankThenActivity);
  });
  return { pinned: pinned, groups: groups };
}
function visualTicketOrder(){
  if(UI.search.trim()){
    var q = UI.search.trim();
    /* La búsqueda del sidebar vive dentro del mismo conjunto "solo vivos"
       que la lista (V0.5 §5/D3) — un ticket cerrado se busca en su propia
       vista (Tickets cerrados), no aquí. */
    var filtered = STATE.tickets.filter(function(t){ return !ticketIsCerrado(t) && matchesSearch(t, q); });
    filtered.sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
    return filtered;
  }
  var g = groupedTicketOrder();
  var ordered = g.pinned.slice();
  ["Hoy","Ayer","Últimos días","Anteriores"].forEach(function(k){ ordered = ordered.concat(g.groups[k]); });
  return ordered;
}

/* Único lugar donde el × de cancelar aparece (V0.5 §6) — la lista principal
   del sidebar, ya filtrada a "solo vivos" por groupedTicketOrder/
   visualTicketOrder, así que todo lo que se renderiza aquí es cancelable. */
function renderSidebarRow(t){ return renderTicketRow(t, { showCancel: true }); }
function renderSidebarList(){
  if(UI.search.trim()){
    var q = UI.search.trim();
    var ordered = visualTicketOrder();
    if(!ordered.length) return '<div class="empty-list">Sin resultados para “' + escapeHtml(q) + '”.</div>';
    return ordered.map(renderSidebarRow).join("");
  }
  if(!STATE.tickets.length){
    return '<div class="empty-list">Todavía no hay tickets. Crea el primero arriba.</div>';
  }
  var g = groupedTicketOrder();
  var html = "";
  if(g.pinned.length){
    html += '<div class="group-label">Fijados</div>' + g.pinned.map(renderSidebarRow).join("");
  }
  ["Hoy","Ayer","Últimos días","Anteriores"].forEach(function(k){
    if(g.groups[k].length){
      html += '<div class="group-label">' + k + '</div>' + g.groups[k].map(renderSidebarRow).join("");
    }
  });
  return html || (STATE.tickets.length ? '<div class="empty-list">Nada activo ahora mismo — revisa Tickets cerrados.</div>' : '<div class="empty-list">Sin resultados.</div>');
}

function renderThreadItem(ev, ticketId){
  var dotClass = ev.type;
  var body = "";
  /* V0.5 §4: la hora ya no se repite en cada fila por defecto — el día lo
     da el separador (joinWithDaySeparators) y eventShowsTime() decide si
     ESTE evento en particular necesita trazabilidad de hora (pago,
     documento, entrega, cierre). El timestamp completo sigue disponible
     siempre vía el atributo title del renglón, nunca se pierde. */
  var metaBits = [];
  if(ev.autor) metaBits.push('<span class="autor">' + escapeHtml(ev.autor) + "</span>");
  if(eventShowsTime(ev)) metaBits.push(fmtTime(ev.ts));
  var meta = metaBits.join(" · ");
  var fullStamp = escapeHtml(fmtDateShort(ev.ts) + " · " + fmtTime(ev.ts));
  if(ev.type === "nota"){
    body = '<div class="thread-text">' + escapeHtml(ev.text).replace(/\n/g,"<br>") + "</div>";
  } else if(ev.type === "sistema"){
    body = '<div class="thread-sub">' + escapeHtml(ev.text) + "</div>";
  } else if(ev.type === "producto"){
    /* El historial nunca se reescribe (sección 3): este renglón sigue
       diciendo exactamente lo que pasó cuando se agregó. Lo nuevo es que
       ahora es clicable — abre el MISMO editor de productos que ya usan
       /productos y los botones "Total conocido"/"pendientes" del
       encabezado, nunca una copia — y usa color como lenguaje funcional
       (sección 4): cantidad en cian, precio en verde o dorado si está
       pendiente, sin que la línea completa comparta un solo color. */
    var cantidadSpan = '<span class="hist-cantidad">' + ev.cantidad + " ×</span>";
    var precioSpan = ev.precio == null
      ? '<span class="hist-precio hist-pending">precio pendiente</span>'
      : '<span class="hist-precio">' + fmtMoney(ev.precio) + " c/u</span> = <span class=\"hist-total\">" + fmtMoney(ev.cantidad*ev.precio) + "</span>";
    var descSpan = '<span class="hist-desc">' + escapeHtml(ev.desc) + "</span>";
    var clickable = ticketId ? (' data-action="show-productos" data-ticket="' + ticketId + '" data-filter="all"') : "";
    var Tag = ticketId ? "button" : "div";
    body = '<' + Tag + ' class="thread-text hist-producto-line"' + clickable + '>Producto agregado</' + Tag + '>' +
      '<div class="thread-sub">' + cantidadSpan + " " + descSpan + " · " + precioSpan + "</div>";
  } else if(ev.type === "tarea" || ev.type === "tarea_produccion"){
    var label = ev.type === "tarea_produccion" ? "Tarea de producción" : "Tarea";
    body = '<div class="thread-text">' + label + ": " + escapeHtml(ev.desc) + "</div>";
    var extra = [];
    if(ev.responsable) extra.push(escapeHtml(ev.responsable));
    if(ev.estado) extra.push(estadoLabel(ev.estado));
    if(ev.fechaAtencion) extra.push("atender " + fmtDateOnlyShort(ev.fechaAtencion));
    if(extra.length) body += '<div class="thread-sub">' + extra.join(" · ") + "</div>";
  } else if(ev.type === "pago"){
    body = '<div class="thread-text">Pago registrado' + (ev.concepto ? " — " + escapeHtml(ev.concepto) : "") + "</div>";
    body += '<div class="thread-sub">' + fmtMoney(ev.monto) + (ev.metodo ? " · " + escapeHtml(ev.metodo) : "") + (ev.fecha ? " · " + fmtDateOnlyShort(ev.fecha) : "") + "</div>";
  } else if(ev.type === "archivo"){
    body = '<div class="thread-text">' + (ev.caption ? escapeHtml(ev.caption) : "Archivo adjunto") + "</div>";
    if(ev.storage_path){ body += '<img class="thread-img" data-storage-path="' + escapeHtml(ev.storage_path) + '" alt="' + escapeHtml(ev.filename||"adjunto") + '">'; }
    else { body += '<div class="thread-sub">' + escapeHtml(ev.filename||"") + "</div>"; }
  } else if(ev.type === "documento"){
    var docLabel = ev.tipo === "invoice" ? "Invoice" : "Cotización";
    body =
      '<button class="doc-card" data-action="open-doc" data-id="' + escapeHtml(ev.documento_id||"") + '">' +
        '<div class="doc-card-title">' + docLabel + " #" + escapeHtml(ev.numero||"") + "</div>" +
        (ev.cliente_nombre ? '<div class="doc-card-cliente">' + escapeHtml(ev.cliente_nombre) + "</div>" : "") +
        '<div class="doc-card-total">' + fmtMoney(ev.total) + "</div>" +
        '<div class="doc-card-link">Abrir ' + (ev.tipo==="invoice"?"invoice":"cotización") + " &#8594;</div>" +
      "</button>";
  }
  return (
    '<div class="thread-item" title="' + fullStamp + '">' +
      '<div class="thread-dot ' + dotClass + '"></div>' +
      '<div class="thread-body"><div class="thread-meta">' + meta + "</div>" + body + "</div>" +
    "</div>"
  );
}

   input/select y el mismo commitHeaderField/commitQueSigue de siempre —
   nunca una segunda lógica de guardado por abrir/cerrar la vista. */
var HEADER_EDIT_FOCUS_EL = { cliente:"field-cliente", quesigue:"field-quesigue", responsable:"field-responsable", atencion:"field-fecha-atencion", compromiso:"field-fecha-compromiso" };
function openHeaderEdit(field){
  UI.headerEditField = field;
  /* Token que cambia en cada apertura: el blur de un input de comanda agenda
     su cierre 150ms después (ver wireEvents), pero si en ese lapso el mismo
     u otro campo se reabre programáticamente (p.ej. el fallback de fecha
     ambigua en applyFocus), ese cierre quedaría "viejo" y borraría la
     reapertura sin que el usuario haya tocado nada. Comparando el token en
     ese momento contra el actual, un cierre viejo simplemente no hace nada. */
  UI.headerEditToken = (UI.headerEditToken||0) + 1;
  UI.pendingFocus = { elId: HEADER_EDIT_FOCUS_EL[field] };
  render();
}
function closeHeaderEdit(){
  if(UI.headerEditField){ UI.headerEditField = null; render(); }
}

/* Resumen corto de trabajo (sección 3.2) — derivado de los productos que ya
   existen, nunca un campo nuevo obligatorio. Sin productos, simplemente no
   hay subtítulo (no se inventa texto). */
function ticketWorkSummary(t){
  if(!t.productos.length) return "";
  var first = t.productos[0];
  var head = ((first.cantidad && first.cantidad !== 1) ? (first.cantidad + " ") : "") + first.desc;
  var rest = t.productos.length - 1;
  return head + (rest > 0 ? " · +" + rest + (rest===1 ? " producto más" : " productos más") : "");
}

/* Fila "clic para actuar" reutilizada por OPERACIÓN y COMERCIAL (sección
   10: "ver algo debe acercarme a actuar sobre ello") — un solo renderer,
   nunca una copia por zona. */
/* Dos formas del mismo patrón "clic para actuar" (sección 10), nunca dos
   lógicas de guardado distintas — ambas son botones normales con el mismo
   data-action/data-field que ya consume wireEvents/openHeaderEdit. Difieren
   solo en el orden visual: OPERACIÓN se lee primero por el nombre del campo
   (¿qué es esto?), COMERCIAL se lee primero por el número (¿cuánto es?). */
/* valueHtml siempre trae su propio <span class="comanda-field-value ...">
   ya armado por quien llama (con el modificador muted/known/accent/pending
   que aplique) — el helper solo pone el label y el botón alrededor, nunca
   envuelve el valor por su cuenta, para no terminar con dos spans
   "comanda-field-value" anidados. */
function comandaField(label, valueHtml, dataAttrs){
  return '<button class="comanda-field" ' + (dataAttrs||"") + '><span class="comanda-field-label">' + label + "</span>" + valueHtml + "</button>";
}
function comandaStat(label, valueHtml, dataAttrs){
  return '<button class="comanda-field comanda-stat" ' + (dataAttrs||"") + '>' + valueHtml + '<span class="comanda-field-label">' + label + "</span></button>";
}

function renderTicketHeader(t){
  var totals = computeTotals(t);
  var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  var estado = ticketEstado(t);
  var editing = UI.headerEditField;

  /* Cabecera móvil colapsable §21-28/§39: SIGUE SIENDO la misma función,
     una sola vez — mobile solo reorganiza vía CSS/estado UI, nunca
     duplica la mutación de datos. `expanded` decide qué zonas se ven en
     mobile (en desktop las reglas de abajo no aplican: fuera del
     @media(max-width:880px) todo se muestra siempre, igual que antes de
     esta ronda). `moreOpen` es el "•••" de acciones secundarias
     (Documentos/Fijar/Cerrar ticket) — independiente del expandido: solo
     tiene sentido (y solo es visible) una vez expandido, porque colapsado
     ya las oculta todas por completo (§22: nada de eso se muestra "de
     forma permanente" en compacto). */
  var expanded = !!UI.ticketHeaderExpanded[t.id];
  var moreOpen = !!UI.headerMoreOpen;

  /* 3.1 — barra superior chica: folio+fecha+pastilla de estado a la
     izquierda, Documentos/Fijar a la derecha en desktop; en mobile esas
     dos vuelven acciones secundarias detrás de "•••" (mismos botones,
     mismo data-action — solo CSS decide si se ven). El control de
     expandir/colapsar (˅/˄) es nuevo en esta ronda y solo se ve en mobile. */
  var topBar =
    '<div class="ticket-header-top">' +
      '<div class="comanda-meta"><span class="ticket-id">#' + t.seq + " · creado " + fmtDateShort(t.createdAt) + '</span>' +
        '<span class="pill status-pill status-' + estado + '">' + ticketEstadoLabel(estado) + "</span></div>" +
      '<div class="comanda-header-controls">' +
        '<div class="ticket-header-actions">' +
          '<button class="btn-plain doc-badge" data-action="show-documentos" data-ticket="' + t.id + '">&#128196; Documentos · ' + t.documentos.length + "</button>" +
          '<button class="btn-plain" data-action="toggle-pin" data-id="' + t.id + '" title="' + (t.pinned?"Desfijar":"Fijar") + '">' + (t.pinned?"&#9733; Fijado":"&#9734; Fijar") + "</button>" +
        "</div>" +
        '<button class="comanda-more-toggle" data-action="toggle-header-more" title="Más acciones" aria-label="Más acciones">&#8942;</button>' +
        '<button class="comanda-expand-toggle" data-action="toggle-header-expanded" data-ticket="' + t.id + '" title="' + (expanded?"Ocultar detalles":"Ver detalles") + '" aria-label="' + (expanded?"Ocultar detalles":"Ver detalles") + '">' +
          '<span class="comanda-expand-label-full">' + (expanded?"Ocultar detalles":"Ver detalles") + "</span>" +
          '<span class="comanda-expand-label-short">Detalles</span>' +
          '<span class="comanda-expand-chevron">' + (expanded?"&#9652;":"&#9662;") + "</span>" +
        "</button>" +
      "</div>" +
    "</div>";

  /* 3.2 — identidad: cliente grande y clicable (o el mismo campo libre
     editable en línea si todavía no está vinculado a un cliente real),
     más el resumen de trabajo derivado de productos. */
  var identityMain;
  if(t.clienteId){
    var c = STATE.clientes.filter(function(x){ return x.id === t.clienteId; })[0];
    identityMain = c
      ? '<button class="comanda-identity-btn comanda-cliente-btn" data-action="open-cliente-ficha" data-client-id="' + c.id + '" data-ticket="' + t.id + '">' +
          clientAvatar(c, {size:"sm"}) +
          '<span class="comanda-cliente-name">' + escapeHtml(c.nombre) + (c.empresa ? ' <span class="cliente-chip-empresa">· ' + escapeHtml(c.empresa) + "</span>" : "") + "</span>" +
          ' <span class="comanda-cliente-chevron">&rsaquo;</span>' +
        "</button>"
      : "";
  } else if(editing === "cliente"){
    identityMain = '<div class="comanda-edit-inline"><input type="text" id="field-cliente" placeholder="Sin definir" value="' + escapeHtml(t.cliente) + '"></div>';
  } else {
    identityMain = '<button class="comanda-identity-btn comanda-cliente-plain" data-action="header-edit" data-field="cliente">' +
      (t.cliente ? escapeHtml(t.cliente) : "Sin cliente definido") + " <span class=\"comanda-cliente-chevron\">&rsaquo;</span></button>";
  }
  var workSummary = ticketWorkSummary(t);
  var identity =
    '<div class="comanda-identity"><div>' + identityMain +
      (workSummary ? '<div class="comanda-summary">' + escapeHtml(workSummary) + "</div>" : "") +
    "</div></div>";

  /* 6/7 — acciones primaria/secundaria, y el estado ya resuelto (nota de
     entrega o de cierre) cuando aplica. "ENTREGADO NO SIGNIFICA CERRADO":
     el botón de cerrar sigue disponible después de entregar. */
  var actionsRow = "";
  if(estado === "abierto" || estado === "entregado"){
    actionsRow = '<div class="comanda-actions-row">';
    if(estado === "abierto"){
      actionsRow += '<button class="btn btn-success" data-action="marcar-entregado" data-ticket="' + t.id + '">&#10003; Marcar entregado</button>';
    } else {
      actionsRow += '<span class="comanda-entregado-note">Entregado ' + fmtDateShort(t.entregadoAt) + (t.entregadoPor ? " · " + escapeHtml(t.entregadoPor) : "") +
        ' · <button data-action="deshacer-entrega" data-ticket="' + t.id + '">deshacer</button></span>';
    }
    actionsRow += '<button class="btn btn-cierre-secondary comanda-secondary-btn" data-action="abrir-cierre">Cerrar ticket &#9662;</button>';
    actionsRow += "</div>";
  } else {
    actionsRow = '<div class="comanda-cerrado-note"><b>' + ticketEstadoLabel(estado) + "</b> · " + fmtDateShort(t.cerradoAt) +
      (t.cerradoPor ? " · " + escapeHtml(t.cerradoPor) : "") +
      (t.razonCierre ? '<div>' + escapeHtml(t.razonCierre) + "</div>" : "") + "</div>";
  }

  /* 4 — OPERACIÓN: clic para actuar, no inputs siempre visibles. Cada fila,
     al abrirse, es EXACTAMENTE el mismo control que ya existía (misma
     commitHeaderField/commitQueSigue) — solo cambia cuándo se muestra. */
  var opRows = "";
  opRows += (editing === "quesigue")
    ? '<div class="comanda-edit-inline">' + renderQueSigueSelect(t) + "</div>"
    : comandaField("Qué sigue", t.queSigue ? '<span class="comanda-field-value accent">' + escapeHtml(t.queSigue) + " &rsaquo;</span>" : '<span class="comanda-field-value muted">Sin definir &rsaquo;</span>', 'data-action="header-edit" data-field="quesigue"');
  opRows += (editing === "responsable")
    ? '<div class="comanda-edit-inline"><input type="text" id="field-responsable" list="dtg-team-names" placeholder="Sin asignar" value="' + escapeHtml(t.responsable) + '"></div>'
    : comandaField("Responsable", t.responsable ? '<span class="comanda-field-value">' + escapeHtml(t.responsable) + " &rsaquo;</span>" : '<span class="comanda-field-value muted">Sin asignar &rsaquo;</span>', 'data-action="header-edit" data-field="responsable"');
  opRows += (editing === "atencion")
    ? '<div class="comanda-edit-inline"><input type="date" id="field-fecha-atencion" min="' + DATE_INPUT_MIN + '" max="' + DATE_INPUT_MAX + '" value="' + (t.fechaAtencion||"") + '"></div>'
    : comandaField("Atender", t.fechaAtencion ? '<span class="comanda-field-value">' + fmtDateOnlyShort(t.fechaAtencion) + " &rsaquo;</span>" : '<span class="comanda-field-value muted">Sin definir &rsaquo;</span>', 'data-action="header-edit" data-field="atencion"');
  opRows += (editing === "compromiso")
    ? '<div class="comanda-edit-inline"><input type="date" id="field-fecha-compromiso" min="' + DATE_INPUT_MIN + '" max="' + DATE_INPUT_MAX + '" value="' + (t.fechaCompromiso||"") + '"></div>'
    : comandaField("Compromiso", t.fechaCompromiso ? '<span class="comanda-field-value">' + fmtDateOnlyShort(t.fechaCompromiso) + " &rsaquo;</span>" : '<span class="comanda-field-value muted">Sin definir &rsaquo;</span>', 'data-action="header-edit" data-field="compromiso"');

  /* 5 — COMERCIAL: SOLO hechos ya calculados en otro lado (computeTotals,
     pagos) — jamás una deuda/saldo inventada aquí ("PRECIO ≠ DEUDA"). Los
     números van primero (comandaStat): en esta zona lo que se escanea es
     la cifra, no el nombre del campo. */
  var comRows = "";
  comRows += t.productos.length
    ? comandaStat("Total conocido", '<span class="comanda-field-value known">' + fmtMoney(totals.known) + " &rsaquo;</span>", 'data-action="show-productos" data-ticket="' + t.id + '" data-filter="all"')
    : comandaStat("Total conocido", '<span class="comanda-field-value muted">Sin productos &rsaquo;</span>', 'data-action="show-productos" data-ticket="' + t.id + '" data-filter="all"');
  comRows += comandaStat("Cobrado", '<span class="comanda-field-value known cobrado">' + fmtMoney(cobrado) + " &rsaquo;</span>", 'data-action="show-dinero" data-ticket="' + t.id + '"');
  if(totals.pending){
    comRows += comandaStat(totals.pending===1?"Precio pendiente":"Precios pendientes", '<span class="comanda-field-value pending">' + totals.pending + " &rsaquo;</span>", 'data-action="show-productos" data-ticket="' + t.id + '" data-filter="pending"');
  }
  comRows += comandaStat("Documentos", '<span class="comanda-field-value">' + t.documentos.length + " &rsaquo;</span>", 'data-action="show-documentos" data-ticket="' + t.id + '"');

  /* §23/§26: resumen comercial "extremadamente compacto" — SOLO en mobile
     colapsado (la regla CSS lo oculta en desktop y en expandido). Reutiliza
     los mismos `totals`/`cobrado` ya calculados arriba — nunca un segundo
     cálculo comercial. Sin "Documentos" aquí a propósito: ya está cubierto
     por el badge de la barra superior una vez expandido, y en compacto no
     hace falta duplicarlo. */
  var compactSummary =
    '<div class="comanda-compact-summary">' +
      (t.productos.length ? fmtMoney(totals.known) : "Sin productos") +
      ' <span class="comanda-compact-sep">·</span> Cobrado ' + fmtMoney(cobrado) +
    "</div>";

  return (
    '<div class="ticket-header ' + (expanded ? "th-expanded" : "th-collapsed") + (moreOpen ? " th-more-open" : "") + '">' +
      topBar +
      identity +
      actionsRow +
      compactSummary +
      '<div class="comanda-zones">' +
        '<div class="comanda-zone"><div class="comanda-zone-title">Operación</div><div class="comanda-zone-fields">' + opRows + "</div></div>" +
        '<div class="comanda-zone comanda-zone-comercial"><div class="comanda-zone-title">Comercial</div><div class="comanda-zone-fields">' + comRows + "</div></div>" +
      "</div>" +
    "</div>"
  );
}

/* Addendum "One-Click Tax & Fees" §10: una fila editable por fee, con id
   ligado al uid() propio del fee (no al índice del array) — así remover un

   renderKeepingLiveInputs() (que restaura por id) sigue funcionando

      '<select id="docform-fee-type-' + f.id + '">' +
        '<option value="percentage"' + (f.type === "fixed" ? "" : " selected") + ">%</option>" +
        '<option value="fixed"' + (f.type === "fixed" ? " selected" : "") + ">$</option>" +
      "</select>" +
      '<input type="number" id="docform-fee-value-' + f.id + '" value="' + (f.value === "" || f.value == null ? "" : f.value) + '" min="0" step="0.01" placeholder="0.00">' +
      '<button type="button" class="btn-plain" data-action="docform-remove-fee" data-fee-id="' + f.id + '" title="Quitar">&times;</button>' +

      '<button type="button" data-action="docform-add-fee" data-preset="other">Other…</button>' +

  );
}

/* V0.5 §10-18/D10: modal propio del formulario de documento — reemplaza el
   popover angosto. Una sola pantalla (sin wizard), con Bill To/productos/
   fechas/PO arriba, tax/fee en medio, y un resumen financiero en vivo
   (docform-summary) que se recalcula leyendo el propio DOM del formulario
   sin pasar por render() (igual criterio que updateProductoPreview: no
   perder foco/cursor a media edición). Ningún dato se guarda hasta
   submitDocFormCreate(). */
function renderDocFormModal(){
  if(!UI.docFormOpen || !UI.docDraft) return "";
  var t = findTicket(UI.selectedTicketId);
  if(!t) return "";
  var d = UI.docDraft;
  var isInvoice = d.tipo === "invoice";
  var items = d.items;

  var itemsHtml = items.length
    ? '<div class="doc-items-list">' + items.map(function(it, idx){
        var pending = it.precio == null;
        return (
          '<div class="doc-item-row">' +
            '<span class="doc-item-desc">' + escapeHtml(it.desc) + "</span>" +
            '<span class="doc-item-qty">×' + it.cantidad + "</span>" +
            '<span class="doc-item-price' + (pending?" pending":"") + '"><input type="number" min="0" step="0.01" data-docform-item-price="' + idx + '" placeholder="pendiente" value="' + (it.precio==null?"":it.precio) + '"></span>' +
          "</div>"
        );
      }).join("") + "</div>"
    : '<div class="doc-pending-note">Este ticket todavía no tiene productos agregados.</div>';

  var datesBlock;
  if(isInvoice){
    var initialDue = dueDateFromTerms("Due on Receipt", new Date());
    datesBlock =
      '<div class="popover-row">' +
        '<label>Terms<select id="docform-terms">' +
          TERMS_PRESETS.map(function(tp){ return '<option value="' + tp + '">' + tp + "</option>"; }).join("") +
        "</select></label>" +
        '<label>Due Date<input type="date" id="docform-duedate" min="' + DATE_INPUT_MIN + '" max="' + DATE_INPUT_MAX + '" value="' + initialDue + '"></label>' +
      "</div>" +
      '<div id="docform-terms-custom-wrap" hidden><label>Terms — texto libre<input type="text" id="docform-terms-custom" placeholder="Ej. 50% anticipo, resto contra entrega"></label></div>';
  } else {
    datesBlock = '<label>Valid Until (opcional)<input type="date" id="docform-validuntil" min="' + DATE_INPUT_MIN + '" max="' + DATE_INPUT_MAX + '"></label>';
  }

  var exemptHint = d.clientExempt
    ? '<div class="ephemeral-sub">Cliente registrado como tax exempt' + (d.clientExemptReason ? " (" + escapeHtml(d.clientExemptReason) + ")" : "") + " — tax propuesto en OFF, puedes cambiarlo.</div>"
    : "";

  return (
    '<div class="docform-overlay" id="docform-overlay">' +
      '<div class="docform-modal">' +
        '<div class="docform-head">' +
          '<div class="docform-title">' + (isInvoice ? "Nuevo invoice" : "Nueva cotización") + '<span class="docform-title-sub">' + escapeHtml(ticketLabel(t)) + " · #" + t.seq + "</span></div>" +
          '<button class="btn-plain" data-action="close-docform" title="Cerrar">&times;</button>' +
        "</div>" +
        '<div class="docform-body">' +
          '<div class="docform-grid">' +
            '<label>Cliente / empresa<input type="text" id="docform-cliente" value="' + escapeHtml(t.cliente) + '"></label>' +
            '<label>PO / Reference (opcional)<input type="text" id="docform-po" placeholder="Ej. PO-48392"></label>' +
          "</div>" +
          datesBlock +
          '<div class="docform-section-title">Productos</div>' +
          itemsHtml +
          '<div class="docform-section-title">Impuesto y cargos</div>' +
          exemptHint +
          /* Addendum §6/§8: Tax y "+ Fee" en la MISMA fila, como dos
             controles de un toque — no dos secciones separadas que haya
             que abrir. La tasa se ve directamente en el chip; cambiarla es
             la única acción "secundaria" (el campo de abajo, no obligatorio
             de tocar). */
          '<div class="docform-quickrow">' +
            '<label class="docform-chip' + (d.clientExempt?"":" on") + '" id="docform-tax-chip"><input type="checkbox" id="docform-tax-applied"' + (d.clientExempt?"":" checked") + '> Sales Tax <span id="docform-tax-chip-rate">' + (DEFAULT_SALES_TAX_RATE*100) + '%</span></label>' +
            '<div class="docform-fee-add">' +
              '<button type="button" class="docform-chip-btn" data-action="docform-add-fee-menu">+ Fee</button>' +
              (d.feeMenuOpen ? renderDocFormFeeMenu() : "") +
            "</div>" +
          "</div>" +
          '<div id="docform-tax-rate-wrap"' + (d.clientExempt?" hidden":"") + '><label>Tasa (%) — solo si necesitas cambiarla<input type="number" id="docform-tax-rate" min="0" step="0.01" value="' + (DEFAULT_SALES_TAX_RATE*100) + '"></label></div>' +
          '<div class="docform-fee-rows" id="docform-fee-rows">' + d.fees.map(renderDocFormFeeRow).join("") + "</div>" +
          '<label>Notas (opcional)<input type="text" id="docform-notas" placeholder="Se muestran en el documento"></label>' +
          '<div class="docform-summary" id="docform-summary"></div>' +
        "</div>" +
        '<div class="docform-actions"><button class="btn btn-ghost" data-action="close-docform">Cancelar</button><button class="btn btn-primary" data-action="docform-create">Crear ' + (isInvoice?"invoice":"cotización") + "</button></div>" +
      "</div>" +
    "</div>"
  );
}
/* Recalcula el resumen financiero y la visibilidad de sub-campos leyendo
   directamente el DOM del modal (nunca pasa por render(), así que nunca
   pierde el cursor a media edición) — mismo criterio que
   updateProductoPreview. Es también la única función que decide qué
   significa "el total" mientras el documento todavía no existe; una vez
   creado, ese cálculo se congela en pricing_snapshot y no se vuelve a
   correr esta función sobre él. */
function refreshDocFormUI(){
  if(!UI.docDraft) return;
  var priceInputs = document.querySelectorAll("[data-docform-item-price]");
  var subtotal = 0, pendingCount = 0;
  priceInputs.forEach(function(inp){
    var idx = Number(inp.getAttribute("data-docform-item-price"));
    var it = UI.docDraft.items[idx];
    if(!it) return;
    if(inp.value === ""){ pendingCount++; return; }
    var precio = parseFloat(inp.value);
    if(!isNaN(precio)) subtotal += precio * it.cantidad;
  });

  var taxAppliedEl = document.getElementById("docform-tax-applied");
  var taxApplied = !!(taxAppliedEl && taxAppliedEl.checked);
  var taxRateEl = document.getElementById("docform-tax-rate");
  var taxRatePct = taxRateEl ? (parseFloat(taxRateEl.value) || 0) : 0;
  var taxAmount = computeTaxAmount(subtotal, taxRatePct / 100, taxApplied);

  /* Addendum §10/§11: cada fee vive en su propia fila (id por f.id, no por
     índice) y se calcula independientemente sobre la misma base
     subtotal+tax — igual criterio que createDocumentoCore, para que el
     resumen en vivo del formulario y el snapshot que se va a congelar
     siempre coincidan. */
  var feeBase = subtotal + taxAmount;
  var feesTotal = 0;
  var feeSummaryRows = "";
  (UI.docDraft.fees || []).forEach(function(f){
    var labelEl = document.getElementById("docform-fee-label-" + f.id);
    var typeEl = document.getElementById("docform-fee-type-" + f.id);
    var valueEl = document.getElementById("docform-fee-value-" + f.id);
    var label = labelEl ? labelEl.value : (f.label || "");
    var type = typeEl ? typeEl.value : (f.type || "percentage");
    var value = valueEl ? (parseFloat(valueEl.value) || 0) : (Number(f.value) || 0);
    var amount = computeFeeAmount(feeBase, { type: type, value: value });
    feesTotal += amount;
    feeSummaryRows += '<div class="docform-sum-row"><span>' + escapeHtml(label || "Fee") + '</span><span>' + fmtMoney(amount) + "</span></div>";
  });

  var total = round2(subtotal + taxAmount + feesTotal);

  var sumEl = document.getElementById("docform-summary");
  if(sumEl){
    var html = '<div class="docform-sum-row"><span>Subtotal</span><span>' + fmtMoney(subtotal) + "</span></div>";
    html += '<div class="docform-sum-row"><span>Sales Tax' + (taxApplied ? " (" + taxRatePct + "%)" : " — off") + '</span><span>' + fmtMoney(taxAmount) + "</span></div>";
    html += feeSummaryRows;
    html += '<div class="docform-sum-row docform-sum-total"><span>TOTAL</span><span>' + fmtMoney(total) + "</span></div>";
    if(pendingCount) html += '<div class="doc-pending-note">' + pendingCount + (pendingCount===1?" producto sin precio":" productos sin precio") + " — el total se actualizará cuando lo completes.</div>";
    sumEl.innerHTML = html;
  }
  var taxRateWrap = document.getElementById("docform-tax-rate-wrap");
  if(taxRateWrap) taxRateWrap.hidden = !taxApplied;
  var taxChip = document.getElementById("docform-tax-chip");
  if(taxChip) taxChip.classList.toggle("on", taxApplied);
  var taxChipRate = document.getElementById("docform-tax-chip-rate");
  if(taxChipRate) taxChipRate.textContent = taxRatePct + "%";
  var termsEl = document.getElementById("docform-terms");
  var termsCustomWrap = document.getElementById("docform-terms-custom-wrap");
  if(termsCustomWrap && termsEl) termsCustomWrap.hidden = (termsEl.value !== "Custom");
}
/* Lee todo el formulario del DOM (mismo criterio que la createDocumento()
   original: nada se mantuvo sincronizado en UI.docDraft mientras se
   escribía) y llama al mismo núcleo compartido (createDocumentoCore) que
   usan /factura y /cotizacion — nunca una segunda función de guardado. */
async function submitDocFormCreate(){
  var t = findTicket(UI.selectedTicketId);
  if(!t || !UI.docDraft) return;
  var d = UI.docDraft;
  var isInvoice = d.tipo === "invoice";

  document.querySelectorAll("[data-docform-item-price]").forEach(function(inp){
    var idx = Number(inp.getAttribute("data-docform-item-price"));
    if(!d.items[idx]) return;
    var raw = inp.value;
    d.items[idx].precio = raw === "" ? null : parseFloat(raw);
  });

  var val = function(id){ var el = document.getElementById(id); return el ? el.value : ""; };
  var checked = function(id){ var el = document.getElementById(id); return !!(el && el.checked); };

  var clienteNombre = val("docform-cliente").trim();
  var notas = val("docform-notas").trim();
  var poReference = val("docform-po").trim() || null;
  var taxApplied = checked("docform-tax-applied");
  var taxRatePct = parseFloat(val("docform-tax-rate")) || 0;
  /* Addendum §10: cada fila de fee se lee por el id de su propio fee (no
     por índice) — mismo criterio que refreshDocFormUI. */
  var fees = (d.fees || []).map(function(f){
    return {
      label: val("docform-fee-label-" + f.id).trim(),
      type: val("docform-fee-type-" + f.id) || "percentage",
      value: parseFloat(val("docform-fee-value-" + f.id)) || 0
    };
  });

  var terms = null, dueDate = null, validUntil = null;
  if(isInvoice){
    var termsSel = val("docform-terms") || "Due on Receipt";
    terms = termsSel === "Custom" ? (val("docform-terms-custom").trim() || "Custom") : termsSel;
    dueDate = val("docform-duedate") || null;
  } else {
    validUntil = val("docform-validuntil") || null;
  }
  /* Addendum "Date Correctness" §9: un documento con Due Date/Valid Until
     absurdo (año "0002" por el mismo bug de <input type="date">) nunca
     debe poder emitirse — a diferencia de un campo del encabezado, aquí no
     hay nada que "revertir": simplemente no se crea el documento. */
  if(!isSaneDateOnly(dueDate) || !isSaneDateOnly(validUntil)){
    showToast("Fecha inválida en Due Date / Valid Until — revisa el año.");
    return;
  }

  var pricing = {
    taxApplied: taxApplied, taxRate: taxRatePct / 100,
    taxExempt: d.clientExempt, taxExemptReason: d.clientExemptReason,
    fees: fees,
    terms: terms, dueDate: dueDate, validUntil: validUntil, poReference: poReference
  };

  var items = d.items, tipo = d.tipo;
  UI.docFormOpen = false;
  UI.docDraft = null;
  render();
  var newDocId = await createDocumentoCore(t, tipo, items, clienteNombre, notas, pricing);
  if(newDocId) openDocumentViewer(newDocId, {refocus:true});
}

/* Fotos múltiples §1-11: el mismo overlay .popover de siempre (nunca uno
   nuevo), con 4 fases según UI.photoBatch — selector vacío, revisión con
   miniaturas antes de subir, progreso, y resultado solo si hubo alguna
   falla (si todo salió bien, el popover se cierra solo — mismo criterio
   que ya tenía la subida de una sola foto, sección "no molestar cuando no
   hay nada que decidir"). */
function renderPhotoBatchPopover(){
  var pb = UI.photoBatch;

  if(pb && pb.uploading){
    var total = pb.progress.total || 1;
    var pct = Math.round((pb.progress.done / total) * 100);
    return (
      '<div class="popover photo-batch-popover" id="composer-popover">' +
        '<div class="popover-title">Subiendo fotografías</div>' +
        '<div class="photo-batch-progress-label">' + pb.progress.done + " de " + pb.progress.total + "</div>" +
        '<div class="photo-batch-progress-bar"><div class="photo-batch-progress-fill" style="width:' + pct + '%"></div></div>' +
      "</div>"
    );
  }

  /* Fase de resultado: solo aparece cuando YA se intentó subir al menos una
     vez (pb.totalOriginal) y todavía quedan fotos sin subir (pb.items =
     únicamente las fallidas, listas para Reintentar — sección 7: una foto
     fallida nunca borra ni cancela las que sí se subieron). */
  if(pb && pb.totalOriginal && pb.items.length){
    return (
      '<div class="popover photo-batch-popover" id="composer-popover">' +
        '<div class="popover-title">Resultado del lote</div>' +
        '<div class="photo-batch-result-line">' + pb.succeededSoFar + " de " + pb.totalOriginal + " fotografías subidas</div>" +
        '<div class="photo-batch-result-fail">' + pb.items.length + (pb.items.length === 1 ? " no pudo subirse" : " no pudieron subirse") + "</div>" +
        '<div class="popover-actions">' +
          '<button class="btn btn-ghost" data-action="discard-photo-batch">Descartar</button>' +
          '<button class="btn btn-primary" data-action="submit-form" data-kind="archivo">Reintentar</button>' +
        "</div>" +
      "</div>"
    );
  }

  if(!pb || !pb.items.length){
    return (
      '<div class="popover photo-batch-popover" id="composer-popover">' +
        '<div class="popover-title">Adjuntar fotografías</div>' +
        '<div class="popover-form">' +
          '<label>Fotografías<input type="file" id="f-photos" accept="image/*" multiple></label>' +
          '<div class="photo-batch-hint">Hasta ' + MAX_PHOTOS_PER_BATCH + " a la vez.</div>" +
          '<div class="popover-actions"><button class="btn btn-ghost" data-action="cancel-form">Cancelar</button></div>' +
        "</div>" +
      "</div>"
    );
  }

  /* Fase de revisión: miniaturas livianas (URL.createObjectURL — nunca se
     decodifica la imagen completa solo para previsualizar, sección 8 del
     análisis) con "×" individual para quitar sin reabrir el selector
     (§11), nota de lote opcional (§10) y el botón de subir con el conteo
     real en su propia etiqueta. */
  var thumbs = pb.items.map(function(it){
    return (
      '<div class="photo-batch-thumb">' +
        '<img src="' + it.previewUrl + '" alt="">' +
        '<button type="button" class="photo-batch-remove" data-action="remove-photo-item" data-id="' + it.id + '" aria-label="Quitar esta fotografía">&times;</button>' +
      "</div>"
    );
  }).join("");
  return (
    '<div class="popover photo-batch-popover" id="composer-popover">' +
      '<div class="popover-title">Adjuntar fotografías</div>' +
      '<div class="photo-batch-count">' + pb.items.length + (pb.items.length === 1 ? " fotografía seleccionada" : " fotografías seleccionadas") + "</div>" +
      '<div class="photo-batch-grid">' + thumbs + "</div>" +
      '<div class="popover-form">' +
        '<label>Nota del lote (opcional)<input type="text" id="f-photo-caption" placeholder="Ej. Fotos del montaje terminado" value="' + escapeHtml(pb.caption || "") + '"></label>' +
        '<div class="popover-actions">' +
          '<button class="btn btn-ghost" data-action="cancel-form">Cancelar</button>' +
          '<button class="btn btn-primary" data-action="submit-form" data-kind="archivo">Subir ' + pb.items.length + (pb.items.length === 1 ? " fotografía" : " fotografías") + "</button>" +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

function renderComposer(){
  var hasTicket = !!findTicket(UI.selectedTicketId);
  var pop = "";
  if(UI.composer === "menu") pop = popoverMenu();
  else if(UI.composer === "doc_choice") pop = docChoiceMenu();
  else if(UI.composer) pop = popoverForm(UI.composer);
  else if(UI.pendingConfirm) pop = slashConfirmBanner();
  else if(UI.smartActions) pop = renderSmartActions();
  else if(UI.slashMenuOpen) pop = slashMenu();
  else if(UI.cliSuggestOpen) pop = clienteSuggestPopover();
  /* /help, /estado, /pendientes, /dinero ya NO son popovers flotantes —
     viven como mensajes efímeros dentro del hilo (ver renderEphemeralEntry),
     igual que una consola. Aquí solo quedan los overlays de "interacción"
     momentánea: confirmación, autocomplete, y ahora las acciones sugeridas
     sobre texto plano y el preview de /nuevo. */
  var plusBtn = hasTicket ? '<button class="composer-plus" data-action="toggle-menu" title="Agregar">+</button>' : "";
  /* Composer Intelligence §4: enseña los DOS prefijos de comando — "/" y
     "-" (este último pensado para teclados móviles/mexicanos donde "/" no
     está a la mano, sección 3).
     Ronda "Fluidez…" §13: en mobile el placeholder descriptivo no cabe en
     una sola línea en un iPhone chico y se corta feo — ahí se usa EXACTO
     "Escribe / o - para comandos", sin ejemplos. Desktop conserva el más
     descriptivo de siempre (con ejemplos), sin cambios. */
  var placeholder = isMobileViewport()
    ? "Escribe / o - para comandos"
    : (hasTicket ? "Escribe / o - para comandos (nota, producto, pago…)" : "Escribe / o - para comandos (buscar, nuevo, ayuda…)");
  return (
    '<div class="composer-wrap">' + pop +
      '<div class="composer">' + plusBtn +
        '<textarea id="composer-input" rows="1" placeholder="' + placeholder + '"></textarea>' +
        '<button class="composer-send" id="composer-send" data-action="send-note" disabled>&#8593;</button>' +
      "</div>" +
      '<div class="producto-preview" id="producto-preview" hidden></div>' +
    "</div>"
  );
}

/* Composer Intelligence §1/§15: panel de "Usar como…" sobre texto plano —
   chips grandes y cómodos para dedo (sección 15: "no depender de hover"),
   máximo 4-6 (suggestActionsForText ya se encarga del tope). Cada chip es
   solo etiqueta + key — el click handler en wireEvents decide a qué comando
   real despacha; esta función nunca guarda nada. */
function renderSmartActions(){
  var sa = UI.smartActions;
  if(!sa) return "";
  /* Addendum final §2/§10: Nota (índice 0 salvo que se haya navegado con
     flechas) siempre se ve marcada como "esto es lo que ejecutará Enter" —
     nunca solo al entrar en modo navegación, porque Enter ya ejecuta la
     seleccionada desde el primer momento (captura continua, sección 3). En
     touch no cambia nada: los chips siguen siendo botones normales, tocar
     cualquiera ejecuta esa acción sin importar cuál esté "seleccionada". */
  var chips = sa.actions.map(function(a, idx){
    return '<button type="button" class="smart-action-chip' + (idx === sa.navIndex ? " selected" : "") + '" data-action="smart-action" data-key="' + a.key + '">' + escapeHtml(a.label) + "</button>";
  }).join("");
  /* §14: mismo motivo que slashConfirmBanner — "Esc para cancelar" no sirve
     sin teclado físico. Se agrega un botón real; el hint se queda para
     desktop y se oculta en mobile por CSS. Addendum final §11: no se agrega
     ningún hint nuevo sobre Left/Right — en mobile no aplica. */
  return (
    '<div class="smart-actions" id="smart-actions">' +
      '<div class="smart-actions-label">Usar como:</div>' +
      '<div class="smart-actions-chips">' + chips + "</div>" +
      '<div class="smart-actions-footer">' +
        '<div class="smart-actions-hint">Esc para cancelar</div>' +
        '<button type="button" class="btn-plain smart-actions-cancel-btn" data-action="smart-action-cancel">Cancelar</button>' +
      "</div>" +
    "</div>"
  );
}

/* Vista previa en vivo de /producto (sección 6): usa el MISMO parser que
   guarda (parseProductoArg) en modo solo-lectura — nunca hay una segunda
   copia de la lógica para "cómo se ve" vs "qué se guarda". Se actualiza con
   cada tecla directamente sobre el DOM (sin pasar por render()) para no
   perder la posición del cursor a media edición; es puramente ephemeral,
   nunca toca STATE ni Supabase. */
function updateProductoPreview(rawValue){
  var el = document.getElementById("producto-preview");
  if(!el) return;
  /* Ronda "Fluidez, Confiabilidad, Realtime y QA" §16: bug real encontrado
     en la auditoría de paridad "/"-"-" — esta vista previa solo reconocía
     "/producto", nunca "-producto", así que escribir con el prefijo "-"
     (el pensado para teclados móviles/mexicanos, sección 3) se quedaba sin
     el preview de precio en vivo aunque el comando sí se ejecutara igual al
     enviarlo. Mismo [\/\-] que ya usa el resto del compositor. */
  var m = rawValue.match(/^[\/\-](producto|product)(\s+(.*))?$/i);
  if(!m || !(m[3] || "").trim()){ el.hidden = true; el.innerHTML = ""; return; }
  var p = parseProductoArg(m[3]);
  if(!p.desc){ el.hidden = true; el.innerHTML = ""; return; }
  var html = '<span class="pv-qty">' + p.cantidad + " ×</span> <span class=\"pv-desc\">" + escapeHtml(p.desc) + "</span>";
  if(p.precio == null){
    html += ' · <span class="pv-pending">precio pendiente</span>';
  } else {
    html += ' · <span class="pv-price">' + fmtMoney(p.precio) + " c/u</span> · <span class=\"pv-total\">Total " + fmtMoney(p.cantidad * p.precio) + "</span>";
  }
  el.innerHTML = html;
  el.hidden = false;
}

/* ---------------- slash commands: UI (autocomplete, ayuda, confirmación, tarjetas efímeras) ----------------
   Todo esto lee del registro COMMANDS (definido más abajo junto a su lógica
   de despacho) — no existe una segunda lista ni un segundo texto de ayuda
   que haya que mantener sincronizado a mano. */

function visibleCommands(hasTicket){
  return COMMANDS.filter(function(c){ return hasTicket || !c.requiresTicket; });
}
/* Extraído de filterCommands() (§15) para poder reutilizar SOLO el match de
   alias-por-prefijo, sin el fallback de buscar en la descripción — eso es
   lo que necesita el autocomplete sin prefijo ("prod" sin "/"): un texto
   suelto que además matcheara por descripción sería demasiado impreciso
   para secuestrar silenciosamente lo que el usuario está escribiendo. */
function filterCommandsByAliasPrefix(hasTicket, fragment){
  var pool = visibleCommands(hasTicket);
  fragment = (fragment || "").toLowerCase();
  if(!fragment) return pool;
  return pool.filter(function(c){
    return c.aliases.some(function(a){ return a.toLowerCase().indexOf(fragment) === 0; });
  });
}
function filterCommands(hasTicket, fragment){
  var byAlias = filterCommandsByAliasPrefix(hasTicket, fragment);
  fragment = (fragment || "").toLowerCase();
  if(!fragment || byAlias.length) return byAlias;
  // Sin coincidencia de alias: solo buscamos también en la descripción si el
  // fragmento ya es específico — con 1-2 letras casi cualquier texto libre
  // "matchea" algo, y eso deja de ser un filtro útil.
  if(fragment.length < 3) return [];
  return visibleCommands(hasTicket).filter(function(c){ return c.summary.toLowerCase().indexOf(fragment) !== -1; });
}

function slashMenu(){
  var hasTicket = !!findTicket(UI.selectedTicketId);
  var list = filterCommands(hasTicket, UI.slashQuery);
  if(UI.slashActiveIndex >= list.length) UI.slashActiveIndex = 0;
  var html = '<div class="slash-menu" id="slash-menu">';
  if(!list.length){
    html += '<div class="slash-menu-item" style="color:var(--text-faint);">Sin comandos que coincidan.</div>';
  } else {
    list.forEach(function(c, idx){
      html += '<button class="slash-menu-item' + (idx===UI.slashActiveIndex?" active":"") + '" data-slash-cmd="' + c.aliases[0] + '"><code>/' + c.aliases[0] + '</code><span class="desc">' + escapeHtml(c.summary) + '</span></button>';
    });
  }
  html += "</div>";
  return html;
}

/* Autocomplete predictivo de /cliente (secciones 1.2/6.2/6.3): mismo
   componente visual que el menú de "/" (.slash-menu), mismo rankClientes
   que usa la sección Clientes — nunca un tercer buscador con su propio
   criterio. Vacío después de "/cliente " ya muestra frecuentes, escribir
   filtra en vivo sin esperar Enter. */
function clienteSuggestList(){ return rankClientes(UI.cliSuggestQuery).slice(0, 8); }
function clienteSuggestPopover(){
  var list = clienteSuggestList();
  if(UI.cliSuggestIndex >= list.length) UI.cliSuggestIndex = 0;
  var html = '<div class="slash-menu" id="cli-suggest-menu">';
  if(!list.length){
    html += '<div class="slash-menu-item" style="color:var(--text-faint);">' +
      (STATE.clientes.length ? "Sin coincidencias — Enter para buscar de todos modos." : "Aún no hay clientes registrados.") +
      "</div>";
  } else {
    list.forEach(function(c, idx){
      html += '<button class="slash-menu-item' + (idx===UI.cliSuggestIndex?" active":"") + '" data-cli-suggest-idx="' + idx + '"><code>' + escapeHtml(c.nombre) + '</code><span class="desc">' + (c.empresa ? escapeHtml(c.empresa) : "") + "</span></button>";
    });
  }
  html += "</div>";
  return html;
}
/* execute=true (Enter o clic): resuelve directamente al cliente elegido,
   igual que tocar un resultado de "varias coincidencias" en /cliente.
   execute=false (Tab): solo completa el texto del compositor, sin
   ejecutar — el usuario decide cuándo confirmar. */
function chooseCliSuggestion(idx, execute){
  var list = clienteSuggestList();
  var chosen = list[idx];
  if(!chosen) return;
  UI.cliSuggestOpen = false;
  if(execute){
    var hasTicket = !!findTicket(UI.selectedTicketId);
    pushEphemeral("cliente", hasTicket ? UI.selectedTicketId : null, { mode: hasTicket ? "ticket" : "home", resolvedId: chosen.id });
  } else {
    var text = "/cliente " + chosen.nombre;
    render();
    restoreComposerText(text);
  }
}

/* Contenido de un mensaje efímero de /help — sigue derivando exclusivamente
   del registro COMMANDS (única fuente de verdad para comandos/alias/ayuda),
   pero ahora cada comando y cada ejemplo es un botón: tocarlo escribe el
   texto en el compositor (con el cursor al final) SIN ejecutarlo, para que
   /help sirva a la vez de documentación, menú táctil y atajo de captura
   rápida (sección 4). El detalle de un comando exacto también puede
   completarse tecleando /help <comando>. */

/* Vista editable de productos (sección 7) — un solo renderer parametrizado
   reutilizado por /productos, por "Total conocido" y por "N pendientes de
   precio" en el encabezado (nunca un módulo de productos aparte). Cada
   campo se guarda solo (blur/change) llamando a updateProductoCore, la
   misma función que usaría cualquier otro camino de edición. */
function productoEditRow(t, p){
  return (
    '<div class="producto-edit-row">' +
      '<input type="text" class="pe-desc" data-producto-edit="' + p.id + '" data-field="desc" data-ticket="' + t.id + '" value="' + escapeHtml(p.desc) + '">' +
      '<input type="number" class="pe-cant" min="0" step="1" data-producto-edit="' + p.id + '" data-field="cantidad" data-ticket="' + t.id + '" value="' + p.cantidad + '">' +

/* Regla de iniciales (§17) — determinista y simple a propósito, nunca
   intenta resolver casos lingüísticos perfectos:
     2+ palabras → primera letra de las dos primeras palabras
     1 palabra   → sus primeras dos letras (una sola si la palabra mide 1)
   "Top Builder" → TB · "Angela Martinez" → AM · "Design To Go" → DT
   (toma las dos PRIMERAS palabras, no busca cuál es "más relevante" — la
   predictibilidad importa más que el resultado perfecto en cada caso). */
function initialsForName(name){
  var words = String(name || "").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return "?";
  if(words.length === 1){
    return words[0].slice(0, 2).toUpperCase() || "?";
  }
  return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
}

/* Única función de ranking/orden de clientes (sección 1.2): la usan por
   igual la sección Clientes, /cliente y cualquier otro selector de
   clientes que exista o se agregue — "no crear tres buscadores con
   comportamientos diferentes". Criterio, en este orden:
     1) coincide al inicio del nombre
     2) coincide al inicio de la empresa
     3) coincidencia parcial en el nombre
     4) coincidencia parcial en la empresa
     5) frecuencia de uso / actividad reciente, solo como desempate
   Sin texto de búsqueda, se listan directamente por actividad reciente
   (clientes "frecuentes/relevantes") — nada de esto usa una tabla ni un
   campo nuevo, todo sale de tickets ya existentes vía ticketsForCliente. */
function clienteActivityScore(c){
  var tickets = ticketsForCliente(c);
  var lastTs = 0;
  tickets.forEach(function(t){
    var ts = t.lastActivityAt ? new Date(t.lastActivityAt).getTime() : 0;
    if(ts > lastTs) lastTs = ts;
  });
  return { count: tickets.length, lastTs: lastTs };
}
function compareClienteRelevance(a, b){
  var sa = clienteActivityScore(a), sb = clienteActivityScore(b);
  if(sb.lastTs !== sa.lastTs) return sb.lastTs - sa.lastTs;
  if(sb.count !== sa.count) return sb.count - sa.count;
  return (a.nombre||"").localeCompare(b.nombre||"");
}
function clienteRankTier(c, q){
  var nombre = normalizeWord(c.nombre||"");
  var empresa = normalizeWord(c.empresa||"");
  if(nombre.indexOf(q) === 0) return 1;
  if(empresa.indexOf(q) === 0) return 2;
  if(nombre.indexOf(q) !== -1) return 3;
  if(empresa.indexOf(q) !== -1) return 4;
  return 99;
}
function rankClientes(query){
  var q = normalizeWord((query||"").trim());
  var list = STATE.clientes.slice();
  if(!q) return list.sort(compareClienteRelevance);
  return list
    .filter(function(c){ return clienteRankTier(c, q) < 99; })
    .sort(function(a,b){
      var ta = clienteRankTier(a, q), tb = clienteRankTier(b, q);
      if(ta !== tb) return ta - tb;
      return compareClienteRelevance(a, b);
    });
}
/* Envoltorio delgado sobre rankClientes que conserva el contrato original
   (query vacía = sin resultados) para no tocar el comportamiento de sus
   llamadores existentes (clienteEntryContent con resolvedId, editarcliente). */
function findClienteMatches(query){
  var q = (query || "").trim();
  if(!q) return [];
  return rankClientes(q);
}
function ticketsForCliente(c){
  return STATE.tickets.filter(function(t){ return t.clienteId === c.id; });
}
/* Cierre explícito del ticket (sección 7 de la iteración "Comanda + Entrega
   + Cierre"): fuente ÚNICA de verdad para si un ticket está vivo o
   terminado. Reemplaza al heurístico anterior (ticketIsActivo, que deducía
   "activo" observando qué sigue/tareas/precio pendiente) — ese heurístico
   generaba falsos "cerrados" apenas un ticket se quedaba sin qué-sigue
   aunque el trabajo siguiera vivo. Ahora:
     - "abierto": sin cierre — vive en AHORA, sin importar qué sigue/tareas.
     - "entregado": se marcó entregado pero NO se cerró — sigue en AHORA
       ("entregado no significa cerrado": puede faltar cobrar o admin).
     - "cerrado_pagado" / "cerrado_cancelado": cierre explícito — HISTORIA.
   Qué sigue, tareas y productos sin precio siguen existiendo igual que
   antes; simplemente ya no deciden esto. */
function ticketEstado(t){
  if(t.cierreTipo === "pagado") return "cerrado_pagado";
  if(t.cierreTipo === "cancelado") return "cerrado_cancelado";
  if(t.entregadoAt) return "entregado";
  return "abierto";
}
function ticketEstadoLabel(estado){
  return { abierto: "Abierto", entregado: "Entregado", cerrado_pagado: "Cerrado · Pagado", cerrado_cancelado: "Cerrado · Cancelado" }[estado] || "Abierto";
}
function ticketIsCerrado(t){ return !!t.cierreTipo; }
/* Rango de orden para el sidebar (sección 6: "entregado se mueve debajo de
   los activos") — solo reordena, nunca oculta: abiertos primero, entregados
   sin cerrar después, cerrados al final de su mismo grupo de fecha. */
function ticketOrderRank(t){
  var e = ticketEstado(t);
  if(e === "abierto") return 0;
  if(e === "entregado") return 1;
  return 2; // cerrado_pagado / cerrado_cancelado
}
/* ---------------- V0.5 §8: vistas operativas ----------------
   Las tres son filtros puros sobre STATE.tickets — ningún estado nuevo,
   ninguna tabla nueva, ningún segundo modelo de "producción". Se apoyan
   exclusivamente en ticketEstado()/ticketIsCerrado() (fuente única de
   verdad ya existente) y en los campos que ya existen en cada ticket. */

/* Vencidos primero (fecha de atención más antigua = más vencido), luego
   hoy; el filtro ya garantiza que nada de "después" entra aquí. Incluye
   Entregado-sin-cerrar si todavía tiene atención pendiente (V0.5 §8.1). */
function ticketsAtencion(){
  /* Addendum "Date Correctness": t.fechaAtencion es una fecha CALENDARIO
     ("YYYY-MM-DD"), no un timestamp. `startOfDay(stringDeFecha)` pasaba por
     `new Date(str)` (que interpreta el string como medianoche UTC) y
     recién ahí aplicaba setHours en hora LOCAL — en una zona detrás de UTC
     (Brownsville TX incluida) eso corría el día un día hacia atrás, así que
     un ticket con Atender = 4-sep podía aparecer como vencido desde el
     3-sep. parseDateOnly nunca pasa por UTC. */
  var today = startOfDay(new Date());
  return STATE.tickets.filter(function(t){
    if(ticketIsCerrado(t)) return false;
    if(!t.fechaAtencion) return false;
    var da = parseDateOnly(t.fechaAtencion);
    return !!da && da <= today;
  }).sort(function(a,b){
    var da = parseDateOnly(a.fechaAtencion), db = parseDateOnly(b.fechaAtencion);
    if(da && db && da - db !== 0) return da - db;
    return new Date(b.lastActivityAt) - new Date(a.lastActivityAt);
  });
}
/* Abierto (nunca entregado/cerrado) con al menos una tarea de producción
   sin terminar (V0.5 §8.2) — reutiliza t.tareas tal cual existen hoy. */
function ticketsProduccion(){
  return STATE.tickets.filter(function(t){
    if(ticketEstado(t) !== "abierto") return false;
    return (t.tareas||[]).some(function(x){ return x.tipo === "produccion" && x.estado !== "terminado"; });
  }).sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
}
/* Todo ticket con cierre explícito, más reciente primero (V0.5 §8.3). */
function ticketsCerrados(filter){
  return STATE.tickets.filter(function(t){
    if(!ticketIsCerrado(t)) return false;
    if(filter === "pagados") return t.cierreTipo === "pagado";
    if(filter === "cancelados") return t.cierreTipo === "cancelado";
    return true;
  }).sort(function(a,b){ return new Date(b.cerradoAt) - new Date(a.cerradoAt); });
}

  );

function clienteFinancials(c){
  var tickets = ticketsForCliente(c);
  var known = 0, cobrado = 0, pend = 0, activos = 0, lastTs = 0;
  tickets.forEach(function(t){
    var totals = computeTotals(t);
    known += totals.known; pend += totals.pending;
    cobrado += t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
    if(!ticketIsCerrado(t)) activos++;
    var ts = t.lastActivityAt ? new Date(t.lastActivityAt).getTime() : 0;
    if(ts > lastTs) lastTs = ts;
  });
  /* V0.5 §8.4/D9: ya NO se expone "saldo" (known - cobrado) — "total
     conocido" no es una factura emitida ni una deuda; restarlo y llamarlo
     "saldo" comunica una cuenta por cobrar que no existe todavía. Quien
     necesite known/cobrado por separado los tiene aquí sin combinarlos. */
  return { tickets: tickets, known: known, cobrado: cobrado, pend: pend,
    activos: activos, lastActivityAt: lastTs ? new Date(lastTs).toISOString() : null };
}
function clienteFichaContent(c, t, mode){

  if(fin.tickets.length){
    lines.push(["Tickets relacionados", fin.tickets.map(ticketLabel).join(", ")]);
    lines.push(["Total conocido (todos sus tickets)", fmtMoney(fin.known) + (fin.pend ? " (+" + fin.pend + " sin precio)" : "")]);
    lines.push(["Cobrado (todos sus tickets)", fmtMoney(fin.cobrado)]);
  }
  var html = lines.map(lineRow).join("");
  if(mode === "ticket" && t){

    }
  } else {
    /* Fuera de un ticket, /cliente solo consulta (sección 1.10) — el
       resumen efímero siempre ofrece el camino a la ficha completa, que es
       donde vive AHORA/HISTORIA, archivos y documentos. */
    html += '<button class="help-cmd-btn" data-action="open-cliente-ficha" data-client-id="' + c.id + '"><span class="desc">Abrir ficha completa &#8594;</span></button>';
  }
  return { title: clienteLabel(c), html: html };
}
function clienteEntryContent(entry){
  if(STATE.clientesTableMissing){
    return { title: "Clientes", html: '<div class="ephemeral-sub">La función de clientes todavía no está activada — falta aplicar una migración pendiente en Supabase. Mientras tanto, "Cliente" sigue funcionando como texto libre en el encabezado del ticket.</div>' };
  }
  var t = entry.ticketId ? findTicket(entry.ticketId) : null;
  var mode = (entry.params && entry.params.mode) || (t ? "ticket" : "home");
  var query = (entry.params && entry.params.query) || "";
  if(entry.params && entry.params.resolvedId){
    var resolved = STATE.clientes.filter(function(c){ return c.id === entry.params.resolvedId; })[0];
    if(!resolved) return { title: "Cliente", html: '<div class="ephemeral-sub">Ese cliente ya no existe.</div>' };
    return clienteFichaContent(resolved, t, mode);
  }
  if(!query.trim()){
    /* /cliente sin nada después (sección 1.2): en vez de pedir ayuda,
       muestra de inmediato los clientes frecuentes/relevantes — mismo
       rankClientes("") que usa la sección Clientes con el buscador vacío. */
    var frequent = rankClientes("").slice(0, 8);
    if(!frequent.length){
      var emptyHtml = '<div class="ephemeral-sub">Todavía no hay clientes registrados.' +
        (mode === "ticket" ? " Escribe /cliente seguido de un nombre para crear el primero." : "") + "</div>";
      return { title: "Clientes", html: emptyHtml };
    }
    var freqRows = frequent.map(function(c){
      return '<button class="help-cmd-btn" data-action="cliente-select" data-client-id="' + c.id + '" data-ticket="' + (t?t.id:"") + '" data-mode="' + mode + '"><span class="desc">' + escapeHtml(clienteLabel(c)) + "</span></button>";
    }).join("");
    var freqFooter = mode !== "ticket" ? '<button class="help-cmd-btn" data-action="go-clientes"><span class="desc">Ver todos en Clientes &#8594;</span></button>' : "";
    return { title: "Clientes frecuentes", html: freqRows + freqFooter + '<div class="ephemeral-sub">Sigue escribiendo un nombre o empresa para buscar.</div>' };
  }
  var matches = findClienteMatches(query);
  var title = 'Cliente — "' + query + '"';
  if(matches.length === 1) return clienteFichaContent(matches[0], t, mode);
  if(matches.length > 1){
    var rows = matches.map(function(c){
