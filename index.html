<meta charset="utf-8">
<title>Design To Go</title>
<style id="dtg-style">
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#ECE9E0; --surface-3:#E1DDD0;
  --border:#DEDACB; --text:#211F1A; --text-muted:#726C5C; --text-faint:#A39C89;
  --accent:#C4006B; --accent-ink:#8C004C; --accent-soft:#F7DCE9;
  --cyan:#00728F; --cyan-soft:#D9EDF2;
  --gold:#9C6A08; --gold-soft:#F1E3BF;
  --danger:#B3261E; --danger-soft:#F6DCD9;
  --shadow:0 1px 2px rgba(33,31,26,.07),0 8px 24px rgba(33,31,26,.08);
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17161A; --surface:#1D1C21; --surface-2:#232228; --surface-3:#2B2A32;
    --border:#35333B; --text:#EDEBE6; --text-muted:#9A968C; --text-faint:#69655C;
    --accent:#FF4FA0; --accent-ink:#FF86BF; --accent-soft:#3B1E2C;
    --cyan:#3FC3E8; --cyan-soft:#12313B;
    --gold:#E7B23D; --gold-soft:#3A2E12;
    --danger:#FF6B61; --danger-soft:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17161A; --surface:#1D1C21; --surface-2:#232228; --surface-3:#2B2A32;
  --border:#35333B; --text:#EDEBE6; --text-muted:#9A968C; --text-faint:#69655C;
  --accent:#FF4FA0; --accent-ink:#FF86BF; --accent-soft:#3B1E2C;
  --cyan:#3FC3E8; --cyan-soft:#12313B;
  --gold:#E7B23D; --gold-soft:#3A2E12;
  --danger:#FF6B61; --danger-soft:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,select,textarea{font:inherit; color:inherit;}
input,select,textarea{background:transparent;}
button{cursor:pointer;}
::selection{background:var(--accent-soft);}
.app{display:flex; height:100vh; width:100vw;}

/* ---------- sidebar ---------- */
.sidebar{
  width:290px; flex-shrink:0; background:var(--surface-2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100%;
}
.sidebar-top{padding:14px 14px 10px; display:flex; flex-direction:column; gap:8px;}
.brand{
  display:flex; align-items:baseline; gap:6px; padding:2px 2px 6px;
  font-family:var(--font-mono); letter-spacing:.02em;
}
.brand-mark{color:var(--accent); font-weight:600;}
.brand-name{color:var(--text); font-weight:600; font-size:13px;}
.btn{
  border:1px solid transparent; border-radius:var(--radius-s); padding:8px 12px;
  font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:background .12s ease, border-color .12s ease, opacity .12s ease;
}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
.btn-primary{background:var(--accent); color:#fff; justify-content:center;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--text);}
.btn-ghost:hover{background:var(--surface-3);}
.btn-plain{background:transparent; border:none; color:var(--text-muted); padding:6px 8px;}
.btn-plain:hover{color:var(--text); background:var(--surface-3); border-radius:var(--radius-s);}
.search-wrap{position:relative;}
.search-wrap input{
  width:100%; padding:8px 10px 8px 30px; border:1px solid var(--border); border-radius:var(--radius-s);
  background:var(--surface); font-size:13px;
}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55;}
.nav-stubs{list-style:none; margin:4px 0 2px; padding:0 6px; display:flex; flex-direction:column; gap:1px;}
.nav-stub{
  display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:var(--radius-s);
  color:var(--text-muted); font-size:13px; background:none; border:none; width:100%; text-align:left;
}
.nav-stub:hover{background:var(--surface-3); color:var(--text);}
.nav-stub .tag{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); border:1px solid var(--border); border-radius:999px; padding:1px 6px;}
.sidebar-scroll{flex:1; overflow-y:auto; padding:6px 8px 10px;}
.group-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);
  padding:14px 8px 6px; font-weight:600;
}
.group-label:first-child{padding-top:6px;}
.ticket-row{
  display:flex; flex-direction:column; gap:3px; width:100%; text-align:left; border:none; background:none;
  padding:8px 8px; border-radius:var(--radius-s); position:relative;
}
.ticket-row:hover{background:var(--surface-3);}
.ticket-row.active{background:var(--surface); box-shadow:var(--shadow);}
.ticket-row-top{display:flex; align-items:center; gap:6px; justify-content:space-between;}
.ticket-title{font-weight:600; font-size:13.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ticket-pin{color:var(--gold); flex-shrink:0;}
.ticket-meta{display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:11.5px;}
.pill{
  display:inline-flex; align-items:center; padding:1px 7px; border-radius:999px; font-size:11px;
  font-weight:600; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis;
}
.pill-neutral{background:var(--surface-3); color:var(--text-muted);}
.pill-accent{background:var(--accent-soft); color:var(--accent-ink);}
.empty-list{color:var(--text-faint); font-size:12.5px; padding:16px 10px; text-align:center;}
.whoami-bar{
  border-top:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:8px;
  font-size:12.5px; color:var(--text-muted);
}
.whoami-bar input{
  flex:1; min-width:0; border:1px solid var(--border); border-radius:var(--radius-s); padding:5px 8px;
  background:var(--surface); color:var(--text); font-size:12.5px;
}

/* ---------- main ---------- */
.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%; position:relative;}
.readonly-banner{
  background:var(--gold-soft); color:var(--gold); font-size:12.5px; font-weight:600;
  padding:7px 20px; border-bottom:1px solid var(--border); text-align:center;
}
.empty-state{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--text-muted); text-align:center; padding:20px;
}
.empty-state h1{font-size:17px; color:var(--text); font-weight:600; margin:0;}
.empty-state p{margin:0; max-width:340px; font-size:13.5px;}

.ticket-header{
  border-bottom:1px solid var(--border); padding:14px 22px 10px; background:var(--surface);
  display:flex; flex-direction:column; gap:8px; flex-shrink:0;
}
.ticket-header-top{display:flex; align-items:center; gap:10px; justify-content:space-between;}
.ticket-id{font-family:var(--font-mono); color:var(--text-faint); font-size:12px;}
.ticket-header-actions{display:flex; align-items:center; gap:4px;}
.field-grid{display:flex; flex-wrap:wrap; gap:6px 4px; align-items:center;}
.field{display:flex; align-items:center; gap:6px; min-width:0;}
.field-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); white-space:nowrap;}
.field input[type=text], .field input[type=date], .field select{
  border:1px solid transparent; background:transparent; border-radius:var(--radius-s);
  padding:4px 7px; font-size:13px; color:var(--text); min-width:60px;
}
.field input[type=text]{width:150px;}
.field input:hover, .field select:hover{background:var(--surface-3);}
.field input:focus, .field select:focus{background:var(--surface); border-color:var(--border);}
.field input::placeholder{color:var(--text-faint);}
.totals-line{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono);}
.totals-line .known{color:var(--text); font-weight:600;}
.totals-line .pending{color:var(--gold);}

.thread{flex:1; overflow-y:auto; padding:16px 22px 8px;}
.thread-item{display:flex; gap:10px; padding:7px 0; max-width:640px;}
.thread-dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--text-faint);}
.thread-dot.nota{background:var(--accent);}
.thread-dot.producto{background:var(--cyan);}
.thread-dot.tarea{background:var(--text-faint);}
.thread-dot.tarea_produccion{background:var(--cyan);}
.thread-dot.pago{background:var(--gold);}
.thread-dot.documento{background:var(--accent);}
.thread-dot.archivo{background:var(--text-muted);}
.thread-dot.sistema{background:var(--border);}
.thread-body{min-width:0; flex:1;}
.thread-meta{font-size:11.5px; color:var(--text-faint); margin-bottom:2px;}
.thread-meta .autor{color:var(--text-muted); font-weight:600;}
.thread-text{font-size:13.5px; color:var(--text); white-space:pre-wrap; word-break:break-word;}
.thread-sub{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono); margin-top:1px;}
.thread-img{margin-top:6px; max-width:260px; border-radius:var(--radius-m); border:1px solid var(--border); display:block;}
.prod-toggle{
  display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; flex-shrink:0;
}
.prod-toggle button{
  border:none; background:var(--surface); padding:3px 9px; font-size:11px; color:var(--text-muted); font-weight:600;
}
.prod-toggle button.on{background:var(--cyan); color:#fff;}
.prod-toggle button+button{border-left:1px solid var(--border);}

.tasks-panel{border-bottom:1px solid var(--border); background:var(--surface); padding:10px 22px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; max-height:130px; overflow-y:auto;}
.tasks-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600;}
.task-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.task-row.done .task-desc{color:var(--text-faint); text-decoration:line-through;}
.task-check{
  width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); flex-shrink:0; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
}
.task-check.on{background:var(--cyan); border-color:var(--cyan);}
.task-desc{flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.task-extra{color:var(--text-faint); font-size:11px; white-space:nowrap;}

.composer-wrap{border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; position:relative;}
.popover{
  position:absolute; bottom:100%; left:20px; margin-bottom:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-m); box-shadow:var(--shadow); padding:10px; width:280px; z-index:20;
}
.popover-menu-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 8px; border:none;
  background:none; border-radius:var(--radius-s); font-size:13px;
}
.popover-menu-item:hover{background:var(--surface-3);}
.popover-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:2px 6px 8px; font-weight:600;}
.popover-form{display:flex; flex-direction:column; gap:8px;}
.popover-form label{font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:3px;}
.popover-form input, .popover-form select{
  border:1px solid var(--border); border-radius:var(--radius-s); padding:6px 8px; font-size:13px; background:var(--surface);
}
.popover-row{display:flex; gap:6px;}
.popover-row > label{flex:1; min-width:0;}
.popover-actions{display:flex; justify-content:flex-end; gap:6px; margin-top:2px;}
.radio-row{display:flex; gap:12px; font-size:12.5px; color:var(--text); align-items:center;}
.radio-row label{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text);}
.composer{display:flex; align-items:flex-end; gap:8px; padding:12px 20px;}
.composer-plus{
  width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; color:var(--text-muted);
}
.composer-plus:hover{background:var(--surface-3); color:var(--text);}
.composer textarea{
  flex:1; resize:none; border:1px solid var(--border); border-radius:var(--radius-l); padding:9px 14px;
  font-size:13.5px; max-height:120px; background:var(--bg);
}
.composer-send{
  width:32px; height:32px; border-radius:50%; border:none; background:var(--accent); color:#fff; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.composer-send:disabled{opacity:.35; cursor:default;}
.composer-send:not(:disabled):hover{background:var(--accent-ink);}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
  padding:9px 16px; border-radius:999px; font-size:12.5px; box-shadow:var(--shadow); z-index:50; opacity:0;
  pointer-events:none; transition:opacity .18s ease, transform .18s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;} }

@media (max-width: 880px){
  .sidebar{position:fixed; inset:0 auto 0 0; z-index:30; transform:translateX(-100%); transition:transform .18s ease;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-toggle{display:inline-flex!important;}
}
.sidebar-toggle{display:none; margin-right:4px;}
.fatal-banner{
  background:var(--danger-soft); color:var(--danger); font-size:12.5px; font-weight:600;
  padding:7px 20px; border-bottom:1px solid var(--border); text-align:center;
}
.syncing-dot{
  width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; margin-left:6px;
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
@media (prefers-reduced-motion: reduce){ .syncing-dot{animation:none;} }

/* ---------- documento comercial: tarjeta en el thread ---------- */
.doc-card{
  display:flex; flex-direction:column; gap:2px; text-align:left; width:100%; max-width:340px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:10px 14px; margin-top:2px; cursor:pointer; transition:border-color .12s ease, box-shadow .12s ease;
}
.doc-card:hover{ border-color:var(--accent); box-shadow:var(--shadow); }
.doc-card-title{ font-weight:600; font-size:13.5px; color:var(--text); }
.doc-card-cliente{ font-size:12.5px; color:var(--text-muted); }
.doc-card-total{ font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--text); margin-top:2px; }
.doc-card-meta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.doc-card-link{ font-size:12px; color:var(--accent); font-weight:600; margin-top:4px; }

/* ---------- documento comercial: elección de tipo + formulario ---------- */
.doc-type-choice{ display:flex; flex-direction:column; gap:6px; }
.doc-items-list{ display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
.doc-item-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.doc-item-desc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-item-qty{ color:var(--text-muted); flex-shrink:0; }
.doc-item-price{ width:80px; flex-shrink:0; }
.doc-item-price input{ width:100%; border:1px solid var(--border); border-radius:var(--radius-s); padding:4px 6px; font-size:12.5px; background:var(--surface); }
.doc-item-price.pending input{ border-color:var(--gold); background:var(--gold-soft); }
.doc-pending-note{ font-size:11.5px; color:var(--gold); }
.doc-total-preview{ font-family:var(--font-mono); font-weight:600; font-size:13.5px; border-top:1px solid var(--border); padding-top:6px; margin-top:2px; }

/* ---------- documento comercial: modal de vista limpia ---------- */
.doc-modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.doc-modal{
  background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow);
  width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:28px 32px;
  display:flex; flex-direction:column; gap:14px;
}
.doc-modal-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.doc-modal-back{ font-size:12.5px; color:var(--text-muted); background:none; border:none; cursor:pointer; padding:4px 0; }
.doc-modal-back:hover{ color:var(--text); }
.doc-modal-actions{ display:flex; gap:6px; }
.doc-modal-brand{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; color:var(--text-faint); text-transform:uppercase; }
.doc-modal-heading{ font-size:19px; font-weight:600; color:var(--text); }
.doc-modal-sub{ font-size:12.5px; color:var(--text-muted); }
.doc-modal-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
.doc-modal-table th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:600; padding:0 0 6px; border-bottom:1px solid var(--border); }
.doc-modal-table td{ padding:7px 0; border-bottom:1px solid var(--border); color:var(--text); }
.doc-modal-table td.num, .doc-modal-table th.num{ text-align:right; font-family:var(--font-mono); }
.doc-modal-total-row td{ border-bottom:none; font-weight:600; font-size:15px; padding-top:10px; }
.doc-modal-notes{ font-size:12.5px; color:var(--text-muted); white-space:pre-wrap; }
.doc-modal-pending{ color:var(--gold); font-size:11.5px; }

@media print{
  body > *:not(.doc-modal-overlay){ display:none!important; }
  .doc-modal-overlay{ position:static; background:none; padding:0; display:block; }
  .doc-modal{ box-shadow:none; max-width:none; max-height:none; width:auto; border-radius:0; padding:0; }
  .doc-modal-back, .doc-modal-actions{ display:none!important; }
}

/* ---------- slash commands ---------- */
.slash-menu{
  position:absolute; bottom:100%; left:20px; margin-bottom:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow);
  width:260px; padding:6px; z-index:20;
}
.slash-menu-item{
  display:flex; align-items:baseline; gap:8px; width:100%; text-align:left; padding:7px 8px; border:none;
  background:none; border-radius:var(--radius-s); font-size:13px;
}
.slash-menu-item.active, .slash-menu-item:hover{ background:var(--surface-3); }
.slash-menu-item code{ font-family:var(--font-mono); color:var(--accent); font-weight:600; }
.slash-menu-item span.desc{ color:var(--text-muted); font-size:12px; }
.slash-help{
  position:absolute; bottom:100%; left:20px; right:20px; margin-bottom:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow);
  padding:12px 14px; font-size:12.5px; color:var(--text); z-index:20; max-height:220px; overflow-y:auto;
}
.slash-help code{ font-family:var(--font-mono); color:var(--accent); }
.slash-help-row{ margin-bottom:6px; }
.slash-help-row .ex{ color:var(--text-muted); font-size:12px; margin-left:2px; }
.slash-confirm{
  position:absolute; bottom:100%; left:20px; margin-bottom:8px; background:var(--surface);
  border:1px solid var(--accent); border-radius:var(--radius-m); box-shadow:var(--shadow);
  padding:10px 14px; z-index:20; display:flex; flex-direction:column; gap:6px; min-width:220px;
}
.slash-confirm-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:600; }
.slash-confirm-amount{ font-family:var(--font-mono); font-weight:600; font-size:15px; color:var(--text); }
.slash-confirm-hint{ font-size:11.5px; color:var(--text-muted); }
.slash-error{ color:var(--danger); font-size:12px; }
</style>

var UI = { selectedTicketId: null, search: "", composer: null, sidebarOpen: false, whoami: "",
  docDraft: null, viewingDocId: null, slashMenuOpen: false, slashQuery: "", slashActiveIndex: 0,
  pendingConfirm: null, slashHelp: null, ephemeralCard: null };
var FATAL_ERROR = null;
var signedUrlCache = {};

function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function fmtMoney(n){
  if(n==null || isNaN(n)) return "";
  return "$" + Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtTime(iso){
  try{ return new Date(iso).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
}
function fmtDateShort(iso){
  try{ return new Date(iso).toLocaleDateString("es-MX",{day:"2-digit",month:"short"}); }catch(e){ return ""; }
}

/* ---------------- local UI-only storage (never the source of truth) ---------------- */

function loadUi(){
  try{
    var raw = localStorage.getItem("dtg_ui");
    if(raw){
      var parsed = JSON.parse(raw);
      UI.selectedTicketId = parsed.selectedTicketId || null;
      UI.search = parsed.search || "";
    }
  }catch(e){}
  try{ UI.whoami = localStorage.getItem("dtg_whoami") || ""; }catch(e){ UI.whoami = ""; }
}
function saveUi(){
  try{ localStorage.setItem("dtg_ui", JSON.stringify({selectedTicketId:UI.selectedTicketId, search:UI.search})); }catch(e){}
}
function saveWhoami(v){
  UI.whoami = v;
  try{ localStorage.setItem("dtg_whoami", v); }catch(e){}
  rememberName(v);
}

/* ---------------- Supabase: session, fetch, realtime ---------------- */

async function ensureSession(){
  var got = await sb.auth.getSession();
  if(got.data && got.data.session) return got.data.session;
  var signed = await sb.auth.signInAnonymously();
  if(signed.error) throw signed.error;
  return signed.data.session;
}

async function fetchAllState(){
  var results = await Promise.all([
    sb.from("tickets").select("*"),
    sb.from("productos").select("*"),
    sb.from("tareas").select("*"),
    sb.from("pagos").select("*"),
    sb.from("bitacora").select("*").order("ts", {ascending:true}),
    sb.from("app_settings").select("*"),
    sb.from("documentos").select("*")
  ]);
  for(var i=0;i<results.length;i++){ if(results[i].error) throw results[i].error; }
  var ticketsRows = results[0].data, productosRows = results[1].data, tareasRows = results[2].data,
      pagosRows = results[3].data, bitacoraRows = results[4].data, settingsRows = results[5].data,
      documentosRows = results[6].data;

  var byTicket = {};
  ticketsRows.forEach(function(row){
    byTicket[row.id] = {
      id: row.id, seq: row.seq, createdAt: row.created_at, lastActivityAt: row.last_activity_at,
      pinned: row.pinned, cliente: row.cliente || "", queSigue: row.que_sigue || "",
      responsable: row.responsable || "", fechaAtencion: row.fecha_atencion || "", fechaCompromiso: row.fecha_compromiso || "",
      productos: [], tareas: [], pagos: [], documentos: [], thread: []
    };
  });
  productosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.productos.push({ id: row.id, desc: row.descripcion, cantidad: row.cantidad==null?1:Number(row.cantidad), precio: row.precio==null?null:Number(row.precio) });
  });
  tareasRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.tareas.push({ id: row.id, desc: row.descripcion, tipo: row.tipo, responsable: row.responsable || "", fechaAtencion: row.fecha_atencion || "", estado: row.estado });
  });
  pagosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.pagos.push({ id: row.id, monto: Number(row.monto), fecha: row.fecha, metodo: row.metodo || "", concepto: row.concepto || "" });
  });
  documentosRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    t.documentos.push({ id: row.id, tipo: row.tipo, numero: row.numero, clienteNombre: row.cliente_nombre || "", notas: row.notas || "", items: row.items || [], total: Number(row.total), autor: row.autor, createdAt: row.created_at });
  });
  bitacoraRows.forEach(function(row){
    var t = byTicket[row.ticket_id]; if(!t) return;
    var ev = Object.assign({ id: row.id, type: row.tipo, ts: row.ts, autor: row.autor }, row.payload || {});
    t.thread.push(ev);
  });
  var settings = { queSigueOptions: [], teamNames: [] };
  settingsRows.forEach(function(row){
    if(row.key === "que_sigue_options") settings.queSigueOptions = row.values || [];
    if(row.key === "team_names") settings.teamNames = row.values || [];
  });
  return { meta: settings, tickets: Object.keys(byTicket).map(function(k){ return byTicket[k]; }) };
}

var refreshInFlight = null;
async function refreshFromServer(){
  if(refreshInFlight) return refreshInFlight;
  refreshInFlight = (async function(){
    try{
      var fresh = await fetchAllState();
      STATE = fresh;
      if(UI.selectedTicketId && !findTicket(UI.selectedTicketId)) UI.selectedTicketId = null;
      render();
    }catch(e){
      showToast("No se pudo sincronizar: " + (e.message || "error de red"));
    }finally{
      refreshInFlight = null;
    }
  })();
  return refreshInFlight;
}

var realtimeTimer = null;
function scheduleRefresh(){ clearTimeout(realtimeTimer); realtimeTimer = setTimeout(refreshFromServer, 300); }
function subscribeRealtime(){
  var channel = sb.channel("dtg-changes");
  ["tickets","productos","tareas","pagos","bitacora","app_settings","documentos"].forEach(function(table){
    channel.on("postgres_changes", { event: "*", schema: "public", table: table }, scheduleRefresh);
  });
  channel.subscribe();
}

/* ---------------- helpers over STATE ---------------- */

function findTicket(id){
  for(var i=0;i<STATE.tickets.length;i++){ if(STATE.tickets[i].id===id) return STATE.tickets[i]; }
  return null;
}

async function rememberName(name){
  name = (name||"").trim();
  if(!name) return;
  if(STATE.meta.teamNames.indexOf(name) !== -1) return;
  STATE.meta.teamNames = STATE.meta.teamNames.concat([name]);
  render();
  try{
    await sb.from("app_settings").update({ values: STATE.meta.teamNames }).eq("key", "team_names");
  }catch(e){ /* non-critical */ }
}

function computeTotals(t){
  var known = 0, pending = 0;
  (t.productos||[]).forEach(function(p){
    if(p.precio == null || isNaN(p.precio)){ pending++; }
    else { known += (p.cantidad || 1) * Number(p.precio); }
  });
  return { known: known, pending: pending };
}

function bucketFor(t){
  var d = startOfDay(t.lastActivityAt);
  var today = startOfDay(new Date());
  var diff = Math.round((today - d) / 86400000);
  if(diff <= 0) return "Hoy";
  if(diff === 1) return "Ayer";
  if(diff <= 7) return "Últimos días";
  return "Anteriores";
}

function ticketLabel(t){ return t.cliente ? t.cliente : ("Ticket #" + t.seq); }

function matchesSearch(t, q){
  q = q.toLowerCase();
  if(("#" + t.seq).indexOf(q) !== -1) return true;
  if((t.cliente||"").toLowerCase().indexOf(q) !== -1) return true;
  var i;
  for(i=0;i<(t.productos||[]).length;i++){ if((t.productos[i].desc||"").toLowerCase().indexOf(q)!==-1) return true; }
  for(i=0;i<(t.thread||[]).length;i++){
    var ev = t.thread[i];
    if(ev.type==="nota" && (ev.text||"").toLowerCase().indexOf(q)!==-1) return true;
  }
  return false;
}

function estadoLabel(e){
  return e === "en_proceso" ? "En proceso" : (e === "terminado" ? "Terminado" : "Pendiente");
}

function renderTicketRow(t){
  var active = t.id === UI.selectedTicketId;
  var pill = t.queSigue ? '<span class="pill pill-accent">' + escapeHtml(t.queSigue) + "</span>" : "";
  return (
    '<button class="ticket-row' + (active?" active":"") + '" data-action="open-ticket" data-id="' + t.id + '">' +
      '<div class="ticket-row-top">' +
        '<span class="ticket-title">' + escapeHtml(ticketLabel(t)) + "</span>" +
        (t.pinned ? '<span class="ticket-pin" title="Fijado">&#9733;</span>' : "") +
      "</div>" +
      '<div class="ticket-meta"><span>#' + t.seq + "</span>" + pill + "</div>" +
    "</button>"
  );
}

function renderSidebarList(){
  var tickets = STATE.tickets.slice();
  if(UI.search.trim()){
    var q = UI.search.trim();
    var filtered = tickets.filter(function(t){ return matchesSearch(t, q); });
    filtered.sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
    if(!filtered.length) return '<div class="empty-list">Sin resultados para “' + escapeHtml(q) + '”.</div>';
    return filtered.map(renderTicketRow).join("");
  }
  if(!tickets.length){
    return '<div class="empty-list">Todavía no hay tickets. Crea el primero arriba.</div>';
  }
  var pinned = tickets.filter(function(t){ return t.pinned; })
    .sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
  var rest = tickets.filter(function(t){ return !t.pinned; });
  var groups = {"Hoy":[], "Ayer":[], "Últimos días":[], "Anteriores":[]};
  rest.forEach(function(t){ groups[bucketFor(t)].push(t); });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
  });
  var html = "";
  if(pinned.length){
    html += '<div class="group-label">Fijados</div>' + pinned.map(renderTicketRow).join("");
  }
  ["Hoy","Ayer","Últimos días","Anteriores"].forEach(function(k){
    if(groups[k].length){
      html += '<div class="group-label">' + k + '</div>' + groups[k].map(renderTicketRow).join("");
    }
  });
  return html || '<div class="empty-list">Sin resultados.</div>';
}

function renderThreadItem(ev){
  var dotClass = ev.type;
  var body = "";
  var meta = (ev.autor ? '<span class="autor">' + escapeHtml(ev.autor) + "</span> · " : "") + fmtTime(ev.ts) + " · " + fmtDateShort(ev.ts);
  if(ev.type === "nota"){
    body = '<div class="thread-text">' + escapeHtml(ev.text).replace(/\n/g,"<br>") + "</div>";
  } else if(ev.type === "sistema"){
    body = '<div class="thread-sub">' + escapeHtml(ev.text) + "</div>";
  } else if(ev.type === "producto"){
    var sub = ev.precio == null ? "precio pendiente" : (ev.cantidad + " × " + fmtMoney(ev.precio) + " = " + fmtMoney(ev.cantidad*ev.precio));
    body = '<div class="thread-text">Producto agregado</div><div class="thread-sub">' + escapeHtml(ev.desc) + " — " + sub + "</div>";
  } else if(ev.type === "tarea" || ev.type === "tarea_produccion"){
    var label = ev.type === "tarea_produccion" ? "Tarea de producción" : "Tarea";
    body = '<div class="thread-text">' + label + ": " + escapeHtml(ev.desc) + "</div>";
    var extra = [];
    if(ev.responsable) extra.push(escapeHtml(ev.responsable));
    if(ev.estado) extra.push(estadoLabel(ev.estado));
    if(ev.fechaAtencion) extra.push("atender " + ev.fechaAtencion);
    if(extra.length) body += '<div class="thread-sub">' + extra.join(" · ") + "</div>";
  } else if(ev.type === "pago"){
    body = '<div class="thread-text">Pago registrado' + (ev.concepto ? " — " + escapeHtml(ev.concepto) : "") + "</div>";
    body += '<div class="thread-sub">' + fmtMoney(ev.monto) + (ev.metodo ? " · " + escapeHtml(ev.metodo) : "") + (ev.fecha ? " · " + ev.fecha : "") + "</div>";
  } else if(ev.type === "archivo"){
    body = '<div class="thread-text">' + (ev.caption ? escapeHtml(ev.caption) : "Archivo adjunto") + "</div>";
    if(ev.storage_path){ body += '<img class="thread-img" data-storage-path="' + escapeHtml(ev.storage_path) + '" alt="' + escapeHtml(ev.filename||"adjunto") + '">'; }
    else { body += '<div class="thread-sub">' + escapeHtml(ev.filename||"") + "</div>"; }
  } else if(ev.type === "documento"){
    var docLabel = ev.tipo === "invoice" ? "Invoice" : "Cotización";
    body =
      '<button class="doc-card" data-action="open-doc" data-id="' + escapeHtml(ev.documento_id||"") + '">' +
        '<div class="doc-card-title">' + docLabel + " #" + escapeHtml(ev.numero||"") + "</div>" +
        (ev.cliente_nombre ? '<div class="doc-card-cliente">' + escapeHtml(ev.cliente_nombre) + "</div>" : "") +
        '<div class="doc-card-total">' + fmtMoney(ev.total) + "</div>" +
        '<div class="doc-card-link">Abrir ' + (ev.tipo==="invoice"?"invoice":"cotización") + " &#8594;</div>" +
      "</button>";
  }
  return (
    '<div class="thread-item">' +
      '<div class="thread-dot ' + dotClass + '"></div>' +
      '<div class="thread-body"><div class="thread-meta">' + meta + "</div>" + body + "</div>" +
    "</div>"
  );
}

function renderQueSigueSelect(t){
  var opts = STATE.meta.queSigueOptions.slice();
  if(t.queSigue && opts.indexOf(t.queSigue) === -1) opts.push(t.queSigue);
  var html = '<select id="field-quesigue">';
  html += '<option value="">—</option>';
  opts.forEach(function(o){
    html += '<option value="' + escapeHtml(o) + '" ' + (t.queSigue===o?"selected":"") + '>' + escapeHtml(o) + "</option>";
  });
  html += '<option value="__custom__">+ Nueva opción…</option>';
  html += "</select>";
  return html;
}

function renderTasksPanel(t){
  if(!t.tareas.length) return "";
  var rows = t.tareas.map(function(task){
    var extraBits = [];
    if(task.responsable) extraBits.push(escapeHtml(task.responsable));
    if(task.fechaAtencion) extraBits.push(task.fechaAtencion);
    var extra = extraBits.length ? '<span class="task-extra">' + extraBits.join(" · ") + "</span>" : "";
    if(task.tipo === "produccion"){
      var order = ["pendiente","en_proceso","terminado"];
      var toggle = '<div class="prod-toggle">' + order.map(function(o){
        return '<button data-toggle-task="' + task.id + '" data-ticket="' + t.id + '" class="' + (task.estado===o?"on":"") + '">' + estadoLabel(o) + "</button>";
      }).join("") + "</div>";
      return '<div class="task-row"><span class="task-desc">' + escapeHtml(task.desc) + "</span>" + extra + toggle + "</div>";
    }
    var done = task.estado === "terminado";
    return (
      '<div class="task-row' + (done?" done":"") + '">' +
        '<button class="task-check' + (done?" on":"") + '" data-toggle-normal-task="' + task.id + '" data-ticket="' + t.id + '">' + (done?"&#10003;":"") + "</button>" +
        '<span class="task-desc">' + escapeHtml(task.desc) + "</span>" + extra +
      "</div>"
    );
  }).join("");
  return '<div class="tasks-panel"><div class="tasks-title">Tareas</div>' + rows + "</div>";
}

      (totals.pending ? ' <span class="pending">+ ' + totals.pending + (totals.pending===1?" producto pendiente de precio":" productos pendientes de precio") + "</span>" : "") +
      "</div>";
  }
  return (
    '<div class="ticket-header">' +
      '<div class="ticket-header-top">' +
        '<span class="ticket-id">#' + t.seq + " · creado " + fmtDateShort(t.createdAt) + "</span>" +
        '<div class="ticket-header-actions">' +
          '<button class="btn-plain" data-action="toggle-pin" data-id="' + t.id + '" title="' + (t.pinned?"Desfijar":"Fijar") + '">' + (t.pinned?"&#9733; Fijado":"&#9734; Fijar") + "</button>" +
        "</div>" +
      "</div>" +
      '<div class="field-grid">' +
        '<div class="field"><span class="field-label">Cliente</span><input type="text" id="field-cliente" placeholder="Sin definir" value="' + escapeHtml(t.cliente) + '"></div>' +
        '<div class="field"><span class="field-label">Qué sigue</span>' + renderQueSigueSelect(t) + "</div>" +
        '<div class="field"><span class="field-label">Responsable</span><input type="text" id="field-responsable" list="dtg-team-names" placeholder="Sin asignar" value="' + escapeHtml(t.responsable) + '"></div>' +
        '<div class="field"><span class="field-label">Atender</span><input type="date" id="field-fecha-atencion" value="' + (t.fechaAtencion||"") + '"></div>' +
        '<div class="field"><span class="field-label">Compromiso</span><input type="date" id="field-fecha-compromiso" value="' + (t.fechaCompromiso||"") + '"></div>' +
      "</div>" +

function docForm(){
  var t = findTicket(UI.selectedTicketId);
  if(!t || !UI.docDraft) return "";
  var tipo = UI.docDraft.tipo;
  var items = UI.docDraft.items;
  var pendingCount = items.filter(function(it){ return it.precio == null; }).length;
  var rows = items.map(function(it, idx){
    var pending = it.precio == null;
    return (
      '<div class="doc-item-row">' +
        '<span class="doc-item-desc">' + escapeHtml(it.desc) + "</span>" +
        '<span class="doc-item-qty">×' + it.cantidad + "</span>" +
        '<span class="doc-item-price' + (pending?" pending":"") + '"><input type="number" min="0" step="0.01" data-doc-item-price="' + idx + '" placeholder="pendiente" value="' + (it.precio==null?"":it.precio) + '"></span>' +
      "</div>"
    );
  }).join("");
  var total = items.reduce(function(sum,it){ return sum + (it.precio==null?0:it.precio*it.cantidad); }, 0);
  var itemsBlock = items.length
    ? '<div class="doc-items-list">' + rows + "</div>" +
      (pendingCount ? '<div class="doc-pending-note">' + pendingCount + (pendingCount===1?" producto sin precio — puedes completarlo aquí.":" productos sin precio — puedes completarlos aquí.") + "</div>" : "")
    : '<div class="doc-pending-note">Este ticket todavía no tiene productos agregados.</div>';
  return (
    '<div class="popover" id="composer-popover" style="width:300px;">' +
      '<div class="popover-title">' + (tipo==="invoice"?"Nuevo invoice":"Nueva cotización") + "</div>" +
      '<div class="popover-form">' +
        itemsBlock +
        '<label>Cliente / empresa<input type="text" id="doc-cliente" value="' + escapeHtml(t.cliente) + '"></label>' +
        '<label>Notas (opcional)<input type="text" id="doc-notas" placeholder="Se muestran en el documento"></label>' +
        '<div class="doc-total-preview" id="doc-total-preview">Total: ' + fmtMoney(total) + "</div>" +
        '<div class="popover-actions"><button class="btn btn-ghost" data-action="cancel-form">Cancelar</button><button class="btn btn-primary" data-action="create-documento">Crear ' + (tipo==="invoice"?"invoice":"cotización") + "</button></div>" +
      "</div>" +
    "</div>"
  );
}

/* ---------------- slash commands: UI (autocomplete, ayuda, confirmación, tarjetas efímeras) ----------------
   Todo esto lee del registro COMMANDS (definido más abajo junto a su lógica
   de despacho) — no existe una segunda lista ni un segundo texto de ayuda
   que haya que mantener sincronizado a mano. */

function visibleCommands(hasTicket){
  return COMMANDS.filter(function(c){ return hasTicket || !c.requiresTicket; });
}
function filterCommands(hasTicket, fragment){
  var pool = visibleCommands(hasTicket);
  fragment = (fragment || "").toLowerCase();
  if(!fragment) return pool;
  var byAlias = pool.filter(function(c){
    return c.aliases.some(function(a){ return a.toLowerCase().indexOf(fragment) === 0; });
  });
  if(byAlias.length) return byAlias;
  // Sin coincidencia de alias: solo buscamos también en la descripción si el
  // fragmento ya es específico — con 1-2 letras casi cualquier texto libre
  // "matchea" algo, y eso deja de ser un filtro útil.
  if(fragment.length < 3) return [];
  return pool.filter(function(c){ return c.summary.toLowerCase().indexOf(fragment) !== -1; });
}

function slashMenu(){
  var hasTicket = !!findTicket(UI.selectedTicketId);
  var list = filterCommands(hasTicket, UI.slashQuery);
  if(UI.slashActiveIndex >= list.length) UI.slashActiveIndex = 0;
  var html = '<div class="slash-menu" id="slash-menu">';
  if(!list.length){
    html += '<div class="slash-menu-item" style="color:var(--text-faint);">Sin comandos que coincidan.</div>';
  } else {
    list.forEach(function(c, idx){
      html += '<button class="slash-menu-item' + (idx===UI.slashActiveIndex?" active":"") + '" data-slash-cmd="' + c.aliases[0] + '"><code>/' + c.aliases[0] + '</code><span class="desc">' + escapeHtml(c.summary) + '</span></button>';
    });
  }
  html += "</div>";
  return html;
}

function slashHelpPanel(){
  var hasTicket = !!findTicket(UI.selectedTicketId);
  var query = ((UI.slashHelp && UI.slashHelp.query) || "").toLowerCase().trim();
  var html = '<div class="slash-help" id="slash-help">';
  var exact = query ? COMMANDS.filter(function(c){ return c.key===query || c.aliases.indexOf(query)!==-1; })[0] : null;
  if(exact){
    html += '<div class="popover-title">/' + exact.aliases[0] + " — " + escapeHtml(exact.summary) + "</div>";
    html += '<div class="slash-help-row"><code>' + escapeHtml(exact.syntax) + "</code></div>";
    (exact.examples || []).forEach(function(ex){
      html += '<div class="slash-help-row ex">' + escapeHtml(ex) + "</div>";
    });
    if(exact.aliases.length > 1){
      html += '<div class="slash-help-row" style="color:var(--text-faint);">También: ' + exact.aliases.slice(1).map(function(a){ return "/"+a; }).join(", ") + "</div>";
    }
  } else {
    var list = query ? filterCommands(hasTicket, query) : visibleCommands(hasTicket);
    if(!list.length){
      html += '<div class="slash-help-row">Sin comandos que coincidan con "' + escapeHtml(query) + '".</div>';
    } else {
      list.forEach(function(c){
        html += '<div class="slash-help-row"><code>/' + c.aliases[0] + "</code> — " + escapeHtml(c.summary) + "</div>";
      });
      html += '<div class="slash-help-row" style="color:var(--text-faint);">/help &lt;comando&gt; para ver ejemplos</div>';
    }
  }
  html += "</div>";
  return html;
}

function slashConfirmBanner(){
  var c = UI.pendingConfirm;
  var cmd = c && COMMANDS_BY_KEY[c.key];
  if(!cmd) return "";
  return (
    '<div class="slash-confirm" id="slash-confirm">' +
      '<div class="slash-confirm-title">' + escapeHtml(cmd.confirmTitle || cmd.summary) + "</div>" +
      '<div class="slash-confirm-amount">' + cmd.confirmSummary(c.data) + "</div>" +
      '<div class="slash-confirm-hint">Enter para confirmar · Esc para cancelar</div>' +

  );

/* ---------------- tarjetas efímeras (/estado, /pendientes, /dinero) ----------------
   Se calculan al vuelo a partir de STATE y nunca se guardan: no generan fila
   en ninguna tabla ni evento en la bitácora, y se recalculan en cada render
   (nunca inventan datos ni duplican lo que ya existe en el hilo). */

function estadoCardLines(t){
  var lines = [];
  lines.push(["Cliente", t.cliente || "—"]);
  lines.push(["Qué sigue", t.queSigue || "—"]);
  if(t.responsable) lines.push(["Responsable", t.responsable]);
  if(t.fechaAtencion) lines.push(["Atender", t.fechaAtencion]);
  if(t.fechaCompromiso) lines.push(["Compromiso", t.fechaCompromiso]);
  if(t.productos.length){
    var totals = computeTotals(t);
    lines.push(["Total", fmtMoney(totals.known) + (totals.pending ? " (+" + totals.pending + " sin precio)" : "")]);
  }
  if(t.pagos.length){
    var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
    lines.push(["Cobrado", fmtMoney(cobrado)]);
  }
  var pend = t.tareas.filter(function(x){ return x.estado !== "terminado"; });
  if(pend.length){
    lines.push(["Tareas pendientes", pend.length + ": " + pend.slice(0,3).map(function(x){ return x.desc; }).join(", ") + (pend.length>3?"…":"")]);
  }
  if(t.documentos.length){
    lines.push(["Documentos", t.documentos.map(function(d){ return d.numero; }).join(", ")]);
  }
  return lines;
}

function pendientesLinesForTicket(t){
  var lines = [];
  var pendTasks = t.tareas.filter(function(x){ return x.estado !== "terminado"; });
  if(pendTasks.length){
    lines.push(["Tareas", pendTasks.map(function(x){ return x.desc + (x.tipo==="produccion" ? " ("+estadoLabel(x.estado)+")" : ""); }).join(" · ")]);
  }
  var pendProd = t.productos.filter(function(p){ return p.precio == null; });
  if(pendProd.length){
    lines.push(["Precios pendientes", pendProd.map(function(p){ return p.desc; }).join(", ")]);
  }
  if(!lines.length) lines.push(["", "Nada pendiente en este ticket."]);
  return lines;
}
function pendientesLinesGlobal(){
  var conQueSigue = STATE.tickets.filter(function(t){ return t.queSigue; })
    .sort(function(a,b){ return new Date(b.lastActivityAt) - new Date(a.lastActivityAt); });
  if(!conQueSigue.length) return [["", 'No hay tickets con "Qué sigue" activo.']];
  return [["Con \"Qué sigue\" activo", conQueSigue.slice(0,8).map(function(t){ return ticketLabel(t) + " (" + t.queSigue + ")"; }).join(" · ")]];
}

function dineroLinesForTicket(t){
  var totals = computeTotals(t);
  var cobrado = t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  var lines = [["Total conocido", fmtMoney(totals.known)]];
  if(totals.pending) lines.push(["Pendientes de precio", totals.pending + " producto(s)"]);
  lines.push(["Cobrado", fmtMoney(cobrado)]);
  lines.push(["Saldo", fmtMoney(totals.known - cobrado)]);
  return lines;
}
function dineroLinesGlobal(){
  var known=0, cobrado=0, pend=0;
  STATE.tickets.forEach(function(t){
    var totals = computeTotals(t);
    known += totals.known; pend += totals.pending;
    cobrado += t.pagos.reduce(function(s,p){ return s+p.monto; }, 0);
  });
  var lines = [["Total conocido (todos los tickets)", fmtMoney(known)]];
  if(pend) lines.push(["Productos pendientes de precio", pend]);
  lines.push(["Cobrado (todos los tickets)", fmtMoney(cobrado)]);
  lines.push(["Saldo", fmtMoney(known - cobrado)]);
  return lines;
}

function renderEphemeralCard(){
  var card = UI.ephemeralCard;
  if(!card) return "";
  var t = card.ticketId ? findTicket(card.ticketId) : null;
  var title, lines;
  if(card.kind === "estado"){
    if(!t) return "";
    title = "Estado actual — " + ticketLabel(t);
    lines = estadoCardLines(t);
  } else if(card.kind === "pendientes"){
    title = t ? "Pendientes — " + ticketLabel(t) : "Pendientes (todos los tickets)";
    lines = t ? pendientesLinesForTicket(t) : pendientesLinesGlobal();
  } else if(card.kind === "dinero"){
    title = t ? "Dinero — " + ticketLabel(t) : "Dinero (todos los tickets)";
    lines = t ? dineroLinesForTicket(t) : dineroLinesGlobal();
  } else {
    return "";
  }
  var rows = lines.map(function(l){
    return '<div class="slash-help-row">' + (l[0] ? "<strong>" + escapeHtml(l[0]) + ":</strong> " : "") + escapeHtml(String(l[1])) + "</div>";
  }).join("");
  return (
    '<div class="slash-help" id="ephemeral-card">' +
      '<div class="popover-title" style="display:flex;justify-content:space-between;align-items:center;">' + escapeHtml(title) +
        '<button class="btn-plain" data-action="close-ephemeral" style="padding:2px 4px;">&times;</button></div>' +
      rows +
      '<div class="doc-card-meta">No se guarda — este resumen se genera al momento a partir de la información actual.</div>' +
    "</div>"
  );
}

function render(){
  var app = document.getElementById("app");
  if(FATAL_ERROR){
    app.innerHTML = '<div class="app"><div class="empty-state" style="width:100%;"><h1>No se pudo conectar</h1><p>' + escapeHtml(FATAL_ERROR) + "</p></div></div>";
    return;
  }
  var teamOptions = STATE.meta.teamNames.map(function(n){ return '<option value="' + escapeHtml(n) + '">'; }).join("");
  app.innerHTML =
    '<datalist id="dtg-team-names">' + teamOptions + "</datalist>" +
    '<div class="app">' +
      '<div class="sidebar' + (UI.sidebarOpen?" open":"") + '" id="sidebar">' + renderSidebar() + "</div>" +
      '<div class="main">' + renderMain() + "</div>" +
    "</div>" +
    renderDocModal() +
    '<div class="toast" id="toast"></div>';
  wireEvents();
  hydrateImages();
  var threadEl = document.getElementById("thread-scroll");
  if(threadEl) threadEl.scrollTop = threadEl.scrollHeight;
  var composerInput = document.getElementById("composer-input");
  if(composerInput){
    composerInput.addEventListener("input", function(){
      var v = composerInput.value;
      document.getElementById("composer-send").disabled = !v.trim();
      composerInput.style.height = "auto";
      composerInput.style.height = Math.min(composerInput.scrollHeight, 120) + "px";
      /* Cualquier panel que no sea el menú de "/" (confirmación, ayuda,
         tarjeta efímera) se descarta en cuanto el usuario vuelve a escribir
         o borra el texto — nunca debe quedar "pegado" mostrando algo viejo. */
      var hadOverlay = !!(UI.pendingConfirm || UI.ephemeralCard || UI.slashHelp);
      UI.pendingConfirm = null;
      UI.ephemeralCard = null;
      UI.slashHelp = null;
      var m = v.match(/^\/([a-zA-Z0-9áéíóúÁÉÍÓÚñÑ]*)$/);
      var shouldOpen = !!m;
      var fragment = m ? m[1] : "";
      var menuChanged = (shouldOpen !== !!UI.slashMenuOpen || fragment !== UI.slashQuery);
      if(menuChanged){
        UI.slashMenuOpen = shouldOpen;
        UI.slashQuery = fragment;
        UI.slashActiveIndex = 0;
      }
      if(menuChanged || hadOverlay){
        render();
        restoreComposerText(v);
      }
    });
    composerInput.addEventListener("keydown", function(e){
      if(UI.slashMenuOpen){
        var hasTicket = !!findTicket(UI.selectedTicketId);
        var list = filterCommands(hasTicket, UI.slashQuery);
        if(e.key === "ArrowDown"){ e.preventDefault(); if(list.length) UI.slashActiveIndex = (UI.slashActiveIndex+1) % list.length; var v1=composerInput.value; render(); restoreComposerText(v1); return; }
        if(e.key === "ArrowUp"){ e.preventDefault(); if(list.length) UI.slashActiveIndex = (UI.slashActiveIndex-1+list.length) % list.length; var v2=composerInput.value; render(); restoreComposerText(v2); return; }
        if(e.key === "Enter"){
          e.preventDefault();
          UI.slashMenuOpen = false;
          if(!list.length){
            /* Sin coincidencias en el autocomplete: no nos quedamos callados
               — se envía tal cual para que el despachador avise con el
               mensaje de "comando no reconocido", igual que si no hubiera
               menú de por medio. */
            submitNote();
            return;
          }
          /* Si ya se escribió el nombre completo de un comando (sin espacio
             final), Enter lo ejecuta directo en vez de solo autocompletarlo
             — evita que comandos sin argumento (/estado, /help…) necesiten
             dos Enter seguidos para hacer algo. */
          var typed = composerInput.value.trim().slice(1).toLowerCase();
          if(typed && ALIAS_INDEX[typed]){
            var full = composerInput.value.trim();
            composerInput.value = "";
            dispatchCommand(full);
          } else {
            pickSlashCommand(list[UI.slashActiveIndex].aliases[0]);
          }
          return;
        }
        if(e.key === "Escape"){ e.preventDefault(); UI.slashMenuOpen = false; var v3=composerInput.value; render(); restoreComposerText(v3); return; }
      }
      if(UI.pendingConfirm){
        if(e.key === "Enter"){ e.preventDefault(); confirmPendingSlash(); return; }
        if(e.key === "Escape"){ e.preventDefault(); UI.pendingConfirm = null; render(); return; }
      }
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submitNote(); }
    });
  }
}

function restoreComposerText(v){
  var el = document.getElementById("composer-input");
  if(!el) return;
  el.value = v;
  el.focus();
  el.selectionStart = el.selectionEnd = v.length;
  var sendBtn = document.getElementById("composer-send");
  if(sendBtn) sendBtn.disabled = !v.trim();
}

function pickSlashCommand(cmd){
  UI.slashMenuOpen = false;
  render();
  restoreComposerText("/" + cmd + " ");
}

function hydrateImages(){
  var imgs = document.querySelectorAll("img[data-storage-path]");
  imgs.forEach(async function(img){
    var path = img.getAttribute("data-storage-path");
    if(!path) return;
    if(signedUrlCache[path]){ img.src = signedUrlCache[path]; return; }
    try{
      var res = await sb.storage.from(FILES_BUCKET).createSignedUrl(path, 3600);
      if(res.data && res.data.signedUrl){
        signedUrlCache[path] = res.data.signedUrl;
        if(document.body.contains(img)) img.src = res.data.signedUrl;
      }
    }catch(e){ /* leave broken silently, non-critical */ }
  });
}

var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 3200);
}

/* ---------------- mutations: optimistic local update, then write to Supabase, then reconcile ---------------- */

async function createTicketFlow(){
  try{
    var ins = await sb.from("tickets").insert({}).select().single();
    if(ins.error) throw ins.error;
    var newId = ins.data.id;
    await sb.from("bitacora").insert({ ticket_id: newId, tipo: "sistema", autor: UI.whoami || null, payload: { text: "Ticket creado" } });
    UI.selectedTicketId = newId;
    UI.composer = null;
    UI.ephemeralCard = null;
    UI.slashHelp = null;
    saveUi();
    await refreshFromServer();
  }catch(e){ showToast("No se pudo crear el ticket: " + (e.message || "error")); }
}

async function submitNote(){
  var input = document.getElementById("composer-input");
  if(!input) return;
  var text = input.value.trim();
  if(!text) return;
  if(text.charAt(0) === "/"){
    input.value = "";
    UI.slashMenuOpen = false;
    dispatchCommand(text);
    return;
  }
  /* Escribir no significa guardar: solo /nota crea una nota. Texto plano
     nunca modifica nada, ni aquí ni en ningún otro comando. */
  var hasTicket = !!findTicket(UI.selectedTicketId);
  if(hasTicket){
    showToast('Escribir no guarda nada por sí solo — usa "/nota" para agregar una nota, o "/" para ver los comandos.');
  } else {
    showToast('Usa "/" para ver los comandos disponibles (buscar, ticket, ayuda…).');
  }
}

/* ---------------- mutaciones compartidas ----------------
   El botón "+" y los slash commands terminan aquí, en las mismas
   funciones — nunca hay dos caminos distintos para la misma operación. */

async function addProductoCore(t, desc, cantidad, precio){
  t.productos.push({ id: uid(), desc: desc, cantidad: cantidad, precio: precio });
  render();
  try{
    var r1 = await sb.from("productos").insert({ ticket_id: t.id, descripcion: desc, cantidad: cantidad, precio: precio });
    if(r1.error) throw r1.error;
    var r2 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "producto", autor: UI.whoami || null, payload: { desc: desc, cantidad: cantidad, precio: precio } });
    if(r2.error) throw r2.error;
  }catch(e){ showToast("No se pudo guardar el producto: " + (e.message || "error")); }
  refreshFromServer();
}

async function addTareaCore(t, tipo, desc, responsable, fechaAtencion){
  var kind = tipo === "produccion" ? "tarea_produccion" : "tarea";
  t.tareas.push({ id: uid(), desc: desc, tipo: tipo, responsable: responsable||"", fechaAtencion: fechaAtencion||"", estado: "pendiente" });
  render();
  if(responsable) rememberName(responsable);
  try{
    var r3 = await sb.from("tareas").insert({ ticket_id: t.id, descripcion: desc, tipo: tipo, responsable: responsable || null, fecha_atencion: fechaAtencion || null, estado: "pendiente" });
    if(r3.error) throw r3.error;
    var r4 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: kind, autor: UI.whoami || null, payload: { desc: desc, responsable: responsable, fechaAtencion: fechaAtencion, estado: tipo==="produccion" ? "pendiente" : null } });
    if(r4.error) throw r4.error;
  }catch(e){ showToast("No se pudo guardar la tarea: " + (e.message || "error")); }
  refreshFromServer();
}

async function addPagoCore(t, monto, fecha, metodo, concepto){
  t.pagos.push({ id: uid(), monto: monto, fecha: fecha, metodo: metodo||"", concepto: concepto||"" });
  render();
  try{
    var r5 = await sb.from("pagos").insert({ ticket_id: t.id, monto: monto, fecha: fecha, metodo: metodo || null, concepto: concepto || null });
    if(r5.error) throw r5.error;
    var r6 = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "pago", autor: UI.whoami || null, payload: { monto: monto, fecha: fecha, metodo: metodo, concepto: concepto } });
    if(r6.error) throw r6.error;
  }catch(e){ showToast("No se pudo guardar el pago: " + (e.message || "error")); }
  refreshFromServer();
}

async function addNotaCore(t, text){
  var optimistic = { id: uid(), type: "nota", ts: new Date().toISOString(), autor: UI.whoami || null, text: text };
  t.thread.push(optimistic);
  render();
  try{
    var res = await sb.from("bitacora").insert({ ticket_id: t.id, tipo: "nota", autor: UI.whoami || null, payload: { text: text } });
    if(res.error) throw res.error;
  }catch(e){ showToast("No se pudo guardar la nota: " + (e.message || "error")); }
  refreshFromServer();
}

async function submitForm(kind){
  var t = findTicket(UI.selectedTicketId);
  if(!t) return;
  if(kind === "producto"){
    var desc = (document.getElementById("f-desc").value || "").trim();
    if(!desc){ showToast("Descripción requerida."); return; }
    var cantidad = parseFloat(document.getElementById("f-cantidad").value) || 1;
    var precioRaw = document.getElementById("f-precio").value;
    var precio = precioRaw === "" ? null : parseFloat(precioRaw);
    UI.composer = null; render();
    await addProductoCore(t, desc, cantidad, precio);
  } else if(kind === "tarea" || kind === "tarea_produccion"){
    var tdesc = (document.getElementById("f-desc").value || "").trim();
    if(!tdesc){ showToast("Descripción requerida."); return; }
    var resp = (document.getElementById("f-responsable").value || "").trim();
    var fecha = document.getElementById("f-fecha").value || "";

function resizeImageToBlob(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(){
      var img = new Image();
      img.onerror = reject;
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error("No se pudo procesar la imagen")); }, "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- slash commands: parsing y ejecución ----------------
   Sintaxis pequeña y predecible a propósito — no lenguaje natural. Las
   tres rutas (botón +, /comando, escribir el comando completo) llaman
   siempre a las mismas funciones core de arriba. */

function parseSlashCommand(raw){
  var body = raw.slice(1); // quita el "/"
  var firstSpace = body.indexOf(" ");
  var cmd = (firstSpace === -1 ? body : body.slice(0, firstSpace)).toLowerCase().trim();
  var arg = (firstSpace === -1 ? "" : body.slice(firstSpace + 1)).trim();
  return { cmd: cmd, arg: arg };
}

function parseProductoArg(arg){
  var cantidad = 1, rest = arg;
  var mCant = arg.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
  if(mCant){ cantidad = parseFloat(mCant[1]); rest = mCant[2]; }
  var mTotal = rest.match(/^(.*\S)\s+total\s+(\d+(?:\.\d+)?)\s*$/i);
  if(mTotal){
    var desc1 = mTotal[1].trim();
    var total = parseFloat(mTotal[2]);
    return { desc: desc1, cantidad: cantidad, precio: cantidad ? total / cantidad : null, total: total };
  }
  var mPrecio = rest.match(/^(.*\S)\s+(\d+(?:\.\d+)?)\s*$/);
  if(mPrecio){
    return { desc: mPrecio[1].trim(), cantidad: cantidad, precio: parseFloat(mPrecio[2]) };
  }
  return { desc: rest.trim(), cantidad: cantidad, precio: null };
}

function parsePagoArg(arg){
  var m = arg.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  if(!m) return null;
  return { monto: parseFloat(m[1]), concepto: (m[2]||"").trim() };
}

/* ---------------- fecha humana: un solo parser reutilizable ----------------
   Distingue tres resultados a propósito: "confident" (se puede guardar tal
   cual), "ambiguous" y "unrecognized" (nunca se guarda nada en estos dos
   últimos casos — el comando que llama cae de vuelta al selector de fecha
   que ya existe en el encabezado del ticket, en vez de adivinar). */

var WEEKDAY_NAMES = {
  domingo:0, dom:0, sunday:0, sun:0,
  lunes:1, lun:1, monday:1, mon:1,
  martes:2, mar:2, tuesday:2, tue:2,
  miercoles:3, "miércoles":3, mie:3, wednesday:3, wed:3,
  jueves:4, jue:4, thursday:4, thu:4,
  viernes:5, vie:5, friday:5, fri:5,
  sabado:6, "sábado":6, sab:6, saturday:6, sat:6
};

function parseHumanDate(raw, now){
  now = now || new Date();
  var text = (raw || "").trim().toLowerCase();
  if(!text) return { status: "unrecognized" };

  if(text === "hoy" || text === "today"){
    return { status: "confident", date: startOfDay(now) };
  }
  if(text === "mañana" || text === "manana" || text === "tomorrow"){
    var d0 = startOfDay(now); d0.setDate(d0.getDate()+1);
    return { status: "confident", date: d0 };
  }

  var mSlash = text.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/);
  if(mSlash){
    var day = parseInt(mSlash[1],10), month = parseInt(mSlash[2],10);
    if(month < 1 || month > 12 || day < 1 || day > 31) return { status: "unrecognized" };
    var year = mSlash[3] ? (mSlash[3].length===2 ? 2000+parseInt(mSlash[3],10) : parseInt(mSlash[3],10)) : now.getFullYear();
    var d1 = new Date(year, month-1, day);
    if(!mSlash[3] && startOfDay(d1) < startOfDay(now)){
      d1 = new Date(year+1, month-1, day); // sin año: siempre la próxima ocurrencia futura
    }
    return { status: "confident", date: d1 };
  }

  var mRel = text.match(/^en\s+(\d+)\s+d[ií]as?$/) || text.match(/^in\s+(\d+)\s+days?$/);
  if(mRel){
    var d2 = startOfDay(now); d2.setDate(d2.getDate() + parseInt(mRel[1],10));
    return { status: "confident", date: d2 };
  }

  var wd = text.replace(/^(el|on)\s+/, "");
  if(WEEKDAY_NAMES.hasOwnProperty(wd)){
    var target = WEEKDAY_NAMES[wd];
    var d3 = startOfDay(now);
    var diff = (target - d3.getDay() + 7) % 7;
    if(diff === 0) diff = 7; // "el lunes" es el próximo lunes, no hoy si hoy ya es lunes
    d3.setDate(d3.getDate() + diff);
    return { status: "confident", date: d3 };
  }

  if(/^(el\s+)?\d{1,2}$/.test(text)){
    return { status: "ambiguous" }; // un número suelto: no sabemos a qué mes se refiere
  }

  return { status: "unrecognized" };
}

  {

    syntax: "/buscar <texto>", summary: "Buscar tickets",
    examples: ["/buscar Ángela", "/buscar banners"],
    parse: function(arg){ return arg ? { ok:true, data:{ q: arg } } : { ok:false, showHelp:true }; },
    run: function(data){ UI.search = data.q; saveUi(); render(); }
  },
  {
    key: "ticket", aliases: ["ticket","go"], type: "read", requiresTicket: false,
    syntax: "/ticket <número>", summary: "Abrir un ticket por número",
    examples: ["/ticket 42"],
    parse: function(arg){
      if(!arg) return { ok:false, showHelp:true };
      var seq = parseInt(arg.replace(/^#/,"").trim(), 10);
      if(isNaN(seq)) return { ok:false, error: "Escribe un número de ticket, ej. /ticket 42" };
      return { ok:true, data:{ seq: seq } };
    },
    run: function(data){
      var found = STATE.tickets.filter(function(t){ return t.seq === data.seq; })[0];
      if(!found){ showToast("No encontré el ticket #" + data.seq + "."); return; }
      UI.selectedTicketId = found.id; UI.search = ""; UI.ephemeralCard = null; saveUi(); render();
    }
  },
  {
    key: "help", aliases: ["help","ayuda"], type: "read", requiresTicket: false,
    syntax: "/help [comando]", summary: "Ver la lista de comandos o la ayuda de uno en particular",
    examples: ["/help", "/help producto", "/help attention"],
    parse: function(){ return { ok:true, data:{} }; },
    run: function(){ /* manejado directo en dispatchCommand */ }
  }
];

var ALIAS_INDEX = {};
var COMMANDS_BY_KEY = {};
COMMANDS.forEach(function(c){
  COMMANDS_BY_KEY[c.key] = c;
  c.aliases.forEach(function(a){ ALIAS_INDEX[a.toLowerCase()] = c.key; });
});

/* El botón "+", escribir el comando completo, y elegirlo del menú de "/"
   terminan siempre aquí. Los comandos "read" solo llaman a run(), nunca
   tocan Supabase ni la bitácora — eso es exclusivo de los comandos "write". */
async function dispatchCommand(raw){
  var parsed = parseSlashCommand(raw);
  var aliasKey = parsed.cmd.toLowerCase();
  var t = findTicket(UI.selectedTicketId);
  var hasTicket = !!t;

  UI.slashHelp = null; // cada comando que se despacha empieza sin ayuda pegada de antes

  if(aliasKey === "help" || aliasKey === "ayuda"){
    UI.slashHelp = { query: parsed.arg.replace(/^\//, "").trim() };
    render();
    return;
  }
  if(!aliasKey){
    UI.slashMenuOpen = true; UI.slashQuery = ""; UI.slashActiveIndex = 0;
    render();
    restoreComposerText("/");
    return;
  }

  var key = ALIAS_INDEX[aliasKey];
  if(!key){
    showToast('Comando no reconocido: "/' + parsed.cmd + '". Escribe /help para ver la lista.');
    return;
  }
  var cmd = COMMANDS_BY_KEY[key];
  if(cmd.requiresTicket && !hasTicket){
    showToast("Selecciona un ticket primero.");
    return;
  }
  var ctx = { ticket: t };
  var result = cmd.parse(parsed.arg, ctx);
  if(!result.ok){
    if(result.showHelp){ UI.slashHelp = { query: key }; render(); }
    else if(result.error){ showToast(result.error); }
    return;
  }
  return runWithConfirm(cmd, result.data, ctx);
}

function runWithConfirm(cmd, data, ctx){
  var needsConfirm = typeof cmd.confirm === "function" ? cmd.confirm(data, ctx) : !!cmd.confirm;
  if(needsConfirm){
    UI.pendingConfirm = { key: cmd.key, data: data, ticketId: ctx.ticket ? ctx.ticket.id : null };
    render();
    restoreComposerText("");
    return;
  }
  return cmd.run(data, ctx);
}

async function confirmPendingSlash(){
  var c = UI.pendingConfirm;
  if(!c) return;
  var cmd = COMMANDS_BY_KEY[c.key];
  UI.pendingConfirm = null;
  render();
  restoreComposerText("");
  if(!cmd) return;
  var t = c.ticketId ? findTicket(c.ticketId) : findTicket(UI.selectedTicketId);
  await cmd.run(c.data, { ticket: t });
}

/* ---------------- events ---------------- */

function wireEvents(){
  var root = document.getElementById("app");

  root.querySelectorAll('[data-action="new-ticket"]').forEach(function(b){
    b.addEventListener("click", function(){ createTicketFlow(); });
  });

  root.querySelectorAll('[data-action="open-ticket"]').forEach(function(b){
    b.addEventListener("click", function(){
      UI.selectedTicketId = b.getAttribute("data-id");
      UI.composer = null;
      UI.ephemeralCard = null;
      UI.slashHelp = null;
      saveUi();
      render();
    });
  });

  root.querySelectorAll('[data-action="stub"]').forEach(function(b){
    b.addEventListener("click", function(){ showToast((b.getAttribute("data-name")) + ": disponible próximamente."); });
  });

  root.querySelectorAll('[data-action="toggle-pin"]').forEach(function(b){
    b.addEventListener("click", function(){ togglePin(b.getAttribute("data-id")); });
  });

  var searchInput = document.getElementById("search-input");
  if(searchInput){
    searchInput.addEventListener("input", function(){
      UI.search = searchInput.value;
      saveUi();
      render();
      var again = document.getElementById("search-input");
      if(again){ again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
    });
  }

  var whoamiInput = document.getElementById("whoami-input");
  if(whoamiInput){
    whoamiInput.addEventListener("change", function(){ saveWhoami(whoamiInput.value.trim()); });
  }

  bindField("field-cliente", "change");
  bindField("field-responsable", "change");
  bindField("field-fecha-atencion", "change");
  bindField("field-fecha-compromiso", "change");
  var qsEl = document.getElementById("field-quesigue");
  if(qsEl) qsEl.addEventListener("change", function(){ commitQueSigue(qsEl.value); });

  var plusBtn = root.querySelector('[data-action="toggle-menu"]');
  if(plusBtn){
    plusBtn.addEventListener("click", function(){
      UI.composer = UI.composer ? null : "menu";
      render();
    });
  }
  root.querySelectorAll('[data-open-form]').forEach(function(b){
    b.addEventListener("click", function(){ UI.composer = b.getAttribute("data-open-form"); render(); });
  });
  var cancelBtn = root.querySelector('[data-action="cancel-form"]');
  if(cancelBtn) cancelBtn.addEventListener("click", function(){ UI.composer = null; UI.docDraft = null; render(); });
  var submitBtn = root.querySelector('[data-action="submit-form"]');
  if(submitBtn) submitBtn.addEventListener("click", function(){ submitForm(submitBtn.getAttribute("data-kind")); });
  var sendBtn = document.getElementById("composer-send");
  if(sendBtn) sendBtn.addEventListener("click", submitNote);

  var docChoiceBtn = root.querySelector('[data-action="open-doc-choice"]');
  if(docChoiceBtn) docChoiceBtn.addEventListener("click", function(){ UI.composer = "doc_choice"; render(); });
  root.querySelectorAll('[data-doc-type]').forEach(function(b){
    b.addEventListener("click", function(){ openDocumentForm(b.getAttribute("data-doc-type")); });
  });
  var createDocBtn = root.querySelector('[data-action="create-documento"]');
  if(createDocBtn) createDocBtn.addEventListener("click", createDocumento);
  root.querySelectorAll('[data-doc-item-price]').forEach(function(inp){
    inp.addEventListener("input", function(){
      var idx = Number(inp.getAttribute("data-doc-item-price"));
      if(UI.docDraft && UI.docDraft.items[idx]){
        var raw = inp.value;
        UI.docDraft.items[idx].precio = raw === "" ? null : parseFloat(raw);
      }
      var total = 0;
      root.querySelectorAll('[data-doc-item-price]').forEach(function(inp2){
        var v = inp2.value;
        if(v !== ""){
          var idx2 = Number(inp2.getAttribute("data-doc-item-price"));
          var cant = UI.docDraft && UI.docDraft.items[idx2] ? UI.docDraft.items[idx2].cantidad : 1;
          total += parseFloat(v) * cant;
        }
      });
      var totalEl = document.getElementById("doc-total-preview");
      if(totalEl) totalEl.textContent = "Total: " + fmtMoney(total);
    });
  });

  var closeDocBtn = root.querySelector('[data-action="close-doc"]');
  if(closeDocBtn) closeDocBtn.addEventListener("click", closeDocumentViewer);
  var printDocBtn = root.querySelector('[data-action="print-doc"]');
  if(printDocBtn) printDocBtn.addEventListener("click", function(){ window.print(); });
  var docOverlay = document.getElementById("doc-modal-overlay");
  if(docOverlay){
    docOverlay.addEventListener("click", function(e){ if(e.target === docOverlay) closeDocumentViewer(); });
  }

  root.querySelectorAll('[data-slash-cmd]').forEach(function(b){
    b.addEventListener("click", function(){ pickSlashCommand(b.getAttribute("data-slash-cmd")); });
  });

  var closeEphemeralBtn = root.querySelector('[data-action="close-ephemeral"]');
  if(closeEphemeralBtn) closeEphemeralBtn.addEventListener("click", function(){ UI.ephemeralCard = null; render(); });
}

function bindField(id, evtName){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener(evtName, function(){ commitHeaderField(id, el.value); });
}

/* single delegated document-level listener, registered once at boot (never re-added on render).
   CAPTURE phase so it sees the DOM before any handler-triggered render() replaces it. */
document.addEventListener("click", function(e){
  var prodBtn = e.target.closest && e.target.closest("[data-toggle-task]");
  if(prodBtn){ toggleTaskEstado(prodBtn.getAttribute("data-ticket"), prodBtn.getAttribute("data-toggle-task")); return; }
  var normalBtn = e.target.closest && e.target.closest("[data-toggle-normal-task]");
  if(normalBtn){ toggleNormalTask(normalBtn.getAttribute("data-ticket"), normalBtn.getAttribute("data-toggle-normal-task")); return; }
  var docCard = e.target.closest && e.target.closest('[data-action="open-doc"]');
  if(docCard){ openDocumentViewer(docCard.getAttribute("data-id")); return; }
  if(UI.composer){
    var pop = document.getElementById("composer-popover");
    var plus = document.querySelector('[data-action="toggle-menu"]');
    var clickedInsidePop = pop && pop.contains(e.target);
    var clickedPlus = plus && (e.target === plus || plus.contains(e.target));
    if(!clickedInsidePop && !clickedPlus){ UI.composer = null; render(); }
  }
}, true);

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && UI.viewingDocId){ closeDocumentViewer(); }
});

/* ---------------- boot ---------------- */

async function boot(){
  loadUi();
  render();
  if(window.__dtgSupabaseLoadFailed || !window.supabase){
    FATAL_ERROR = "No se pudo cargar la librería de Supabase (revisa tu conexión a internet y recarga).";
    render();
    return;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await ensureSession();
    await refreshFromServer();
    if(UI.whoami) rememberName(UI.whoami);
    subscribeRealtime();
  }catch(e){
    FATAL_ERROR = "No se pudo conectar con la base de datos: " + (e.message || "error desconocido") +
      ". Si el proyecto sigue mostrando este error, confirma que \"Anonymous sign-ins\" esté activado en Supabase Auth.";
    render();
  }
}

boot();

})();
</script>
